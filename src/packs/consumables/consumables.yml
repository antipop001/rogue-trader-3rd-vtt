data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Also know as “onslaught”, this drug heightens awareness and improves
        reaction time, literally speeding up the user but causing Fatigue and neural
        damage with prolonged use. Taking a dose increases the user's Agility Bonus
        and Perception Bonus by 3 for 2d10 minutes. When the drug runs its course,
        the user must Test Toughness or take a -20 penalty to Agility Tests and Perception
        Tests for 1d5 hours.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Slaught
type: drug
---
data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: Stimm is a powerful drug that works to mask pain and drive fighters
        on when their bodies would otherwise give up. A dose of stimm lasts 3d10 Rounds.
        During this time a character ignores any negative effects to his Characteristics
        from Damage or Critical Damage and cannot be Stunned. When the stimm wears
        off, the character takes a -20 penalty to Strength, Toughness and Agility
        Tests for one hour.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Stimm (drug)
type: drug
