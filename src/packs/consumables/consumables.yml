data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Amasec is a popular alcoholic drink distilled from wine. It can range
        from lesser brews barely fit for firebombs, to well-aged brands suitable for
        only the finest of the Emperor's servants.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-bottle.png
name: Amasec
type: drug
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This drug can negate the effects of most dangerous gases and toxins
        if administered fast enough. A dose of de-tox immediately ends the ongoing
        effects, both positive and negative, of any drugs, toxins, or gases affecting
        the character (unless the effect states that de-tox is not effective against
        them). Using de-tox, however, is both painful and debilitating, causing such
        unpleasant side effects as vomiting, nose bleeds, and a great voiding of the
        bowels. Upon taking this drug, a character is Stunned for a number of Rounds
        equal to 1d10 minus his Toughness Bonus. A result of 0 or less means that
        the character suffers no ill effects.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: De-Tox (drug)
type: drug
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: A generic name for a variety of combat drugs most often used within
        penal legion units. Once administered, the subject becomes fearless and fanatical
        in combat. A character using frenzon gains the Frenzy talent and also gains
        immunity to Fear. A single dose of frenzon lasts for 1d10 minutes.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Frenzon (drug)
type: drug
---
data:
    craftsmanship: common
    availability: Plentiful
    weight: 0
    equipped: false
    inBackpack: false
    description: Injectors can take many forms from cheap low-tech disposable syringes
        up to sophisticated hypo-sprays and even bio-attuned skin patches. An injector
        can hold a single dose of any drug, which a character may administer as a
        Full Action.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
