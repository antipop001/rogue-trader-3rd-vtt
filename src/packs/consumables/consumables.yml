data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Lho-sticks are common with Imperial Guard troopers and many menial
        workers. Each rolled paper tube contains a scented, mildly narcotic (and addictive)
        plant-derived substance, which is then lit and the resulting smoke inhaled
        through the tube.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-lho-stick.png
