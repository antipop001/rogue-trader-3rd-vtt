data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: A heady, thick liquor of Archaos, forbidden by ancient law upon that
        world. It is said to give a drinker depth and clarity of thought, and though
        this is likely no more than the mystique that attends any forbidden item,
        this rare intoxicant is prized as a sign of culture and wealth amongst Calixian
        sophisticates.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Theosophist's Philtre
type: drug
---
data:
    craftsmanship: common
    availability: Abundant
    weight: 0
    equipped: false
    inBackpack: false
    description: The term "tranq" covers an array of artificial, alcoholic chemistillates
        made by the low-hive masses of the Golgenna Reach. The techniques for producing
        tranq have been carried throughout the Calixis Sector by crew-scum, criminals,
        and Guardsmen. Drinking tranq numbs the body and mind, a very different feeling
        to being drunk on rotgut, amasec or other spirits. Though similar in end result,
        the effects of tranq are unpleasant, depressive, and an acquired taste.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Tranq
type: drug
---
data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: A tech-device of the Divine Astrometricum, a Calixian faction of
        tech-priests concerned with cataloguing stars, nebulae, and distant events
        in the voids. Its clicking arrangement of spheres and hololithic projections
        form a catalogue of sorts, which is of use to those who make their way between
        stars. It can provide a +10 bonus to Navigation, Pilot, Scholastic Lore (Astromancy),
        or Trade (Astrographer) Tests where its information is directly relevant to
        the circumstances.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Almanac Astrae Divinitus
type: drug
