data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: An addictive and illegal drug mostly found amid front line units
        entrenched in seemingly endless combat, White Void creates a beatific feeling
        of well being. Common methods of usage involve either sprinkling the powder
        onto damp lho sticks, or immersing the sticks in dissolved powder then smoking
        them once dry. Long-term usage slowly removes coloration from the eye, eventually
        leaving a small black dot surrounded by white. Users gain +20 WP for 1d10
        minutes per dose. If used more than twice in a week long period, the user
        must make a Hard (-20) Willpower Test or become addicted, unable to fight
        his cravings and ingesting the drug on a daily basis.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: White Void
type: drug
