data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: This is vital bit of equipment for any medic. A typical medikit contains
        various cataplasm patches, contraseptics, and synthetic skin applicators.
        A character who has a medikit at hand when using the Medicae skill gains a
        +20 bonus to their Test.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Medikit
type: drug
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: A practical item for vessels with no properly trained medicae support,
        these kits can be used by almost anyone. Each contains essential items such
        as synthetic skin spray, counterseptics, cast spray, toxin wands, and more,
        all with easy to follow instructions and built-in cogitators for diagnostic
        advice. This item grants a +20 bonus to Medicae skill Tests and can be used
        even if user does not have the skill.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Medikit (Advanced)
type: drug
