    availability: Ubiquitous
    weight: 0
    equipped: false
    inBackpack: false
    description: Most food in the Imperium is packaged, processed, and usually completely
        unrecognisable as anything edible. The quality of ration packs varies widely,
        ranging from simple and poor fare such as corpse starch rations or cultured
        algae to flavoured strips of grox meat and fine nutrislurry.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
