data:
    craftsmanship: common
    availability: Plentiful
    weight: 0
    equipped: false
    inBackpack: false
    description: A simple drug made in numerous styles from many different ingredients,
        Wideawake acts to ward off feelings of drowsiness and keeps the user alert
        for many hours beyond his normal limit. While multiple doses will keep the
        user awake even longer, once the effects wear off the resulting collapse will
        last much longer and lead to feelings of listlessness for several days. Wideawake
        allows the user to stay awake and alert, ignoring one level of Fatigue for
        1d5 hours. Additional doses prolong the affect, but do not counteract more
        than one Fatigue level. fter the drug wears off the user suffers an additional
        level of Fatigue.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
