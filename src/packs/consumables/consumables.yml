    description: 'Though this drug is not as common as Obscura, Haze dealers nonetheless become extremely prosperous within the Calixis Sector’s many hive worlds, and other locations where crime is rife. Normally inhaled or ingested, Haze can produce an addictive delirium that lasts for hours. A single dose of Haze causes 1d5 Intelligence, Perception and Willpower damage, rolled separately for each.'
