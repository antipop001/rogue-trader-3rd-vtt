---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This intoxicating drink is made from a rare small yellow fruit found
        on some worlds on the rimward edges of the Calixis Sector. Fermented properly
        in raw stone vats, it gives a very pleasant glowing feeling when imbibed.
        This glow is quite literal—as intoxication sets in, the drinker actually emits
        a soft reddish hue that diminishes as the effects fade and sobriety sets back
        in. Popular amongst debauched young nobles, it is a favourite drink at their
        parties, where they compete to see who can glow the brightest before passing
        out.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Blush
type: drug
---
data:
    craftsmanship: common
    availability: Ubiquitous
    weight: 0
    equipped: false
    inBackpack: false
    description: The ploin is a fruit grown in both the Calixis Sector and Koronus
        Expanse. It is often brewed into a non-alcoholic beverage popular with many
        Explorers as it combats many common illnesses brought on by the habitual poor
        diets inherent to extended space travel. Made from the lopsided ploin fruit,
        it is rich in nutrients. When cheaply fermented it produces a clear, strong
        drink commonly known as "wobble"—as this is both what the fruit does when
        set upright, as well as what most users do after imbibing. Drinking wobble
        requires a Difficult (-10) Carouse Test to avoid extreme drunkenness—a level
        of fatigue in game terms—and painful headaches the following morning.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Ploin Juice
type: drug
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Raenka is a highly prized brandy made from fermented Ploin juice
        and crafted through careful distillation in used amasec barrels. On several
        feudal worlds, it is a main export and secures a great percentage of yearly
        revenues. Prized for its rich dark yellow hue and subtle bouquet, raenka connoisseurs
        eagerly watch for news each season on the stages of ageing and which areas
        are releasing their vintages. Many traders make a small but tidy profit carrying
        barrels by special request from fermentation yards to impatient buyers willing
        to circumvent the normal flow of the liqueur.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Raenka
type: drug
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This drug induces a state of near monomania, allowing the user to
        totally focus their concentration on a single subject. It is not to be used
        carelessly; if the mind wanders while the drug takes effect there is no telling
        what topic may become the fixation. Still, when a deadly puzzle must be solved
        or an ancient scroll deciphered it can literally become a lifesaver. Users
        taking the drug must first take a Difficult (-10) Willpower Test to see if
        they successfully focus on the desired topic. If they succeed, then they take
        all Intelligence-based tests at +30 bonus for 3d10 rounds. If they fail however,
        for the same period of time they take all tests at a -20 penalty, perhaps
        concentrating more on an attractive shipmate or the pattern or the stars through
        the glassteel void portals.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Attention Spanner
type: drug
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: As long as Ghostfire has been used to produce Frenzon and many of
        the other combat stimulants in Calixis, there has been the refined extract
        commonly called Cold Fire. While Frenzon induces a near-suicidal state of
        aggression (which is fine for Penal Legionaries), Cold Fire allows for more
        self-control, although it is still illegal unless issued by regimental commanders.
        Users gain the Battle Rage Talent, lasting for 3d10 rounds per dose.
    source: Into the Storm
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: Cold Fire
type: drug
