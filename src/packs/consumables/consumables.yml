data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: The nobility of the Imperium dine upon such delicacies as real, unprocessed
        meat from strange beasts, fruits won from death worlds at the cost of many
        lives, and exotic grains from private hydroponic gardens. Some intricate delicacies
        are created solely for the purpose of demonstrating great wealth, but no self-respecting
        noble would sink so low as to eat and drink the same rations as their servants—or,
        Emperor forbid, the filth that serfs and mid-hivers consume.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-drug-vial.png
name: High Provender
type: drug
