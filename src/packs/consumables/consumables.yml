    craftsmanship: common
    availability: Abundant
    weight: 0
    equipped: false
    inBackpack: false
    description: Recaf is a popular hot beverage, made from crushed and brewed leaves.
        The composition can vary from planet to planet, but most blends incorporate
        some form of stimulant such as caffeine or detoxified pharamoxine compounds.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-bottle.png
name: Recaf
type: drug
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: 'Sacred unguents blessed by the Omnissiah are much sought after for
        their mystical properties when applied to machines. If applied to a weapon
        (a Full Action) it becomes immune to Jamming (see Chapter IX: Playing the
        Game, page 249) for a number of shots equal to its clip size. If the weapon
        is Jammed and the unguent is then applied, it immediately unjams, but there
        is no further effect.'
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/consumable-sacred-unguent.png
