  description: Whilst regular melta weapons are known for the tight focus of the superheated blasts they generate, Airtorch ammunition allows them to burn even hotter in a barely-controlled reaction that can almost set the air itself on fire. Indeed, the heat is so intense that it generally overwhelms the barrel allowing the blast to escape in a wide swath. **Effects:** Airtorch canisters fire in a wide swath and gain the Scatter quality, but cause the weapon to suffer from the Overheating quality, as the heat is more than most melta weapons can withstand safely. The more rapid dispersal halves the weapon's Range as well. **Used With:** Inferno pistols and meltaguns.
