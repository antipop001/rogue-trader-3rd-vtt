  description: As the name suggests, these specialised shells contain vials of powerful acids, strong enough to eat through almost any material. Against armours they can dissolve deep into casings, greatly reducing any protection they might provide. Against exposed flesh they can melt tissue down to the bone in moments. Only extremely large-bore weapons can use these shells. **Effects:** Acid Shells cause 2d10 E Damage, 0 Penetration. If the target takes damage it suffers the same effects as being set on Fire. Each hit against an armoured target will reduce its AP value by 1 (down to a minimum of 0); any armour damaged in this way must be repaired to regain its effectiveness. **Used With:** Shotguns, pump-action shotguns, shotgun pistols, shotcannons, bolt pistols, and bolters.
