    inBackpack: false
    description: Filled with much higher concentrations of heavy ions, Microburst
        flasks allow a plasma weapon to fire smaller but denser bursts at farther
        ranges and with greater armour penetration. Microburst plasmas are cooler,
        however, but many users prefer it this way, given the normal thermal temperament
        of the weapon. **Effects:** Plasma weapons using Microburst ammo add -2 Damage,
        +2 Penetration and +10 metres to the weapon's Range but cannot be fired in
        Maximal Mode. Using microburst ammo keeps the weapon from Overheating as well.
        Flasks add 1kg to the weapon weight. **Used With:** Plasma pistols and plasma
        guns.
