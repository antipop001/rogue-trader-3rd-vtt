data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Where most ammunition types are designed to either kill or subdue,
        organgrinder shells are designed for a lingering, excruciatingly painful death.
        If the round penetrates into the flesh, spiralled ridges emerge and the shell
        slowly twists its way through the body, slicing tissue and bone in a pulp
        of viscera. There are rumours that this horrific ammunition was an attempt
        to recreate an actual xenos round, and those who have seen organgrinder shells
        in action know they are not in a hurry to meet anything that they might be
        patterned after. **Effects:** These shells do damage equal to the weapon's
        regular damage. If the target takes Damage from this shell, after reduction
        for Armour and Toughness Bonus, he must make a Toughness Test with a -10 penalty
        for every point of Damage taken. Success means the shell has either failed
        or is not powerful enough to cause further injury. Failure deals an immediate
        2d5 points of Rending Damage to the victim with no reduction from Armour or
        Toughness Bonus. **Used With:** Hand cannons, heavy stubbers, and any Bolt
        weapons.
    source: Into the Storm
