    description: 'The mass-reactive explosive bolt shell is among the deadliest kind of round in the Imperial arsenal. Tempest bolt shells are perhaps the rarest variety, manufactured only in the temples of Mars. They contain a powerful miniaturised plasma-shock generator that releases a pulse of electromagnetic and thermal energy as the shell detonates. They are particularly effective against machine targets, but obtaining them from the Machine Cult is a nigh-impossible task. **Effect:** Change the weapon''s damage class to Energy and the weapon gains the Shock quality. The weapon adds 3 Damage when used against a target with the Machine Trait. **Used With:** Bolt pistols, bolters, and heavy bolters.'
