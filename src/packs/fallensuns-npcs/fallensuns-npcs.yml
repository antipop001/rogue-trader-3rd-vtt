  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Air of Authority
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer was born to command, either motivating or terrifying those under his charge. On a successful Command
      Test, the Explorer may affect a number of targets equal to 1d10 plus his Fellowship Bonus. This Talent has no effect
      on hostile targets, and only affects NPCs.
    cost: 0
    prerequisites: Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: h5yZ1iPD6F6z5Jl4
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
  name: Ambidextrous
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'This Talent does not represent true ambidexterity so much as sufficient training with both hands to make the
      distinction moot. The Explorer can use either hand equally well for any task, and does not suffer the -20 penalty for
      actions using his off hand. Special: When combined with a Two-Weapon Wielder Talent, the penalty for making attacks
      with both weapons in the same Turn drops to -10.'
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: QhQoL3ILNrjwj9sd
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Armour of Contempt
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's hatred of all the impure armours his soul against malign influence. Whenever the Explorer gains
      Corruption Points, reduce the total by 1, to a minimum of 0. With a successful Willpower Test, taken as a Free Action,
      he may ignore the effects of accumulated Corruption Points for 1 Round.
    cost: 0
    prerequisites: Willpower 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 3KoUoHk051lL2dEJ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/psykana/wind-grasp-magenta-1.jpg
  name: Catfall
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Gymnastic ability and natural balance enables the Explorer to fall far greater distances without harm than the
      common man. Whenever he falls, he may take an Agility Test as a Free Action. Success, and each additional Degree of
      Success, reduces the distance fallen by a number of metres equal to the character's Agility Bonus for the purposes of
      determining the Damage from the fall.
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 30wiuPzF3ShRK9ft
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Crack Shot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The Explorer can place his shots where they will inflict more harm: at creases, gaps, or joints in armour. When
      his ranged attack causes Critical Damage, add +2 to the Damage.'
    cost: 0
    prerequisites: Ballistic Skill 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: wfMwWTDtDoFyOjct
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Deadeye Shot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's rock-steady hand and hawk-like eyesight make him a dreaded marksman. No target, however precise,
      can escape his crosshairs. When making a called shot, the character takes a -10 penalty instead of -20.
    cost: 0
    prerequisites: Ballistic Skill 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: Ei4ehAQF0U8m53FS
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fearless
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through hard experience with horrifying situations, fear no longer commands the Explorer's actions. He is immune
      to the effects of Fear and Pinning, but disengaging from combat or backing down from a fight requires a successful Willpower
      Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: lM8PMYjzH5wxgCfL
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Gunslinger
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained with pistols for so long that they are like extensions of his own body, barely requiring
      conscious thought to aim and fire. When armed with two pistols, he reduces the penalty for Two-Weapon Fighting by -10.
      If he also possesses the Ambidextrous Talent, the penalty is reduced to 0.
    cost: 0
    prerequisites: Ballistic Skill 40, Two-Weapon Wielder
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: WQNTqab3HgAURE0S
  effects: []
  flags:
    rt:
      conditionalBonuses:
      - applies:
          characteristics:
          - weaponSkill
          skills: []
        label: in melee vs Eldar, Orks
        value: 10
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hatred (Eldar, Orks)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'A group, organisation or race has wronged the Explorer in the past, fuelling this animosity. When fighting opponents
      of that group in close combat, he gains a +10 bonus to all Weapon Skill Tests made against them. (Errata v1.4: The effects
      of the Hatred Talent never stack — multiple Hatred Talents do not combine, and the bonus to Weapon Skill Tests can never
      exceed +10.) Talent Groups: Criminals, Mutants, Pirates, Psykers, Rogue Trader (specific), Xenos (specific).'
    choice: Eldar, Orks
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: GHADfWFKcL5W3Zz6
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Jaded
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's wide travels have shown both wonders and horrors beyond the ken of most. The galaxy has thrown
      its worst at him and he has yet to flinch. Outrageous events, from death's horrific visage to xenos abominations, will
      not cause Insanity Points or Fear Tests. Terrors of the Warp still affect the character normally.
    cost: 0
    prerequisites: Willpower 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: V9jjeSkwFw0DvXdv
  effects: []
  flags: {}
