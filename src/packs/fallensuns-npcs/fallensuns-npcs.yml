effects: []
flags:
  rt:
    description: 'Slaanesh has many servants, but the most numerous of them are the Daemonettes. Created to fulfil the Prince
      of Pleasure''s every whim, Daemonettes are his courtiers and courtesans, his warriors and messengers.


      In appearance, a daemonette is both alluring and repulsive, with slender, lithe bodies and an androgynous glamour that
      is heightened by the captivating musk that pervades the air around them. A daemonette''s skin is luminously pale and
      smooth, and the daemon''s hands are replaced by long, dextrous claws covered in iron-hard chitin. These claws can bestow
      a gentle caress or a fatal slash with equal skill. Daemonettes move swiftly upon languid, long legs and bird-like feet,
      able to dart across the battlefield with uncanny grace. Regardless of their appearance, daemonettes possess a powerful
      gift from their master, an aura that always makes them appear as an object of ultimate beauty and desire in the eyes
      of their enemies, no matter what race, gender, or morality such a foe may possess.'
    movement: 5/10/15/30
    rawGear: ''
    source: Fallen Suns
img: ''
