- _id: 9XqRWYvcIfIkRDjH
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Air of Authority
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer was born to command, either motivating or terrifying those under his charge. On a successful Command
      Test, the Explorer may affect a number of targets equal to 1d10 plus his Fellowship Bonus. This Talent has no effect
      on hostile targets, and only affects NPCs.
    cost: 0
    prerequisites: Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: stDBYphbCK3NIa0h
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
  name: Ambidextrous
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'This Talent does not represent true ambidexterity so much as sufficient training with both hands to make the
      distinction moot. The Explorer can use either hand equally well for any task, and does not suffer the -20 penalty for
      actions using his off hand. Special: When combined with a Two-Weapon Wielder Talent, the penalty for making attacks
      with both weapons in the same Turn drops to -10.'
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: N9DRmLmFuOjQk58h
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Armour of Contempt
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's hatred of all the impure armours his soul against malign influence. Whenever the Explorer gains
      Corruption Points, reduce the total by 1, to a minimum of 0. With a successful Willpower Test, taken as a Free Action,
      he may ignore the effects of accumulated Corruption Points for 1 Round.
    cost: 0
    prerequisites: Willpower 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: iaNuHfzAj3iCiRbo
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/psykana/wind-grasp-magenta-1.jpg
  name: Catfall
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Gymnastic ability and natural balance enables the Explorer to fall far greater distances without harm than the
      common man. Whenever he falls, he may take an Agility Test as a Free Action. Success, and each additional Degree of
      Success, reduces the distance fallen by a number of metres equal to the character's Agility Bonus for the purposes of
      determining the Damage from the fall.
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: FKy7sPxZQaEd9WTU
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Crack Shot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The Explorer can place his shots where they will inflict more harm: at creases, gaps, or joints in armour. When
      his ranged attack causes Critical Damage, add +2 to the Damage.'
    cost: 0
    prerequisites: Ballistic Skill 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: KFmigvKbCb3YNWTY
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Deadeye Shot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's rock-steady hand and hawk-like eyesight make him a dreaded marksman. No target, however precise,
      can escape his crosshairs. When making a called shot, the character takes a -10 penalty instead of -20.
    cost: 0
    prerequisites: Ballistic Skill 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: fwBFUTfKaFKHGkqh
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fearless
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through hard experience with horrifying situations, fear no longer commands the Explorer's actions. He is immune
      to the effects of Fear and Pinning, but disengaging from combat or backing down from a fight requires a successful Willpower
      Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: ADeDA3C9yWN6TvM8
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Gunslinger
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained with pistols for so long that they are like extensions of his own body, barely requiring
      conscious thought to aim and fire. When armed with two pistols, he reduces the penalty for Two-Weapon Fighting by -10.
      If he also possesses the Ambidextrous Talent, the penalty is reduced to 0.
    cost: 0
    prerequisites: Ballistic Skill 40, Two-Weapon Wielder
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: FPUs7k5k2IPpk0uy
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hatred (Eldar, Orks)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'A group, organisation or race has wronged the Explorer in the past, fuelling this animosity. When fighting opponents
      of that group in close combat, he gains a +10 bonus to all Weapon Skill Tests made against them. (Errata v1.4: The effects
      of the Hatred Talent never stack — multiple Hatred Talents do not combine, and the bonus to Weapon Skill Tests can never
      exceed +10.) Talent Groups: Criminals, Mutants, Pirates, Psykers, Rogue Trader (specific), Xenos (specific).'
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: i3IYGKIqdcsg9XAl
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Jaded
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's wide travels have shown both wonders and horrors beyond the ken of most. The galaxy has thrown
      its worst at him and he has yet to flinch. Outrageous events, from death's horrific visage to xenos abominations, will
      not cause Insanity Points or Fear Tests. Terrors of the Warp still affect the character normally.
    cost: 0
    prerequisites: Willpower 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: gQhhOaeglAH7zlsc
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Master and Commander
  ownership:
    default: 3
  sort: 0
  system: {}
  type: talent
- _id: ir2Pk6W5OQylhwvK
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Pistol Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has practiced with nearly every single-handed ranged weapon within the confines of the Imperium,
      and no small number without. The Universal group confers proficiency with most pistol weapons, including the Bolt, Las,
      Launcher, Melta, Plasma, and SP groups. When a character attempts to use a weapon he does not have the correct Weapon
      Training Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: VJpowJIj8hn8n3ni
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Melee Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained extensively with hand-to-hand weaponry, becoming proficient in the use of virtually
      all hand-held close combat arms. The Universal group includes the Chain, Shock, and Power groups, and allows proficient
      use of all those weapon types. When a character attempts to use a weapon he does not have the correct Weapon Training
      Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: pLUfwQJIfJzX6aaU
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/pistols/pistols_18.png
  name: Quick Draw
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has practised so frequently with his weapons that they practically leap into his hands, ready for
      action. He can Ready as a Free Action when armed with a Pistol or Basic class ranged weapon, or a melee weapon that
      can be wielded in one hand.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: eoCnowMxAeO6NY2E
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Rapid Reload
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The practice bays aboard the Explorer's vessel are like a second home, and he has reloaded countless magazines
      or power cells for his weapons until he can replace them with his eyes closed. The Explorer halves all reload times,
      rounding down. Thus, Half Action reloads become a Free Action, a Full Action reload becomes a Half Action, and so on.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: LxG0OFTJaOKx35f2
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Step Aside
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can sway his body out of the path of an attack, causing it to pass through thin air. He may make
      an additional Dodge once per Round. In effect this gives him a second Reaction that may only be used to Dodge, allowing
      two Dodges in a Turn. However, he may still only attempt a single Dodge against one attack.
    cost: 0
    prerequisites: Agility 40, Dodge
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: Jlfg3Vf1Y754N7jg
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Two-Weapon Wielder (Ballistic)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of training allow the Explorer to use a melee weapon in each hand when needed. When armed with two melee
      weapons, he may spend a Full Action to attack with both. Both tests made to attack with the weapons suffer a -20 penalty.
      He must possess Two-Weapon Wielder (Melee) and Two-Weapon Wielder (Ballistic) if he wishes to use a gun and hand weapon
      together.
    cost: 0
    prerequisites: Weapon Skill 35, Agility 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
