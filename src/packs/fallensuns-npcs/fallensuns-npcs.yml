effects: []
flags:
  rt:
    description: 'Among the Eldar there exists a troupe of masked warrior-dancers called the Harlequins, devotees of their
      Laughing God and driven foes of Chaos. These mysterious entertainers travel the Webway, constantly moving among the
      Eldar people. They bring with them the epic tales of their race, passing them on to each dwindling generation with their
      exquisite dance and evocative mummery. Of these stories the greatest, though most rarely repeated, is the Dance Without
      End, the story of the Fall. In this dark morality tale, the Harlequins re-enact the Fall of the Eldar Empire and the
      creation of Slaanesh—the dark result of their own decadence. Few beings in the galaxy are as single-minded in their
      opposition to Chaos as the Harlequins. Fierce combatants all, their performances turn to death-dances on the field of
      battle, bringing terror and death to the servants of the Dark Powers.


      Acting a variety of parts, troupes make up the bulk of a Harlequin troupe. While the most numerous, these performers
      are nevertheless potent combatants against the forces of Chaos. Their supernatural grace and skill on the battlefield
      surpasses that of all but the most highly-trained Imperial soldier or xenos menace. In addition to their own innate
      skill, all Harlequins make use of technology beyond even the rest of the Eldar people, including brightly-coloured holo-suits
      that mask their movements and anti-gravity "flip-belts."'
    movement: 8/16/24/48
    rawGear: ''
    source: Fallen Suns
img: systems/rogue-trader-3rd/images/npcs/fallensuns/eldar-harlequins.png
