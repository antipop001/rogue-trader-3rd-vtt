    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 0BH0QhfxyMtbPeOd
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Foresight
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Logic and analysis do for the Explorer what Tarot and the bones claim to do for the superstitious masses. By
      careful consideration of all the possible consequences, and examination of all evidence and information, he can identify
      the best path for success. By spending ten minutes studying or analysing a problem, he gains a +10 bonus to his next
      Intelligence Test.
    cost: 0
    prerequisites: Intelligence 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: sdnm5i8LPdgv4zF9
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Improved Warp Sense
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can now see the warp and physical universe side by side, no longer taking any concentration on his
      part. After gaining this Talent, the character may use the Psyniscience Skill as a Free Action.
    cost: 0
    prerequisites: Warp Sense
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 7UsRMCbvcMts2G65
  effects: []
