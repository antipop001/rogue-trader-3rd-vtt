    aptitudes: ''
    benefit: The Explorer's senses have evolved to perceive the warp in parallel with the physical world, though it requires
      some concentration to do so. After gaining this Talent, using the Psyniscience Skill requires a Half Action instead
      of a Full Action.
    cost: 0
