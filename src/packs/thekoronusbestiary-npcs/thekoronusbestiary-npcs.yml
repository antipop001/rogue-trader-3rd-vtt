effects: []
flags:
  rt:
    description: 'Taproom tales at Port Wander tell that these things have been seen in close approximation to Eldar pirates
      and raiding parties, used as some kind of tracking hound. Those who have survived some of these xenos raids have even
      spoken of seeing creatures whose features resemble the Ur-Ghul taking part in the attack. They had been used to hunt
      down those who sought to escape the raiders, fleeing away in frantic attempts to reach safety or hiding places where
      they could wait until the xenos departed. The attempts were doomed to failure. The Ur-Ghuls were loosed to roam the
      area, and soon caught the exhilarating scents of desperation and fear left in the air. In each report, none escaped
      the beasts, and their prey were dragged weeping and screaming back to the xenos raiders to meet their terrible fates.


      One unverified but popularly recounted account relates that a particularly high-ranking member of this enigmatic xenos
      race personally commanded one such beast, using it as part of vile blood-sport raids and other foul practices. The story
      says the xenos employed the beast to track down a human the Eldar believed had wronged him in some unfathomable way.
      It managed to track down the unfortunate prey across the varied surface of Janto III deep within the Unbeholden Reaches,
      a world known for its bleak rocky plains and pestilent marshland. The hunt went on for weeks, ranging far across broad
      swaths of a remote and scantly inhabited continent, but finally the Ur-Ghul caught up with its victim, who did not long
      survive the debt he had to pay. The cruel xenos directing the beast seemed to delight as much with the hunt as it did
      with the method of payment.


      Such thoughts are likely just so much fancy, mere void travellers'' stories to enliven spire parties or to put fear
      in their trading associates'' dreams. Some xenos savants worry though that beings able to command such terrible beasts
      are perhaps even more puissant than previously believed. It is definite that, as mindless hunters, the Ur-Ghul are certainly
      dangerous enough; if actually under the direction of sentient xenos races their threat level can only increase.'
    movement: 4/8/12/24
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/ur-ghul.png
