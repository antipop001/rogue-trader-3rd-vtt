effects: []
flags:
  rt:
    description: 'Those who dare to search through Yu''Vath ruins seeking ancient treasures seldom find what they seek. Worse
      yet, some find exactly what they sought, but are unprepared for the consequences of their discoveries. For those who
      discover a Sandslime, it most often falls into the latter category. These creatures dwell in the darkest depths of abandoned
      voidstations, subterranean chasms, and other places far from the purifying light of the stars.


      Physically, these constructs typically occupy a volume of more than seventy-five kilolitres. However, they are capable
      of shifting their mass and volume substantially to create sheets less than three centimetres thick or limbs more than
      a metre in diameter. As they flow across a surface, they may absorb portions of virtually any material to increase their
      size and mass—destroying the matter in the process. In spite of their soft nature, they are also capable of securely
      grasping objects and anchoring their forms to surfaces with a powerful grip. The mechanism behind this shift in tensile
      strength is unclear, but may be an inherent factor in their chemical composition.


      At times, when a Sandslime flows through a region, it emits flares and arcs of plasma-like energy typical of Yu''Vath
      constructs. These blasts illuminate the area around it with a purple light that legends say tears at the minds of all
      who view it. None know the reasons for these emissions. Some who have viewed it suggest that these are a manifestation
      of the creature''s fury. Others believe that the energy occurs as the construct transforms physical matter into some
      warp-charged energy.


      Regardless of the cause, the light that accompanies these flares is a signature of the construct''s presence. Those
      who have previously confronted a Sandslime immediately know to flee the area when they see the irregular lighting approach.


      No humans know why the Yu''Vath might have created these terrors, unless they were to serve as guardians or destroyers.
      There seems to be little logic to where they are encountered. The records associated with confirmed sightings seldom
      associate them with any items of great value. In fact, many of the reported incidents involving these horrors occurred
      in places where there was no known Yu''Vath activity. It might be that the Sandslimes have destroyed any other Yu''Vath
      artefacts or converted them into more of their own type. Alternatively, it might be that the infectious nature of these
      creatures permitted them to spread to locations where the Yu''Vath had never travelled.


      This infectious reproduction is their greatest threat. Those exposed to the substance of a Sandslime are virtually always
      transformed into another of these creatures. Mere contact with the surface of one of these foul creations can result
      in its victim creating more of the spawn. For most, this is an agonising process that takes place over the course of
      two days. However, some undergo the transformation within moments of their exposure to its unholy touch. While Imperial
      medical treatments can halt a progression that has begun, there is no known way to reverse it. Most of those who have
      survived such exposure lose a limb in order to preserve their lives.


      These entities seem to be able to selectively apply their destructive nature as they travel. In some locations where
      Sandslimes are known to be active, the structures bear substantial wear marks that are consistent with its activities.
      However, in other locations, the characteristic markings are not present. Similarly, while Sandslime reports typically
      indicate that the constructs destroy everything with which they interact, others report finding intact xenos artefacts
      within the remains of a destroyed Sandslime. The basis for these variations is unclear. It may be that there is more
      than one Yu''Vath construct that shares this appearance and nature.


      A few anecdotal reports within Ordo Xenos records suggest that a Sandslime may have a vicious cunning. These indicated
      that Explorers fell prey to one of these specimens when they unknowingly walked into it. In one instance, the construct
      had spread itself thinly across a floor, then simply folded itself over upon its prey, consuming their gear and transforming
      all who had stepped upon it into more of its kind. In another unconfirmed incident, three Sandslimes were said to have
      infiltrated a vessel planetside by entering through its waste disposal chutes. The terrors soon spread through the voidship,
      transforming crew and destroying the craft as they travelled. The survivors insisted that they were only able to tell
      their stories after a desperate escape aboard a saviour pod and years in cryosleep awaiting recovery. Neither of these
      reports mentions the Sandslime''s energetic flares. It may be that the construct is capable of suppressing them or it
      could be that there are specimens that do not exhibit this characteristic trait.


      The Sandslime appears to be one of the more successful of the Yu''Vath creations. Legends of these creatures now extend
      throughout the Koronus Expanse. Agents of the Ordo Xenos have confirmed sightings on more than a dozen worlds, though
      many Explorers believe that this estimate is dramatically lower than could possibly be accurate. Few groups that encounter
      such a construct survive, so they could be responsible for dozens of expeditions that have been lost for unknown reasons.
      On at least two occasions, Rogue Traders have reported discoveries of these constructs aboard space hulks discovered
      far from any inhabited planets. Analysts suggest that these may be due to cases where an infected survivor transformed
      into another Sandslime and devoured its vessel''s crew.


      Because of their deadly and infectious nature, there are stories that circulate on Footfall of a pirate who attempted
      to capture and control a Sandslime. The tales recount how the captain recovered a portion of one of these creatures
      and loaded it into a boarding torpedo. However, the legends also tell how the construct escaped its containment before
      the pirate was able to launch the torpedo at an enemy vessel, and so it devoured the pirate''s crew and vessel instead.
      This legend could of course be a simple morality tale of one''s reach exceeding one''s grasp and the dangers of contact
      with xenos, but those who know the terrifying power and cunning of the Sandslime firsthand are less willing to dismiss
      such stories out of hand.'
    movement: 3/6/9/18
    rawGear: None.
    source: The Koronus Bestiary
