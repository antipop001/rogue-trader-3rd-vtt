    aptitudes: ''
    benefit: The Explorer has the ability to focus his entire body into close combat attacks, adding +2 to damage inflicted
      in melee.
    cost: 0
    prerequisites: Strength 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 631WiQjU0RjyVfLA
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Furious Assault
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's speed and martial prowess allow him to land several blows where lesser combatants land one. If
      he successfully hits his target using the All Out Attack Action, he may spend his Reaction to make an additional attack
      using the same bonuses or penalties as the original attack.
    cost: 0
    prerequisites: Weapon Skill 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: vNUs9YbGTJMxgnHf
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hardy
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's constitution rebounds quickly from shock or injury. When undergoing medical treatment or healing
      from injuries, he recovers Damage as if Lightly Wounded.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 1hNcg6vUC8C8mkNd
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Iron Discipline
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Iron sharpens iron. The Explorer does not coddle his crew, nor motivate them through kindness. His stalwart example
      and stern leadership exhorts them with steel instead of spoils. If the character is visible to his followers, either
      in person or via vox- or pict-caster, they may re-roll failed Willpower Tests made to resist Fear and Pinning. Iron
      Discipline can affect a number of targets equal to the character's Willpower Bonus, who must be under his command. PCs
      can benefit from Iron Discipline if the character with this Talent is the official group leader. If the Explorer is
      leading a boarding action, he gains a +10 bonus to his Command Tests.
    cost: 0
    prerequisites: Willpower 30, Command
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: FW6eFLs48qrsqFi4
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Iron Jaw
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has taken blows from Orks and given back as good as he got. He can bounce back from most strikes
      without ill effects. If ever Stunned, a successful Toughness Test allows him to ignore the effects.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: VVcBFWbO6rSlfwZs
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Lightning Reflexes
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer always expects trouble, even in the most innocuous situations, allowing him to act quickly when
      needed. The character adds twice his Agility Bonus when rolling for Initiative. If he has Unnatural Agility, add +1
      to the multiplier before factoring the bonus into the Initiative roll.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: g183a85Of7Na9Tng
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Master Chirurgeon
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's advanced medical skills enable him to knit flesh with deft mastery. His exceptional education
      in use of the Narthecium, Med-Slate, and supplemental drugs gives his patients an enormous advantage. The Explorer gains
      a +10 bonus on all Medicae Tests. If treating a Heavily or Critically Wounded patient, a successful Test heals 2 points
      of Damage instead of 1. If the patient is in danger of losing a limb from a Critical Hit, the Explorer provides him
      with a +20 bonus to the Toughness Test to prevent limb loss.
    cost: 0
    prerequisites: Medicae +10
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
