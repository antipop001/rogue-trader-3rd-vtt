effects: []
flags:
  rt:
    description: 'The Shadowkith are still mostly human, though barely so, and many of the Magos Biologis would name them
      mutant. Their lean forms are emaciated sinew and lean muscle, stretched thin under leathery skin. Their eyes have become
      wide and furtive under the darkened clouds, as if they seek to hide their shame from the very skies. While it has been
      a relatively short time since Grace became isolated, this slide to degradation is more pronounced than would be expected,
      certainly more than would be expected simply from an unsavoury diet.


      Some retain most of their intelligence, especially those who get meat in their bellies, but many more are scarcely sentient
      from poor diets consisting only of watery fungal growths. Xenos savants have undertaken analysis of this native flora
      with inconclusive results, despite suppositions that these fungi might have something to do with the accelerated morphic
      and cranial drift shown in the more primitive Shadowkith. As low as these wretches might be, life in some ways is worse
      for those who remain sane, knowing it is only a matter of time before they too fall to that state. For some, the awful
      knowledge of what they have done to survive means they no longer wish to rejoin humanity.


      Grace is an unforgiving planet, and the hungry survivors roam the storm-ridden lands amidst the freezing hail in search
      of food. Their once-prized weapons having fallen into disrepair, as few had the knowledge to maintain them. The Shadowkith
      hunt in packs using numbers against their foes. These are now rumoured to include small feral Ork tribes, the remnants
      from some forgotten battle somewhere in the system and dangerous


      enemies even for well-equipped humans. Most estates are now ruins, picked clean of edibles by the hordes that dwell
      in the darkness. Some still remain intact though, fighting desperately to keep the Shadowkith at bay, and continue to
      broadcast calls for aid with all the power their fading generatorium systems can provide. The ether surrounding the
      planet is often filled with multitudes of plaintive appeals, all hoping to reach any nearby ships or other pockets of
      humanity.


      Many of these hails, though, are from those Shadowkith with access to the few functioning vox-casters still intact on
      the planet outside the intact estates. The terrible wretches are perpetually eager to lure unsuspecting meals, and these
      cries for assistance work surprisingly well even given the planet''s reputation. Devious Shadowkith also use greed against
      their rescuers, promising them the legendary gilded treasures and more spoken of in the tavern tales, and even showing
      off some of the riches to tempt them even further. Those landing with hopes of vast fortunes soon learn, as those who
      became the Shadowkith did long ago, that Grace is especially good at crushing all hope.'
    movement: 3/6/9/18
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/shadowkith.png
