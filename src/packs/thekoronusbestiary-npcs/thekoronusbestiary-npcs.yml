effects: []
flags:
  rt:
    description: 'The creature gained its now infamous name many years ago, when Rogue Trader Augustus Killian, the beast
      hunter famed across the Calixis Sector and into the depths of the Expanse, took his leave on Burnscour to show off his
      prowess to a gathering of the Sector''s nobility shimmering behind protective power fields. He claimed to possess a
      new archeotech discovery to unveil, though exactly what it was he would not say other than it would result in a spectacular
      display.


      Killian confidently strode to the nearby water''s edge, wielding only his family''s heirloom power sabre. He then produced
      an oddly shaped crystalline object, which shown with a blue-white light as he waved it over his head to the crowd''s
      delight. Vid-captures recovered later show faces quickly turning to terror as a wyrm larger than ever seen before rose
      out of the swamp and far above the trees. For a long, dreadful moment, nothing moved except for the swamp water dripping
      onto the stunned trader, then it fell to take Killian between jaws now stretched wide enough to swallow a lander.


      Theories vary if the mysterious device had somehow summoned the beast from the depths, or was designed to help him vanquish
      it, or perhaps protect him somehow. He was simply gone in a moment as the beast dove back into its dank home, the massive
      tail carelessly shattering the power field generators and plasteel tents surrounding the panicked crowd. Some insisted
      that Killian glowed an unearthly metallic sheen in the brief moment before he was engulfed, but this was never substantiated
      in the vid-captures.


      House Killian was suddenly ruined in a single day, losing not only their master but also the ancient and invaluable
      Warrant of Trade he had always famously carried in a small stasis cylinder on his wide sash as a point of pride. Many
      Explorers have since also lost their lives attempting to find the creature, knowing that inside is not only what could
      be a priceless device but also an actual Warrant, which would allow them to establish their own dynasty.


      The tale spread through Port Wander''s many taverns and from there into the Calixis Sector, and soon the notoriety made
      it a creature in high demand for the illicit fighting pits and beast arenas across the region. Seeing their favourite
      gladiators eaten alive, and then betting if they can escape before perishing, is often the highlight of many such affairs.'
    movement: 6/12/18/32
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/killian-s-bane.png
