- _id: G5iVCaEjy81GDUMt
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Dark Sight
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait sees normally even in areas of total darkness, and never takes a penalty for fighting
      in areas of dim or no lighting.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: I7cWrGt2GNL9ILCp
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fear (3)
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait has an unnerving appearance. The fear of it always has an associated rating (1–4)
      to reflect just how awful the creature is to behold. The higher the Fear Rating the harder it is for others to resist
      going insane from the encounter, as shown on the following chart.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: L0O2KEfpnx4UM2d7
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: From Beyond
  ownership:
    default: 3
  sort: 0
  system:
    description: The mind of a creature with this Trait is beyond the petty frailties and precarious sanity of a mortal mind.
      It is immune to Fear, Pinning, Insanity Points, and psychic powers used to cloud, control, or delude its mind.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: G1JgLzGku4wwEYN2
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Glossolalia
  ownership:
    default: 3
  sort: 0
  system: {}
  type: trait
- _id: Qt7BPRAtaFxLnNtk
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hoverer (3)
  ownership:
    default: 3
  sort: 0
  system:
    description: 'Creatures with this Trait have a limited capability for flight, flying no higher than two metres. As with
      the Flyer trait, this Trait always includes a number to indicate speed. For more details on flying, see Chapter VII:
      Playing the Game.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: d1PNE6gvDxGWHNId
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Size (Hulking)
  ownership:
    default: 3
  sort: 0
  system:
    description: '**Trait Groups:** Miniscule, Puny, Scrawny, Hulking, Enormous, Massive Creatures come in one of seven different
      size categories, as shown on the following chart. Size affects movement and how easy or hard it is to strike that creature
      in combat. (When calculating a creatures movement, apply the size modifier first, and then other modifiers from other
      Traits or talents. Base movement can never be reduced below 1.) For the purposes of comparison, a human is an average-sized
      creature.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 2Uc4dLEhaegIjJnn
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Strange Physiology
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait has an unusual, alien, or altogether bizarre anatomy. All hits count as Body hits
      and death results when damage equals or exceeds the creature's Wounds.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: Szwt7StZl51rjHg8
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: The Stuff Of Nightmares
  ownership:
    default: 3
  sort: 0
  system:
    description: Some Warp entities are so terribly powerful that the will perpetuating their bodies in our reality is almost
      impossible to break or disrupt. Such entities are completely immune to the effects of poisons, diseases, the need to
      breathe, most environmental hazards, bleeding, stunning, and any critical result other than one that would destroy them
      outright, unless caused by a psychic power, force weapon, or holy attack.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: SnInwDLHEDvqkrtR
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Intelligence (x2)
  ownership:
    default: 3
  sort: 0
  system:
    description: One or more of the creature's Characteristics is unnatural. Each time this Trait is gained, select a Characteristic,
      and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait,
      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
      Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: i87LS6lVgMWKSQ26
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Warp Instability
  ownership:
    default: 3
  sort: 0
  system:
    description: Most Warp-entities have a tenuous hold on our reality, often maintained only by horror and bloodshed, and
      may be disrupted if sufficient harm can be done to their manifested forms. If a creature with this Trait takes damage
      and does not deal damage or Insanity Points to other creatures by the end of its next turn, it must make a Willpower
      Test. The creature takes 1 damage for failure, plus 1 damage for each degree of failure. If this would deal damage equal
      to or in excess of the creature's Wounds, it is cast back into the Warp.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: BVsFcy5HWrw58rbJ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Warp Weapon
  ownership:
    default: 3
  sort: 0
  system:
    description: Creatures with this Trait have weapons that are partially insubstantial, able to ignore such mundane things
      as armour or cover. Natural weapons and attacks made by a creature with this Trait ignore physical armour unless it
      is created from psychoactive materials or carries the holy quality. Force fields still work against these attacks normally.
    source: Rogue Trader Core Rulebook
  type: trait
