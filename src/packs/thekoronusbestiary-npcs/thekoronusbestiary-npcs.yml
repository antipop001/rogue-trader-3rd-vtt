effects: []
flags:
  rt:
    description: 'The tools of the xenos do not always depend upon darkness. Some present the false light of salvation, only
      to drown those who view it with its blasphemous nature. The Crystalwisp—believed to be a creation of the Yu''Vath—is
      one such being. These terrors have been found on worlds that contain the ruins of that ancient civilisation, often in
      the presence of other artefacts. Legends suggest that the ancients created these beings as angelic guardians of their
      treasures. If that is the case, then these creatures are supremely capable of fulfilling their duties.


      Physically, the Crystalwisp resembles a cluster of floating crystals interwoven with crackling energy. Typically one
      of these crystals is much larger than the others. The largest reported specimen was estimated to have a central crystal
      that was more than two metres in diameter. The smaller crystals are typically less than half the size of the central
      one. These move in eccentric orbits around the largest crystal, constantly arcing tendrils of energy back towards it.
      This constant arcing of energy creates characteristic flashes of light that illuminate the creature and all around it
      in a strobing, unnatural manner.


      All of the crystals seem to be made of a partially translucent, milky-white substance. Most show extensive patterns
      of cracks and chips that cover their surface. Observer reports—at least from those who remember their encounter—indicate
      that the patterns change constantly. This may be a function of its unusual lighting effects or rotation, or the patterns
      might actually be changing to new shapes. Legends suggest that the construct records all of its


      memories upon its surface, and these changes in appearance hallmark the constant fluctuations in its latest memories.


      These legends also touch upon the dangers of encountering a Crystalwisp. As the monstrosity moves, it constantly extends
      additional tendrils of its unholy light outwards from its crystalline structures. Whenever one of these luminous tendrils
      comes into contact with an object storing information, the data is gradually erased through unknown means. This effect
      works on electronic, mechanical, and living storage mediums; scrolls and murals may be absorbed just as easily as the
      information stored within a vessel''s cogitators or a human mind.


      The motives of these creatures, on the other hand, are far less obvious than their methods of operation. Most xenobiologists
      believe their behaviour is instinctive, like a beast''s need to hunt and feed, but others claim that their predations
      are part of some dark purpose.


      While a brief contact is generally insufficient to completely destroy all of an individual''s memories, extended contact
      can be devastating. Further, the creature always begins by eliminating the most recently stored memories. Those who
      survive an initial Crystalwisp attack have no memory of the encounter and are momentarily disoriented as they attempt
      to get their bearings. This often allows the creature to surprise them with another strike before they realise what
      is happening. After a series of such attacks, an individual''s mind may be wiped completely clean, leaving them with
      no memory of language or how to control their bodies. Once such a point has been reached, the Crystalwisp typically
      moves on to new prey, as the data storage has been completely emptied.


      Because of this unusual attack mechanism, members of the Adeptus Mechanicus who dare to study Yu''Vath artefacts believe
      that these constructs may be fairly common within the Koronus Expanse. They posit that most encounters go unrecorded,
      as the Crystalwisp devours the memories of individuals and any recording devices they might carry. Those who were injured
      but survived the encounter with some memories intact might not be able to find the way back to their vessel—or even
      know where they were and how they had travelled to that point. These factors suggest that undocumented Crystalwisp encounters
      could constitute a substantial portion of the individuals lost within the Expanse each year due to unknown causes. The
      Adeptus Mechanicus, in particular, finds this possibility—that precious and irreplaceable knowledge can be so casually
      devoured—to be a horrifying anathema to their creed, and an affront to the Omnissiah. More fanatical and martially-minded
      Explorators in the Expanse sometimes go out of their way to hunt down Crystalwisps, or more often, pay others with more
      expendable and less sacred memories to slay the abominations.


      Legends also suggest that the only way the creature can perceive its surroundings is through its energy tendrils. There
      are certainly no visible sense organs upon the creature''s surface. As the crystals float through the air, they constantly
      avoid making contact with solid objects, their only interaction through these lashes of energy and unholy light. These
      factors make it unclear how the creature perceives the world around it; while they display an uncanny ability to sense
      the presence of devices containing record information, little else is known of their sensory mechanisms.


      As these constructs travel through the dark passages of Yu''Vath worlds, the arcs of energy that they emit often give
      off a characteristic crackling sound. Many of those who have seen them and lived (and remembered) to tell of their encounters
      warn to flee when they hear the noise that they describe as "zzr-tk-tk-tk." Strangely, all who have heard the sound
      say and record it with the same vocalisation and letters, and it may be that those who hear it become psychically imprinted
      with the unique noise.


      While a Crystalwisp is hardy, it is not indestructible. There are several confirmed reports of individuals that have
      successfully eliminated one of these specimens. In all known cases, encounters concluded when the largest crystal shattered
      and its energetic aura faded. In some of these reports, the remaining crystalline components broke down into fine dust-like
      granules within moments. In others, the crystals remained intact, but darkly clouded. At least two analysts have used
      cogitators and auspex systems to attempt to recover data from these crystals, but no such attempts have met with success.
      If the information that the Crystalwisp steals is contained within its crystalline form, recovering it may be beyond
      Imperial technology. Even so, members of certain groups within the Adeptus Mechanicus pay hefty prices for the crystalline
      shards from a slain Crystalwisp, in the hopes that they might recover stolen knowledge from eons past. And this is to
      say nothing of the dark whispers occasionally heard of Heretek sects that claim the key to prying out the knowledge
      is to take one of these horrifying specimens alive.'
    movement: 4/8/12/24
    rawGear: None.
    source: The Koronus Bestiary
