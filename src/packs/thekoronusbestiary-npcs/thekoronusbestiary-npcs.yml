effects: []
flags:
  rt:
    description: 'There are clear signs that the Yu’Vath engaged in some form of ancestor worship. Within their towers and
      their catacombs there are massive shrines devoted to the dead. Though all of the identified remains belong to known
      slave races, analysts believe that similar unidentified locations must house the remains of the Yu’Vath. Those who search
      for and investigate such sites, however, and tread upon the forbidden ground of the Yu’Vath, often discover such ruins
      attended by the most horrifying of guardians.


      Many such investigators are unlearned hirelings worried only about the spirits of the entombed dead and other superstitions.
      Explorers more experienced in the nature of Yu’Vath ruins, however, know to fear more corporal hazards, such as the
      dreaded Bone Conqueror. Indeed, to those seeing it for the first time, the Bone Conqueror might well seem to be the
      spirits of the ancient dead rising up from the grave to strike down the interlopers treading carelessly on their hallowed
      ground. This is not the truth of the matter, but the reality of Bone Conquerors is just as terrifying.


      These constructs seem to be created for the sole purpose of guarding the remains of the dead, or perhaps using the dead
      to provide one last service to their ancient masters. The Ordo Xenos have no confirmed reports indicating the origins
      or causes for activation of a Bone Conqueror. It is clear that they are only found within locations that resemble Yu’Vath
      mausoleums unless moved to a new location by ambitious, careless, or ignorant outsiders. However, some analysts suggest
      that these supposed Yu’Vath graveyards only appear at mausoleums due to the Bone Conqueror’s instinctive desire to maintain
      a supply of corpses. It is also possible that, far more often than one would like to assume, Bone Conquerors that cannot
      get enough corpses to form bodies have simply gone unnoticed by treasure-hunters, and have been filed away as mere baubles,
      waiting dormant in the hands of some unsuspecting unfortunate for the right conditions to awaken them to their dark
      purpose and set about their terrible work.


      106


      The physical basis for a Bone Conqueror is a small artefact, typically less than fifty centimetres in length. The precise
      shape and mass of its makeup reportedly varies substantially, though all appear to be composed of a bone-like ceramic
      material. When inactive, these components are often mistaken for a tool crafted from a bone, as they are heavily inscribed
      with many indecipherable characters suggesting perhaps the Yu''Vath language. Typically, this gives them an innocuous
      and primitive appearance that give the uninitiated no reason for fear.


      If one of these artefacts is brought within roughly twenty metres of one or more corpses, they immediately begin to
      assemble an oversized humanoid body from the remains. Generally, the Bone Conqueror is able to use its inherent warp-based
      technology to reanimate these body parts and keep them active for an extremely long period of time. So long, in fact,
      that the majority of confirmed Bone Conqueror encounters began when individuals discovered an active example rather
      than the isolated artefact. It is also believed that these artefacts have some inherent capacity to preserve the remains
      they are actively using. In this way, a Bone Conqueror''s component bodies typically decompose at a rate much, much
      slower than is normally observed.


      Bone Conquerors typically vary in size based upon their access to available corpses. The largest confirmed sightings
      were in excess of six metres tall, while less well-preserved specimens are typically much smaller. In some instances,
      Bone Conquerors utilise non-humanoid corpses in order to assemble their forms. Such variants may be distinctively different
      constructs, or they might just be an instance of the entity working within the context of available resources. The constructs
      clearly demonstrate environmental variation as well. In instances where a mausoleum is located within a room with a
      lower ceiling, Bone Conquerors reform their physical structures so that the reduced height is not an inconvenience.


      The bodies that comprise the Bone Conqueror are linked together with an ever-flowing and rippling series of energy arcs.
      The exact type of energy involved is unclear. Tech-Priests of the Adeptus Mechanicus typically identify it as "dark
      energy" and refuse to offer any additional insights, and those seeking further information regularly find it unavailable
      through standard Imperial channels. These entities often use this same energy to launch attacks against those that intrude
      upon their domains. Those who survive Bone Conqueror attacks often complain that they are haunted by the experience
      ever after. At least two known victims deliberately returned to their attacker once more so their bodies might continue
      in its service. This suggests that there may be a telepathic element present within the constructs energy reserves,
      but there is limited data available to confirm this theory.


      It remains unclear if these constructs were put into place to guard remains for sentimental reason or if there were
      a more pragmatic basis. It is clear that they represent a substantial threat to anyone that encounters them. It is also
      apparent that they are capable of using human remains to create their "bodies" as effectively as they can work with
      the remains of Yu''Vath client races. At the same time, there are no reports of them using non-sentient remains within
      their structures. The reason for such a requirement is unclear, and Ordo Xenos agents have repeatedly requested members
      of the Adeptus Mechanicus to investigate this phenomenon.


      One unusual characteristic of the Bone Conqueror is that, because of its organic components, they seem to be far less
      stable than most other Yu''Vath constructs. When these terrors are left in isolation from any available corpses, they
      eventually revert to an inactive state. However, if they are later moved into a region where bodies become available,
      they swiftly reactivate. Anecdotal reports suggest that in such cases their capacity is proportionate to the number
      of bodies available, but no upper limit to its capacity has been identified. In at least one incident, a ship''s crew
      discovered an active Bone Conqueror in their hold after human remains awaiting processing to corpse starch were temporarily
      stored near a cache of unknown xenos artefacts.'
    movement: 3/6/9/18
    rawGear: None.
    source: The Koronus Bestiary
