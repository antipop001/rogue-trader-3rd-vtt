effects: []
flags:
  rt:
    description: '"So many eyes... so many looking through me... what does it really want from me?"


      —Intercepted vox-cast near Foulstone, origin unknown


      The Stryxis are a wandering species, spending most of their existence tumbling through the cold and unforgiving void.
      They have proven to be exceptionally adept at this lifestyle, however. These xenos act as "friendly" merchants just
      as easily as underhanded pirates and can change from one to the other on a moments notice. Either way, it is almost
      guaranteed that a bargain can be found somewhere during encounters with this particular race, assuming an Explorer maintains
      a very cautious attitude at all times.


      One of their most common representatives are the so-called Nomads, perhaps given this appellation as indicative of the
      race as a whole. Although from what xenos savants can determine, these Stryxis make up the majority of this elusive
      xenos'' reported true population, their numbers are dwarfed by those of the slaves and Vat-Born that inhabit Stryxis
      vessels.


      The standard Nomad tends to be a basic pilot or salvager, standard trades for the race, though some lean more toward
      more extremes of exploration or piracy. This usually depends on the particular habits of their Pact leaders, though
      like all Stryxis they can easily shift their disposition as the circumstance requires. Nomads are very adaptable and
      can perform well in almost any situation that may arise, making them useful in a variety of ship-board roles and dealings
      with other races. They are rarely effectively armed for conflict, however, and almost universally flee any situation
      that does not favour them heavily.'
    movement: 4/8/12/24
    rawGear: Assorted trinkets from other races, three ammunition clips, and xenos ration packs.
    source: The Koronus Bestiary
img: ''
