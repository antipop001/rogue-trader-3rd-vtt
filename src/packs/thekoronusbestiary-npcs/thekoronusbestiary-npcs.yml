    description: Daemonic creatures are creatures of the Warp, but can manifest in realspace either through sheer strength
      of will, hunger, or occult rituals. Creatures with this Trait double their Toughness Bonus against all damage, except
      for damage inflicted by force weapons, psychic powers, holy attacks, or other creatures with this Trait. Daemonic creatures
      are also immune to poison and disease.
    source: Rogue Trader Core Rulebook
  type: trait
