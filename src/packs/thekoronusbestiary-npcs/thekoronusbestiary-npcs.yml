effects: []
flags:
  rt:
    description: 'The Stryxis are some of the Expanse''s best gene manipulators and are well known as growers of biological
      labour that they refer to as "meat." Although this term is often applied to any non-Stryxis inhabitants of Stryxis Pacts,
      it is most frequently used when referring to these genetically grown beings.


      The creatures that Stryxis manufacture are grown in large vats under the arcane directions of Vat Masters, and are more
      commonly known as Vat-Born. The Vat-Born come in all manner of shapes and sizes filling many roles for their Stryxis
      masters. Some are created for the sole purpose of combat, while others are specifically designed for very specialised
      labour.


      Although they come in many forms, the Vat-Born almost always follow the basic template of four appendages, with a head
      and torso. In some rare cases, creations move on all fours, or have multiple heads or extra appendages. It is unclear
      if these deviations in design are purposeful or if they are merely experiments gone horribly awry. These constructs
      are also known to be augmented with implants and tools for the tasks they are specifically built to undertake.


      These unnatural servants often account for the vast majority of the population on board Stryxis ships or asteroid hives.
      It is rare for a Stryxis Pact to have fewer than four times their population consist of these Vat-Born constructs.'
    movement: 3/6/9/18
    rawGear: Practical but worn clothing.
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/vat-labourer.png
