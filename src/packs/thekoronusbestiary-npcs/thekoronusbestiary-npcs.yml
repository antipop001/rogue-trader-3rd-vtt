effects: []
flags:
  rt:
    description: 'Mukaali have existed on Naduesh for many generations, imported long ago by a clever Rogue Trader who realised
      they were a perfect fit for the wide areas of dry, desert climate on that world. Here they quickly became part of the
      native culture, acting as personal transport, beast of burden, and even food should conditions demand the desperate
      act. Overall they have adapted very well, creating a slightly new strain unique to the world. Breeders on Naduesh discovered
      though that if their Mukaali were not allowed to breed in the wild they are even more cowardly and timid than usual,
      barely suited for anything but the mildest of burden duties, and even then they may run away when startled. For this
      reason, many herds are allowed to breed in the open plains, with herdsmen deployed to watch over them to protect from
      poachers or other dangers. As needed, stock is culled from these wild herds for training and resale to buyers across
      the Expanse and beyond.


      The beasts are a common trading item and source of income for many Nadueshi tribes. Many experienced hunters travel
      from the Calixis Sector to pick steeds to carry them on their latest expeditions, and colonists purchase entire herds
      as they prepare to immigrate to the drier or hotter planets they intended to make home. They have also been seen in
      several planetary forces in use as military mounts, but less frequently in mercantile or mercenary bands. One infamous
      Brontian Longknives platoon even somehow arranged for a herd to stampede into enemy lines, shocking their foes long
      enough for the guardsmen to overrun their flattened enemy.'
    movement: 8/16/24/48
    rawGear: ''
    source: The Koronus Bestiary
