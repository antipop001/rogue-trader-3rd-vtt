effects: []
flags:
  rt:
    description: 'Only rarely observed. Abominations are believed to be the highest known rank of Rak''Gol active within the
      Koronus Expanse. Examples of these creatures are most often seen during the latter stages of a Rak''Gol attack. All
      instances where survivors described specimens occurred on planetary surfaces. While analysts believe these creatures
      play a role in shipboard combat, they hypothesise that by the time they join the battle the outcome is virtually certain
      and survivors are tremendously unlikely.


      Analysts have concluded that Abominations typically command Rak''Gol vessels and—in the rare instances where multiple
      Rak''Gol ships co-operate—small fleets. Reports indicate that their approach to close combat mirrors their shipboard
      tactics. These xenos embrace all out assaults and prefer to manoeuvre so that they might engage in melee combat at the
      earliest opportunity. While these massive specimens are always willing to engage in conflict, they are never alone.
      Abominations are always accompanied by other exceptionally large Rak''Gol specimens. Agents of the Ordo Xenos suggest
      that these guardians are Broodmasters that have been tasked with a specific responsibility to protect their overlord.


      Abominations are typically slightly larger than other Rak''Gol. This may be due to physiological changes associated
      with their cultural status, but it is more likely that this is a direct consequence of the extensive implants present
      within these specimens. Many (though not all) reports of Abomination sightings indicate that the specimens exhibit extensive
      decorations upon their cybernetic exoskeletons. The patterns described were complex—several witnesses suggested that
      they also played tricks upon the eye. Others have stated that the symbols were identical to patterns found among Yu''Vath
      ruins. The patterns could be specific iconography associated with these individuals or it could be that they are present
      to indicate specific links to the Ruinous Powers.


      If Imperial analyses are correct, then it is likely that the Abominations are involved in selecting the places where
      the Rak''Gol launch their attacks. Consequently, it is likely that they are familiar with their overarching goals. Abominations
      may even be associated with different combat groups or in direct competition for some unidentified resources present
      within the Koronus Expanse. Ordo Xenos agents as well as individuals associated with groups victimised by the Rak''Gol
      remain extremely interested in discovering such information. In such a case it is likely that eliminating a single Abomination
      might thoroughly disrupt Rak''Gol activity within a region, or it might refocus internal struggles as the species reacts
      to the new power vacuum.


      Alternatively, it is possible that there might be a higher-ranking unknown entity responsible for coordinating Rak''Gol
      actions. Such a being or group of beings might easily be unknown due to the lack of communication and confirmed reports
      of Rak''Gol activity. Some even suggest that it might be another species of xenos entirely, though since the Rak''Gol
      response to every xenos they encounter has been murderous frenzy, this is unlikely.'
    movement: 5/10/15/30
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/abomination.png
