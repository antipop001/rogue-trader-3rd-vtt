effects: []
flags:
  rt:
    description: 'Robin''s game has progressed beyond the Death World where Corpse-Snare blooms and onto a world covered in
      arid desert. The players are there for business, but Robin wants to include a memorable local creature or two. He starts
      by rolling for Base Profile and Size. The results give him a Massive Herd Beast. He adjusts the Base Profile with the
      modifiers for Size, and notes that the creature, while using the Herd Beast Base Profile, is most likely to be encountered
      alone. It''s already tough enough to resist a concerted assault by a group of well-armed Explorers, much less other,
      lesser wild beasts—not to mention that a herd of such creatures couldn''t feed themselves off a desert''s fare. He records
      the adjusted Base Profile as follows:'
    movement: 6/12/18/36
    rawGear: ''
    source: The Koronus Bestiary
