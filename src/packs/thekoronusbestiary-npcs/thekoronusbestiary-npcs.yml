effects: []
flags:
  rt:
    description: 'Now Robin needs to generate the Species Traits for his vines. He rolls on Table 4–3: Flora Species Traits
      twice for Active Trap Species Traits to generate the Traits it uses to hunt, and twice for Death World Species Traits
      to show how the strain evolved to meet the pressures of a Death World ecosystem. The first two rolls come out with the
      Mighty and Deadly Traits, granting increased Weapon Skill and Strength, as well as the Improved Natural Weapons Trait.
      The first roll on the Death World table shows that these vines keep predators away by being Disturbing, granting a Fear
      Rating of 1. Being from a Death World means the creature gains two rolls appropriate to its environment, instead of
      the normal one, and so the creature is also Armoured, adding two to the Natural Armour value of the vines. Robin could
      choose to roll one or more times additionally, but he decides his new flora strain is fine as it is. He decides one
      of the few previous visitors to the Death World called the vines “Corpse-Snare,” after the way in which the vine incorporates
      elements of devoured creatures into its thick rubbery frame as a warning (also accounting for the Fear Rating). The
      final creature’s Profile is as follows:'
    movement: N/A
    rawGear: ''
    source: The Koronus Bestiary
