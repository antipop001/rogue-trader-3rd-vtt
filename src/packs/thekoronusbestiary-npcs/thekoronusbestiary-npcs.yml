effects: []
flags:
  rt:
    description: 'Unquenched are also said to inhabit the deep places and caves beneath the desert, where they burrow down
      into the sands in search of underground rivers and streams. Some say that this is also where they horde their vast accumulated
      treasures, the possessions of those they drain dry, safely stored away from desert raiders eager to quench their own
      thirsts.


      Such deposits would certainly sate even the most rapacious of Rogue Traders should they exist and be uncovered, leading
      several expeditions into the vast depths of sand and dust, all returning parched and empty, or not at all. The lack
      of success has lead some Explorers to suppose the Unquenched themselves are propagating these tales in a cunning effort
      to drive prey to themselves, which is perhaps more likely than surely fanciful stories of fabulous treasures in the
      desert.'
    movement: 4/8/12/24
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/unquenched.png
