effects: []
flags:
  rt:
    description: 'Robin is the GM for a group of Explorers who are planning an expedition to a little-known Death World in
      the Expanse. He needs some local lifeforms to keep the Explorers on their toes, and elects to start with a xenos flora
      strain.


      First, he needs to generate the Base Profile and Flora Type, and rolls on the appropriate tables. The dice tell him
      to use the Large Flora Base Profile—but the creature is an Active Trap, and thus does not use those Characteristics
      exactly as they are. Robin could narrow down some details about what the flora looks like or how it behaves at this
      point, and so he decides the flora is a vast conglomeration of vines that lash out at nearby creatures. He modifies
      the Weapon Skill and Perception to the appropriate levels, and notes the relevant details about the flora’s attacks,
      resulting in the following Base Profile:


      ## Corpse Snare Base Profile'
    movement: N/A
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/example-corpse-snare.png
