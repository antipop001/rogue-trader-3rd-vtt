    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's skill with guns is such that he can target two shots on exactly the same point. When armed with
      two pistols, he can fire both simultaneously as a Full Action. Make a single Ballistic Skill Test, and if successful
      he hits his target with both shots. As the character is firing both guns as a single attack, he may take an Aim Action
      before firing to get a +10 or +20 bonus to the BS Test, and a red-dot laser sight mounted on any one of the weapons
      will provide its +10 bonus. The Explorer does not suffer from the normal -20 BS penalty for wielding two weapons. If
      he hits, the target's Armour gets applied as normal to both hits individually, but Toughness only counts once against
      the combined Damage rolls of both hits. A single successful Dodge Test from the target will avoid both shots.
