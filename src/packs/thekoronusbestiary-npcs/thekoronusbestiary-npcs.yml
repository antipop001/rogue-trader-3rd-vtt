  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of serving as a bodyguard allow the Explorer to put himself in the line of fire, or to take a murderous
      attack that was intended for another. He may sacrifice all of his Actions for the next Round to switch places with an
      ally within 2 metres (as long as there is no obstruction in the way). This may be done at any time, even interrupting
      another action. The character becomes the target of any attacks previously targeting the ally. This Talent may not be
      used more than once per combat.
    cost: 0
    prerequisites: Agility 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
