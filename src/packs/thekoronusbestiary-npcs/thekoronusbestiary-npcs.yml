effects: []
flags:
  rt:
    description: 'Rarely seen by humans, the Wraithguard are thought to be very uncommon to the Expanse. Tales from distant
      battlefields, though, talk of these animated hulking constructs forming implacable waves, moving inexorably across blasted
      landscapes, ignoring all but the most potent attacks and bearing terrifying weapons capable of obliterating any man-made
      substance.


      Xenographers believe the Wraithguard are almost never utilised except in times of desperate war. It is known that the
      Eldar look upon their deployment with sadness and regret. However, the most rapacious Rogue Trader would have to think
      twice about crossing any Eldar who is guarded by these tireless sentinels and their gruesome weapons.


      Constructed from the same psychoplastic, bone-like material as the larger Wraithlords, Wraithguard share the same basic
      design, down to the beautiful gems scattered across the armour. Although not as powerful or implacable as a Wraithlord,
      the fear inspired by these lesser cousins is no less severe due to their unique weapon, the Wraithcannon.


      The Wraithcannon uses unknown xenos technology to fire unstable matter, opening a small warp rift at the target in a
      wide variety of effects. These can range from messy implosions to a sudden and complete disappearance as the foe is
      dragged into the warp forever. No armour has ever been found to be effective against this weapon, and only its relatively
      short range and long recycle time offer any hope at all to forces arrayed against the Wraithguard. Its power source
      is unknown; all that can be determined is that once removed from its bearer, the weapon becomes nothing more than interesting
      but useless xenos sculpture.


      In the Koronus Expanse, Wraithguard have been sighted acting as silent bodyguards for the most important Eldar psykers.
      When these dignitaries deign to meet with humans, they are often flanked by two Wraithguard standing eerily in the background.
      Few confirmed records exist of Wraithguard being used in actual combat, though this could be due to a lack of survivors
      in the case of such encounters. Despite this, enough rumours abound of the efficacy of their weaponry and their fearsome
      abilities to firmly establish their reputation.'
    movement: 4/8/12/24
