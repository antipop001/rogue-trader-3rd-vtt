effects: []
flags:
  rt:
    description: 'Khymeraere are terrifying creatures, literally born from a person''s nightmares. They spawn in the warp,
      coalescing into existence like malignant cysts around the psychic energies that fear and terror leaves in the Immaterium.
      They do not form at the whim of the Chaos Gods nor do they appear to be fragments of these powers. Taxonomists of the
      Ordo Malleus classify them not as actual daemons but as warp creatures, one example of the many unnatural flora and
      fauna existing in the Immaterium, though this distinction is usually lost on those facing the beasts. Khymeraere lack
      a proper corporeal form, allowing them to flicker between real space and the Sea of Souls at whim, appearing momentarily
      before a foe and then vanishing suddenly to launch an attack from an unexpected direction. Their phasing powers also
      mean Khymeraere can appear inside areas thought secure—such as locked rooms or the fighting compartments of armoured
      vehicles. They have even been known to appear inside of moving void ships, meaning they were either drawn by on-board
      psykers or were directed in the attack by agencies unknown.


      Those Khymeraere encountered in the Expanse usually have a huge, roughly feline form, best likened to a skinned hunting
      cat. Each appears a slightly different assemblage of skinless flesh, mighty jaws, grasping talons, and powerful limbs.
      The bright red muscles glisten wetly no matter the level of illumination, while the bare bone of the skull sports several
      pairs of flat black eyes. The long black tongue appears segmented, as if it was an immense worm extending from the Khymera''s
      mouth. Two great raptorial arms sprout from the shoulders, some linked by thin strips of red muscle and white sinews
      and lined with impaling spikes. Others have more tentacle-shaped whips of serrated flesh, and can lash out with blinding
      speed to catch prey. Much smaller talons are found on the chest, where they are used to rip small bits of flesh from
      a downed victim, while the tail is a fleshless series of bone links. Some attack survivors have reported even more bizarre
      shapes with bulging eyes and tucked jaws lacking the dorsal talons; it is supposed these may be immature variants or
      creatures formed from unnatural xenos nightmares. The entire effect, though, is always one of noisome unnaturalness
      and cannot be mistaken for anything but a warp-spawned creature of Chaos.


      Khymeraere are pack hunters and are often found in small groups of four to eight, but in areas of great psychic disturbance
      can appear in vast hordes of forty or more. They fear little and normally view everything, even other warp creatures,
      as prey. While they do not display any actual sentience, they do show great cunning in their actions while hunting.
      Their usual tactic is to rush in as quickly as possible, leaping over or phasing through any obstacles they encounter.
      Once a Khymera closes with a desired target, it quickly lashes out with its raptorial arms, seeking to snare its prey
      with the sharp spikes. The Khymera then drags its victim within range of its long-fanged jaws and smaller chest talons.
      However, the Khymera does not spend too much time on any one target and quickly moves on to a fresh victim, seeking
      to spread as much fear and terror as possible within a short period of time.


      It is in this way they reproduce, using these terrifying attacks to spread new nightmares and other strongly emotional
      reactions, from which new Khymeraere can emerge. Once they have glutted themselves on their kills, the Khymeraere fade
      away, rejoining the warp which birthed them.


      While often found in the vicinity of open warp gates and similar manifestations, Khymeraere can also appear far from
      any known Chaos incursions. There are many tales throughout the Expanse of cruel Eldar using these creatures as part
      of hunting packs or raiding parties, somehow controlling the unstoppable ferocity the beasts normally display. Some
      even quietly speculate these xenos may actually capture Khymeraere in the depths of the warp or other shadowy realms,
      conquering their will and enslaving them to their new masters. Regardless of how they came to be under Eldar control,
      in these situations the beasts are even more dangerous than usual as their handlers can direct their fury to best advantage.
      Where they might normally rampage in wild pursuit, here they can be aimed at the foe so as to cause maximum carnage
      and casualties. They can also be used as tracking and hunting animals, loping across huge distances and warping in and
      out of real space with a tremendous pace. It is nearly impossible to hide from a Khymera on the hunt, as walls, bastions,
      bulkheads, and even voidship hulls do not slow them in their quest.


      Khymeraere can also be found in the Expanse wherever powerful and long-lasting psychic impressions have been formed.
      Battlefields, places of massacre and slaughter, torture chambers, and similar locations all may have seen sufficient
      fear and suffering to cause the creation of one or more Khymeraere. Some Inquisitors who covertly roam the Expanse have
      also reported tales of powerful psykers, especially those unstable nascents still lacking full control of their abilities,
      accidentally summoning newly-formed Khymeraere from the warp. The psyker''s nightmares that resulted in the spawning
      of the warp creature are trivial compared to the actuality of the Khymera, now given physical form and eager to meet
      its creator.'
    movement: 12/24/36/72
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/khymera.png
