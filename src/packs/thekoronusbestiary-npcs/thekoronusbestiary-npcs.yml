effects: []
flags:
  rt:
    description: '"Honestly! Being spooked by a few unknown xenos skulking around near the dig site! That hill is hundreds
      of metres away, and at that range, a few infantry can hardly pose a threat to -"


      -Final words of Alek Lir, Excavator Engine Driver


      In recent decades in the Expanse, tales have spread of spectral forces that bring destruction down upon even the most
      well-prepared party, especially along the Rifts of Hecaton. Accounts have circulated of established Rogue Traders and
      their retinues destroyed by half-seen, floating figures garbed in pale robes. Imperial xenographers have now begun to
      connect these reports with the whispered tales of the Shadow Spectres, perhaps the least well-documented of the Eldar
      Aspect Warriors.


      There are no substantiated sighting of these xenos warriors in the Expanse, and all reports seem more the result of
      poor quality amasce than reputable accounts. They tell of ethereal figures, floating gently in midair, that appear out
      of nowhere to unleash devastating firepower and then disappear again, leaving only burning wreckage behind. All tales
      agree that the more xenos present, the more deadly their impact, and few armours are proof against their wrath.


      Scholars can only speculate regarding these warriors'' armour and weapons, but much can be guessed from what the Imperium
      knows of Eldar capabilities in general. It can be assumed that the Shadow Spectres don light psycho-sensitive armour
      for battle, given the reports of their manoeuvrability and airborne movements. Most tales in the Expanse have them in
      soft grey or faded white armour, with pale streamers and tattered robes that trail behind them as they drift upon the
      wind.


      Their weapon appears to be a laser rifle variant of the crystalline cannons found on their heavy grav-tanks, called
      a Prism Rifle. These smaller weapons share many traits with the Eldar Lasblaster, with the additional ability to somehow
      link together for more power and range; this may explain the wildly varying reports of the weapon''s efficacy in combat
      reports. Shadow Spectres also appear to employ a form of mobility via xenos jet packs, given the reports of sustained
      flight.


      Many xenos scholars hold that these aspect warriors represent the righteous vengeance of the unquiet dead. It is possible
      these warriors are used in other roles than battlefield terror weapons, but as of yet there are none who have lived
      to speak of them.'
    movement: 5/10/15/30
    rawGear: Spectre Jet Pack (confers the Flyer 12 Trait), Personal Holo-field††, 2 extra prism rifle clips, 2 clips of shuriken
      pistol ammunition, xenos-crafted medikit, waystone gem, scanner, and helm (incorporating re-breather, photo-visor, and
      micro-bead).
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/shadow-spectre.png
