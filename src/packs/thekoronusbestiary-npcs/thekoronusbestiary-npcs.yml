flags:
  rt:
    description: 'The xenos races in this section are not typical fare for the ROGUE TRADER setting. They possess no advanced
      technology and pose no threat to other worlds, much less to the Koronus Expanse. While some groups might find this disappointing,
      it would take far more time and space than could be included in this book to give a generator for advanced xenos civilisations
      its proper due.


      However, this focus on fledgling cultures does not mean that stories of danger and hazard cannot occur. While simple
      warclubs may not penetrate carapace armour as easily as Eldar laablasters, a tribe of savages angered by the patronising
      attitude of a haughty Rogue Trader is not a threat to be discounted, especially when their mastery of local terrain
      can cut off escape routes or ground assaults. No alien race is to be assumed non-threatening, as the Imperial Creed
      will readily assert.


      Throughout this area of wilderness space, countless xenos races still thrive. Some hold regional pocket empires, employing
      starships and small warp-capable fleets. Far more commonly they exist on but a single world, often as a pre-industrial
      civilisation with only rudiments of the technology that others have mastered. These races are ostensibly rivals to mankind''s
      rightful dominance, and—according to Imperial doctrine—are to be viewed as a threat as great as that posed by the ravening
      Tyranid or rampaging Ork. Some Rogue Traders in the Expanse rigidly adhere to this philosophy and have purged many a
      race from existence. Other Rogue Traders adopt a more flexible view, believing there are greater profits to be made
      through trade and conquest, as they can often deal with these lesser species from a position of strength and control.
      As a result, many dynasties reap huge fortunes from alien artefacts of a considerably less hazardous provenance than
      Egarian geodes or the glass knives of the Fra''al.


      While dealing with such races is usually less perilous than braving the guardianship of Eldar Maiden Worlds or the corpse-choked
      ruins of the Yu''vath, it is still not altogether safe. These primitive cultures are often as proud and vicious as starfaring
      races, and trade deadly weaponry for a ruthless will to survive, often coupled with a perfect knowledge of the local
      flora and fauna that makes them unmatched in their native environment.


      The only reliable way to deal with such a culture is to engage it with cautious diplomacy, preferably from a position
      of great strength. Intimidation from orbit rarely works, as the xenos typically have no conception of the threat they
      face until everything that could have been of value has been scorched to glass or shattered under macrocannon barrages.
      Some Rogue Traders prefer to engage in raids from guncutters and shuttles, seizing what they can before fleeing beyond
      retaliation, but the cunning and spite of primitive races has led to more than one Warrant being passed to the next
      in succession.


      IV: XENOS GENERATOR


      TABLE 4-8: PRIMITIVE XENOS SPECIES TRAITS


      # XENOS BASE PROFILE


      The following profile represents the baseline for most species that have mastered basic tool-use and social organisation.
      However, such species have begun the trend towards individual specialisation, and so GMs are encouraged to grant modest
      bonuses (no greater than 10 to 15 Characteristic points in total) to individuals based on their role in the society.
      A hunter might receive +5 to Ballistic Skill, Agility, and Perception, while a chieftain''s personal bodyguard might
      have +10 Weapons Skill or Toughness.


      ## Primitive Xenos Profile'
