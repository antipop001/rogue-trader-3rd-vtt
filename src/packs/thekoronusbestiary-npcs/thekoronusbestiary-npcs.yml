effects: []
flags:
  rt:
    description: 'One of the more popular stories told by voidfarers well in their cups is the tale of Magos Du''Bane. The
      Thulian Explorator is said to have travelled to Vaporius, where he became enthralled by the biological makeup of the
      wildlife there. The semi-silicate nature of certain native creatures such as the Dwellers in the Heights interested
      him, but the crystalline skeleton of the Sand Tiger truly fascinated the Magos. He spent weeks in the cities of various
      Priest-Kings, boring them to no end with his experiments and postulations.


      Finally, desperate to be rid of the tiresome Tech-Priest, one of the Priest-Kings sponsored an expedition into the deep
      desert, so Du''Bane might find specimens. The tales all agree that Du''Bane found Sand Tigers, and became convinced
      that he could use a sonic amplifier to resonate with their crystal bones, drawing them from great distances to the machine.
      The last anyone heard about him, he was travelling into the deepest dune seas, seeking a suitable site to test his device.
      His arranged transport finally departed without him, but curiously was later paid the balance of the agreed on fee along
      with a substantial bonus.


      Of course, most assume this is simply a story, designed to prise a few free drinks from the gullible in the Calixis
      Sector eager for tales of the fearsome and dangerous Expanse. Some hold it contains a measure of truth, however, and
      several expeditions have nearly been organised to seek out Du''Bane''s last resting place. A Sand Tiger lure would seem
      to be a guaranteed way to make immense profit—if one ignored the danger of hundreds of ravenous predators converging
      on his location.'
    movement: '3/6/9/18 Grounds: 18'
    rawGear: ''
    source: The Koronus Bestiary
img: systems/rogue-trader-3rd/images/npcs/thekoronusbestiary/sand-tiger.png
