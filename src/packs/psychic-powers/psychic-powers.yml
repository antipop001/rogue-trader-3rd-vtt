data:
    attackBonus: 0
    attackType: Concentration
    cost: 0
    damage: 0
    damageType: Energy
    discipline: Navigator
    description: 'Time is not an arrow that flies straight and true, but rather a
        tangled web of moments and possibilities. The Course Un-travelled power allows
        a Navigator to negotiate this web, stepping fractionally from one moment to
        another, and in the process, altering his position in the physical world.
        The use of such power is extremely dangerous, however, as the Navigator is
        not actually physically travelling in place as such, but rather choosing an
        alternate future in which wish to inhabit. He risks both injury and madness
        in trying to step outside the flow of time in this way. Novice: If the Navigator
        succeeds at a Difficult (–10) Willpower Test, he may move to any point within
        a distance equal to his Perception Characteristic in metres, so long as he
        could have walked, climbed, or swam there normally without impediment. If
        he fails this test, he is Stunned for 1 round and fails to change position.
        If he fails this test by three degrees or more, he is Stunned for 1d10 rounds
        and gains an Insanity Point. Whether or not this power is successful, the
        Navigator suffers a level of Fatigue at the end of the Round thanks to the
        strain on his body. Adept: As above, except the test is only to double the
        Navigator''s Perception Characteristic in metres. Master: As above, except
        he may now perform this power as a Free Action or as a Reaction. // Errata:
        Default action changed to Half Action per Errata v1.4, except at Master level
        where it can be a Free Action or Reaction.'
