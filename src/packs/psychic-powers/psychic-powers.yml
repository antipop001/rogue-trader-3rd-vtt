  damageType: Energy
  description: 'Those who put their trust in the Warp are constantly compelled to draw others under its influence. This strategy is as fundamental to the nature of mortal cultists as it is to the most powerful Daemonic entities. Some of these beings are capable of using their Warp-spawned powers to twist mortal minds into completely new systems of belief. By exploiting their inherently psychic nature, they can delicately manipulate an individual''s core personality so that it assumes an entirely new outlook, sometimes without their subject''s knowledge. The Daemon selects a target and makes a Focus Power Test. On success, the Daemon is able to dominate the target''s thoughts and alter some aspect of their belief system. The severity of this change is directly proportionate to the Psy Rating of the Daemon (see Table 5–11: Fire of Revelation Transformations). On 3+ Degrees of Success, the subject does not realise that the change in beliefs has occurred. If a character with Fate Points falls
    under the sway of this power, he may "burn" a Fate Point to permanently remove the Daemon''s mystical influence over him. If he does so, he also becomes immune to any future uses of this power by the same Daemon.'
