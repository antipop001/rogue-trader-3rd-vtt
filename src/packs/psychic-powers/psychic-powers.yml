data:
    attackBonus: 0
    attackType: 'Concentration'
    cost: 0
    damage: 0
    damageType: 'Energy'
    discipline: 'Telepathy'
    description: 'As part of the Soul Binding process, astropaths become able to send and receive messages across vast distances using the warp as a medium. Using astro-telepathic abilities in this way requires careful concentration, meditation, and freedom from distraction, and so cannot be done "on the move," let alone during combat or strife. Transmitting a message over interstellar distances normally takes 1d5 hours (this time may be adjusted at the GM''s discretion based on the length and complexity of the message). Astropathic communication in this way is a matter of sending and receiving messages that must themselves be encapsulated and encrypted lest they become lost in the warp, hopelessly garbled, or worse yet, intercepted. As a result, messages sent over long distances are often ''packets'' of information, akin in some ways to letters or brief recordings from the real world absorbed and sent on their way to be (hopefully) caught and possibly relayed on by other astropaths to their intended destination. This process is not instantaneous. However, it is considerably faster than warp travel—an astropathic signal will cross a solar system in moments, across a subsector in hours, a sector in days and, if strong enough, a Segmentum. An astropath''s "signal strength"—broadly how far in average conditions in the warp he may transmit clearly with a successful focused use of his power—is determined by his Psy Rating (see Table 6–5: Astral Signals). After this distance, unless relayed on, the signal will sharply degrade, imposing a –20 penalty to understand per additional range bracket until it dissolves into nothingness. Picking up an astropathic communication by its intended target within clear range is a Routine (+10) Psyniscience Test for an astropath in a meditative state to receive one, and a Challenging (+0) test for one going about ordinary life, increasing to Hard (–20) if he is in life or death combat or other such distracting circumstances.'
