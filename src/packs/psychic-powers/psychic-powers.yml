data:
    attackBonus: 0
    attackType: Psychic Bolt
    cost: 0
    damage: 1d10
    damageType: Energy
    discipline: Navigator
    description: 'Novice: The Navigator makes an Opposed Willpower Test with anyone
        looking into his Warp Eye within 15 metres. Make a single test for the Navigator
        and compare it to the results of each person gazing into his Warp Eye. Should
        the Navigator achieve more degrees of success, the opponent suffers 1d10+
        the Navigator''s unmodified Willpower Bonus in Energy damage, plus an additional
        1d10 for every degree of success. This damage is not reduced by armour (unless
        warded), but the opponent may use his Toughness Bonus. Adept: As per Novice,
        however the damage is increased to 1d10+ double the Navigator''s unmodified
        Willpower Bonus in Energy Damage, plus an additional 1d10 for every degree
        of Success. In addition, this ability can also damage non-living beings, and
        inanimate objects (bulkheads, structures, etc). Because of the taxing nature
        of this power, using it causes the Navigator to suffer one Wound and one level
        of Fatigue. Should the Navigator fail the Willpower Test by one degree or
