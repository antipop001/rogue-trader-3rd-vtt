    cost: 0
    damage: 0
    damageType: Energy
    discipline: Navigator
    description: 'By using his warp eye to filter small secrets from the near future,
        the Navigator can choose to make slight adjustments to his actions to avoid
        harm and manipulate the course of events. Only if the Navigator tries to dig
        too deep into the future and he may become victim of the warp''s lies. Novice:
        With a successful Perception Test, the Navigator draws three secrets from
        the future. He may then "spend" a secret on his following turn to gain a +10%
        bonus on any Test. Using one secret in this way carries no danger. However,
        he may choose to spend either of his other two secrets to add an additional
        +10 bonus to the roll for each secret spent (for a total bonus of +20 for
        2 secrets used, and +30 for three secrets used). For each additional secret
        used beyond the first, the Navigator must roll a d10; if this roll comes up
        7, 8, 9, or 10, then the secret causes the Navigator to suffer a –10% penalty
        instead of granting a bonus. Secrets not used in the following round are lost
        as time marches on. Using this power more than once in the same hour is dangerous,
        as no one should know too much about his own future. For every use after the
        first in a single hour, the Navigator suffers 1d5 Insanity Points. Adept:
        As above, except secrets will only deduct rather than add on a roll of 9 or
        10. Master: As above, except secrets can be used up to five rounds after the
        power is used. // Errata: Default action changed to Half Action per Errata
        v1.4.'
