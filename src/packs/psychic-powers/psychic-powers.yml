  attackType: Concentration
  cost: 0
  damage: 0
  damageType: Energy
  description: 'Time can flow in a strange manner when travelling through the Immaterium, and over the years many Navigators have learned to move with the temporal unpredictability of the Immaterium that underlies reality. By unleashing a vision that strips away the presumptuous facade of linear time before an attacker''s eyes, the Navigator can slow an enemy to a crawl. Even if the power''s effect is extraordinarily subtle, many have found it to be just enough to stay an assassin''s blade by a few precious moments or prevent a foe escaping the judgement of the Navis Nobilite. Novice: The Navigator makes an Opposed Willpower Test against a single target within his line of sight who can see his Warp Eye. If he succeeds on the Test, so long as the target remains within line of sight, it may not perform Reactions as its movements slow. Anyone attempting to Dodge or Parry an attack made by the target gains a +10 bonus to his Skill Test. This power lasts as long as the Navigator chooses to maintain
    it, although he must devote his first Half Action on each of his Turns to maintaining it or the power fades at the end of the Turn. Adept: As per Novice, except that the effects extend the Navigator''s Willpower Bonus in metres around the target, slowing every creature in the radius that fails the Opposed Willpower Test. The bonus to Dodge and Parry Tests increases to +20. Master: As per Adept, except that anyone caught in this area completely loses his grip on the flow of time for a few fleeting moments. For the first Round that the power takes effect, all creatures caught within the radius that fail the Opposed Willpower Test are Stunned.'
