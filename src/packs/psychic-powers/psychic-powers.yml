        than normal psykers, Navigators may be given the location of the beacon. Should
        the Navigator gain at least one degree of success on a Difficult (–10) Psyniscience
        Test, then he is able to locate the beacon within a number of light years
        equal to the psyker's Psy Rating. By knowing the location of the beacon (and
        being able to sense it) a Navigator who is unable to locate the Astronomican
        can make a Very Hard (–30) Navigation (Warp) Test instead of the normal test
        required to chart a successful course. The beacon can become obscured by warp
        storms or eddies, or even destroyed, per the Game Master's discretion. This
        power may not be used at the Fettered Psychic Strength.
