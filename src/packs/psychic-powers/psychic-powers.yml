    cost: 100
    damage: 0
    damageType: 'Energy'
    discipline: 'Divination'
    description: 'By succeeding at a Psyniscience Test, the psyker can locate and track down a single object or person in his immediate vicinity. The psyker can find anything, but there must be some degree of familiarity. Touching a lock and trying to find the key to that lock is fine, but just thinking "I want a key" without a corresponding lock will not work. In the same vein, the psyker must have seen the person he wants to find—either directly or through some image, painting, etc.—or have the target''s true name. Once the psyker has chosen a target, he makes a Psyniscience Test modified by the following factors: Intimately familiar with target (Knows subject well, or has an item that has been with the subject for a long time): +10. Has a portion of the subject (Fragment from the item, lock of hair from a person): +5. Subject is surrounded by others of its kind (a coin in a coin purse, a person in a crowd, etc.): –10. Subject is within 50m x Psy Rating: +5. Subject is over 2 km away: –20. If the psyker passes the Psyniscience Test, and the subject is within range, the psyker receives a rough idea of where the subject is located, based on how many degrees of success he has scored. 0: The psyker knows the rough direction of the subject. 2: The psyker knows the specific direction of the subject, and roughly how far away it is. 4: The psyker knows the specific direction of the subject, and exactly how far away it is. // Errata: Focus Power Test listed as Psyniscience in Errata v1.4.'
