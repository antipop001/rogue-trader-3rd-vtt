    description: With this power the psyker is able to create a small psychic beacon
        within the Empyrean that can only be seen with Psyniscience or by a Navigator's
        Warp Eye. Any psyker within 10,000 km x Psy Rating can sense the beacon. If
        the psyker succeeds on a Challenging (+0) Psyniscience Test, he can determine
        how far away he is from that beacon as if it were a fixed point in space.
        The maximum range that he can perceive the beacon is equal to 5km x Psy Rating.
