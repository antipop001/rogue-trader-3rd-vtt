    description: 'When a ship travels though either real space or the warp it leaves
        a faint trail, the lingering shadow of its warp drive. Using his third eye,
        the Navigator can follow this trail across the stars. Novice: Using Perception,
        the Navigator can track the warp trail of a ship through real space in the
        same way as if he was using the Tracking skill (see page 88). To track a warp
        trail, it can be no older than the Navigator''s Perception Bonus in weeks,
        although the size and power of the vessel involved may mitigate this. Adept:
        As above, however, the warp trail may be up to a number of months old equal
