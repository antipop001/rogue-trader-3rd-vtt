    description: 'By understanding and perceiving the currents of the warp, the Navigator can hide his presence from those that would use the Immaterium to detect him. Whilst it does not in any way mask his presence in the real universe, it can ably hide him from detection by Psykers and confuse creatures whose essence and existence are linked to the warp, such as Daemons and other warp entities. As the Navigator grows in power, he will become harder to detect, as well as being able to mask others if they stand nearby. Novice: By making a Willpower test, the Navigator becomes shrouded in an immaterial cloak, forcing those that use any kind of psychic sight, detection or divination to make a Challenging (+0) Perception Test to see him with such powers. This power also has the same effect on the perception of all Daemons and warp entities. This power will last as long as the Navigator maintains it, however whilst he does so, he cannot use any other powers (though he may take other actions normally). Adept: As above, except the test to detect the Navigator becomes Difficult (–10). Master: As above, except the power gains a radius equal to the Navigator''s Willpower Bonus in metres centred on his person. Any creature within the radius may be shrouded at the choice of the Navigator. // Errata: Default action changed to Half Action per Errata v1.4.'
