data:
    attackBonus: 0
    attackType: Concentration
    cost: 200
    damage: 0
    damageType: Energy
    discipline: Divination
    description: 'Learning to read the Tarot is in part the act of learning to divine
        the Emperor''s word from psychic impressions. Refining this skill allows the
        psyker to learn more about others from the crude psychic traces they leave
        behind on objects and places in the world around them. In its simplest form,
        the psyker can gain rough impressions from an object or a general area by
        maintaining physical contact and making a Psyniscience Test. More information
        beyond the strongest emotions requires time, and the longer the psyker stays
        in a given area, the more information he can ascertain. These numbers are
        modified by the raw strength of the psyker, and he may subtract a number of
        rounds equal to his Psy Rating from each result level. Example: A psyker with
        Psy Rating 5 will get the first result in 5 rounds, the second result in 10,
        etc. Rounds Result: 10: The psyker can detect the strongest emotion associated
        with the area or object. 20: The psyker can see the general features of the
        person who experienced the emotion. 30: The psyker gets a clear image of the
        person who experienced the emotion. 40: The psyker is able to identify the
        person''s occupation (e.g. Career and Rank). 50: The psyker can now determine
        the name of the person. +10: The psyker discovers an additional fact about
        the person as determined by the GM. // Errata: Focus Power Test changed to
        Psyniscience per Errata v1.4.'
