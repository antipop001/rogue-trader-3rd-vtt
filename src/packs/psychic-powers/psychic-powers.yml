data:
  action: Full Action
  attackBonus: 0
  attackType: Concentration
  cost: 0
  damage: 0
  damageType: Energy
  description: In order to successfully corrupt humanity, Daemons pursue a broad range of different approaches. For some individuals, punishment and agony is the most effective tool available. For others, the offer of pleasure can be incredibly addictive. Those Daemons that most commonly induce euphoria in their prey often begin with psychic techniques that fog the mind as they simultaneously overwhelm the sensory organs. This technique represents one method of overcoming the defences of a single individual for these purposes. Under its influence, a target may become far easier to manipulate and thus bind to the cause of the Ruinous Powers. Alternatively, a Daemon might use this against a foe that must be quickly overcome—after all, in a euphoric state, a target is seldom capable of mounting an effective defence. The Daemon selects a target within range and makes an Opposed Fellowship Test, which the target resists with his Willpower. If the Daemon wins the Opposed Test, it inflicts 1d10
    Willpower Damage on the target, plus an additional 1d5 Willpower Damage for every two Degrees by which it won the Opposed Test. If the target's Willpower drops to zero because of this power, it falls under the sway of the Daemon (instead of suffering the normal effects of having zero Willpower) as long as the Daemon sustains the Technique. The target loses the ability to act of its own volition and simply remains standing, catatonic. Each Round, at the start of the Daemon's Turn, it may spend a Free Action to make a Challenging (+0) Fellowship Test to convince the target to take any action of the Daemon's choosing, which it obeys without question. If any of the target's allies are present, any single ally may attempt to appeal to his erstwhile friend, spending his Reaction to make this Fellowship Test into an Opposed Fellowship Test against the Daemon. The winner of this Opposed Fellowship Test then issues the order to the victim of this power. When the Daemon stops sustaining this power,
    the target is released from its grasp and immediately suffers all of the effects of having zero Willpower until it can recover from this Characteristic Damage (see page 251 of the ROGUE TRADER Core Rulebook).
