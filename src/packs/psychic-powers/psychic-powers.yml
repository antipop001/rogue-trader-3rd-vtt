  damageType: Energy
  description: 'A skilled Navigator can use this power to mark a point of calm in even the most tumultuous Warp storm. On a smaller scale, they can also use this ability to find a stillness in the Immaterium flowing around them that dampens psychic powers and even pushes Daemons back towards the edge of the dark pit from whence they came. Many Navigator Houses teach their progeny how to seek this calm in the Warp, as it may be the only thing that stops the Navigator from being torn to shreds and their soul devoured by Daemons in the case of a flicker in the Gellar Field. Novice: On a successful Difficult (-10) Willpower Test, the Navigator causes an area with a radius of his Perception Bonus times 5 metres to fall into a Warp lull for two Rounds, plus one Round per Degrees of Success on the Willpower Test. The Navigator may also choose to dismiss the calm as a Free Action at the beginning of his Turn. At the end of each of his Turns that he does not choose to dismiss the calm, the Navigator
    must make a Challenging (+0) Toughness Test or gain one level of Fatigue. Psykers in this area suffer a -10 penalty to all Focus Power Tests. Daemons that end their Turns within this area must make a Challenging (+0) Toughness Test or be Stunned for 1 Round. Adept: As per Novice, but Psykers do not add any bonus from their Psy Rating to their Focus Power Tests and Daemons who fail their Toughness Test to resist this power also suffer 1d5 plus the Navigator''s Perception Bonus in Energy Damage that ignores Toughness Bonus, Armour, and the Daemonic Trait. Master: As per Adept, but the calm lasts for four Rounds plus two Rounds per Degree of Success that the Navigator scores on his Willpower Test.'
