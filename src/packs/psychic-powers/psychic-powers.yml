    damageType: 'Energy'
    discipline: 'Divination'
    description: 'The psyker can attempt to read the aura of any person he can see as a Full Action. This requires a successful Focus Power Test, with every degree of success providing more information. A psyker can only maintain this power on one target. If he wishes to divine the well-being of a different person, he must activate the power again. If the psyker maintains the power on the same target, he can increase his Degrees of Success by +1 per round cumulatively, eventually getting to the full 3 Degrees of Success. 0: The psyker gains superficial impressions about the target person. This includes the three strongest emotions the target is currently experiencing, his race, whether or not he has any psychic powers, and a rough idea of his state of mental and physical health (No numbers, just good, poor, weak, etc.). Lastly, it determines if the target is an untouchable–naturally, in this case, the psyker receives no further information, including the effects from this technique! 1: The psyker gets all of the information above, plus he gets a deeper insight in to all of the target''s feelings, granting a +10 to all Fellowship Tests made against the target while Divination is active. The psyker also gets a better idea about the target''s well-being, including current Wounds and Fatigue levels. Finally, if the target is also a psyker, he can sense the target''s Psy Rating. 2: The psyker gets all of the above results, plus he can now determine the target''s Insanity Points, as well as which addictions or madness he might be suffering from. If the target is a psyker, he can determine which Discipline(s) and Techniques the target possesses. 3: The psyker gets all of the above information, and now he can determine how many Corruption Points the target might have accumulated. Also, the psyker can determine if the aura is genuine, or has been produced by some other means—technologically, psychically, daemonically, etc.'
