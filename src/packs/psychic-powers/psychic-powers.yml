    damageType: Energy
    discipline: Navigator
    description: 'The unflinching eye of a Navigator locks a creature in place with
        a gaze that pierces flesh and bone to see the immaterial essence of all things.
        Most commonly employed against psykers, this ability can be used to render
        them effectively powerless and prevent them from calling upon their abilities.
        It is also undeniably effective against creatures with a strong connection
        to the warp, such as daemons, for which it can have spectacular and devastating
        consequences. Novice: The Navigator chooses a target which he has line of
        sight to and is no further away than 5 metres per point of his Perception
        Bonus. He then makes an Opposed Willpower test with the target. If he is successful,
        then the target is locked and will remain so as long as the Navigator does
        not use any other powers. A locked target must beat the Navigator in an Opposed
        Willpower test each time it wishes to use a psychic power or invoke the Daemonic
        Presence Trait. If the target moves out of range or line of sight, the power
        ends. Daemons affected by this power suffer 1 point of additional Damage for
        Warp Instability. Adept: As above, however the range increases to the 20 metres
        per point of the Navigator''s Perception Bonus and daemons affected by this
        power suffer 2d10 points of damage instead of 1 point when suffering Warp
        Instability. Master: As above, with the addition that the Navigator no longer
        needs to have line of sight to the target and daemons suffering any damage
        from Warp Instability are immediately destroyed and cast back into the warp.
