    description: 'By reading the Emperor''s Tarot for a specific individual, the psyker can grant insight into what troubles lay ahead. A specific question must be asked, though it can be as detailed as "What must we overcome to defeat the xenos on Choir?" or as broad as "How can I turn a greater profit?" After that, the psyker will read the Emperor''s Tarot for the subject as they both concentrate on the question asked. At the end of this time, typically 30 minutes—though some readings take longer to interpret—the psyker makes a Psyniscience Test. Every two degrees of success reveals more information. However, any rolls on the Psychic Phenemona chart that are provoked from this technique also add +10. 0: Opposition: The psyker can determine the greatest opposition that the subject will face. 2: Fears: The psyker also can determine other negative forces that may be in play—the number of these is equal to the Psy Rating used in this power. 4: Hopes: The psyker can now determine the greatest advantage or tool the subject has at hand. 6+: Outcome: The psyker may offer a single sentence of advice to the subject about the clearest path to his answer. // Errata: Focus Power Test changed to Psyniscience per Errata v1.4.'
