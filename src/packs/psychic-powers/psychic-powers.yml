  description: Some Daemons are capable of inflicting the twisting nature of the Warp directly upon their material targets. Those subjected to such attacks may become dramatically transformed by the Warp energy that wreathes them. Often, such an attack may appear as a searing blast of Warp-flame, symbolic of the many-coloured fires of Tzeentch. The Daemon activates this Technique by selecting a target within range and making a Focus Power Test. The attack deals 1d10 Energy Damage with a Pen of 5, plus an additional 1d10 Energy Damage per two Degrees of Success on the Focus Power Test. Any living creature affected by the Technique must immediately make a Challenging (+0) Toughness Test. Failure indicates that the target gains 1d5 Corruption Points, plus an additional Corruption Point for every Degree of Failure. A target that fails this Test by five or more Degrees of Failure becomes subject to swift and catastrophic mutation, transforming irreversibly into a Chaos Spawn. Characters with
