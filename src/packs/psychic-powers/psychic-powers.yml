    damage: 1d10
    damageType: Impact
    discipline: Telekinesis
    description: 'Telekinesis is the ability to move physical objects with force of
        will. The psyker''s initial gift in Telekinesis has several applications.
        The psyker may lift or move any object within his range and line of sight
        that does not exceed the weight limit of 10 kg x Psy Rating. The object may
        be moved slowly within the range of the power. Objects move far too slowly
        to be used as an attack, however. Additionally, this raw lifting ability does
        not function on living beings, as the smallest movements tend to unbalance
        the psyker''s mental focus. Once an object is released from Telekinesis, it
        begins to slowly settle back to earth as the last vestiges of the power leave
        it. A more forceful approach can be taken with lighter objects, weighing up
        to 5 kg x Psy Rating. These may be accelerated with greater speed and force,
        out to a maximum of 5 metres x Psy Rating. To hit a target, the psyker makes
        a Ballistic Skill Test. Damage is equal to 1d10 Impact Damage plus 1 point
        per 5 kg of the missile''s weight. Lastly, the psyker can direct a sharp wave
        of force against a target to shove it away. The psyker must make an Opposed
        Test, pitting his Willpower against the target''s Strength. If the psyker
        wins, he knocks the target to the ground and pushes it away a number of metres
        equal to his Psy Rating. // Damage formula: 1d10 Impact + 1 per 5 kg'
