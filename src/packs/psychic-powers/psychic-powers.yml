  damageType: Energy
  description: It is clear that many psykers perceive reality differently to those who lack psychic talents. Among the Rak'Gol, where many members perceive the world through cybernetic implants or radiation spawned mutations, the baseline for perceptions is decidedly variable. For those who are neither Rak'Gol nor a psyker, the world as perceived and understood by these creatures is a horrifying experience. Even more horrifying is the effect of the Rak'Gol psyker overlaying its dread perceptions onto the world around it, and those unfortunate enough to be caught within the blast can only watch in abject terror as reality itself frays and tatters, breaking apart at the most elemental level. Objects and individuals within the blast begin to break apart in incomprehensible ways, and madness seems the only escape from this realm of absolute terror. The psyker makes a Focus Power Test to activate the Technique. This Technique affects each enemy within range (other than the psyker himself). Each
    target that loses its Opposed Test against the psyker suffers 1d10 + Psy Rating Characteristic Damage to a randomly chosen Characteristic. Every Degree of Success inflicts an additional 2 points of Characteristic Damage and 1 additional Insanity Point. Characters may attempt to Dodge the effect as one. Dodges an Area Effect Attack (see page 239 of the ROGUE TRADER Core Rulebook). 113
