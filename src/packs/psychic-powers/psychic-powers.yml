data:
    attackBonus: 0
    attackType: Concentration
    cost: 0
    damage: 0
    damageType: Energy
    discipline: Navigator
    description: 'Using this power and gazing into the void whilst aboard ship, the
        Navigator can learn things about space in the immediate vicinity of his vessel.
        This can reveal hidden dangers such as mines, void creatures, and concealed
        ships, as well as more mundane perils like asteroids and debris. With skill
        and practice, a Navigator''s void sense can become amazingly precise and reach
        out across millions of kilometres of space. Novice: The Navigator can make
        a Perception test (modified by range and size of potential objects as the
        GM thinks appropriate) to detect objects in space up to a distance equal to
        the Navigator''s Perception Bonus in Void Units (see page 212 in Chapter VIII:
        Starships). If the power is not being used during space combat, the distance
        equals 1,000 kilometres times the Navigator''s Perception Bonus. Information
        gained about such objects is only what the Navigator could discover through
        normal observation. Adept: As above, however, range is increased to a distance
        equal to double the Navigator''s Perception Bonus in Void Units (see page
        212 in Chapter VIII: Starships), or 10,000 km times the Navigator''s Perception
        Bonus if the power is not being used during space combat. He may make a Difficult
        (–10) Willpower Test to gain some information about the nature of the object
        (i.e., what minerals are in an asteroid, what kind of crew a starship has).
        Master: As above, except range becomes equal to five times the Navigator''s
        Perception Bonus in Void Units (see page 212 in Chapter VIII: Starships),
        or 100,000 km times the Navigator''s Perception Bonus if the power is not
        being used during space combat. The test to gain additional information becomes
        Routine (+10). // Errata: Default action changed to Half Action per Errata
        v1.4.'
