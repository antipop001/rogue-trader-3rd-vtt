  description: 'There are many myths about the "third eye" into the soul, their origins supposedly harking from Old Terra itself. The Navis Nobilite knows that such stories are not wholly mythical, though, and that it is entirely possible to discover hidden knowledge and a degree of inner calm using its own unique brand of introspective meditation. Many of the older, more cloistered members of the Navigator dynasties spend prolonged periods in their Reclusiam Chapels, meditating upon philosophical issues and esoteric lore. Novice: The Navigator makes a Challenging (+0) Willpower Test. If successful, he removes up to one level of Fatigue and adds +10 to the first Investigation Skill Test that he makes in the next hour. It takes five minutes for a Navigator to establish himself in the physical and mental posture for this rapid meditation and he can only use this power once every 24 hours. IV: IIIENTAL ARSENAL Adept: As per Novice, but the Navigator removes up to two levels of Fatigue and adds
    a +5 bonus to all Navigation (Warp) Tests that he is required to make in the next hour. Master: As per Adept, but the Navigator removes up to three levels of Fatigue and adds a +10 bonus to all Navigation (Warp) Tests that he is required to take for the next eight hours.'
