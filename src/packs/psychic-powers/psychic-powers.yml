data:
  action: Full Action
  attackBonus: 0
  attackType: Concentration
  cost: 0
  damage: 0
  damageType: Energy
  description: 'The power of the Immaterium is vastly potent and its applications are boundless. Just as the Warp can rend a body with raw energy, it can also fill it with joy and pleasure. Those who serve the Ruinous Powers often have a knack for turning anything into an effective weapon. The battlefield applications for pain and destruction are abundantly clear. An exhibition of joy in the midst of a violent confrontation has the potential to be a deadly application of a technique that also has tremendous potential applications in more peaceful encounters. The Call to Ecstasy causes its victims to experience and exhibit a near fanatical degree of euphoria. Its most common application may be in the realm of politics or negotiation, where such a spectacle could be disastrous. However, when the air is littered with gunfire, cavorting joyfully through the firing lanes can be terminal. The Daemon selects a target within range and makes an Opposed Fellowship Test, which the target resists with
    his Willpower. If the Daemon wins, the subject is immediately compelled to spend all of its Actions dancing and singing at the top of his lungs for as long as the Daemon sustains the power. The subject may not take any other Actions or Reactions while under the Technique''s effects, but at the beginning of each of its Turns, it may attempt to wrest its mind from the Daemon''s control and make a Challenging (+0) Willpower Test with a -5 Penalty for each Degree V: PSYCHIC ADVERSARIES TABLE 5-10: DAEMONIC TECHNIQUES | Name | Focus Time | Sustain | Focus Power Test | | --- | --- | --- | --- | | Siren''s Whisper | Half Action | Yes | Opposed Willpower | | Call to Ecstasy | Full Action | Yes | Opposed Willpower | | Realm of Decay | Half Action | Yes | Willpower | | Breath of the Plaguelord | Full Action | No | Willpower | | Sorcerer''s Tribute | Half Action | No | Willpower | | Fires of Revelation | Full Action | Yes | Opposed Willpower | by which the Daemon won the Opposed Test. If the target
    succeeds, the target escapes the Daemon''s grip, but if it fails, it suffers 1 level of Fatigue from the mental effort it expends to try to rip free. The target does not benefit from extra Armour Points granted by cover that does not fully block line of sight while under the effects of this power.'
