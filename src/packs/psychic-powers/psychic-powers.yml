data:
    attackBonus: 0
    attackType: Concentration
    cost: 200
    damage: 0
    damageType: Energy
    discipline: Telepathy
    description: 'This technique allows the psyker to peel back the layers of another''s
        mind to read the basic surface thoughts and beyond. If the psyker wants to
        perform the Probe without the target''s knowledge, then the psyker takes a
        –20 penalty to the Opposed Willpower Test and can only use this technique
        at the Fettered Psychic Strength. Round One (Contact): The psyker makes initial
        contact, and learns basic information about the target such as his name, mood,
        Insanity level, and the state of his physical health. Round Two (Surface Thoughts):
        Now the psyker can sense the thoughts uppermost in the target''s mind, such
        as immediate fears/concerns, conscious lies, etc. The target''s Corruption
        level is also now known to the psyker. Round Three (Short Term Memory): The
        psyker can now sort through the target''s memories over the last 12 hours.
        Less casual information the subject may keep as secrets—such as simple passwords
        or recent experiences he might wish to hide—may also be available at this
        level. Round Four (Subconscious): The psyker now gains detailed information
        about people, places, or objects that the target considers as important and
        how they relate to each other. The target''s beliefs, motivations and personal
        goals are known, as any contacts or complicated hidden ciphers. The psyker
        is also aware of the pivotal moments in the target''s life. Round Five (Broken):
        The psyker may plunder the target''s mind at will. Any information contained
        in the target''s psyche is an open book for the psyker. The psyker can also
        use this technique to identify implanted memories or personalities. Although
        a successful Mind Probe takes five Rounds to complete, it only requires a
        single Focus Power Test. Failing the Focus Power Test (or losing, as it is
        an Opposed Test) only takes one Round for the psyker manifesting the power.
        // Errata: Added errata clarifying that although a successful Mind Probe takes
        five Rounds, it requires only a single Focus Power Test, and failing takes
        only one Round.'
