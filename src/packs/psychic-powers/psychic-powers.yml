    discipline: Navigator
    description: 'This power allows a Navigator to see a creature''s or object''s
        reflection in the warp and learn things hidden from the real universe. This
        power is most useful in unmasking both psykers and daemons, but has other
        applications, such as reading residual psychic taint on objects and tracking
        powerful psychic entities. Novice: With a successful Perception Test, the
        Navigator can determine if a creature or object holds the taint of the warp.
        This will tell the Navigator if the person or object has a Psy Rating or is
        tainted (roughly speaking if they have more than 20 Corruption Points, warp
        mutations, are possessed, etc.). Psykers who have made dark pacts with the
        warp and daemons are more resistant to this power, however. These creatures
        may make a Willpower Test opposed by the Navigator''s Perception, which if
        successful will hide their true natures. This power can also be used to track
        powerful psychic or warp creatures using the rules for Tracking on page 88.
        Adept: As above, with the additional effect that the Navigator can detect
        major disturbances in the warp, such as warp portals and ships entering and
        exiting the Immaterium within a radius of 100 kilometres times his Perception
        Bonus. In Starship Combat a number of VUs equal to the Navigator''s Perception
        Bonus. Master: As above but the Navigator can also use the power to detect
        the use of psychic powers within a radius of 10 metres per point of his Perception
        Bonus. // Errata: Default action changed to Half Action per Errata v1.4.'
