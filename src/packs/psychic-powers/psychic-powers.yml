    damageType: 'Energy'
    discipline: 'Navigator'
    description: 'By examining the flow of the warp around him, the Navigator can anticipate near future actions and thus move outside the normal flow of events by choosing strands of reality and slipping between them. Whilst this power can be of great benefit to the Navigator, it is also very dangerous, and should he lose control, the results can be disastrous. Novice: Each round the Navigator wishes to use this power he must make a Perception test to read the strands of time. On a success, he doubles his Agility Bonus for the purposes of determining initiative and may take an additional Half Action that turn. The additional Action may not have the Attack subtype. If he fails this test, he halves his Agility Bonus for initiative and may only take a Half Action that turn as he loses his grip on reality, becoming confounded and disorientated. Should he fail by three degrees or more, he winks out of existence for 1d5 rounds, reappearing where he was at the end of this duration. Should something else occupy that space when the Navigator returns, he shifts his position as much as necessary to a point of the player''s choice should something else occupy that space. Whether or not this power is successful, however, the Navigator suffers a level of Fatigue at the end of the Round each time it is used. This power does not give the Navigator an additional Reaction. Adept: As above, except he triples his Agility Bonus for the purposes of Initiative. Master: As above, however, he quadruples his Agility Bonus for Initiative. In addition, he may take two extra Half Actions or a Full Action in addition to his other actions this round (rather than a single Half Action as results from the Novice manifestation of this power). // Errata: Action changed to Free Action per Errata v1.4.'
