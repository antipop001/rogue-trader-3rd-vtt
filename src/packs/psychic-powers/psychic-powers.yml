        the psyker to garner impressions and information about the consciousnesses
        within range. The information the psyker receives from this technique is based
        on the degrees of success from the Focus Power Test: One Success: The psyker
        gains a crude impression of the number of conscious minds and their general
        relation to them. Two Successes: The psyker knows the number, general location
        and relative ''strength'' of conscious minds within the area of effect, and
        may determine if those minds are themselves psykers with a successful Challenging
        (+0) Psyniscience Test. Three Successes: As per two successes, plus the psyker
        may attempt to initiate telepathic communication with any of the minds he
        has sensed in the area. Four or More Successes: As per three successes, plus
        the psyker may attempt to carry out a Mind Probe on one of the minds he has
        sensed in the area. Untouchables, mindless creatures—such as servitors or
        robots—and other psychically inert creatures are invisible to Mind Scan. Also,
        individuals with the Resistance (Psychic Techniques) Talent inflict a –10
        penalty on the Psyker''s Focus Power Test (the penalty does not stack with
        itself). Other creatures or individuals that are resistant to psychic powers
        may be hidden entirely at the GM''s discretion.'
