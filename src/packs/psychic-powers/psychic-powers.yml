data:
    attackBonus: 0
    attackType: 'Concentration'
    cost: 500
    damage: 0
    damageType: 'Energy'
    discipline: 'Telepathy'
    description: 'Requiring utmost skill and experience, this technique enables the psyker to enter into another mind and completely reprogram the contents, insidiously reshaping its memories and experiences as he desires. This can be something as simple as an engram designed to fool casual searches by other telepaths, or something more crafted and elaborate to remake an entire personality and constructed as ''false self'' the unfortunate victim will believe to be true. The briefest expression of this power takes 2d5 rounds. The psyker must win an Opposed Willpower Test against the victim, delving one level deeper into the target''s mind with every two degrees of success. If the target wins, he rejects the reprogramming and forces the psyker out ending the procedure and inflicting a Fatigue level on the psyker, who may not re-attempt this technique for 1d5 hours. This is also not a gentle process, and the target will be aware that his mind is being reordered until the reprogramming is successful, at which point the reprogramming itself will be forgotten as an event, buried deep in the subject''s unconscious mind. For every 2 Psy Rating the psyker uses, he gains a +10 bonus to the Opposed Willpower Test. The effects of Reprogramming are permanent unless they are forcibly broken down (see The Danger of Paradox section). At the end of this process, the psyker''s results will depend on the amount of successes he has achieved. 1 (Sow Confusion): The psyker can shroud a single event or memory in the subject''s mind in doubt and mental fog, inflicting a –20 penalty to his recall of facts concerning it. 2 (Implant Falsehood): The psyker can now implant simple information like a false face on a killer in a witness''s mind, a false pass code, or any other single sentence''s worth of knowledge the subject will now recall as fact. 3 (Rewritten History): The psyker can now alter a single event or series of events in the subject''s recent memories to his specification. The subject will now earnestly believe this ''new'' version of events to be the truth. 4 (Sculpt Synapses): The psyker can now supplant a single major long term memory or obliterate it entirely, affecting potentially the perception of an entire sequence of events in the subject''s lives, and perhaps influencing the subject''s personality in the process. This also inflicts 1D5 Insanity Points on the subject. 5+ (Psychic Block): In addition to his other workings, the psyker can put in place a basic psychic block that grants the target a +10 bonus to his Willpower Test when resisting Mind Probes. This also conceals the psyker''s tampering. Major Reprogramming: Given extensive time, effort and the malign will to do so, a psyker with this power can freely implant a complete new personality, restructure memories, counterfeit experience, and implant hate with this ability. However, the level of effort and detailed attention required to do this without overtaxing the psyker and driving the subject mad is far beyond most immediate game use, and requires a minimum of 2d10 hours. The Danger of Paradox: The mind is a complex thing, and a reprogrammed individual—if faced with evidence of the truth, or major discrepancies between what he has been manipulated into believing and the facts—may break through his reprogramming. If the GM judges such an event occurs, the victim must succeed at a Hard (–20) Willpower Test. If successful, the mental reprogramming breaks down. If the Test is failed, the victim goes on believing what he has been manipulated into thinking is the truth. In either case the mental strain inflicts 1d10 Insanity points on the subject.'
