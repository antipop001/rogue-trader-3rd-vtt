  description: At times, the Warp's corruption may be almost invisible as it inflicts its damage through treachery and concealment. However, when its unholy nature is fully unleashed, its merest hint can be devastating to a mortal psyche. A Daemon in service to Nurgle may choose to expose the faintest hint of his dark god's power into the material world. In doing so, those exposed are completely overwhelmed by its presence, such that they may become incapable of normal function. The Daemon makes a Focus Power Test to exude a hideously foul cloud of corruption about itself. As long as the Daemon sustains this power, any creature without the Daemonic Trait within range suffers a penalty equal to the Daemon's Psy Rating to all Tests, with an additional -2 penalty for each Degree of Success that the Daemon scored on its Focus Power Test. Additionally, whenever a creature within range fails a Toughness Test (regardless of the cause of the Test), it suffers 1d5 Impact Damage that is not reduced
    by Armour or Toughness Bonus. This stench is a direct product of the Warp, so no amount of mundane shielding or air filtration is capable of overcoming its effects.
