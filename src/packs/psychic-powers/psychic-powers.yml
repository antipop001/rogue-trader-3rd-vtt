  attackType: Concentration
  cost: 0
  damage: 0
  damageType: Energy
  description: 'On many worlds, three-eyed mutants who can peer into your soul are thought of as bogey-men to scare children into obedience and people whisper that they are a tainted breed that can curse good, Emperor-fearing citizens with but a glance. These legends likely do not truly refer to Navigators, but they do echo with the truth of the matter, as techniques exist that can cause a person to attract the malign spirits of the Warp, drawing hungry things to them that slowly siphon away at their very mind and soul. This power is reserved for the Navigator House''s most loathed enemies, and these unfortunates soon find that their luck fails them and their allies treat them with disdain. Novice: The Navigator chooses a target that is no further away than his Perception Bonus in metres and then makes an Opposed Willpower Test. If he succeeds, any weapons the target uses gain the Unreliable Trait and the target suffers a -10 penalty on all Tests. The effects of this power last for 1d5 days
    plus one extra day per Degree of Success that the Navigator scored on the Opposed Willpower Test, or until the "cursed" character spends a Fate Point to end the effect. Only one instance of this power may be active at any one time. Adept: As per Novice, but the target also suffers an additional-10 penalty to all Interaction Tests it makes (to a total of -20 on Interaction Tests). Further, the next time the target or anyone within five metres of him uses a Psychic Technique, the psyker automatically manifests Psychic Phenomena even if he would not normally do so (such as on a Fettered level power), and must roll on Table 6-3: Psychic Phenomena (see page 160 of the ROGUE TRADER Core Rulebook). Master: As per Adept, but the psyker incurs a significant Warp breach and must roll on Table 6-4: Perils of the Warp instead of Table 6-3: Psychic Phenomena (see page 160-161 of the ROGUE TRADER Core Rulebook).'
