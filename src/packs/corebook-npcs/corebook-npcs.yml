effects: []
flags:
  rt:
    description: The Imperium's myriad worlds are connected in vast intertwining networks of commerce, with many planets unable
      to sustain themselves without imports of food, technology, or manpower. It is this merchant navy which acts to move
      trade and tithe goods from one system to another, transporting untold quantities of essential freight across the stars.
      Free traders are normally part of commercial fleets and travel where their masters decree, but some small operators
      continue to act independently of the conglomerate, while others are hardy (or desperate enough) to strike out for border
      areas in search of greater profits on the very edge of the Imperium. While their passages are normally quiet, they know
      at any time they and their crews might be called upon to lay down their lives in battle and no passage in the warp is
      ever safe.
    movement: 3/6/9/18
    rawGear: 1 spare hellpistol clip, personal vox, seal of captaincy or commercia warrant, data-slate, master security key
      for ship.
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/free-trader-captain.png
