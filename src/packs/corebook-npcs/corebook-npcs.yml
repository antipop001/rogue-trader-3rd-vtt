effects: []
flags:
  rt:
    description: 'The Charron Pattern is a light battle servitor, humanoid in shape, found often in the service of the Imperial
      Navy and numerous other star vessels as shock troops and defenders


      in boarding actions. Those found in the Koronus Expanse are often very old, their inorganic components having been recycled
      through numerous bodies and recovered from the fallen of the battlefield. As a result they have a reputation for their
      machine spirits being unreliable in combat and not knowing friend from foe on occasion. This makes some captains reluctant
      to employ them save in the direst need.


      Battle Servitor Profile'
    movement: 2/4/8/12
    rawGear: Internal vox-bead, ammo hopper equivalent to four clips for each weapon, red dot laser sight for its primary
      ranged weapon, systems sealed to the void, inbuilt mag-boots.
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/battle-servitor-charron-pattern.png
