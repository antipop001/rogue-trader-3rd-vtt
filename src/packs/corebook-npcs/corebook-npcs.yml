effects: []
flags:
  rt:
    description: Encountered very rarely in the Koronus Expanse, the kroot are not indigenous to the local stars but nomadic
      wanderers from half a galaxy away. A mercenary race, their feral, clannish mindset hides both a perception and intelligence
      few would credit them with. A carnivorous and highly adaptable species, an individual kroot stands considerably taller
      than a human and possesses many features that betray their avian heritage. Sporting a crest of quills, a beaked mouth,
      and the ability to move with incredible speed and lithe physical power, a kroot is a formidable opponent. Their martial
      prowess—combined with an unpleasant reputation for eating those they slay—gives these freelance warriors a justly fearsome
      reputation, and they command a high price from the merchant criminals and recidivist elements willing to flout Imperial
      law by taking them into their employ.
    movement: 4/8/16/32
    rawGear: ''
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/kroot-mercenary.png
