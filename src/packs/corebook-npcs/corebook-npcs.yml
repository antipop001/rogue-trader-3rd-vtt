effects: []
flags:
  rt:
    description: It takes a brave and capable individual to lead a pirate crew in the reaches beyond Imperial space. One must
      be cunning and ruthless, as well as able to command a crew of renegades and killers through respect or fear. A pirate
      captain can be as cruel as vacuum or affect the manner of a rakish noble or Rogue Trader depending on his nature and
      crew, but he must be successful or risk his command to mutiny. The most successful are more than the leaders of cutthroats;
      they are savvy operators with extensive intelligence gathering networks, knowledge of dark secrets uncovered in their
      voyages and contacts on both sides of the law.
    movement: 3/6/9/18
    rawGear: Motley uniform, bionic eye, 2 bolt pistol clips, 4 hand cannon clips, 1 clip for exotic weapon, dubious charts.
      Some may have extensive further cybernetic implants.
    source: Rogue Trader Core Rulebook
