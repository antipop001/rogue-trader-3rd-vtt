effects: []
flags:
  rt:
    description: There are many that flee the Imperium and turn renegade, and just as many reasons for doing so. Failed revolutionaries,
      refugees, Imperial deserters, outlaws, heretics and worse all make their way to the Expanse in the hopes of freedom
      from pursuit and to do as they will. Many attempt to found their own societies on shadowed and undiscovered worlds,
      or lurk on the edge of more established colonies, but an equal number are drawn to raiding and piracy to survive. Many
      human pirates and raiders are not worshippers of Chaos or in league with aliens, but simply criminals out to take what
      they can, or who have fallen into an unforgiving cycle of plunder and flight in order to sustain their outlaw existence.
      There remains a darker core however, of those that have fallen far from the light and are prey to the most appalling
      appetites and savagery. It is these that are the most feared of renegades, hated by colonist, Imperial, Rogue Trader
      and fellow outlaw alike.
    movement: 3/6/9/18
    rawGear: Tattered miss-matched clothing, spare ammunition for weapons, and either a hand vox and respirator, or gruesome
      trophies, human meat, and skins. Void pirates will also be equipped in armoured void suits.
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/renegade.png
