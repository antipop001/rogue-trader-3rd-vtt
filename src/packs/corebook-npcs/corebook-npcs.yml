effects: []
flags:
  rt:
    description: The exploitation of the Expanse has resulted in the amassing of many great fortunes and a great many vendettas
      and intrigues in turn. Both are equally perilous in a realm where little law is recognised beyond raw power and the
      void of space swallows the dead without trace. In such a world no one, no matter how famed or mighty, is beyond the
      reach of an assassin's hand, and the need for trustworthy personal protection is paramount. While dumb muscle and hired
      guns of dubious provenance are ten-a-throne, a skilled professional, or Oathsworn as they are known in the parlance
      of the Expanse, is another matter. Depending on their contract, those who offer their services as such bodyguards range
      in their role from simple escort duty, to laying their life down for their employer, to acting as their personal agents
      and 'dealing' with those who offended their masters. Reputable bodyguards can become quite wealthy and respected themselves,
      assuming they survive, and some establish familial contracts which last as long as their employer's lineage does. Others
      specialize in dangerous locales, using their familiarity with the local environs to offer protection in that area.
    movement: 3/6/9/18
    rawGear: Quality clothing suitable to their surroundings, micro-bead, 2 autopistol manstopper clips, 1 blind grenade,
      filtration plugs, silencer, photo-contacts.
    source: Rogue Trader Core Rulebook
