effects: []
flags:
  rt:
    description: 'Mutation is a fact of human existence in the 41st Millennium. On many worlds, particularly those who have
      been cut off from contact for centuries and even millennia, the human gene-pool has become irrevocably damaged by generations
      of exposure to pollutants and alien biospheres, and worst of all, to genetic tampering and exposure to the reality distorting
      effects of the warp. As a result, increasing numbers are born with obvious and often grievous mutations, most often
      in the form of gross physical deformities and mental deviancies. Within the Imperium the most terribly afflicted are
      ruthlessly and systematically purged, however beyond the Imperium''s border, their treatment can vary widely, from exploitation
      to dominance among those worlds lost to the taint of Chaos. On some worlds steeped in commonplace superstition and fear,
      or where fanatical interpretations of the Imperial creed and local hatreds have taken hold, the merest hint of physical
      deviancy is likely to end in a pyre. On other largely industrial worlds where mutation is sometimes viewed as a baleful


      but unavoidable fact among the lower classes, whole mutant populations are allowed to form as a harshly repressed and
      utterly disposable workforce, and only the most excessive cases of mutation are culled.


      There are numerous forms of mutant, but the most common exhibits some base physical degeneracy or deviation from the
      excepted norms of the human form. Also known as an abhuman, sub or twist, these degenerates are often found as slaves
      and outcasts on the fringes of human settlement in the Koronus Expanse, and in abominable profusion on those worlds
      touched by the warp.'
    movement: 2/4/6/12
    rawGear: Rags, tatters and scraps of scavenged detritus.
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/mutant-outcast.png
