effects: []
flags:
  rt:
    description: Among the Void Born, there are those psykers who flee the Imperial authorities upon the awakening of their
      powers or have been born beyond their reach. Those that manage to survive this dark transfiguration are rare, and often
      insane, but no less sought after in certain quarters because of this. This is because these Warp Witches possess among
      their psyker’s gifts some, albeit crude, ability to navigate the warp and whisper upon its unseen winds, although never
      with anything approaching the certainty and proficiency of a true Navigator or Astropath. For those renegades and corsairs
      who strike a devil’s bargain with a Warp Witch, they may find the price levied by these fickle and spiteful psykers
      even steeper than they can guess at. Often, the powers they have to track the warp are conveyed not by their own gifts,
      but by the daemons sitting invisibly on their shoulders.
    movement: 3/6/9/18
    rawGear: ''
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/warp-witch.png
