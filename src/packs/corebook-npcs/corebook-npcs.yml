effects: []
flags:
  rt:
    description: 'A military aristocracy of the stars that spans the Imperium, the Officer Corps of the Imperial Navy are
      an institution that dates back millennia in a tradition of service, bellicosity, and sacrifice that some would argue
      is unmatched. To serve in the Imperial Navy is to act as the glue that holds the Imperium together, for without warp
      travel the vast armies of humanity would be left stranded, impotent, and swiftly torn apart by its enemies. Just as
      the Navy itself binds together the Imperium, so do its officer class bind and regulate the Navy.


      Proud, warlike, and honourable, often descended from bloodlines that have served for centuries, it is they who keep
      the ratings and the indentures in line, uphold the traditions of service and loyalty and most importantly hold the line
      against the darkness of the void beyond.'
    movement: 3/6/9/18
    rawGear: 2 spare naval pistol clips, personal vox, officer's seal, respirator.
    source: Rogue Trader Core Rulebook
img: ''
