effects: []
flags:
  rt:
    description: Servo-skulls are human skulls (often that of a favoured servant or low ranking tech-priest) that have been
      fitted with rudimentary artificial intelligence, support systems, and an anti-grav motor to provide mobility. Their
      advantages are their small size and manoeuvrability, which allows them to enter otherwise inaccessible spaces or hazardous
      areas that would endanger their operators, as well as the ability to act as additional 'eyes and ears' for their masters.
    movement: — (see below)
    rawGear: Inbuilt vox and cogitator. Depending on its function the Servo-skull will also have an inbuilt lumen globe, auspex,
      combi-tool or laspistol (30m; S/—/—; 1d10+2 E; Pen 0; Clip 30; Reload Full; Reliable) with inbuilt red-dot laser sight.
      Servo-skulls are often modified with other tools, sensors, or pistol-class weapons by their owners.
    source: Rogue Trader Core Rulebook
