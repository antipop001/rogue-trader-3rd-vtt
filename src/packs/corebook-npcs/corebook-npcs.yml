effects: []
flags:
  rt:
    description: One of the more unusual servitor types, the grapplehawk is a large cyber-converted avian creature used to
      hunt and capture or kill human and animal prey. They are armoured, fitted with enhanced sensory equipment and grav-assisted
      flight systems. The Thulian Magos are known to favour this kind of construct both as scouts in the field and aggressive
      sample "gatherers," and also have been known to sell examples to various Rogue Traders and Outlander nobles in return
      for their cooperation and support.
    movement: 2/4/6/12
    rawGear: Inbuilt vox and cogitator, auspex. Inbuilt grappling units allow it to lift stunned prey as if it had Unnatural
      Strength (x2), although its speed will significantly decrease based on its load.
    source: Rogue Trader Core Rulebook
img: systems/rogue-trader-3rd/images/npcs/corebook/grapplehawk-falax-pattern.png
