  rt:
    description: Another construct of the Yu'vath, these deadly little creatures are fashioned from bruised purple crystal
      and are about the size of a large dog. With twelve legs and a tiny central body they scuttle about with alarming speed.
      They also have a set of needle-like mandibles which they can alternatively use to mend broken crystal or plunge into
      an Explorer's soft flesh...
    movement: 5/10/15/30
    rawGear: 'None # THE KEENING TOWER The needle-like crystal tower that spears the centre of the island has a single, large
      and obvious entrance ringed by strange Yu''vath markings. There is not untoward danger here; however, unless the Explorers
      devise some way of more easily getting to the top, they are in for a long torturous climb. Have each Explorer make an
      Ordinary (+10) Toughness Test or suffer a -10 penalty to their Toughness for the following battle.'
    source: Dark Frontier
