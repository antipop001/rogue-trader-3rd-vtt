effects: []
flags:
  rt:
    description: 'An ancient Dark-Energy Construct, the Bone Warden is a fell union of warp technology and dark sorcery. They
      were crafted by the Yu''vath primarily to act as watchmen and guardians for their void crypts and solar fortresses;
      and even now, long after their masters have been forgotten, they remain to fulfil their duty. The Bone Warden has no
      physical form and instead resides in a collective of dead matter—most often corpses or other once living remains. These
      corpses are held together by ribbons and arcs of crackling black energy, the air around them charged with constant flashes
      of midnight electricity and the smell of burning flesh. Acting as a single mass, the corpses form a cloud of grasping,
      clawing hands and mouths that whirls through the


      air. The only way to defeat a warden is to destroy its physical state and thus disperse its dark energy field. However,
      even as its adversaries blast away its fleshy shell, it uses its warp-shard crown—a collection of dark crystalline fragments
      that orbit its energised core—to claim more physical matter, regenerating its rotting form. For this reason, Bone Wardens
      are often found in rooms well stocked with the dead—a ready made supply of material left by their Yu''vath masters


      Fortunately for the Explorers, the Bone Warden they will encounter in the crystal tower has faded in power with time
      and the weakening of the fortress itself—as such it does not have archeo-warp weapons or its full complement of psychic
      powers.


      Charged with defending the nexus and the crystal tower, the Bone Warden will attack immediately and fight until either
      it or the Explorers have been destroyed.'
    movement: 3/6/9/18
    rawGear: 'None Warp-Shard Crown: At any time, a Bone Warden can spend a Full Action to regenerate one wound for every
      corpse within 20 metres as its shards burrow into their dead flesh and they are dragged into to the creature’s mass.
      Once a corpse is used in this way, it becomes part of the Bone Warden and cannot be used again. The Warp-Shard Crown
      also has a secondary power to disrupt energy attacks and fields in its presence as the crystals sap their power. For
      this reason, power weapons (like power swords) only do half damage against it.'
    source: Dark Frontier
img: systems/rogue-trader-3rd/images/npcs/darkfrontier/yu-vath-bone-warden.png
