  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: As a Half Action the Explorer may declare that he is attempting a takedown before testing Weapon Skill. If he
      hits and would have done at least 1 point of Damage, then ignore the Damage and the opponent must make a Toughness Test
      or be stunned for 1 Round. When performing a Stun Action, the character does not suffer a -20 penalty to his Weapon
      Skill.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: QDeGIhHzdHZXLXeO
