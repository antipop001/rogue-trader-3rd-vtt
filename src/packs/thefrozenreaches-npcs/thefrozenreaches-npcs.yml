    aptitudes: ''
    benefit: The Explorer has optimised his use of Techna-Lingua for controlling servitors. He receives a +10 bonus to any
      attempt to communicate with servitors, and any vessel upon which he serves receives a +1 bonus to Crew Morale due to
      increased servitor efficiency.
