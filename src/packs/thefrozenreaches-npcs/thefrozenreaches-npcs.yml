    aptitudes: ''
    benefit: Mental conditioning or augmetics enable the Explorer to record and recall great amounts of information, effectively
      granting him a perfect memory. He can automatically remember trivial facts or pieces of information that might feasibly
      have picked up in the past. When dealing with more detailed, complex, or obscure facts, such as the deck plans of a
      space hulk or a complex xeno pictograph, the GM may require an Intelligence Test.
    cost: 0
    prerequisites: Intelligence 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
