  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer is able to shrug off wounds that would fell lesser men. Whenever he suffers Critical Damage, halve
      the result (rounding up).
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: CHtB4Azjf8XFSrHI
