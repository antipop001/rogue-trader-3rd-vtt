effects: []
flags:
  rt:
    description: Snokgritz is a hulking, swaggering brute with a forbidding iron gob, a smouldering cybernetic eye, and more
      scar tissue and screwed-on steel plates than skin. He’s a furious, bloody-minded savage who kills for sport and figures
      any fight you walk away from is a good one. However, Snokgritz appreciates a bit of “low cunnin,” figuring if it’s good
      enough for Gork (or possibly Mork)—the Ork god that’s cunning but brutal—it’s good enough for him. With his boyz, the
      Warboss cut a green swath across Cinerus Maleficum and the Cauldron, leaving only dead and burning worlds in his wake.
      Now, on the advise of some weedy Chaos ’umies, he’s brought his fleet to the Damaris system in search of fresh food
      and good fights, both of which he reckons he’ll find on this fragile little ’umie world.
    movement: ''
    rawGear: ''
    source: The Frozen Reaches
