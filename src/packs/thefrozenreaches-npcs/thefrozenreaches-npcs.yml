flags:
  rt:
    description: Gretchen, also known as Grots, are smaller, more devious greenskins than their Ork relatives, with a cunning
      mind and strong sense of self preservation. Their deviousness makes them dangerous, although their natural cowardice
      means they are typically only dangerous when they outnumber opponents. They typically handle the menial tasks Orks can't
      be bothered with to avoid becoming an Ork's next meal. Those on Damaris tend to be fairly good shots with their "grot
      blastas," probably because their survival depends on it.
    movement: 3/6/9/18
    rawGear: Goggles, shiny bitz of junk.
    source: The Frozen Reaches
