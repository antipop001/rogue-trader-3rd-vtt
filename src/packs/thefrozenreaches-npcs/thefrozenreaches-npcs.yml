  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Whereas a weaker man would be sent flying when using powerful weapons, the Explorer's strong physique allows
      him to remain standing. He can fire heavy weapons using Semi-Auto Burst or Full Auto Burst without bracing, and he does
      not suffer the -30 penalty for failing to brace.
    cost: 0
