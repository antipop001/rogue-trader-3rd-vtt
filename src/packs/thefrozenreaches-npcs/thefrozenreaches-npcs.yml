effects: []
flags:
  rt:
    description: The Skitarii are trained warriors of the Adeptus Mechanicus. Each has been modified extensively with various
      cybernetic and bionic systems. Often, one arm of the Skitarii is replaced with a ranged weapon, while the other is free
      to wield a close-combat weapon.
    movement: 3/6/9/18
    rawGear: Skitarii flak armour and robes, red-dot laser sight, extensive cybernetics, ammunition reloads.
    source: The Frozen Reaches
