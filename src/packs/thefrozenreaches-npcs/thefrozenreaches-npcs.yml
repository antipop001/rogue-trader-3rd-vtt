  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's fleet feet can propel him faster than his comrades. When taking the Full Move Action, the character
      can move an extra number of metres equal to his Agility Bonus. When taking the Run Action, he may double his movement
      for one Round. The Explorer gains one level of Fatigue if he uses this Talent two Turns in a row.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: IOoyrim9rPDH7nIy
