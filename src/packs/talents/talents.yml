    benefit: The Explorer has proven his devotion to the Machine God by lacing augmetic
        coils through every portion of his body. Using a Half Action, he may hover
        20–30 centimetres off the ground for a number of minutes equal to 2d10 plus
        his Toughness Bonus. The Explorer must employ a Half Action each round to
        concentrate on maintaining this rite, but any Move Action allows him to move
