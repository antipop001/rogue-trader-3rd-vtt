---
data:
    aptitudes: ''
    benefit: 'Sure Strike or Deadeye Shot The Explorer is well versed in laying his enemies low without killing them, able to incapacitate his targets and limit the damage he inflicts to them. When the Explorer makes a Called Shot attack against an enemy, he may choose to reduce the damage he inflicts after reduction by the target''s Armour or Toughness Bonus by a number equal to his Perception Bonus, and inflict a level of Fatigue for each point of damage reduced in this way. In addition, the Explorer''s familiarity with non-lethal weaponry means that enemies do not gain the usual bonuses from armour to resist the stunning effect of Shocking weapons, and suffer a -10 penalty to avoid or escape any attack with the Snare quality.'
    cost: 0
    prerequisites: Perception 35 and either
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Take Them Alive
type: talent
---
data:
    aptitudes: ''
    benefit: 'The Explorer''s skills in melee are without parallel, but more importantly he fights with a stylish jaunty confidence guaranteed to impress even his foes. Fast on your feet and faster with witty repartee, if your blade does not pierce their flesh then your barbed banter will surely pierce their composure. This Talent allows the Explorer to make an opposed Challenging (+0) Charm versus Willpower Test as a Half Action against any foes in close combat each combat round. Should he win, his he imposes a -10 penalty to his foes'' Weapon Skill, increasing by 5 for every degree of success. This penalty applies for one full Round. Multiple Explorers may use this Talent with a cumulative effect. At the GM''s discretion, opponents with the Bestial, Daemonic, From Beyond, or Machine Trait are immune to this Talent. To Rogue Trader Sarvus Trask. As a matter of fact, I did encounter the so-called Droad C'
    cost: 0
    prerequisites: Blademaster
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
