data:
    aptitudes: ''
    benefit: The Explorer's skill with guns is such that he can target two shots on
        exactly the same point. When armed with two pistols, he can fire both simultaneously
        as a Full Action. Make a single Ballistic Skill Test, and if successful he
        hits his target with both shots. As the character is firing both guns as a
        single attack, he may take an Aim Action before firing to get a +10 or +20
