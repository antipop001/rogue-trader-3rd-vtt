data:
    aptitudes: ''
    benefit: 'Characters only, must have free will, may not be applied to Daemons or other non-living creatures The NPC has a number of Fate Points equal to half his Willpower Bonus (rounding up). He may use these Fate Points in the exact same way as an Explorer, and may even “burn” a Fate Point to survive death and destruction. In addition, the rules for Righteous Fury apply to this character. profile could be constructed based on choices from the Nemesis Path, to help provide a GM with guidance if he wants to construct his own profiles.'
