data:
    aptitudes: ''
    benefit: 'Integrated Psychically-Charged Xenos Artefacts Some Acolytes of Abraxas have spent a great deal of time mastering the art of channelling their internal energies through their unsanctioned acquisitions, and have found that it can have unexpected—and deadly—results. Damage from this character''s Luminen Shock and Luminen Blast Talents gains the Force Quality. If the character fails his Focus Power Test to activate the Force Quality, however, he suffers 1d5 Energy Damage not reduced by Armour or Toughness Bonus.'
    cost: 0
    prerequisites: Intelligence 45, 2+
    source: The Navis Primer
    tier: '1'
    category: Supplement
