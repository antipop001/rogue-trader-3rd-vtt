data:
    aptitudes: ''
    benefit: 'The Omnissiah has blessed the Explorer with augmetic conduits that parallel
        the bones of his arms. By reciting the proper litany, he can channel the energy
        stored in his Potentia Coil down these channels and direct it at his enemies.
        Success on a Ballistic Skill Test allows him to direct this energy against
        a single target within 10 metres. The target takes 1d10 plus the Explorer''s
        Willpower Bonus in Energy Damage. The character must pass a Toughness Test
        when using this ability or gain a level of Fatigue. Talent Use: Half Action
        Attack.'
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
