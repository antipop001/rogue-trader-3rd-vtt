    benefit: 'Either through training or natural development, the Explorer has learned
        an additional Psychic Technique. Once this Talent has been selected, the Explorer
        must select one new Psychic Technique in any Discipline he possesses that
        has an xp cost equal to or lower than the xp cost of the Talent. Then, the
        Explorer spends xp equal to the cost of the Technique selected (if the Explorer
        cannot spend this xp for any reason, he may not select this Talent). Note:
        this Talent is unique in that the Explorer will not spend the xp cost listed
        in the Advance Tables of his Career in order to purchase it, but the xp cost
        of the Technique itself. The xp cost listed in the Advance Tables is provided
        solely to determine which Psychic Techniques may be selected via that particular
        Talent. (Errata v1.4: description rewritten as above.) This Talent may be
