data:
    aptitudes: ''
    benefit: 'The Explorer modifies himself with arcane technology and now wields techno-arcane powers normally the preserve of the Priesthood of Mars. For the purpose of fulfilling prerequisites, the Explorer counts as possessing the Mechanicus Implants Trait. He does not gain any of the normal effects of the Trait, and he may not necessarily have the same implants, but rather equivalent devices of his own devising.'
    cost: 0
    prerequisites: Tech-Use +10
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Apostate Mechanic
type: talent
---
data:
    aptitudes: ''
    benefit: 'The Explorer has devised a binary argot that confuses and subverts the programming of servitors and other machine-creatures, allowing him to direct their actions. As a Half Action, the Explorer may attempt to command a creature with the Machine Trait and an Intelligence of 20 or less. Make an Opposed Challenging (+0) Tech-Use vs. Willpower Test. If he succeeds, the creature must follow the Explorer''s commands for the following Round. The Explorer may continue to maintain control by spending a Half Action in subsequent Rounds. If he chooses to do this, he must make another opposed Test after four Rounds to maintain the link. The commands must be simple and achievable in one round. Some examples include "Flee," "Fall," and "Attack the closest target."'
    cost: 0
    prerequisites: Mechanics Implants
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Subversive Programming
type: talent
---
data:
    aptitudes: ''
    benefit: 'The Explorer''s implants generate a violent techsorcism pulse, allowing him to disable technology in his presence. A single gesture and most sophisticated devices simply cease to function. A successful Challenging (+0) Ballistic Skill Test allows him to direct the energy against a single target within 10 metres. This is a ranged attack and can be Dodged but not blocked by Fields or other protective devices. If the target is carrying any electrical devices—including energy weapons and bionic systems—then they cease to operate for 1d5 rounds, as if their power had run out. If the target is a vehicle, then it immediately suffers a Critical Hit as if the user had scored Righteous Fury, subtracting one to the Critical Hit result (a result of zero results in no Critical Hit).'
    cost: 0
    prerequisites: Mechanicus Implants
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Luminen Desecration
type: talent
---
data:
    aptitudes: ''
    benefit: 'The Explorer is skilled at gaining access to the knowledge of the most sophisticated machine spirits, assailing them with scrap-code and malicious spirits of his own creation, until they break under the strain. The Explorer gains a +20 bonus on all Tech-Use and Security Tests made to gain unauthorised access to an electronic system such as a Cogitator or an electronic lock, so long as the character can connect directly to it using his implants. 59 II: PLAYING THE ROUGE'
    cost: 0
    prerequisites: Electrograft Use
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Vile Intrusion
type: talent
---
data:
    aptitudes: ''
    benefit: 'Utilising a combination of fast-talking and body language interpretation, the Charlatan can quickly assess attentive crowds and potential customers. Preying on the fears and superstitions of the populace, the Charlatan draws his crowds into unwittingly telling him exactly what it is they believe will save them from the horrors of everyday life in the Expanse. Prior to making a Commerce, Barter, or Charm Test, the Charlatan may make a Blather Test opposed by the target''s Willpower or Scrutiny. If the Blather Test is a success, the Charlatan has hooked the target into giving up some vital information and the Charlatan may then make a Challenging (+0) Scrutiny Test to assess the importance of the information gained. If successful, the Charlatan gains a +5 bonus to his next Commerce, Barter, or Charm Test against the target for each point of Perception Bonus. He has ascertained information a'
    cost: 0
    prerequisites: Blather +10
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Cold Reading
type: talent
---
data:
    aptitudes: ''
    benefit: 'The Explorer gains the benefits of the Chem-geld and Orthoproxy talents (mental conditioning replacing the surgery these would normally require). In addition to being resistant to seduction and interrogation, House Operatives are often trained to use a captor''s inquiries against him. The Explorer may utilise an interrogator''s questions and techniques to garner detailed information about the nature, aims, and motivations of the interrogator himself and those he works for. If the Explorer is subjected to interrogation, and wins the opposed Interrogation versus Willpower Test, he may immediately make a Challenging (+0) Scrutiny Test. On a success and for every additional degree of success, he can learn one detail about his captors (what he can and cannot learn is ultimately up the GM, but it should be something valuable). II: PLAYING THE ROGUE'
    cost: 0
    prerequisites: ''
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Operative Conditioning
type: talent
---
data:
    aptitudes: ''
    benefit: 'Sure Strike or Deadeye Shot The Explorer can find the weaknesses of his prey with only a few moments of observation. When he makes a Called Shot attack and scores a number of Degrees of Success on the attack roll equal to or greater than the target''s Agility Bonus, he immediately inflicts a 1d5 critical damage result on the target in addition to any normal damage. Roll on the appropriate Critical Hit table for the damage type and location struck. Any modifiers to critical damage from Talents or other sources apply as normal. However, the Critical Damage inflicted from this ability does not stack with actual Critical Hits.'
    cost: 0
    prerequisites: Perception 35 and either
    source: Hostile Acquisitions
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: 'Killer''s Eye'
