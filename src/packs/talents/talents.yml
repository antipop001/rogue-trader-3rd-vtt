    benefit: 'The Explorer''s faith in the God Emperor of Mankind, his divine power
        and grace, is total and complete. This faith wraps around him and suffuses
        his soul, armouring him against the foul influences and weapons of the heretic.
        Pure Faith provides all of the following benefits: The Explorer is always
        immune to the effects of Daemonic Presence including the negative modifiers
        to his Willpower. The Explorer may spend a Fate Point to not take Fear Tests,
        not acquire Insanity Points, and not gain any Corruption Points. These safeguards
        remain for the duration of the encounter. The Explorer may burn a Fate Point
        to resist the effects of any single daemonic or psychic attack, effectively
        allowing him to emerge unscathed as if by a miracle.'
