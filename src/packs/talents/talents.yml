---
data:
    aptitudes: ''
    benefit: ', Integrated Psychically-Charged Xenos Artefact By integrating psychically charged xenos artefacts into his bionic form through arcane processes, an Acolyte of Abraxas can channel the power of the artefact through his mind, performing feats much like those of true psykers by virtue of their tainted reflex. The Psychic Technique that the Explorer can use depends on the origin and nature of the artefact; the player and the GM should work together to choose an appropriate power from this volume, the ROGUE TRADER Core Rulebook, or another ROGUE TRADER supplement that contains relevant powers (such as EDGE OF THE ARTER). The character gains Psy Rating 1 (or his Psy Rating increases by 1 if he already has a Psy Rating), and uses the Renegade Psykers and Sorecress section of Table 6-1: Psychic Strength on page 157 of the ROGUE TRADER Core Rulebook. When an Explorer gains this Talent, he immedia'
    cost: 0
    prerequisites: Intelligence 40
    source: The Navis Primer
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Unhallowed Discovery
type: talent
---
data:
    aptitudes: ''
    benefit: 'This character was either a minor unsanctioned psyker hiding his abilities from those around him or a nascent psyker completely unaware of his own status. In either case, an Explorer with this Talent has experienced the realisation of a terrible new power of the mind, and must come to grips with his situation or die trying. The character gains Psy Rating 1, and uses the Renegade Psykers and Sorcerers section of Table 6-1: Psychic Strength on page 157 of the ROGUE TRADER Core Rulebook. If the character already possessed a Psy Rating, thanks to his Origin Path or for any other reason, he increases his Psy Rating by 1 instead. When an Explorer gains this Talent, he also selects a Psychic Discipline (or other grouping of Psychic Techniques, such as the Renegade Psyker Techniques on page 100) from which he can learn Techniques, and immediately learns a single Psychic Technique with a Value of'
    cost: 0
    prerequisites: WP 35
    source: The Navis Primer
    tier: '1'
    category: Supplement
img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
name: Psychic Awakening
type: talent
---
data:
    aptitudes: ''
    benefit: 'Eldar possess an innate connection to the substance known as Wraithbone, and those initiated in the Path of the Seer can interact with artefacts sculpted from it in a way that strangers to these mystic secrets cannot hope to understand. Those with the Secrets of the Seers Talent can access the Witch-Edge Quality of the weapons they wield, which lie dormant in the hands of untrained users.'
    cost: 0
    prerequisites: ''
    source: The Navis Primer
    tier: '1'
    category: Supplement
