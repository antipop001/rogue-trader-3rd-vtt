data:
    aptitudes: ''
    benefit: 'The warriors of the Withered Blade are well-versed in the art of slaying with the tiniest wounds, leaving their prey bleeding and crippled upon the ground with only the smallest and most precise cuts. When a character with this Talent makes a Called Shot attack with a melee weapon or unarmed attack, the weapon counts as having the Crippling (5) Quality. In addition, this character''s unarmed attacks deal Rending Damage instead of Impact Damage. IV: THE TREACHEROUS PATH'
    cost: 0
    prerequisites: ''
