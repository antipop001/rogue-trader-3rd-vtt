items:
- _id: izjfUpWWtEKgF0rm
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
  name: Ambidextrous
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'This Talent does not represent true ambidexterity so much as sufficient training with both hands to make the
      distinction moot. The Explorer can use either hand equally well for any task, and does not suffer the -20 penalty for
      actions using his off hand. Special: When combined with a Two-Weapon Wielder Talent, the penalty for making attacks
      with both weapons in the same Turn drops to -10.'
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 6raoIcL36yIdGW6C
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Step Aside
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can sway his body out of the path of an attack, causing it to pass through thin air. He may make
      an additional Dodge once per Round. In effect this gives him a second Reaction that may only be used to Dodge, allowing
      two Dodges in a Turn. However, he may still only attempt a single Dodge against one attack.
    cost: 0
    prerequisites: Agility 40, Dodge
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: gKLsjWSpToAsrPeq
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Swift Attack
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's speed and martial ability allow him to land flurries of blows. As a Full Action, he may make two
      melee attacks on his Turn. If he has the Two-Weapon Wielder Talent and is wielding two melee weapons, he gets the advantage
      of Swift Attack with only one of the weapons, and a single attack with the other. If he has the Two-Weapon Wielder Talent
      and is wielding a melee weapon in one hand and a gun in the other, he gets the advantage of Swift Attack with the melee
      weapon and a single attack with the gun.
    cost: 0
    prerequisites: Weapon Skill 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: vwOstMeG8fr73D3C
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Two-Weapon Wielder (Melee)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of training allow the Explorer to use a melee weapon in each hand when needed. When armed with two melee
      weapons, he may spend a Full Action to attack with both. Both tests made to attack with the weapons suffer a -20 penalty.
      He must possess Two-Weapon Wielder (Melee) and Two-Weapon Wielder (Ballistic) if he wishes to use a gun and hand weapon
      together.
    cost: 0
    prerequisites: Weapon Skill 35, Agility 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 9K6ffkYg3UFi9eE2
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Dark Sight
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait sees normally even in areas of total darkness, and never takes a penalty for fighting
      in areas of dim or no lighting.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: kvk9XitnRG9VWh3I
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fear (2)
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait has an unnerving appearance. The fear of it always has an associated rating (1–4)
      to reflect just how awful the creature is to behold. The higher the Fear Rating the harder it is for others to resist
      going insane from the encounter, as shown on the following chart.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: fKcpSz1nmyOXeNlf
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: From Beyond
  ownership:
    default: 3
  sort: 0
  system:
    description: The mind of a creature with this Trait is beyond the petty frailties and precarious sanity of a mortal mind.
      It is immune to Fear, Pinning, Insanity Points, and psychic powers used to cloud, control, or delude its mind.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: Sbxps0pWjXoqAJPN
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hoverer (8)
  ownership:
    default: 3
  sort: 0
  system:
    description: 'Creatures with this Trait have a limited capability for flight, flying no higher than two metres. As with
      the Flyer trait, this Trait always includes a number to indicate speed. For more details on flying, see Chapter VII:
      Playing the Game.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 5SejBbtRJsGG1sXB
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Phase
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait can transform its body into an insubstantial state, passing ghost-like through
      solid objects or barriers of any sort. This Trait functions exactly like the Incorporeal Trait, except the creature
      may become solid or insubstantial by spending a half action. Phase carries additional limitations. A creature in a phased
      state cannot cross psychically charged barriers, holy wards, or energy fields designed to flux space or manipulate the
      Warp such as a Gellar Field or a Void Shield.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: F5LUhQ0dfPj6KQYG
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Phase Shifter
  ownership:
    default: 3
  sort: 0
  system: {}
  type: trait
- _id: yJqVi0mgECR6bnUy
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Machine (6)
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with the Machine Trait is fashioned from inorganic materials and is generally more rigorous than
      fleshy folks. Machines do not breathe, are immune to the effects of a vacuum, extremes of cold, any mind-influencing
      psychic effect, and their Armour Points apply toward fire damage. Machines are also resilient to injury, having 1 to
      5 Armour Points for each location. This number is indicated next to the Trait.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 2Xr46K0o4OfS9INq
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Size (Hulking)
  ownership:
    default: 3
  sort: 0
  system:
    description: '**Trait Groups:** Miniscule, Puny, Scrawny, Hulking, Enormous, Massive Creatures come in one of seven different
      size categories, as shown on the following chart. Size affects movement and how easy or hard it is to strike that creature
      in combat. (When calculating a creatures movement, apply the size modifier first, and then other modifiers from other
      Traits or talents. Base movement can never be reduced below 1.) For the purposes of comparison, a human is an average-sized
      creature.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 3Vr3kBWODbuQfl5w
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Regeneration (5)
  ownership:
    default: 3
  sort: 0
  system:
    description: Creatures with this Trait heal very quickly. Each round, at the start of its turn the creature tests Toughness
      to remove 1 point of damage. It loses this Trait when slain.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: XF8huV9N4kDWVqpL
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Strength (x2)
  ownership:
    default: 3
  sort: 0
  system:
    description: One or more of the creature's Characteristics is unnatural. Each time this Trait is gained, select a Characteristic,
      and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait,
      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
      Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.
    source: Rogue Trader Core Rulebook
  type: trait
