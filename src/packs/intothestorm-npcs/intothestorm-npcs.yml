effects: []
flags:
  rt:
    description: There are countless sub-species of Squigs in the greenskin ecosystem, although most share the same basic
      physiological characteristics. Squigs are primarily a gigantic fang-filled maw with a large tongue, plus powerful legs
      and beady eyes. They have voracious appetites, and eat anything they can fit between their grossly oversized jaws, as
      well as plenty of things that don't. Orks and gretchin often keep squigs as pets (and food sources), being one of the
      few races that find any redeeming qualities in them.
    movement: ''
    rawGear: ''
    source: Into the Storm
img: systems/rogue-trader-3rd/images/npcs/intothestorm/squigs.png
