    description: 'Vat-brutes are the massive slabs of muscle that have been created by the Stryxis flesh-crafters for a variety
      of tasks. They are vaguely humanoid, resembling something of a proto-human with smooth and featureless faces, and androgynous
      features. Their intelligence resembles something close to a mono-tasked servitor, with very little creative thinking
      outside the tasks they are created for. Vat-brutes can be used for anything from heavy labour to combat.


