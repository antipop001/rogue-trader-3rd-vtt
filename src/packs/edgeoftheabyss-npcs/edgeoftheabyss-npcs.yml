effects: []
flags:
  rt:
    description: 'Of all the dark fates that can befall a ship is the Warp should its Gellar field flicker or fall, the worst
      is the manifestation of a Greater Daemon. Born of nameless horrors and inhuman hatred, an entity of this magnitude is
      almost impossible to stop by mortal hands. Powerful beyond belief, this lord of darkness desires no more than to drag
      the screaming souls of its victims back to the abyssal depths of the hell-void from which it came.


      Such horrifying entities are thankfully rare, but many voidsmen tell tales of such creatures manifesting aboard a vessel.
      Such stories inevitably end with the "walking nightmare" departing, leaving a drifting charnel-tomb in its wake.


      Walking Nightmare Profile'
    movement: 3/6/9/18
    rawGear: ''
    source: Edge of the Abyss
img: systems/rogue-trader-3rd/images/npcs/edgeoftheabyss/greater-daemon-walking-nightmare.png
