effects: []
flags:
  rt:
    description: 'For the last twenty years Aoife''s daughter Igraine has remained in the Calixis Sector amongst the nobility,
      just as Aoife did while growing up. Aoife has been attempting to groom her daughter for the day when she will take the
      Warrant from afar, but rumours abound that she wants to see her daughter removed from the poisonous intrigues of the
      Sector Capital, so they may meet in Port Wander. However, there are certainly those who desire to strike against the
      Armengarde heir while she is unprotected, as Igraine''s worth to the Dynasty is incalculable. Such a task may be more
      dangerous than it appears, however, especially if Igraine is as competent as her mother. Then, of course, there is also
      the matter of her mysterious father.


      Recently, the Machenko Dynasty has begun to move against the Armengarde interests in the Koronus Expanse with ever-increasing
      force. They have established a base of operations somewhere in the Rubycon II system, and are sending armed vessels
      to attack those associated with the Armengardes in the past. In response, an Armengarde agent known as Master Dougal
      has arrived at the Port. He is offering a great deal of wealth (and future favours) for someone willing to eliminate
      this threat.'
    movement: 3/6/9/18
    rawGear: Chrono, micro-bead, Best Craftsmanship uniform, Best Craftsmanship bionic arm, data-slate, multicompass. Best
      Craftsmanship refractor field (see INTO THE STORM page 130).
    source: Edge of the Abyss
