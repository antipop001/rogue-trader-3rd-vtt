effects: []
flags:
  rt:
    description: 'Demonstrating fierce ambition and ruthless cunning of a kind seen only in very few Orks across the galaxy,
      Morgaash Kulgraz has slain and subjugated every Ork in his path, growing increasingly massive as other “Kaptins” challenge
      him. The last two decades have been particularly prosperous, with Morgaash ripping Uzrek Mag Nazdakka limb from limb
      in brutal unarmed combat and claiming Uzrek’s old ship, *Da Wurldbreaka* as his prize.


      Morgaash is a towering monster of an Ork, larger than most and physically imposing enough to back up his claims of being
      the Warlord of Undred-Undred Teef, though several rivals still claim otherwise. Few accurate records exist of Morgaash
      himself from the Imperial vessels he has assaulted—by the time Morgaash himself boards, the battle is normally won and
      all hope of escape lost. However, occasional survivor’s reports claim that the Warlord is some three and a half metres
      tall and may weigh as much as half a tonne, carrying a massive chain-axe that, wielded by Morgaash’s immense strength,
      is sufficient to shear through deck plating and leave gouges in bulkheads and blast doors. Worse, Morgaash is a bold
      and daring leader, particularly during ship-to-ship combat, and more than a few enemies have underestimated what the
      Orks are capable of under his leadership. Morgaash spends most of his time on *Da Wurldbreaka*, where he is plotting
      the downfall of Snaga, whom he sees as his main opposition to power.'
    movement: 5/10/15/30
    rawGear: ''
    source: Edge of the Abyss
img: systems/rogue-trader-3rd/images/npcs/edgeoftheabyss/morgaash-kulgraz-kaptin-of-da-wurldbreaka-warlord-of-undred-undred-teef.png
