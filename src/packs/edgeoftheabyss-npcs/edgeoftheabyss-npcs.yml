effects: []
flags:
  rt:
    description: 'Calligos Winterscale''s interests stretch across the Expanse, but they are unsurprisingly focused in Winterscale''s
      Realm. Perhaps because it bears his name, Calligos does focus his efforts within this region of the Expanse. His interests
      and assets in this region are myriad and varied; they include arms dealing, dabbling in the Cold Trade, smuggling, piracy,
      exploration, and even "legal" trade ventures. If one can think of a money-making scheme, it is likely that somewhere
      a Winterscale agent is doing something similar. It would not be fair to say that Calligos does not serve Imperial interests,
      he is as loyal to the Imperium of Man as any Rogue Trader. It is more appropriate to say that to Calligos Winterscale,
      the Winterscale Dynasty is the Imperium, and that monolithic establishment back through the Maw is simply not his concern.


      Calligos will not rest until the entirety of Winterscale''s Realm bows to his rule—as preposterous as this goal is,
      he seems to be putting a massive effort behind it. The focus of his effort is the frozen world of Lucien''s Breath.
      There he is embroiled in a bitter war with the Rogue Trader Aspyce Chorda. In Chorda, Winterscale has found an opponent
      he can neither cow nor crush, and to his fury he has been forced to split control of the world with her. All know this
      is only a temporary solution. Already skirmishes and raids break out between the rival sides, and Winterscale is openly
      gathering his strength and his allies to crush the usurper. It is likely that Chorda''s competence and danger as a worthy
      adversary appeals to Winterscale''s bloodlust, and only encourages his desire for conflict. The inevitable war between
      the two promises to be both bloody and massive in scale, and could plunge that entire region of space into conflict.


      However, the approaching war offers Rogue Traders a singular opportunity. Winterscale is too evenly matched to Chorda
      to be assured victory. He is willing to hire cut-throats and mercenary Rogue Traders who are eager for war, and reward
      them well for their service.'
    movement: 3/6/9/18
    rawGear: Chrono, Micro-bead, Best Craftsmanship Uniform Jacket and Clothing, Data-Slate, Multicompass, Recoil Gloves,
      Best Craftsmanship Conversion Field (see INTO THE STORM page 130), one storm bolter reload.
    source: Edge of the Abyss
