effects: []
flags:
  rt:
    description: 'The Crow Spirits have a long and bloody history, and much of it within the last eleven centuries can be
      attributed to one being. The deadliest and most experienced warrior of the Crow Spirits, Ilistaneth Anturien has been
      directly responsible for more death than almost any other individual within the Expanse. Cold and utterly ruthless,
      Ilistaneth harbours a profound loathing for all that is not Eldar and knows joy only in the moment of triumph.


      Ilistaneth does not question the instructions given to him by his masters; his hatred for the enemies of his kind dwarfs
      any empathy he might have for the plight of his targets. A master of many weapons and just as many poisons, Ilistaneth
      is a terrifying adversary to face, and as many foes have died to his blades with a look of dread upon their face, as
      have perished at a great distance never knowing the cause of their demise.


