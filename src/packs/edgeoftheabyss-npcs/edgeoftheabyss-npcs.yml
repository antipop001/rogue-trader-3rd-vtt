effects: []
flags:
  rt:
    description: 'The sorcerers of the Saynay Clan are among the vilest practitioners of the sorcerous arts. Their rituals
      involve sacrifice, blood, and cannibal consumption, preferably while the victim is still alive to witness the feast.
      A sorcerer usually serves the Saynay clan in the role of advisor and enforcer both. They use their warp-divination to
      plot courses for their masters, and consume their masters’ foes in hellfire. If a member of the Saynay Clan is to become
      a shipmaster, he must have the allegiance of at least one sorcerer, and the more successful one of those wretches is,
      the more foul conjurors flock to his banner.


      Sorcerers are also known to infiltrate the worlds and stations of the Koronus Expanse. There they lurk in the darkest
      corners of society, sacrificing and bleeding their victims for the pleasure of their masters. More than one ship-master
      has discovered a gore-splattered abattoir in the lowest decks of their vessel, just as the planetary authorities find
      sewers and alleys drenched in blood. Sometimes, the Saynay sorcerer may summon fell warp-creatures to do their bidding,
      preferring to do so in packed marketplaces and other locations where helpless folk tend to congregate. What this accomplishes
      beyond slaughter is unknown, but whispered tales


      told of the Saynay Clan say no sorcerer is allowed a position of leadership—they must always advise. Whether or not
      this is because the gore-caked masters of the Clan do not trust the sorcerers, or because the leaders of the clan are
      powerful enough to compel total obedience from the wretches, none can say.'
    movement: 4/8/12/24
    rawGear: Runes, sigils, grimoire of sorcerer’s rites, bag of rotting bits, tattered cloak.
    source: Edge of the Abyss
img: ''
