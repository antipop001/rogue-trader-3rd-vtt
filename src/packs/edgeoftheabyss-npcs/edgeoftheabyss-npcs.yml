effects: []
flags:
  rt:
    description: 'The Stormchaser is a legend spoken of fearfully amongst many of the crews that ply the Koronus Expanse,
      the vicious xenos pirate lord whose fleet emerges to strike vessels caught within the storms and tides of the Warp,
      attacking when their prey cannot escape, and leaving survivors enough only to whisper his name.


      The truth is little different. Caeluthin was born to a life of structure and discipline upon the Craftworld of Kaelor,
      becoming a Mariner and sailing the void for many years before his boredom and wanderlust became too great. Leaving his
      home in search of something more, Caeluthin became an Outcast, a willing exile from his people for so long as his wanderlust
      consumed him. Some five centuries later, Caeluthin''s sense of adventure is still strong, and he has risen to become
      the leader of the Twilight Swords Corsairs, and does not feel he shall ever return to the life he had upon Kaelor.


      Caeluthin is cunning, but easily bored, and prone to variegated and ever-changing moods. He views humanity with a sense
      of faint amusement at times, as a man might look at an animal capable of an interesting trick, while in other moods,
      he deems them little better than vermin, worthy only of annihilation. Overall, he sees humanity as worthless creatures,
      useless to his plans.


      This viewpoint conflicts with the guidance of Ela''Ashbel of Craftworld Kaelor, and is the cause of contention as the
      two sides work together more often. It is possible that the Farseer''s council may moderate Caeluthin''s views—or that
      her preference to use humanity to further Eldar goals may have some appeal.'
    movement: 6/12/18/36
    rawGear: ''
    source: Edge of the Abyss
