      blooded in battle and many have the scars and prosthetics to show for it.
    movement: 5/10/15/30
    rawGear: Bionic respiratory system (Good Craftsmanship), implanted vox, photo-visor, and suicide device (as bomb collar,
      self-detonated), spare ammo drum for heavy stubber.
    source: Edge of the Abyss
img: systems/rogue-trader-3rd/images/npcs/edgeoftheabyss/marauder-statistics.png
