effects: []
flags:
  rt:
    description: 'Generations ago, before the Orks and the Tau came to Pech, a migrating group of Crotalid—large semi-aquatic
      reptilian predators who migrate from world to world through the Warp by instinct—found themselves amongst the ancestors
      of the Misthound Kindred, who descended upon them swiftly, glad to have found new prey to consume.


      The peculiar warp-migration ability of the Crotalid seemed difficult to acquire, however, and the Kroot who carried
      the essence of the Crotalid within them were incapable of taking advantage of it. Successive generations of controlled
      breeding, however, after the Ork invasion, led to the first manifestations


      of that ability, in a young Kroot whose parents had consumed Ork psykers early in the war. Over the following decades,
      additional Kroot were born with this ability, though it appeared only a handful of those who carried the essence of
      the Crotalid.


      Ashak Kor was the first to gain this talent, a limited ability to travel short distances through the Warp, phasing slightly
      out of the material universe for short periods of time. As he came of age, he became a Shaper, and led his people off-world
      to find some way of developing this gift they had acquired. When the Misthound Kindred found themselves in the Koronus
      Expanse, Ashak felt that this was the place they would achieve that goal. Since that time, the Kroot of the Misthound
      Kindred have hunted those with a connection to the Warp as a way of expanding their ability to travel the Warp, so that
      one day, they might hunt across the stars without Warspheres, prowling from world to world.'
    movement: 5/10/15/30
    rawGear: ''
    source: Edge of the Abyss
img: systems/rogue-trader-3rd/images/npcs/edgeoftheabyss/master-shaper-ashak-kor-of-the-misthound-kindred.png
