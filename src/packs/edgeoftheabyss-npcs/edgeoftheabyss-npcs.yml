effects: []
flags:
  rt:
    description: 'A spiteful vassal of Karrad Vall, Sendak Voltrasse—whose original name is now long forgotten, even to himself—has
      fought at Vall''s command for as long as he can remember. After what may be centuries of service, Voltrasse harbours
      great hatred for Vall, but is inexplicably powerless against the Faceless Lord, and cannot remember any reason for this
      hatred. For years now, Voltrasse has journeyed across the Void, seeming never to stop save to raid, plunder and destroy,
      searching for something that his master desires. None know what that thing is, save for Vall. However, his thoughts
      infest his servant''s mind, goading him ever onwards.


      Voltrasse''s original nature is a forgotten thing, stripped from his mind until he remembers it no more, leaving him
      unable to recall what shape his body once had. He towers above all others under his command, his sickly flesh and iron-hard
      bone not truly alive. Beneath the surface of his gore-caked voidsuit, thin, dark veins worm across his pale skin, twitching
      and shifting as if imbued with a life of their own; he can no longer remove the suit, as it has long-since fused to
      his flesh. Visible to all through a hole in the front of the voidsuit, a sphere of obsidian covered in blasphemous engravings
      is embedded in his chest, held in place by a twisted scaffold of black iron festooned with barbed needles. His eye sockets
      are empty, as are those of many of his crew, and his face is covered in ancient scars and unnerving tattoos.


      Voltrasse Profile'
    movement: 4/8/12/24
    rawGear: ''
    source: Edge of the Abyss
img: ''
