effects: []
flags:
  rt:
    description: 'Those who live in the underdecks of Footfall tell tales of creatures that lurk in the dark corners at the
      edge of sight,


      things of mist, shadows, and far too many razor-edged blades. These creatures prowl in the unlit places below humanity''s
      hives and stations, waiting and watching for some lone unfortunate. Their victim''s bodies are found days later, bled
      dry through a thousand cuts. The Ordo Malleus names such creatures Daemons, but to their prey, they are simply Blade-things.


      The Blade-thing is a Daemon that thrives on fear and blood. It possesses a malicious, animalistic cunning, and often
      shows a proclivity to slay unseen, only to leave evidence of its work for others to discover. The sorcerers of the Saynay
      Clan delight in the creatures'' work, and some twisted resonance between their spirit and the Daemon leads to the sorcerers
      showing a tendency to summon Blade-things to do their twisted bidding. In turn, Blade-things seem almost eager in their
      service. The rare few slaves and captives who have escaped captivity from the Saynay Clan tell frightening tales of
      the pens and pits in the bowels of their ramshackle vessels, and the sharp-bladed creatures that lurk and roam through
      unlit corridors, killing anyone—friend or foe—they find alone.


      The rites to summon a Blade-thing and bind it in reality for any length of time are a secret passed amongst the Saynay
      sorcerers. It is likely the blasphemous rituals can only be found in their sorcerous grimoires—and perhaps in the hidden
      vaults of the Tricorn Palace on Scintilla, kept in the care of the Inquisition. Beyond the paraphernalia of blasphemous
      runes and a eight-pointed symbol of Chaos rendered into a summoning circle, the main ingredients of the rite are a light
      source (such a candle or lamp), and a sacrificial victim. The key act involves extinguishing the light, then, in the
      darkness that follows, slaying the sacrifice with a single cut, preferably to the throat or other artery. If the Blade-thing
      is lured by this offering, it will manifest in the shadows, listening to the sorcerer''s whispered orders. However,
      tales are told that if the sorcerer has any open cuts or wounds on himself, the Blade-thing will take his life instead,
      and return to the warp.


      Blade-thing Profile'
    movement: 6/12/18/36
    rawGear: 'None Thing of Smoke and Shadow: The Blade-thing lives in shadows and darkness. When in a shadow or other dark
      area, it gains the Phase Trait. It may only become incorporeal or substantial in a dark or shadowed area.'
    source: Edge of the Abyss
