        kilo-tonne ordinance, mounted along the vessel''s dorsal ridge or in broadside.
        Mars Pattern Macrocannon Broadside The most common macrobattery, these are
        reliable, hard-hitting weapons firing kilo-tonne ordinance, mounted in a warship''s
        extended broadside. Broadside: These weapons must occupy a Port or Starboard
        Weapon Capacity slot. Sunsear Laser Battery These laser batteries are common
        on Naval frigates, providing a balance between power used and damage inflicted.'
