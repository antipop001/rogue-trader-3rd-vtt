    description: A vastly expensive and rare device normally found only in the hands
        of legendary assassins or bounty hunters, the Omni-scope is a cluster of finely-tuned
        sensor wands linked to a precision lens. Some of these scopes plug directly
        into a bionic cranial port, allowing the user to shoot around corners without
        exposing himself—the scope becomes a “third eye.” The Omni-scope combines
        the benefits of a Preysense Sight, Red-Dot-Laser Sight, and Telescopic Sight.
        **Upgrades:** Any Basic-class Las, Solid Projectile, Bolt, Primitive or Plasma
        weapon. An Omni-scope counts as a sight and a gun may only have one sight.
