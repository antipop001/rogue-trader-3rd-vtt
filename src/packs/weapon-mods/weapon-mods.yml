    description: One attempt to compensate for the dangers of plasma weaponry (or
        other weapons that overheat or overload), so-called "calamity vents" are emergency
        purge vents designed to direct the superheated exhaust away from the firer.
        They have never become widely popular, as their new and somewhat inferior
        design interferes with the ancient and superior workings of certain weapons,
        such as plasma weaponry (sometimes with disastrous results). If a weapon with
        a Calamity Vent overheats and the bearer chooses not to drop it, roll 1d10.
        On a 4 or higher, the vent operates as designed. The bearer takes no damage,
        and the weapon does not need to spend a round cooling. On a 3 or lower, however,
        the bearer counts as being hit with a shot from the weapon in his body, as
        the vent misdirects the backblast. Unlike regular overheating, this hit has
        a Pen equal to the Pen of the weapon, not 0. The weapon still does not need
        to spend a round cooling. This may be equipped to any weapon with the Overheat
        Quality.
