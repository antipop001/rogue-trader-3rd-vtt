    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Mono weapons have specially fashioned blades with superfine edges
        that can easily cut through armour and never lose their edge. Mono weapons
        no longer count as Primitive and add a +2 bonus to their Penetration. The
        Mono upgrade can be applied to a power weapon, but it has no effect whilst
        the power field is active. If the power field is ever lost or deactivated,
        the Mono upgrade's bonuses will then apply. **Note:** The Mono upgrade may
        be applied to any primitive melee weapon, but when applied to close-combat
        weapons that do not use an edge (e.g., hammers, mauls, etc.), it is treated
        differently. Game Masters are encouraged to come up with interesting definitions
        for non-edged weapons with the Mono upgrade. For example, a hammer with the
        Mono upgrade could be defined as having a pneumo-shock enhancement. The in-game
        effects remain the same. **Upgrades:** Any primitive close combat weapon.
    source: Rogue Trader Core Rulebook
