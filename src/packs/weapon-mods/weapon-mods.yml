    description: 'Many of the more zealous religious warriors of the Imperium use
        an Exterminator Cartridge affixed to their regular weapons. This small device
        contains a small one-shot flamer weapon. It functions in much the same manner
        as a Combi-Weapon, TABLE 3-6: WEAPON UPGRADES |  Name | Weight | Availability  |
        | --- | --- | --- | |  Calamity Vent | .5 kg | Very Rare  | |  Exterminator
        Cartridge | 1 kg | Common  | |  Tox Dispenser | .75 kg | Rare  | allowing
        the user to fire either the added weapon (once) or the weapon it is mounted
        to. Cheap and easy to manufacture, they are a common sight on almost every
        weapon used by Imperial cults like the Order of the Red Redemption or the
        Emperor''s Purifying Light—often the last sight a heretic or apostate sees
        before his death. Exterminator Cartridges cannot be reloaded and must be replaced.
        A single Exterminator Cartridge may be equipped to any basic or pistol weapon.
        It may be fired as a half action, and counts as a Hand Flamer. The Exterminator
        Cartridge may not be fired in the same Round as the weapon it is attached
        to.'
