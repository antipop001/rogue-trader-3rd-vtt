effects: []
flags:
  rt:
    description: This Criminal Mastermind has fallen from his position as a commander of an entire planet's worth of Enforcers
      and blends the best of his training with his new connections in the criminal underworld. His harsh, justice-oriented
      origins show through in his knowledge of the Imperium and habits of asceticism. He has Common Lore (Adeptus Arbites,
      Imperial Creed, Imperium, Koronus Expanse) in addition to the Armour of Contempt and Orthoproxy talents. He desires
      Glory above all else, having memorised Imperial legends and tempered nerves of steel. He has Scholastic Lore (Legend)
      and the Nerves of Steel and Last Man Standing talents. His status as a Scandalous Socialite affords him several social
      skills as well as the Peer (Nobility) and Decadence talents. Finally, to interfere in his opposed Rogue Trader's ability
      to use Influence, he has friends in both high and low places represented by his Peer (Adeptus Arbites, Underworld) talent
      and buffed up social skills and Fellowship.
    movement: 3/6/9/18
    rawGear: Autoquill, dataslate, 2 clips for Boltgun and Inferno pistol, set of fine clothing, void suit.
    source: Hostile Acquisitions
img: systems/rogue-trader-3rd/images/npcs/hostileacquisitions/the-criminal-mastermind.png
