effects: []
flags:
  rt:
    description: '"I would sooner submit to penitent excruciation than deal with the Ordinate-Majore again."


      —Rogue Trader Jonquin Saul


      Precise and pedantic to a fault, Ordinate-Majore Mordechai Lorik is one of the Divisio Auditae senior Quaestors. Universally
      disliked by almost everyone he meets, Lorik seems to possess no empathy for other people, caring only about the details
      of his work, and in this regard he has been extremely successful. Over the last forty years, he has investigated the
      political and financial landscape of Port Wander and the systems nearby, personally uncovering the evidence that led
      to the elimination of five smuggling operations carrying xenos technology through the Maw.


      Lorik''s operation now involves dozens of lesser Quaestors, operating in close communication as they move from world
      to world. Lorik himself seldom gets directly involved during the early stages of an investigation, instead choosing
      to direct matters from a private office on Port Wander, analysing data gathered by his subordinates and processed by
      a team of lexmechanics and calculus logi. When he does get involved directly, it is never a quick matter. Lorik has
      had vessels impounded for weeks while he and squads of commandeered Adeptus Arbites search them from prow to stern with
      exacting detail.


      Lorik is particularly loathed by Rogue Traders, who he dislikes in equal measure—individuals so unrestrained and impulsive
      are anathema to him. Voyages into the Expanse have been delayed by months because of tedious inspections performed at
      the command of Mordechai Lorik.


      Now an elderly man, Lorik is frail and feeble, his body sustained only by expensive rejuvenat treatments and augmetic
      replacements. He has only a few years of life left, something for which his enemies are grateful, and hopeful that his
      inevitable replacement is perhaps easier to deal with.


      Lorik''s profile can be used to represent him directly, or any senior Quaestor.'
    movement: 3/6/9/18
    rawGear: Chrono, Ordinate's robes, auto-quill, several data-slates, transcription servo-skull, bionic respiratory system,
      bionic hips, bionic shoulder, scribe-tines.
    source: Hostile Acquisitions
img: systems/rogue-trader-3rd/images/npcs/hostileacquisitions/ordinate-majore-mordechai-lorik.png
