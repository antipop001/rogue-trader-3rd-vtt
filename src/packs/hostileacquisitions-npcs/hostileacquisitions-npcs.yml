effects: []
flags:
  rt:
    description: 'The Orthodox Xenos Inquisitor sends xenostech smuggling Rogue Traders to rot on the nearest prison world.
      Her dedication to Puritan ideals gives her the Armour of Contempt, Hatred (Criminals), Inspire Wrath, and Litany of
      Hate talents. Her commitment to Orthodoxy in all things Imperial continues this puritanical trend and is represented
      by the Duty Unto Death talent. Various knowledge-based skills and the Foresight and Paranoia talents follow from her
      being a Paranoid Savant. Ultimately, her station as an Inquisitor and his good reputation with planetary governments
      help him to revoke the Freedom his Rogue Trader enemies take for granted.


      IV. THE NEMESIS PATH


      Ordo Xenos (The Inquisitor) Profile'
    movement: 3/6/9/18
    rawGear: Auspex, auto-quill, chrono, 2 extra hellgun clips, data-slate, multikey, servo-skull, set of fine clothing.
    source: Hostile Acquisitions
img: systems/rogue-trader-3rd/images/npcs/hostileacquisitions/the-inquisitor.png
