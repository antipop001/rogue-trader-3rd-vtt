effects: []
flags:
  rt:
    description: 'This Rogue Psyker example is a cabal of cultists devoted to the Dark Gods. Their Origin is Faith Found Wanting,
      represented by skills such as Forbidden Lore, Ciphers (Occult), and Secret Tongue (Cult) as well as the Dark Soul talent.
      After Faith Found Wanting, Vendetta is selected and filled out with the Tracking, Shadowing, and Silent Move skills
      in addition to the Peer (Underworld) talent, all showing the cabal’s desire to get revenge by successfully tracking
      their mark and securing allies to assist them. Each cabalist also carries a memento as a reminder of why it is that
      he hunts the Rogue Trader and his crew. Following Vendetta is the Paranoid Savant from Devices and Downfalls.


      The Light Sleeper and Paranoia talents fit well alongside some buffed up Investigation Skills such as Common Lore, Forbidden
      Lore, and Logic. Also, Telepathy and Divination are appropriate Psychic Disciplines due to their focus on information
      gain and transmission. Reputation is selected from the next row and thus their Fellowship is perhaps higher than one
      would normally expect from a cabalist and several Interaction based skills help them with social manoeuvrability. Finally,
      the psykers need a few skills, talents, powers, and equipment specifically appropriate to those who traffic with the
      warp.


      ## Dark Cabalist (Rogue Psyker) Profile'
    movement: 3/6/9/18
    rawGear: Tattered clothes, trinkets and fetishes, memento, ragged reinforced void suit, respirator.
    source: Hostile Acquisitions
