effects: []
flags:
  rt:
    description: 'The Ork Warboss is a formidable villain using the column of the Nemesis Path that starts with Despot and
      ends with The Brute. His Despotic origins grant the Warboss skills such as Command and Intimidate as well as talents
      like Air of Authority. Motivated by Slaughter and threatening the Explorer’s Wellbeing, he has the Frenzy, Battle Rage,
      Crushing Blow, Furious Assault, and (several) Weapon Training talents.


      Many talents designed to make the Warboss seem indomitable and fearsome such as Hardy, True Grit, and Iron Jaw complete
      his status as a Warrior Without Peer. Though mainly developed for his superior combat skills, he has some social ability
      with regards to command and intimidation and fun roleplaying bits like his trophies and Ork Speak.


      ## Ork Warboss (The Brute) Profile'
    movement: 3/6/9/18
