flags:
  rt:
    description: '"All crime is a slight against the Emperor''s divine plan, and consequently an act of beresy. All heretical
      acts are in breach of the Emperor''s holy law; and are thus crimes."


      —Arbitrator Prime Naxander Durantis.


      A man with nearly two decades of experience serving with Judge Envedine, Arbitrator Primus Durantis is the commander
      of the Intervention. Now in his late fifties (and with limited access to rejuvinat drugs), Durantis views his rank with
      a mixture of honour and resentment, eager to bring justice to the stars but also struggling with the fact that he can
      no longer so readily lead his men in combat as he did earlier in his career.


      Unwilling to let all his old duties fall away in place of newer ones, Durantis still interrogates many suspects personally,
      his scarred visage serving to intimidate the weaker-willed of his captives. He is a shrewd interrogator, having learned
      a great deal working alongside many skilled chasteners over the years, and his eye for detail is sharper than ever.'
    movement: 3/6/9/18
    rawGear: Micro-bead, void suit, bionic arm, good-craftsmanship bionic eye, good-craftsmanship bionic ear.
    source: Hostile Acquisitions
