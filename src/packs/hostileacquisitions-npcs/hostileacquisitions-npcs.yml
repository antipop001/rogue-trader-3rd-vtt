      listed below start with Enemy in Arms, taking several Weapon Training talents, Quick Draw, and Leap Up to represent
      an agile and quick combat style. Next, they are motivated by Greed and target a Rogue Trader’s ability to make a profit—Motivation
      and Stakes choices that go hand in hand.


      The Barter, Commerce, Gamble, and Trade skills all make sense when working towards these ends. Because they are Wealthy
      Scofflaws as well, these trade and wealth related skills are bulked up. Additionally, skills and talents related to
      crime work well such as Deceive and Ciphers (Underworld).


