effects: []
flags:
  rt:
    description: 'Both the Nemesis'' origins and motivations are hidden from the world at large and as such are not represented
      by any equipment or other readily visible means. They are however present in the large number of Forbidden Lore skills.
      Interactions with the Rak''Gol and the creatures of the warp has made the adversary Jaded and resistant to fear. As
      a Politico archetype, the villain has several social and manipulation skills, and a high Fellowship attribute.


      Agitator of Tzeentch (The Politico) Profile'
