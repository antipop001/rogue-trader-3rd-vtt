    description: The Arbitrators who serve aboard the Intervention or the Precedent have had to pick up additional skills
      in their shipboard service. In the course of their duties, they have become well-versed in the matters of ship-to-ship
      combat, subduing enemy crewmen, and swiftly searching for hidden contraband. Clad in pressure-sealed carapace armour
      and armed in the traditional manner of an arbitrator—with shotgun, suppression shield, and power maul—the Arbitrators
      are a fearsome prospect for the crew of many illegal ships.
    movement: 4/8/12/24
    rawGear: Micro-bead, photo-visor, 2 combat shotgun magazines, combat shotgun magazine of executioner shells, manacles,
      auspex, suppression shield†.
    source: Hostile Acquisitions
