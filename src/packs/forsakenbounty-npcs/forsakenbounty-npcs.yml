effects: []
flags:
  rt:
    description: These disgusting parodies of life are animated bodies under the Worm's control. Sluggish and clumsy, they
      offer no real danger singly, though in numbers they can be deadly.
    movement: 1/2/3/6
    rawGear: None. **Meat Puppet:** Neither dead nor alive, the Warp Puppets are just objects animated by the power of the
      Psycharus Worm. As such, they cannot truly be killed. When they reach 0 Wounds, they will collapse for 5 rounds before
      rising again with new gaping wounds and missing limbs. Only massive damage inflicting 15 points of Damage in a single
      hit can put them down for good. The GM should allow PCs to hack up inactive puppets with melee weapons. Warp Puppets
      only ever use the Charge or Standard Attack actions.
    source: Forsaken Bounty
