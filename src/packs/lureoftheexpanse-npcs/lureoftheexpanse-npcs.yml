  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through conditioning or long years of abuse, the Explorer has built up a tolerance to many inebriants, drugs,
      and chemicals. When drinking alcohol or similar beverages, he does not pass out until he has failed a number of Toughness
      Tests equal to twice his Toughness Bonus. The character also gains a +10 bonus to resist the effects of addiction.
    cost: 0
    prerequisites: Toughness 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
