    aptitudes: ''
    benefit: The Explorer has optimised his use of Techna-Lingua for controlling servitors. He receives a +10 bonus to any
      attempt to communicate with servitors, and any vessel upon which he serves receives a +1 bonus to Crew Morale due to
      increased servitor efficiency.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: wJxYhFZycx12PSn8
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Concealed Cavity
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The character's flesh or augmetics conceals a small compartment. This might be a pouch hidden under a flap of
      flesh, or a chamber fitted into a cybernetic enhancement. The Explorer may conceal one small item, no larger than a
      closed fist, within this cavity. Discovering this compartment requires success on a Difficult (-10) Search Test. If
      using a medicae scanner or auspex, the Difficulty is reduced to Ordinary (+10).
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: hFhELgFmZQz9ZITm
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Electrical Succour
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can channel the sacred flow of energy from his Potentia Coil or other energy source to replenish
      his flesh. Whilst in contact with a functioning, powered machine, or fully charged battery or power cell, the character
      may make an Ordinary (+10) Toughness Test. Success removes one level of Fatigue plus one additional level of Fatigue
      for each additional Degree of Success. This takes one minute of meditation and ritual incantation.
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
