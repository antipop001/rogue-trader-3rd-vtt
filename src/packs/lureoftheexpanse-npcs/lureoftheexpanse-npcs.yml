  name: Gun Blessing
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Using the Explorer's sacred ability to subtly affect ferrous materials, he can un-jam a number of weapons equal
      to his Intelligence Bonus, so long as they are within a 10-metre radius. A successful Intelligence Test indicates the
      character has appeased the spirits of the weapons. This blessing requires a Full Action.
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
