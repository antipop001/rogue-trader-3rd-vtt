  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can cause an unsecured metal object within his field of vision to fly into his hand. The object
      may mass up to 1 kilogram per point of the character's Willpower Bonus, and must lie within 20 metres. Using this Talent
      requires a Full Action and a successful Willpower Test.
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
