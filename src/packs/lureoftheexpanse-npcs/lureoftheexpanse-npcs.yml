  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has learned to focus the power stored within his Potentia Coil with greater efficiency. He no longer
      gains Fatigue from using Luminen Charge, Luminen Shock, and Luminen Blast.
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
