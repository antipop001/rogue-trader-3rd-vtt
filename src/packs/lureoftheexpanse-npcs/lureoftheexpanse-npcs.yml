  name: Iron Jaw
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has taken blows from Orks and given back as good as he got. He can bounce back from most strikes
      without ill effects. If ever Stunned, a successful Toughness Test allows him to ignore the effects.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: Gi14qQDHgUmFh0WW
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Luminen Charge
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The Explorer has mastered the union between his holy mechanical elements and his mortal flesh, allowing the
      former to power the latter. With a successful Toughness Test the character may recharge or power machinery with his
      internal coils. This requires one minute of meditation and ritual incantation. The difficulty of the Toughness Test
      varies depending on the nature of the powered system: Ordinary (+10) Simple Power Cell, Illuminator; Challenging (+0)
      Weapon Charge Pack, Data Slate, Bridge Terminal; Difficult (-10) Hotshot Charge Pack, Shuttle Electronics, Servo-Skull;
      Hard (-20) Lascannon Charge Pack, Servitor, Bridge Hololith; Very Hard (-30) Ship''s Cogitator Core, Reactor Machine
      Spirit, Xenos Tech. The Explorer must pass a Toughness Test when he uses this ability or gain a level of Fatigue. No
      matter the power bestowed by the Omnissiah, some systems are either too large or too alien for this Talent—the GM will
      be the final judge.'
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
