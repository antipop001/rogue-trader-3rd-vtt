  name: Luminen Shock
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The power of the Explorer''s Potentia Coil flows through a network of inductors within his flesh, allowing him
      to channel this energy into his blows. In close combat, a successful Weapon Skill Test or Grapple delivers the shock.
