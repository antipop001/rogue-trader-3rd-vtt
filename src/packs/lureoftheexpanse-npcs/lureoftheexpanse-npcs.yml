    aptitudes: ''
    benefit: The character's flesh or augmetics conceals a small compartment. This might be a pouch hidden under a flap of
      flesh, or a chamber fitted into a cybernetic enhancement. The Explorer may conceal one small item, no larger than a
      closed fist, within this cavity. Discovering this compartment requires success on a Difficult (-10) Search Test. If
      using a medicae scanner or auspex, the Difficulty is reduced to Ordinary (+10).
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
