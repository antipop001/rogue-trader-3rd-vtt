    aptitudes: ''
    benefit: Prolonged exposure to darkness has acted as an inoculation against all that is foul, granting the Explorer resilience
      against corruption. Whenever he makes a Malignancy Test, he takes half the normal penalty.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
