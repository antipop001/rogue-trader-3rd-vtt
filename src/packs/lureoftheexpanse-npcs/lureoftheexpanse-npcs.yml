effects: []
flags:
  rt:
    description: 'The Farseers of the Eldar are the leaders of their people, guiding them with their ability to see the myriad
      possible futures and select the most advantageous. They are also prodigiously powerful psykers, and prove highly dangerous
      opponents.


      Serrenon is a respected seer amongst the inhabitants of Craftworld Kaelor. He is one of the many Eldar sent by his craftworld
      to the Expanse to work with the Twilight Swords. However, he sees the protection of the Dread Pearl as a sacred duty,
      and will not shirk from it willingly.'
