  name: Electro Graft Use
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The Explorer may use his Electro Graft to access data ports and commune with machine spirits. This grants a
      +10 bonus to Common Lore, Inquiry, or Tech-Use Tests whilst connected to a data port. (Errata v1.4: prerequisite corrected
      to Mechanicus Implants.)'
    cost: 0
    prerequisites: Mechanicus Implants
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
