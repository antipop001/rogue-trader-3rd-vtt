effects: []
flags:
  rt:
    description: 'Drecarus and his coven have countless thousands of assistants, collectively known as Wracks. These degraded,
      twisted beings no longer resemble the Dark Eldar they once were, but rather the abominations they have chosen to become,
      resorting to gruesome transformative surgeries in order to stave off the ennui that comes from centuries of debauched
      experience.


      Wracks one day hope to ascend to the ranks of the Haemonculi themselves, though whether or not any amongst them has
      ever done so is unknown. The Haemonculi, careful with their secrets and essentially immortal, have little room for rivals,
      only servants, slaves, and subjects. Each Wrack is, however, a capable torturer, alchemist, and physician in its own
      right, for few Haemonculi are inclined to the indignities of manual labour and instead command their minions to perform
      the procedures they direct. Some Wracks take the bizarre, specialised results of their masters'' dark science onto the
      battlefield, and equip themselves with liquifier guns, hekrifles, and even stranger contraptions that bring death and
      pain to their enemies.'
    movement: 4/8/12/24
    rawGear: Surgical tools, phials of blood, bile, tissue samples.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/wrack.png
