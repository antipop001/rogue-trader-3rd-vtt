effects: []
flags:
  rt:
    description: 'Though officially part of the Cult of the Withered Blade, the Beastmasters are a world apart from the Hekatarii.
      Almost universally male and isolated from the rest of the cult, the Beastmasters are regarded more as a necessity than
      valued members, for none but the Beastmasters can drive forth the beasts and slaves into the arena with such cruel efficiency.


      Each Beastmaster is blessed with a powerful and commanding presence, and even the mightiest and deadliest of beasts
      will hesitate at a Beastmaster''s scornful glare and the way his hand tightens around the handle of his lash. Weapons
      that inflict debilitating shocks to a target are favoured tools of Beastmasters, allowing them to cow their charges
      into submission and savour the pain and helplessness that such devices inflict.'
    movement: 6/12/18/36
    rawGear: 'Skyboard, dominion mask† †Dominion Mask: The wearer of a dominion mask may re-roll failed Intimidate and Wrangling
      Tests.'
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/wych-beastmaster.png
