effects: []
flags:
  rt:
    description: 'Spawned in fractured corners of the Warp where mortal dreams twist, grow, and burst forth into living creatures
      of nightmare, Khymera are savage, feline hunters kept in realspace through the copious efforts of Dark Eldar Beastmasters.
      Despite the difficulty of keeping these creatures in the materium, to say nothing of keeping them under control once
      there, Khymera resonate with the sadistic psyche of the Dark Eldar in a way that natural beasts cannot, and Beastmasters
      are often found trailing packs of these hulking, ethereal beasts, driving them ever onward to greater and greater heights
      of slaughter.


      In the pits of the Nexus of Shadows, there are few sights more outwardly unnatural and horrifying than a pack of Khymera
      phase-shifting through a solid wall to rend the flesh of a group of slaves with their claws and lashing tendrils of
      knotted flesh. These wretches serve as fodder for the warp-spawned Khymera, and the Dark Eldar drink deep of their terror.
      More information on Khymera in the Koronus Expanse is available in THE KORONUS BESTIARY.'
    movement: 12/24/36/72
    rawGear: ''
    source: The Soul Reaver
img: ''
