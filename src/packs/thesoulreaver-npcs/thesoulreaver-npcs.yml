effects: []
flags:
  rt:
    description: 'Flitting between the towering spires of Kabals, the arena complexes of Wyches, and the dank dungeons of
      Haemonculi, Scourges have seen the full extent of Dark Eldar society and soar contemptuously above it all. Each has
      been subjected to agonising augmentative and transformative surgeries, grafting great wings to their shoulders, augmenting
      their flesh with synth-muscle and adrenaline dispensers, and hollowing their bones so that each Scourge can truly fly.
      Even after these gruelling procedures, a Scourge''s ascension is incomplete, for the newly transformed Dark Eldar must
      soar to the eyries of their new kin upon blood-soaked wings still raw from their implantation, surviving the perils
      of Hellion gangs and the high-speed hunts of Reavers and Razorwings. Only once this vertical pilgrimage is complete
      can they truly be called Scourges.


      Scourges serve as messengers for the powerful, carrying venom-sealed missives. The recipient has the only means to cure
      the courier and open the message. This role gives the Scourges great freedom and power, for to slay a Scourge while
      he performs his duties is punishable by the most creative and painful of deaths. In battle, Scourges favour long-ranged
      weaponry, unwilling to risk their fragile augmented bodies to the fury of melee, and a flight of Scourges can deliver
      that firepower to the enemy swiftly and from unexpected angles. The patronage of powerful Archons and Succubi allows
      a Scourge to afford some of the deadliest and most exotic weaponry, from toxic shardcarbines, to vicious shredders,
      deadly blasters, and even haywire blasters and heat lances.'
    movement: ''
    rawGear: Assorted grisly trophies, 2 clips of shardcarbine rounds.
    source: The Soul Reaver
img: ''
