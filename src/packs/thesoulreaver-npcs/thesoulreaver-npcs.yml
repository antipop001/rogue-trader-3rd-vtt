effects: []
flags:
  rt:
    description: 'Given their sheer numbers within the galaxy, humans make up the largest proportion of the inhabitants of
      the Withered Blade’s dungeons, and can be found participating in all manner of events. Whether they battle against the
      cult’s Wyches, struggle to fend off the onslaught of beasts, or swarm about as moving targets for the exhibition flights
      of Reavers, there are humans everywhere within the arena and beyond.


      As is commonplace, the Withered Blade tends to trade away or otherwise discard those humans who will provide little
      sport—the spectacle of the arena is diminished if the victims cannot pose some challenge, no matter how slight, to the
      Wyches or the beasts, and a swift and easy kill is worth little prestige. Those who are weak of mind or body are swiftly
      traded away to Kabals or Haemonculi covens, for the Withered Blade seeks those with strength and a spark of fury to
      better serve their needs. As a result, most of those who find themselves in the Withered Blade’s dungeons are fighters,
      and already bear the scars of las-burn, bullet, and blade. They fight with the righteous hatred and the desperate ferocity
      of men whose lives were long ago given to battle.'
    movement: 3/6/9/18
    rawGear: None.
    source: The Soul Reaver
img: ''
