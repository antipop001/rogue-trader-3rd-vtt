effects: []
flags:
  rt:
    description: 'Of all the unpleasant creatures in the pens of the Dark Eldar, none can surpass the raw animal ferocity
      of the Clawed Fiend. A Clawed Fiend is a mound of corded muscle, covered by durable grey fur. Every one of its extremities
      is lethal, from its shredding talons, to its bone-bladed tail, to its great, red head set, with slavering jaws and far
      too many beady eyes. Perhaps even more startling than the creature''s physique is the savagery with which it pursues
      prey. Terrors in their own right, Clawed Fiends hardly need to feel the indelicate touch of a Beastmaster''s lash to
      be hunters of the highest calibre. When harmed, however, this beast enters a slashing madness, converting its assailants
      into a gruesome red slurry as it tears and bellows at everything and anything around it.


      The Dark Eldar delight in such violence, of course, and so Clawed Fiends are prized by many Beastmasters, including
      those of the Cult of the Withered Blade, both as creatures to fight in the Shadowspine Pits and as extra muscle for
      the realspace raids that drag new fodder back to the arenas. More information on Clawed Fiends in the Koronus Expanse
      is available in THE KORONUS BESTIARY.'
    movement: 5/10/15/30
    rawGear: ''
    source: The Soul Reaver
