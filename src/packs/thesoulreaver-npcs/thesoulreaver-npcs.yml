effects: []
flags:
  rt:
    description: 'For better or worse, the arachnid form is commonplace across the galaxy, and has been for longer than any
      alive can recall. Countless trillions of species of spiders and similar organisms exist on innumerable worlds and parts
      beyond, and the webway is no exception. Native to the ragged and twisted webway tunnels that stretch across and beyond
      the Calixis Sector, the Koronus Expanse, and the Screaming Vortex between, the Ariadne Helspider is a vicious, many-legged
      creature that seems unfettered by the normal passage of time. Its wounds heal as if its flesh was reverting to a past
      state, its attacks seem to strike home even though the creature remains some metres distant, and blows struck against
      it seem impossibly to miss, as if they had never happened.


      Hunted for sport by the Dark Eldar of the Nexus of Shadows, Helspiders are a local favourite of the Beastmasters of
      the Shadowspine Pits. The audience also enjoys the unique confusion and suffering these creatures can inflict. Further,
      these beasts also make their pit matches more exciting by their habit of manipulating the web of fate to slip past the
      normally impenetrable fields that keep the combatants in the ring. It is not unheard of for these creatures to run rampant
      through the stands until being brought under control, to the delight of any Dark Eldar not in their path.'
    movement: 16/32/48/96
    rawGear: ''
    source: The Soul Reaver
