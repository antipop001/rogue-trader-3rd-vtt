effects: []
flags:
  rt:
    description: '“Neija Tromean is cursed.” Those are likely to be the first words from the lips of any person who has encountered
      her. Escaping from the grasp of the Imperium and the toil of Sepheris Secundus, she found passage to the fringes of
      the Calixis Sector aboard ore freighters and other transports, always escaping the calamities that befell those who
      carried her, until the most recent instance. When she attempted to gain passage to the Koronus Expanse, her vessel was
      attacked by Dark Eldar Raiders.


      The Kabal that claimed her fell to the machinations of another within a week of her arrival in the Dark City, and she
      has since been within the ownership of several other Kabals and cults within Dark Eldar society, each one crumbling
      due to completely unrelated events, as if misfortune is attracted to this young woman. Now, she is condemned to the
      arena of the Withered Blade thanks to the machinations of a rival Wych cult seeking to gain a foothold in the Nexus
      of Shadows. For her part, Neija is biding her time before some new calamity befalls her captors.'
    movement: 3/6/9/18
    rawGear: Psychic Suppressor.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/neija-tromean-warp-wyrd.png
