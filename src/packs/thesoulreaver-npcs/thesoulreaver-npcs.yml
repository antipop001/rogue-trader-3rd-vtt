    aptitudes: ''
    benefit: The slightest change in conditions or disturbance brings the Explorer from sleep to full awareness, remaining
      alert even in slumber. He is always assumed to be awake, even when asleep, for the purposes of Awareness Tests or surprise.
      Unfortunately, the character's sleep is not deep and can be frequently interrupted, resulting in a less-than-cheery
      disposition when awake.
    cost: 0
    prerequisites: Perception 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
