effects: []
flags:
  rt:
    description: 'Holding a place of pride within the Withered Blade''s beast cages, these monstrosities were once entirely
      mundane Carnosaurus on a distant, nameless primordial world. Favoured upon their acquisition for their simplicity and
      the spectacle of their size and power, these creatures have been slain on countless occasions and resurrected each time
      by the labours of Haemonculi, who have not hesitated to improve upon the creatures.


      Now, a Fleshwrought Drake is a hybrid of flesh and venom, its decayed muscles renewed by hypersteroids and vivisect-grafts,
      its blood replaced by a deadly mixture of unnatural chemicals, and its bestial mind supplanted by Drecarus'' own invention,
      the spider-like Effigy Matrix.'
    movement: 5/10/15/30
    rawGear: ''
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/fleshwrought-drake.png
