effects: []
flags:
  rt:
    description: 'Although an impossibly rare sight within the Koronus Expanse, little is beyond the reach of the realspace
      raids of the Dark Eldar, and the distant Tau Empire is no exception. Regarded as little more than animals for sport
      and sustenance in the same ways as humans, Tau are sometimes captured in raids by the Dark Eldar of the Nexus of Shadows,
      more as a curiosity than for their actual worth, for the souls of Tau are pale, flickering things, meagre even compared
      to the sputtering light of the human spirit.


      The Withered Blade has several dozen grey-skinned Tau warriors remaining within its dungeons, more as fodder for the
      beasts than for any real sport. Nonetheless, their efforts in the ring amuse Anyalra, who has watched with idle interest
      as these disciplined warriors have been whittled down to a bare few, surviving by wits and ferocity uncharacteristic
      of their kind in the circle''s bloody conflicts.'
    movement: 2/4/6/12
    rawGear: None.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/brutalised-tau-fire-warrior.png
