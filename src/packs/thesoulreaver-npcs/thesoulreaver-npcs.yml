    benefit: The ancient and blessed technology of the Mechanicus or some corrupt xeno tech flows through the Explorer's blood.
      These miniscule machines repair minor injuries and speed healing. When applying healing, he is always considered Lightly
      Wounded, and heals at an increased rate, removing 2 points of Damage per day.
    cost: 0
