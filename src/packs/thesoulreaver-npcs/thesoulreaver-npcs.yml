effects: []
flags:
  rt:
    description: 'Drecarus is the master of the Sutured Helix Coven, the Arch-Agonist of T''saevoym, a title whose meaning
      is long-forgotten but instils dread in even the most jaded of Dark Eldar nobles of the Nexus of Shadows to this day
      nonetheless. What is known about Drecarus is that he is an incalculably ancient being, and that as long as anyone can
      remember he has been sole master of his coven, the Sutured Helix. Though his coven once held a position of some prominence
      in the twisted dens of Commorragh, Drecarus grew weary of the bickering of Archons and even fellow Haemonculi, and so
      he lead his coven into the webway that they might focus on their twisted work.


      During its aeons of sojourning, The Sutured Helix ran afoul of a group of Rak''Gol marauders while travelling the Koronus
      Expanse. Their damaged vessel was saved by the raiding fleet of Zaergarn Kul. Eager to have a Haemonculi Coven on the
      Nexus of Shadows, Zaergarn offered the crippled vessel an offer it could not refuse, and Drecarus grudgingly assented
      to become Zaergarn''s ally and advisor. Over time, Zaergarn trusted Drecarus with more and more of his rule, and the
      Haemonculus'' power over the


      Nexus of Shadows grew. Drecarus worked to accelerate the war between the two Archons, and it was he who provided Salaine
      Morn with the means to acquire the Mandrake who slew Zaergarn. When the dust settled, the Haemonculus was victorious.
      With Salaine banished and Zaergarn''s spirit trapped inside The Soul Reaver, Drecarus is now master of the Nexus of
      Shadows, and rules through subtle manipulation of Zaergarn''s Kabal of the Splintered Talon, which does not even yet
      suspect its true lord''s death.'
    movement: 4/8/12/24
    rawGear: ''
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/drecarus-the-arch-agonist-of-t-saevoym-haemonculus.png
