effects: []
flags:
  rt:
    description: 'Where Dark Eldar gather, Hellion gangs are sure to form. Exiled miscreants, feral adolescents, and those
      scornful of the rule of the Kabals, Hellion gangs roam the skies at will, surviving in whatever ways they can and resentful
      of any with power, prestige, or privilege. Mounted upon shrieking skyboards, their reflexes and senses heightened by
      powerful combat drugs, and armed with razor-sharp hellglaives, Hellions are an unpredictable danger to anyone who strays
      into their domains.


      Two dozen or so major Hellion gangs haunt the territories of the Splintered Talon and the Withered Blade, while many
      more form and collapse within short spans of time, their members absorbed into larger, more powerful gangs or cast to
      the distant streets below. These gangs sometimes join in the realspace raids launched by the Kabal of the Splintered
      Talon or the Cult of the Withered Blade, but each group considers itself independent from these powerful organisations.'
    movement: 6/12/18/36
    rawGear: Skyboard, 1 dose of combat drugs (see page 116).
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/hellion.png
