effects: []
flags:
  rt:
    description: 'Riding sleek, swift jetbikes, Reaver are obsessed with killing at speed, and they crave nothing so much
      as the thrill of taking a life while travelling at breakneck velocities. Whether slaughtering whimpering lesser races
      during a realspace raid or eviscerating their rivals in a death-race high above the streets, Reavers find joy only by
      turning their skill as pilots to murderous ends.


      Several small Reaver sects gather to the arena of the Withered Blade. Their deadly sport takes place high above the
      stands amidst razor-sharp obstacles, often simultaneously with the gladiatorial bouts far below. More than a few clashes
      on the gore-caked sands of the arena floor have been enlivened by a splatter of blood and a shower of body parts and
      jetbike pieces plummeting from above.


      Sometimes the Reavers who fly above the Shadowspine Pits descend to slaughter combatants or even members of the audience
      in murderous flybys, much to the amusement of those spectators who they have not just eviscerated.'
    movement: 6/12/18/36
    rawGear: Grisly prizes wrested from their prey, combat drugs (see page 116), Reaver jetbike (see page 139).
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/reaver.png
