effects: []
flags:
  rt:
    description: 'The particular talents of Domos Agnelain have not gone to waste, and the depths of his knowledge have been
      sifted and sorted on many occasions to find some morsel of worth. Seldom are any of the secrets of the Adeptus Mechanicus
      of value to the Dark Eldar, for their eldritch technology is as sorcery to the sciences of the Martian priesthood. However,
      it is not lore that the thought-pillagers and meme-scalpels seek, but concepts that bring new sights and sensations
      to the Nexus of Shadows.


      Servitorisation is not a concept entirely unfamiliar to the Dark Eldar—Grotesques are, after all, lobotomised slaves
      of a similar sort—but the notions of Murder-servitors and Arco-flagellants found approval in the dark cliques of the
      Nexus when they were mined from Magos Domos’ brain. Autonomous killing machines designed to terrorise and slaughter
      appealed to the murderous decadence of the Talonlord’s court, and when these concepts were found in the Magos’ mental
      archives, Drecarus’ Haemonculi almost immediately began work to create something similar. Wrought from the flesh of
      Dark Eldar who were deserving of some cruel and unusual punishment, Murderfiend Servitors are vicious, swift, and entirely
      remorseless creatures, seeking only the deaths of those around them and to slake the unholy thirst that still burns
      their hollow souls.'
    movement: 6/12/18/36
    rawGear: Stimulant injectors.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/murderfiend-servitor.png
