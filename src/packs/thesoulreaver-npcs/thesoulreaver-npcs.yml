effects: []
flags:
  rt:
    description: 'Captured alongside the remnants of a cadre of Tau, Nashrik Hakh has survived where many of her kin have
      not. The strength, agility, sensory acuity, and most of all the genetic pliancy of the Kroot saw her kindred divided
      between the laboratories of Drecarus and the fighting pits of the Withered Blade. Of the former, none but Drecarus know
      their fates. Of the latter, only Nashrik survives, her kin having been driven like beasts into the arena time and again
      without respite.


      Nashrik herself is far from intact. Having triumphed in an early battle, she took the opportunity to sate her hunger
      upon the cadaver of her foe, only to find that the Wyches’ drug-polluted flesh reacted poorly with her physiology. She
      struggles to maintain her sense of self against the toxins that seared her brain as they flooded her body, but the senseless
      ferocity of a feral oblivion grows nearer with every passing day.'
    movement: 5/10/15/30
    rawGear: A single ragged quill from her former Shaper’s head.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/nashrik-hakh-savage-kroot.png
