effects: []
flags:
  rt:
    description: 'Unlike the exiled Shadowed Thorns Kabal, the Kabal of the Splintered Talon has long maintained a large cadre
      of Kabalite Trueborn. Trueborn are raised to regard those around them with contempt and derision, viewing themselves
      as superior. To their credit, this is often the case, with the long and ruthless upbringing of a Trueborn child creating
      a killer with prowess equal to its arrogance and ambition.


      Amongst the Splintered Talon Kabal, rapid-firing shardcarbines and long, serrated blades of exquisite quality are some
      of the most fashionable weapons. Beyond the easy reach of many half-born warriors, these deadly implements form the
      common armament of many Trueborn within the Kabal. However, the wealth and power of even the least influential of Trueborn
      is sufficient for them to enter battle with deadlier and more exotic weaponry more often, and many choose to carry splinter
      cannons, shredders, blasters, and dark lances with which to obliterate their prey.'
    movement: 5/10/15/30
    rawGear: Assorted grisly trophies, 2 clips of shardcarbine rounds.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/kabalite-trueborn.png
