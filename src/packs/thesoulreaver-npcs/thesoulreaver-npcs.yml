effects: []
flags:
  rt:
    description: 'Rare enough commodities within most Dark Eldar settlements, few Craftworlders or Exodites ever reach the
      gladiatorial arenas of the Nexus of Shadows. Most are claimed by powerful Dark Eldar as prizes or tributes, their potent
      souls and intense emotions savoured amidst the petty agony of lesser beings, while others are given to the Haemonculi,
      who employ their flesh as raw materials while distilling their spirits are into potent elixirs.


      Only those few Eldar captured by the Cult of the Withered Blade, and those few given to the Cult''s Succubi, ever find
      their way to the Shadowspine Pits. The mightiest of them have endured countless battles and have lost themselves in
      the hate and fury of the arena, and have little care for their own lives. Each is permitted to keep his spirit stone,
      to be defiled, rent open, devoured by his killer, a sensation unlike any other and a reward worthy of the finest performance.'
    movement: 5/10/15/30
    rawGear: ''
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/anguished-eldar.png
