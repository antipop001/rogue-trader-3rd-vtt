effects: []
flags:
  rt:
    description: 'Captured some decades ago, Magos-Errant Domos Agnelain was accompanying an Explorator mission into the Koronus
      Expanse in search of the Gaelan Sphere, when the vessel was attacked by a large group of Dark Eldar whilst performing
      maintenance rites after a somewhat tumultuous journey through the Warp and taken after a short battle. Over the following
      years, Agnelain saw his brethren mutilated and flensed down to little more than augmetic-enhanced skeletons driven by
      shattered minds, yet Agnelain alone was spared the worst of the torturers’ cruel attentions. He did not find out why
      until decades later—the Dark Eldar had discovered that he was the leader amongst the surviving Tech-Priests, if only
      by dint of his rank, and had spent years siphoning and pillaging lore from the minds of his subordinates before they
      reached the leader.


      After nearly forty years with a dwindling number of fellow captives for company, Agnelain’s mind had turned in on itself,
      focussing on the knowledge he had attained rather than face the horrors of his surroundings, until eventually his captors
      came for him as well. It took the Dark Eldar a matter of years to unlock the secrets of his mind and begin sifting through
      them to find anything of use. Domos patches up the slave warriors of the Withered Blade when he is not being called
      upon by the Cult to create monstrosities to tear the gladiators asunder yet again.'
    movement: 2/4/6/12
    rawGear: None.
    source: The Soul Reaver
img: systems/rogue-trader-3rd/images/npcs/thesoulreaver/domos-agnelain-enslaved-magos-of-the-adeptus-mechanicus.png
