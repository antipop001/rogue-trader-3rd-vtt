effects: []
flags:
  rt:
    description: 'Compared with Khymera and Clawed Fiends, Razorwing flocks seem positively mundane. The large avians do not
      at first appear to be a threat to a seasoned traveller—and it is this fact that makes them so very deadly. Razorwings
      are blisteringly fast and agile, capable of outmanoeuvring a flying Hellion ganger on his skyboard, and their hardened
      talons, beaks, and razor-tipped feathers can strip a body of armour and flesh in an instant. It is not unknown for flocks
      of Razorwings to reduce their prey to a mess of bones and blood in a single pass before carrying off the skeleton of
      their victim to devour elsewhere.


      Anyalra always takes a particular interest when her Beastmasters unleash these graceful, feathered killers in the arena.
      More information on Razorwings in the Koronus Expanse is available in THE KORONUS BESTIARY.'
    movement: ''
    rawGear: ''
    source: The Soul Reaver
