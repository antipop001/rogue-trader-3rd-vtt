data:
    description: 'The gigantic Jericho pilgrim ships are converted refinery vessels. Their huge fuel tanks are rebuilt into hundreds of passenger compartments, and a single ship can hold many thousands of the faithful. Accommodations vary; for those with the Thrones, the trip can be relatively pleasant, but most must make do with bilge-berths and corpse rations in the ship''s cavernous cargo bays. A Jericho can also be repurposed to carry cargo.
The ships themselves are large, slow, and unwieldy. Most do sport some weapons to discourage pirates, though most buccaneers might look for richer targets. // Stats: Speed 3, Manoeuvrability -10, Detection 5, Hull Integrity 50, Armour 12, Turret Rating 1, Space 45, SP 20 // Weapon Capacity: 1 Prow, 1 Port, 1 Starboard // Dimensions: 2.25 km long, 0.3 km abeam approx. // Mass: 9 megatonnes approx. // Crew: 20000 crew, approx. // Accel: 1.6 gravities max acceleration // Cargo Hauler: This vessel was designed for transporting goods, and no amount of retrofitting can fully change this. This hull comes pre-equipped with one Main Cargo Hold Component (see page 203). The hull''s Space has already been reduced to account for this, however, when the ship is constructed it must be able to provide 2 Power to this Component.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Jericho-class pilgrim vessel [TRANSPORTS]'
type: 'shipTrait'
---
data:
    description: 'A common sight throughout the Calixis Sector, Vagabonds are small, multi-purpose merchant vessels able to transport a wide variety of cargos and even passengers. Popular amongst poorer Chartist captains, these ships are unassuming but reliable, and have even been known to mount small broadsides for defence. // Stats: Speed 4, Manoeuvrability -5, Detection 10, Hull Integrity 40, Armour 13, Turret Rating 1, Space 40, SP 20 // Weapon Capacity: 1 Dorsal, 1 Prow // Dimensions: 2 km long, 0.4 km abeam approx. // Mass: 8 megatonnes approx. // Crew: 18000 crew, approx. // Accel: 2.1 gravities max acceleration // Cargo Hauler: This vessel was designed for transporting goods, and no amount of retrofitting can fully change this. This hull comes pre-equipped with one Main Cargo Hold Component (see page 203). The hull''s Space has already been reduced to account for this, however, when the ship is constructed it must be able to provide 2 Power to this Component. // ## RAIDERS // Corsairs and pirates prize these fast but fragile vessels.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Vagabond-class merchant trader [TRANSPORTS]'
type: 'shipTrait'
---
data:
    description: 'The Hazeroth class comprises a variety of raider vessels of similar size and firepower. Many have been known to operate
from the infamous Hazeroth Abyss (hence the name), and are popular with privateers. Most sacrifice cargo space and armour for improved engines and reinforced interior bulkheads, allowing them to flee anything they cannot fight. // Stats: Speed 10, Manoeuvrability 23, Detection 12, Hull Integrity 32, Armour 14, Turret Rating 1, Space 35, SP 30 // Weapon Capacity: Dorsal 1, Prow 1 // Dimensions: 1.5 km long, 0.25 km abeam approx. // Mass: 5 megatonnes approx. // Crew: 22000 crew, approx. // Accel: 5.6 gravities max acceleration'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Hazeroth-class privateer [RAIDERS]'
type: 'shipTrait'
---
data:
    description: 'The Havoc class is a heavy raider whose origins date back to before the reconquest of the Calixis Sector. A typical Havoc has fast engines, sizeable cargo space, and a battery strength to rival many frigates. However, their armour is relatively weak, meaning that these ''glass cannons'' have a hard time going toe-to-toe with a comparable naval vessel. // Stats: Speed 9, Manoeuvrability 25, Detection 10, Hull Integrity 30, Armour 16, Turret Rating 1, Space 40, SP 35 // Weapon Capacity: Dorsal 1, Prow 1 // Dimensions: 1.6 km long, 0.4 km abeam approx. // Mass: 6 megatonnes approx. // Crew: 24000 crew, approx. // Accel: 5 gravities max sustainable acceleration // ## FRIGATES // Frigates are fast, small, but powerful craft, used in any number of roles.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Havoc-class merchant raider [RAIDERS]'
type: 'shipTrait'
---
data:
    description: 'The Sword frigates have been a mainstay escort vessel for Battlefleet Calixis ever since its founding. Every system aboard one of these frigates has been tried and tested in innumerable engagements. Its laser-based weapons and turrets are accurate and hard-hitting, its plasma drives are rugged and reliable in extreme conditions. Few task forces do not include at least a pair of Swords to guard the flanks of larger vessels or pursue smaller, faster raiders. More than a few Rogue Traders have noticed the stellar performance of these vessels and obtained one. With a few minor conversions to increase holds, Swords suit their needs quite well. // Stats: Speed 8, Manoeuvrability 20, Detection 15, Hull Integrity 35, Armour 18, Turret Rating 2, Space 40, SP 40 // Weapon Capacity: Dorsal 2 // Dimensions: 1.6 km long, 0.3 km abeam at fins approx. // Mass: 6 megatonnes approx. // Crew: 26,000 crew, approx. // Accel: 4.5 gravities max sustainable acceleration'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Sword-class frigate [FRIGATES]'
type: 'shipTrait'
---
data:
    description: 'The Tempest is a specialised frigate produced in the Calixis and surrounding sectors. It trades long ranged firepower for heavy, short-ranged broadsides designed to devastate enemies at ''knife-fight'' distances. To get to those distances, Tempests have triple-armoured prows and boosted drives, and often carry assault boats and large complements of ratings for boarding actions. These larger quarters and hanger bays have been found very useful for other, more commercial purposes as well. // Stats: Speed 8, Manoeuvrability 18, Detection 12, Hull Integrity 36, Armour 19, Turret Rating 1, Space 42, SP 40 // Weapon Capacity: Dorsal 2 // Dimensions: 1.5 km long, 0.4 km abeam at fins approx. // Mass: 6.1 megatonnes approx. // Crew: 30500 crew, approx. // Accel: 4.7 gravities max sustainable acceleration // VIII: STARSHIPS // # LIGHT CRUISERS // They are the eyes and ears of the fleet, or scouts in the deepest void.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Tempest-class strike frigate [FRIGATES]'
type: 'shipTrait'
---
data:
    description: 'Light, scouting cruisers are the eyes and ears of Imperial fleets. They carry enough fuel and supplies for patrols that last months or even years, and enough firepower to dispatch any smaller vessels foolish enough to close with them. The Dauntless is popular because it combines the manoeuvrability of a frigate with a daunting forward lance armament. // Stats: Speed 7, Manoeuvrability 15, Detection 20, Hull Integrity 60, Armour 19, Turret Rating 1, Space 60, SP 55 // Weapon Capacity: Prow 1, Port 1, Starboard 1 // Dimensions: 4.5 km long, 0.5 km abeam at fins approx. // Mass: 20 megatonnes approx. // Crew: 65000 crew, approx. // Accel: 4.3 gravities max sustainable acceleration // ## CRUISERS // These warships are the backbone of any fleet.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Dauntless-class light cruiser [LIGHT CRUISERS]'
type: 'shipTrait'
