data:
    description: 'The Lunar class cruiser makes up the backbone of Battlefleet Calixis. Its (relatively) uncomplicated design dates back to the dawn of the Imperium, and it can be constructed at worlds normally unable to build a ship of the line. Its variety of weapons batteries, lances, and torpedoes make it both a versatile combatant and dangerous foe. Most Rogue Traders remove the torpedo tubes to add more cargo space instead. // Stats: Speed 5, Manoeuvrability 10, Detection 10, Hull Integrity 70, Armour 20, Turret Rating 2, Space 75, SP 60 // Weapon Capacity: Prow 1, Port 2, Starboard 2 // Dimensions: 5 km long, 0.8 km abeam at fins approx. // Mass: 28 megatonnes approx. // Crew: 95000 crew, approx. // Accel: 2.5 gravities max sustainable acceleration // VIII: STARSHIPS // # COMPLICATIONS // All voidships have a story. Many are thousands of years old, and some were laid down while the Emperor led humanity on the Great Crusade. In that time they have watched the millennia of history come and go, seen the tides of war ebb and flow, experienced hundreds of captains, thousands of crew. // Due to this, a ship is more than a collection of tech-systems and armour plating. Any veteran voidsman knows a ship has its quirks and vagaries. Some vessels leap eagerly at the first hint of battle, their drives burning hot and their auger arrays probing eagerly. Others falter at danger, their systems shorting and sputtering until the vessel turns tail and flees. Some ships are solid and dependable, their systems lasting long beyond their date of operations. Others play tricks on their crew, phantom returns ghosting the auspex displays and strange sounds whisper on the internal vox. A good voidsman knows the personality of his ship, and treats it like another member of the crew. // In game, these are represented by the ship''s Complications. Complications have benefits and detriments that make a ship unique. There are two different types of Complications. Past Histories offer details about the ship''s construction or salvage, and the issues that may arise from its past. Machine Spirit Oddities describe the strange personality quirks the ship''s machine spirit has picked up over the millennia. While not "alive" or even self-aware, anyone who has been aboard a starship will swear that they have desires and fears, and perform some tasks more willingly than others. // Before creating a ship, the ship''s captain should roll once on each chart to determine which Complications his ship suffers from, and note each down on his ship''s sheet. // ## TABLE 8-1: MACHINE SPIRIT ODDITIES // ### Roll Result // 1. **A Nose for Trouble**: Something about this ship quivers at the thought of battle, always probing the cosmos for a new victim. Add +5 to the ship''s Detection, and reduce this ship''s Armour by 1, due to its many battles. Occasionally, the crew may find themselves in fights they might have preferred to avoid. // 2. **Blasphemous Tendencies**: Some unidentifiable aspect of this vessel''s spirit resonates sympathetically with the Immaterium. Captains find this ship swims through the warp more easily, as if it was more at home there... All Navigation Tests made to pilot this vessel through the warp gain a +15 bonus. However, while aboard the ship, all crew suffer –5 to Willpower based Tests. // 3. **Martial Hubris**: The ship has a glorious legacy of warfare and triumphant combats. It is always eager to fight, and unwilling to back down. The ship gains +5 to all Ballistic Skill Tests to fire its weapons, but suffers –15 on any Pilot (Space Craft) Tests made to escape combat. // 4. **Rebellious**: This vessel does not suffer authority willingly. At times is seems to take pleasure in interfering with the plans of its masters. During no more than one space combat per game session, the GM should randomly select one of the ship''s Components that becomes unpowered until repaired. However, whenever the ship suffers a critical hit (for any reason) roll 1d10. On a 8 or higher, the critical effect is ignored. // 5. **Stoic**: The vessel behaves like a beast of burden, plodding but reliable. Due to its somewhat plodding behaviour, whenever the crew would gain Profit Factor from an Endeavour, reduce the amount gained by 1. However, whenever one of the ship''s Component''s becomes damaged or unpowered, roll 1d10. On a 7 or higher, the ship shrugs off the damage and it is ignored. // 6. **Skittish**: The ship fears battle, bucking against its masters when entering the fray. When in combat, reduce the ship''s Speed by 1. However, when not in danger, it runs eagerly and fast. Reduce the travel time for any long distance (between stars) voyage by 1d5 weeks, to a minimum of 1. // 7. **Wrothful**: The ship''s spirit constantly smoulders with anger. In battle, it explodes into a berserker fury, straining and exhausting its systems. During combat, the ship gains +1 Speed and + 7 Manoeuvrability. Out of combat, the ship suffers –1 Speed and –5 to Manoeuvrability and Detection. // 8. **Resolute**: There is little in the universe that can stagger this vessel. No matter the foe, it will advance slowly but surely to meet it. The ship suffers –1 Speed, but gains +3 Hull Points and grants a +10 bonus to all Repair Tests. // 9. **Adventurous**: The vessel is eager to seek new horizons, to turn its bow from civilisation and delve into the darkness of the unknown. When participating in an Endeavour the ship gains +10 Detection, when not participating in an Endeavour it suffers –10 Detection. // 10. **Ancient and Wise**: This ship is of a bygone age, having survived many millennia of voyages and adventures. It''s hull has weakened over the centuries, but it anticipates the needs of its crew, and will move as one with a competent master. The ship suffers –4 Hull Integrity but gains a +10 bonus to any Manoeuvre Actions it performs (including out of combat and ramming). // VIII: STARSHIPS // TABLE 8-2: PAST HISTORIES // Roll Result // 1. **Reality of Mars**: Somehow, this vessel has been outfitted with ancient archaeo-tech systems from mankind''s forgotten past. When constructing this vessel, players must select 1 Archeotech Component of their choice. However, any Tech-Use Tests to repair the ship suffer a -20, due to the highly complex nature of the machinery. Additionally, the tech priests of Mars regard the vessel as holy, or at least having holy components. Some may petition to visit the vessel, others may want it for themselves. // 2. **Haunted**: Some nameless horror haunts this vessel''s past, leaving voidsmen to whisper stories of ghosts wandering through the corridors and cabins. Reduce Morale permanently by 10. However, strange premonitions flicker on the auger arrays, granting a +6 to the ship''s Detection. Additionally, all non-crewmembers suffer -5 to Command Tests involving boarding actions or hit and run actions against the haunted vessel. The presence of these spirits may cause many other issues, depending on their origins and how they came to haunt the vessel (something the GM should determine). // 3. **Emissary of the Imperator**: The vessel is a veritable monument to the power and grandeur of the God-Emperor''s might. Awe-inspiring and terrible, it lacks subtlety. All Intimidate Tests made by characters from this vessel gain +15, while all other social Skill Tests suffer a -5. These bonuses and penalties only apply if the character is known to be from the vessel. In addition, few will be able to see beyond the symbolism of the vessel—xenos see a threat, faithful Imperial citizens see a symbol of civilisation (or possibly chastisement), and heretics and rebels see a hated foe. Their reactions will be coloured accordingly. // 4. **Wolf in Sheep''s Clothing**: Beneath this vessel''s unassuming exterior is a dangerous spacefaring predator. The captain selects three Components. When scanned or subjected to anything but a thorough internal inspection, these components will either not register on the scans, or appear to be a different Component of the same type. Thus, the ship might hide additional armour plating, or a small macrobattery may be much more powerful than it appears. However, the ship suffers -2 Power to maintain the systems creating the illusion. The ship may also have concealed smuggling compartments, unseen passageways, hidden cogitation-override programming, or other secrets. // 5. **Turbulent Past**: Over the years this ship has been used to perform deeds dastardly to some and heroic to others. The GM selects a social group (pirates, heretics, the Imperial Navy, the Inquisition, or inhabitants of an important locale like Footfall). All ship''s crew suffer a -20 to social Skill Tests when interacting with that group. The GM then selects a second group naturally opposed to the first. All ship''s crew gain +20 to social Skills when interacting with that group. The additional problems that could arise from being hated by a particular group of people are limitless. // 6. **Death Cult**: Amongst the low-decks indentured crew, strange perversions of the Imperial Creed have arisen, glorifying death to celebrate the Emperor. Reduce Crew Population permanently by 8. However, reduce all Morale loss from any source by 2, due to the crew''s unwavering faith. Additionally, ship officers and members of the Ministorum will have to deal warily with the cult and its leaders. Death cults do produce skilled assassins... // 7. **Wrested from a Space Hulk**: The ship has been recovered from a space hulk - a mass of wrecked ships that drifts intermittently through the warp and realspace. The ship is very old (and thus of high quality), but those who know of its origins whisper that it is cursed. The ship gains +1 Armour, +1 Speed, and +3 Manoeuvrability. However, every time the crew suffers a Misfortune, the GM rolls twice and chooses the worse of the two. The curse can have many other effects as well, many ill, but a truly skilled Rogue Trader can turn any situation to profit... // 8. **Temperamental Warp Engine**: The ship suffers a flutter in its Warp Engines, an inconsistency that no amount of maintenance or supplication can eliminate. Whenever the ship travels through the immaterium, the GM should roll 1d10. On a 6 or lower, the journey takes an additional 1d5 weeks, on a 7 or higher, the travel time is reduced 1d5 weeks instead (potentially causing the ship to arrive before it left!). However, once in a great while, the ship will leave the warp to unexpectedly find itself someplace other than its intended destination. (This is at the GM''s discretion, but should not happen on a regular basis.) // 9. **Finances in Arrears**: The ship was purchased with borrowed funds. The money could have come from a criminal organisation, influential noble, or even a member of the Inquisition—but no matter the source, the debt must be repaid. Whenever the crew attempts to complete an Endeavour''s Objective, they must accumulate an additional 50 Acheivement Points to accomplish the Objective. However, the ship''s financier supports his investment by providing aid and information. All crew can count their financier as a reliable contact. Additionally, their creditor may require the crew to perform specific missions that they are in no position to refuse. // 10. **Xenophilous**: Through dealings with some xenos race, this vessel has been outfitted with examples of their blasphemous technology. When constructing this vessel, players must select 1 Xenotech Component of their choice. However, any Tech-Use Tests to repair the ship suffer a -30, due to the strange and blasphemous nature of the machinery. Should the character attempting the repairs have Forbidden Lore (Xenos), the penalty is only -10. Also, the forces of the Ordo Xenos have an interest in the vessel and who controls it. // VIII: STARSHIPS // # THE SHIP AS A CHARACTER // Complications are designed to personalize a starship, as well as make it something more than just a collection of statistics on a sheet of paper. A good captain thinks of his ship as something alive, and will love and hate it, cajole, threaten, and praise it in turn, just as he might any one of his ''flesh and blood'' companions. // If the GM wishes the player''s starship to have a specific ''personality,'' he should feel free to select from the Complications charts, rather than having his players roll. Additionally, the Past Histories include suggestions for plot hooks and and situations the players may find themselves in due to what has happened to their starship before they came into possession of it. // As far as the ship''s ''personality,'' the Machine Spirit Oddities should be treated as broad guidelines. GMs shouldn''t feel limited to the benefits and drawbacks listed in the charts, and are free to come up with additional complications that fit the ship''s character. Perhaps a vessel that has A Nose for Trouble occasionally scans nearby vessels as if searching for weaknesses (even if they are friendly), or a ship that is Ancient and Wise flares its retros when on a collision course with an asteroid, warning the helmsman to danger he did not notice. Of course, the ship is not sentient, and will not strike up conversations with players or send them messages telling them what to do. But there should be some spark in its hull, a bit of something beyond a mere machine... // # ESSENTIAL COMPONENTS // Essential Components are required for a starship to function. A ship must have one (no more) Component from each of the following categories, lest the ship lose some vital function. Without a life sustainer, for instance, the vessel is nothing more than a cold and empty tomb, while a ship would be blind and deaf without an auger array. // ## PLASMA DRIVES // A plasma drive does more than move a ship. It also provides power to all of a ship''s other systems—the vessel''s fiery heart.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Lunar-class cruiser [CRUISERS]'
type: 'shipTrait'
---
data:
    description: 'The Loki class is actually a "catch-all" class of several different types of transports that have been modified as Q-ships. Although it is the Navy''s sacred duty to protect Imperial commerce, there are too many trade lanes to defend, and too few warships to do so. In addition, many pirate wolfpacks will stay away from heavily defended convoys, waiting for weaker prey.
Q-ships offer the Imperium a way to turn the predators into the prey. Disguised as helpless merchantmen, they actually pack powerful macrobatteries and even lances. Their favoured tactic is to heave to at the first sight of a pirate, pretending to surrender without a fight. When the raider is close enough, they run out their guns and give them massed broadsides at point-blank range. Although this can often defeat their opponents in a single crushing broadside, most Loki-class ships are still as slow and unwieldy as other merchantmen—not designed for sustained combat. // Stats: Speed 4, Manoeuvrability -5, Detection 10, Hull Integrity 40, Armour 13, Turret Rating 1, Space 45, SP 21 // Weapon Capacity: Dorsal 1, Prow 1 // Dimensions: 2 km long, .4 km abeam approx // Mass: 8 megatons // Crew: 18000 crew, approx. // Accel: 3 gravities max. sustainable acceleration // Cargo Hauler: This vessel was designed for transporting goods, and no amount of retrofitting can fully change this. This hull comes pre-equipped with one Main Cargo Hold Component (see ROGUE TRADER page 203). The hull''s Space has already been reduced to account for this, however, when the ship is constructed it must be able to provide two Power to this Component. // Hidden Predator: This ship automatically gains the Wolf in Sheep''s Clothing Past History (players using this ship do not roll for Past Histories.) // ## ORION-CLASS STAR CLIPPER // Dimensions: 3 km long, .4 km abeam at first approx // Mass: 8 megatons // Crew: 14000 crew, approx. // Accel: 5.4 gravities max. sustainable acceleration // The Orions are something of a rarity amongst the Imperium''s starships—a fast transport or star-clipper. Though they are designed for cargo, their lean forms, raked bows, and powerful drive tubes are less optimised for cargo hauling and more designed for travelling at speed. // Orion-class starships are constructed to transport smaller, high-value cargoes that must reach their destination quickly or through hostile territory. Rather than rely on armed escorts, Orions travel alone. They trust in their speed to see them clear of most predators, and count on their weapons to send off those quick enough to keep up. Often they are successful, but Orions do have one major drawback. The redundant internal bulkheads and exterior armour that would normally be added to human ships has been forgone in order to increase speed and cargo capacity. As a result, a few stiff hits can easily cripple an Orion. // Speed: 10 // Manoeuvrability: +25 // Detection: +10 // Hull Integrity: 35 // Armour: 12 // Turret Rating: 1 // Space: 40 // SP: 25 // Weapon Capacity: 1 Dorsal, 1 Keel // Cargo Hauler: This vessel was designed for transporting goods, and no amount of retrofitting can fully change this. This hull comes pre-equipped with one Main Cargo Hold Component (see ROGUE TRADER page 203). The hull''s Space has already been reduced to account for this, however, when the ship is constructed it must be able to provide two Power to this Component. // Fast Ship: Due to the precisely calibrated nature of this ship, it cannot be equipped with Components that increase its Armour. // IV: STARSHIPS EXPANDED // 13 // # RAIDERS // These fast, light vessels are often used for piracy. However, navies often use packs of raiders (often referred to as "destroyers") for hit and fade attacks on opposing fleets.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Loki-class Q-ship [TRANSPORTS]'
type: 'shipTrait'
---
data:
    description: 'The Cobra-class destroyer is one of the smallest warp-capable ships in the Imperial fleet, and also one of the fastest. It fills two roles in the Imperial Navy. The first, and most common, is a torpedo vessel. Armed with massive anti-warship torpedoes, squadrons of Cobras are agile enough to dart into fleet engagements, launch spreads of ordinance, then flee—hopefully before their larger adversaries can hit them with a massed broadside.
Although no ship could be said to be mass-produced in the Imperium, the Cobra is one of the simplest to build, with a well-equipped shipyard able to construct one in only several years. This makes them popular with Rogue Traders who are—relatively—destitute. A Cobra can be far easier to procure than a cruiser, and still possesses a warp drive. Many Rogue Traders who do so retrofit a Cobra to remove the massive torpedo bays, however, to create space for cargo or other weapons. // Stats: Speed 10, Manoeuvrability 30, Detection 10, Hull Integrity 30, Armour 15, Turret Rating 1, Space 35, SP 30 // Weapon Capacity: Dorsal 1, Prow 1 // Dimensions: 1.5 km long, .3 km abeam at fins // Mass: 5.7 megatons // Crew: 15000 crew; approx. // Accel: 7.6 gravities max. sustainable acceleration // # FFIGATES // The frigate''s chief benefit (to navies and Rogue Traders alike) is its versatility.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Cobra-class Destroyer [RAIDERS]'
type: 'shipTrait'
---
data:
    description: 'The Firestorm is a relatively recent innovation in Battlefleet Obscuras, an attempt to merge the manoeuvrability of escort class ships with the ship-killing power of a lance weapon. The Firestorm is essentially a redesigned Sword, with many of the weapon batteries removed to make space for a prow-mounted lance that runs most of the length of the ship. In fleet engagements, Firestorms often hunt other escorts, their lances letting them out-range and outgun most frigates and raiders.
Firestorms are not commonly used by Rogue Traders, as the lance takes up room that could be used for cargo or supplies. However, more militant individuals have been known to utilise them, as lance-armed frigates are relatively uncommon. // Stats: Speed 7, Manoeuvrability 20, Detection 15, Hull Integrity 38, Armour 18, Turret Rating 1, Space 40, SP 41 // Weapon Capacity: Dorsal 1, Prow 1 // Dimensions: 1.8 km long, .3 km abeam at fins // Mass: 6 megatonnes approx // Crew: 25000 crew; approx. // Accel: 4.4 gravities max. sustainable // # LIGHT CRUISERS // Though not as powerful as full cruisers, light cruisers are often more manoeuvrable, or equipped for long range reconnaissance.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Firestorm class Frigate [RAIDERS]'
type: 'shipTrait'
---
data:
    description: 'The Secutor class vessels are a modification of the Lathe class unique to the Calixis Sector. The first Secutor monitor-cruiser was adapted from the existing design when the forge world learned that the existing light cruiser was insufficiently armed for heavy starship combat. Rather than spend the considerable resources to construct true cruisers, they developed the Secutor.
Secutors are significantly better armed than their cousins, and have higher defensive capabilities as well. In exchange they are less manoeuvrable, and with so much of their frame devoted to weapons and defences, they are useful only for war. Of course, in that field they excel.
**Outfitted for war:** The Secutor is designed solely for combat, and in anticipation of this her masters have equipped her with the heavy power couplings and projection arrays required to maintain multiple void shields. The Secutor can use ''cruiser only'' Void Shield Components. // Stats: Speed 5, Manoeuvrability 12, Detection 15, Hull Integrity 65, Armour 20, Turret Rating 2, Space 58, SP 58 // Weapon Capacity: Dorsal 1, Prow 1, Port 1, Starboard 1 // Dimensions: 4.3 km long, .5 km abeam at fins // Mass: 24 megatonnes // Crew: 50000 crew; approx. // Accel: 3.9 gravities max. sustainable acceleration'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Secutor-class monitor-cruiser [LIGHT CRUISERS]'
type: 'shipTrait'
---
data:
    description: '35,000 crew; 25,000 servitors
6 gravities max sustainable acceleration
The Adeptus Mechanicus, being an entity that exists more alongside than as a part of the Imperium, maintains its own armies and warships. These fight alongside the Imperial Guard and Navy in times of war, but as many Magos are quick to point out, they do so as allies, not vassals.
The primary role of the Mechanicus fleets are exploration, not combat, however. Explorator fleets traverse the galaxy, looking for lost archeotech and ancient relics of the Dark Age of Technology. The Lathe class monitor-cruiser is a perfect example of the ships the Explorators utilise in their fleets.
The design for the Lathe-class was uncovered in the deep data-vaults of Het in the Lathe system during the Angevin Crusade, and in the centuries since the crusade ended, the Lathe shipyards have diligently constructed multiple ships.
The design differs from many light cruisers, with an emphasis on long-ranged detection and endurance rather than speed and manoeuvrability. Outfitted correctly, a Lathe class can operate without refit and resupply for decades. // Stats: Speed 5, Manoeuvrability 12, Detection 15, Hull Integrity 63, Armour 20, Turret Rating 1, Space 60, SP 55 // Weapon Capacity: Dorsal 1, Prow 1, Port 1, Starboard 1 // Dimensions: 4.2 km long, .5 km abeam at fins // Mass: 20.9 megatons // ## CRUISERS // Cruisers are warships through and through, though the richest Rogue Traders possess modified versions.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Lathe-class monitor-cruiser [LIGHT CRUISERS]'
type: 'shipTrait'
---
data:
    description: 'The Tyrant''s design was designed at the end of the 38th millennium around the principles of superfired plasma weaponry. In the attempt to give the Imperial Navy a warship with a powerful, long-range macrobattery broadside, the Tyrant was developed.
Early versions mixed short and long-ranged plasma macroweapons, in an effort to reduce total power draw on the ship''s reactors. However, the firepower at long range was unspectacular enough that the Navy began retrofitting Tyrants with longer ranged weaponry recovered from space hulks or disabled renegade warships, in order to boost range without boosting power draw.
The cruiser is popular amongst Rogue Traders who can afford it, although they often replace the superfired plasma weapons with less space and power intensive macrobatteries. // Stats: Speed 5, Manoeuvrability 10, Detection 10, Hull Integrity 70, Armour 20, Turret Rating 2, Space 77, SP 61 // Weapon Capacity: Prow 1, Port 2, Starboard 2 // Dimensions: 5 km long, .8 km abeam at fins // Mass: 27.2 megatons // Crew: 90000 crew; approx. // Accel: 2.4 gravities max. sustainable acceleration // ## SHIP BACKGROUND PACKAGES // "The people made the ornate building their palace, and shunned the catacombs beneath, never realizing both ''palace'' and ''catacombs'' were but aspects of the Wrath of Terra, buried on the planet three millenia before." // —A History of the Latter Calixian Crusades // Every voidship has a history. Every voidship also has a personality, quirks of machine-spirit that make each ship unique. However, this in no way makes all ships'' spirits equal. Where some are bold, others are timid, and while some are diligent and dutiful, others are flighty and disloyal. This can be affected by a variety of factors, from the yards where the starship was constructed, to the worlds it has visited, to the battles it has fought. // Some captains study these factors, trying to determine what factors will craft a ship that will best suit their needs. They then may spend vast sums of time and resources to find a ship that they think fits these factors, in the hopes that it will indeed serve them in the way they desire. Sometimes, they''re even right. // Ship background packages provide a way for Explorers to select their ship background, rather than rolling for it randomly. Instead of rolling on the Complications Tables, the Explorers can exchange some of their Ship Points to select a background package for their ship. // ## THULIAN EXPLORATOR VESSEL // The task of the Explorator branch of the Adeptus Mechanicus is to search throughout the galaxy for relics of humanity''s Dark Age of Technology. To accomplish this, the Explorators are granted vessels specially crafted by their brethren, vessels equipped with the most powerful secrets and arcane technologies the Mechanicus possesses. // Although the Mechanicus may use a myriad variety of basic hull designs, the end result is always designed and suited primarily for exploration. The Mechanicus prefers to use frigates and light cruisers, tougher vessels with long ''legs'' that can delve into the darkest corners of the void—and handle whatever they find there. // The famous Disciples of Magos Thule are no different than their fellow Explorators. Centuries ago, their mentor explored and catalogued the Calixis Sector. Following his example, his disciples were at the forefront of the push to chart routes through the warp storms closing through the Koronus Expanse. Many explorators were lost, but when the Maw was finally charted successfully, the Disciples were there, delving deep into the unknown in their quest for knowledge. // Now, centuries after their heyday, the Disciples of Thule are a smaller and more insular sub- // IV: STARSHIPS EXPANDED // 980 // sect of the Mechanicus cult. However, their vessels can still be found throughout the Koronus Expanse, waiting to be salvaged and repurposed. // Cost: 1 Ship Point. Frigates, light cruisers, and cruisers may take this. // Explorator Augury: The vessels the Mechanicus supplies to its Explorators are invariably equipped with boosted auspexes and augur arrays to better aid them in their mission. Add +10 to the ship''s Detection, and when working towards an Exploration objective, the players earn an additional 50 Achievement Points. // Wealth of Ancient Tech-vaults: The Mechanicus has access to some of the Imperium''s oldest and most advanced technologies. This ship has access to—and must be equipped with—one Archaeotech Component. // Rerouted Power: Explorator vessels do require vast amounts of power to be rerouted to their boosted augur systems. Reduce the ship''s Speed value by 1 and its Manoeuvrability by -5. // ## REAVER OF THE UNBEHOLDEN REACHES // There are numerous pirates and rogues preying on whomever is unfortunate enough to cross their paths in the Expanse. However, there are few worse than the reavers found in the Unbeholden Reaches. Within the Reaches is a realm of space full of sputtering stars, blasted planets, and asteroid belts full of the shards of shattered worlds. The center of this space is the feared Undred-Undred Teef, the home of the infamous Ork Freebooterz. Needless to say, the danger of living in close proximity to such creatures means that those who do so are the most ruthless and most savage of pirates—dangerous enough that even an Ork will treat them carefully. // Certain reaver clans have been pirates for generations, spending their entire lives aboard their ships. The voidborn life is all they live, and all they know. Thus, their ships are more than mere vessels, more than even their homes. These reaver clans treat their ships like unto gods, garnering the lavish care and attention to them a deity would deserve. // These reavers launch raids out of the Unbeholden Reaches from time to time, striking deep into Winterscale''s Realm and other regions of the Expanse. Sometimes these attacks are successful, sometimes they are defeated and destroyed. And once in a very great while, their ships are boarded and taken. // Cost: 2 Ship Points. Transports, raiders, and frigates may take this. // Self-reliant: Ships of the reaver clans seldom have dockyards they can flee to when they are damaged. Therefore, they must fend for themselves, and the vessels are equipped to do just that. When this vessel affects long-term repairs, they may repair 1d10+5 points of Hull Integrity instead of 1d5. // Strike and Fade: The reaver clans have long practised the art of stealth attacks, a must for a successful buccaneer. Their ships have been modified for the task, with masked drive tubes and baffles to diffuse their signature. All Silent Running manoeuvres the ship performs gain a +10 bonus. // Pirate Vessel: Ships of the reaver clans are known—and feared—throughout the Expanse. Anyone from the vessel suffers a -10 to all Social Interaction Tests, provided the targets know what vessel they hail from. // ## VETERAN OF THE ANGEVIN CRUSADE // The Crusade to conquer the Calixis Sector took hundreds of years, and thousands of vessels. Ships of the line, cruisers, and escorts of all stripes formed the ranks of the crusade fleet. In addition, the fleet was supported by an even vaster fleet of transports, each a veteran of the Crusade as well. // As the Crusade drew to a close, the vessels accumulated for its prosecution dispersed. Many of the Naval warships returned to their original battlefleets, or formed the nucleus of the new Battlefleet Calixis. The Rogue Traders left to explore the new frontiers. The transports were divided into trade fleets or auctioned to chartist captains, the beginnings of the trade-lanes that would establish the sector. And so, the great Crusade fleet broke apart, scattered to all corners of the Sector and beyond. // A millennia later, vessels that served in the Crusade are scarce. Many have scattered across the Sector or Segmentum. Still more ships have been lost to the Imperium''s continued wars, or the inevitable perils of interstellar travel. The great warp storms abutting the Halo Margins, the Hazeroth Abyss, the Margin Crusade, all take their toll. As a result, few veteran vessels remain intact. // Such ships are prized for their rich history, nonetheless. A ship of the Angevin Crusade is infused with martial vigour, and displays an almost living desire to continue persecuting Drusus''s war beyond the Calixis Sector, and into the Expanse beyond. // Cost: 3 Ship Points. All ships may take this. // Emperor''s Crusader: The ships of the Angevin Crusade are built for—and tempered by—centuries of warfare. All Ballistic Skill Tests made to fire the ship''s weapons gain a +10 bonus. // Righteous Arrogance: A Crusade ship is not known for such low tactics as sneaking and skulduggery. This ship makes all Silent Running attempts at a -40 penalty. // Glorious Deeds: One of the traditions said to have been established by Angevin and carried on by his lieutenants is the inscribing of a vessel''s deeds on the outer hall, shielded by powerful localised stasis fields to preserve them against the ravages of time and war. All crew from this ship gain a +10 to Charm and Intimidate Tests, provided their targets know which ship they come from (and are in a position to understand the inscribing—many xenos cultures may not understand or care about the glorious deeds of a human vessel). // ## VESSEL OF THE FLEET // Many of the vessels under a Rogue Trader''s command could be considered warships, but few can truly compare to a true military vessel. Any Naval officer in the sector feels a ship is not a "warship" until it has spent a decade amongst the ranks of the Battlefleet. A proper Battlefleet warship is measured by far more than the strength of its guns. Though accuracy is appreciated in the Imperial Navy, obedience, discipline, and honour are watchwords prized above all else. The Imperial Navy perseveres and triumphs over its enemies through its adherence to duty and tradition, and this ethos is said to be absorbed by the very fibre of the ships they serve aboard. // It is extremely difficult for a Rogue Trader to obtain a warship from the Fleet. Should a Rogue Trader be foolish enough steal from the Imperial Navy, he soon finds that same adherence to honour and duty creates a relentless and // implacable foe. However, it is not unknown for a Rogue Trader dynasty to be gifted a warship for exceptional duties rendered to the Emperor''s Holy Fleet. Even if those who performed for the deeds are long dead, the Navy treats the captain of the warship as if they themselves were responsible. // Cost: Variable. All ships except transports may take this. // Steadfast Ally or Implacable Foe: When this background package is selected, the players can pay 1 Ship Point or 2 Ship Points. If they pay 1 Ship Point, all crew-members gain Enemy (Imperial Navy). If they pay 2 Ship Points, all crew-members gain Good Reputation (Imperial Navy). // His Word Obeyed: Any crew-member who makes Command Tests aboard this ship gains a +10 bonus. // Duty Unto Death: When this ship is crippled, the ship''s Captain may make a Challenging (+0) Command Test. If the Test is successful, the ship does not suffer the effects of being crippled during its subsequent turn. // ## PLANET-BOUND FOR MILLENNIA // It is common for the Imperium''s starships to be extremely ancient. In fact, since much of the technology used to create the ships of yesteryear has since been lost, individuals and organisations often go to great length to recover and restore ancient void ships to use. All-too often, these ancient vessels are simply better in almost every way than their modern counterparts. Therefore, those in the Imperium of Mankind often go to extraordinary lengths to recover them. // Space hulks are a common source for ancient vessels, and salvage operations can make space hulks as profitable as they are dangerous. Other ancient starships may be recovered as derelicts in orbit around a forgotten planet, or some may even have been in continuous use for the ten millennia of the Imperium. Far less common, though by no means unheard of, // are starships that have been buried on a planet''s surface. // The starship may have ended up on the planet in any number of ways. Most often, a starship suffers some catastrophic mechanical failure in orbit around a world. Unless it wants to suffer a fiery descent to the world below, it may be forced to attempt a more controlled descent. Making such a landing is extremely difficult. Imperial starships are not designed to enter an atmosphere, and it will take every bit of skill from the ship''s captain and tech-priest to ensure such a large vessel does not succumb to gravity''s embrace. A small few are able to reach the surface, however, and there they stay. Over the centuries, they often become covered with soil, plant life, and even forests, so that only small parts of the ship are visible. Sometimes they even become the nucleus of towns or cities—the population could even be the descendants of the ship''s original crew. // For most of these ships, the flight to the surface proves to be their last. Crippling gravity crushes their spines and vital systems, and they remain planet-bound forever. Some, however, remain largely intact, and sleep away the millennia beneath their earthy cocoon. Eventually, an enterprising captain may find one of these forgotten treasures, and with grav-lifts and bulk tenders, pry it from its prison to sail the stars once more. // Cost: 3 Ship Points. All ships may take this. // Gravity''s harsh embrace: Decrease Hull Integrity by 1d5-1 for frigates, transports and raiders, and 1d5 for light cruisers, cruisers, and larger vessels. // Lost relics of the past: This ship begins play with a Modified Drive (see page 206 of Rogue Trader) for no extra cost in Ship Points. This ship also gains access to one additional archeotech component of the players'' choice. // Dreams of distant worlds: Superstition claims a planet-bound ship maintains a particular affinity for planetary bodies, after having remained on one for so long. This ship gains +10 Manoeuvrability while within 5 VUs of a planet. // IV: STARSHIPS EXPANDED // 1933 // # ADDITIONAL COMPONENTS // The following is a list of starship Components designed to supplement the Component lists found on pages 199-208 of ROGUE TRADER. The following Components may be used to construct the Explorers''—or an NPC—starship as normal, following all the restrictions found in the core rules. // ## ESSENTIAL COMPONENTS // Although all Imperial starships require roughly the same set of Essential Components to function, millennia of shipbuilding has resulted in countless variants on broad themes. Each starship requires exactly one of each type of Essential Component, no more, no less. // ## PLASMA DRIVE // The plasma drive is the fiery beating heart of a starship, providing power to all systems as well as propelling it through the void.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Tyrant-class cruiser [CRUISERS]'
type: 'shipTrait'
---
data:
    description: 'Something about this ship quivers at the thought of battle, always probing the cosmos for a new victim. Add +5 to the ship''s Detection, and reduce this ship''s Armour by 1, due to its many battles. Occasionally, the crew may find themselves in fights they might have preferred to avoid.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 1'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: A Nose for Trouble'
type: 'shipTrait'
---
data:
    description: 'Some unidentifiable aspect of this vessel''s spirit resonates sympathetically with the Immaterium. Captains find this ship swims through the warp more easily, as if it was more at home there... All Navigation Tests made to pilot this vessel through the warp gain a +15 bonus. However, while aboard the ship, all crew suffer –5 to Willpower based Tests.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 2'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Blasphemous Tendencies'
type: 'shipTrait'
---
data:
    description: 'The ship has a glorious legacy of warfare and triumphant combats. It is always eager to fight, and unwilling to back down. The ship gains +5 to all Ballistic Skill Tests to fire its weapons, but suffers –15 on any Pilot (Space Craft) Tests made to escape combat.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 3'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Martial Hubris'
type: 'shipTrait'
---
data:
    description: 'This vessel does not suffer authority willingly. At times is seems to take pleasure in interfering with the plans of its masters. During no more than one space combat per game session, the GM should randomly select one of the ship''s Components that becomes unpowered until repaired. However, whenever the ship suffers a critical hit (for any reason) roll 1d10. On a 8 or higher, the critical effect is ignored.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 4'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Rebellious'
type: 'shipTrait'
---
data:
    description: 'The vessel behaves like a beast of burden, plodding but reliable. Due to its somewhat plodding behaviour, whenever the crew would gain Profit Factor from an Endeavour, reduce the amount gained by 1. However, whenever one of the ship''s Component''s becomes damaged or unpowered, roll 1d10. On a 7 or higher, the ship shrugs off the damage and it is ignored.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 5'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Stoic'
type: 'shipTrait'
---
data:
    description: 'The ship fears battle, bucking against its masters when entering the fray. When in combat, reduce the ship''s Speed by 1. However, when not in danger, it runs eagerly and fast. Reduce the travel time for any long distance (between stars) voyage by 1d5 weeks, to a minimum of 1.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 6'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Skittish'
type: 'shipTrait'
---
data:
    description: 'The ship''s spirit constantly smoulders with anger. In battle, it explodes into a berserker fury, straining and exhausting its systems. During combat, the ship gains +1 Speed and + 7 Manoeuvrability. Out of combat, the ship suffers –1 Speed and –5 to Manoeuvrability and Detection.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 7'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Wrothful'
type: 'shipTrait'
---
data:
    description: 'There is little in the universe that can stagger this vessel. No matter the foe, it will advance slowly but surely to meet it. The ship suffers –1 Speed, but gains +3 Hull Points and grants a +10 bonus to all Repair Tests.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 8'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Resolute'
type: 'shipTrait'
---
data:
    description: 'The vessel is eager to seek new horizons, to turn its bow from civilisation and delve into the darkness of the unknown. When participating in an Endeavour the ship gains +10 Detection, when not participating in an Endeavour it suffers –10 Detection.'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 9'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Adventurous'
type: 'shipTrait'
---
data:
    description: 'This ship is of a bygone age, having survived many millennia of voyages and adventures. It''s hull has weakened over the centuries, but it anticipates the needs of its crew, and will move as one with a competent master. The ship suffers –4 Hull Integrity but gains a +10 bonus to any Manoeuvre Actions it performs (including out of combat and ramming). VIII: STARSHIPS'
    source: 'Rogue Trader Core Rulebook - Machine Spirit Oddities, Roll 10'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine Spirit Oddities: Ancient and Wise'
type: 'shipTrait'
---
data:
    description: 'Somehow, this vessel has been outfitted with ancient archaeo-tech systems from mankind''s forgotten past. When constructing this vessel, players must select 1 Archeotech Component of their choice. However, any Tech-Use Tests to repair the ship suffer a -20, due to the highly complex nature of the machinery. Additionally, the tech priests of Mars regard the vessel as holy, or at least having holy components. Some may petition to visit the vessel, others may want it for themselves.'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 1'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Reality of Mars'
type: 'shipTrait'
---
data:
    description: 'Some nameless horror haunts this vessel''s past, leaving voidsmen to whisper stories of ghosts wandering through the corridors and cabins. Reduce Morale permanently by 10. However, strange premonitions flicker on the auger arrays, granting a +6 to the ship''s Detection. Additionally, all non-crewmembers suffer -5 to Command Tests involving boarding actions or hit and run actions against the haunted vessel. The presence of these spirits may cause many other issues, depending on their origins and how they came to haunt the vessel (something the GM should determine).'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 2'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Haunted'
type: 'shipTrait'
---
data:
    description: 'The vessel is a veritable monument to the power and grandeur of the God-Emperor''s might. Awe-inspiring and terrible, it lacks subtlety. All Intimidate Tests made by characters from this vessel gain +15, while all other social Skill Tests suffer a -5. These bonuses and penalties only apply if the character is known to be from the vessel. In addition, few will be able to see beyond the symbolism of the vessel—xenos see a threat, faithful Imperial citizens see a symbol of civilisation (or possibly chastisement), and heretics and rebels see a hated foe. Their reactions will be coloured accordingly.'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 3'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Emissary of the Imperator'
type: 'shipTrait'
---
data:
    description: 'Beneath this vessel''s unassuming exterior is a dangerous spacefaring predator. The captain selects three Components. When scanned or subjected to anything but a thorough internal inspection, these components will either not register on the scans, or appear to be a different Component of the same type. Thus, the ship might hide additional armour plating, or a small macrobattery may be much more powerful than it appears. However, the ship suffers -2 Power to maintain the systems creating the illusion. The ship may also have concealed smuggling compartments, unseen passageways, hidden cogitation-override programming, or other secrets.'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 4'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Wolf in Sheep''s Clothing'
type: 'shipTrait'
---
data:
    description: 'Over the years this ship has been used to perform deeds dastardly to some and heroic to others. The GM selects a social group (pirates, heretics, the Imperial Navy, the Inquisition, or inhabitants of an important locale like Footfall). All ship''s crew suffer a -20 to social Skill Tests when interacting with that group. The GM then selects a second group naturally opposed to the first. All ship''s crew gain +20 to social Skills when interacting with that group. The additional problems that could arise from being hated by a particular group of people are limitless.'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 5'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Turbulent Past'
type: 'shipTrait'
---
data:
    description: 'Amongst the low-decks indentured crew, strange perversions of the Imperial Creed have arisen, glorifying death to celebrate the Emperor. Reduce Crew Population permanently by 8. However, reduce all Morale loss from any source by 2, due to the crew''s unwavering faith. Additionally, ship officers and members of the Ministorum will have to deal warily with the cult and its leaders. Death cults do produce skilled assassins...'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 6'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Death Cult'
type: 'shipTrait'
---
data:
    description: 'The ship has been recovered from a space hulk - a mass of wrecked ships that drifts intermittently through the warp and realspace. The ship is very old (and thus of high quality), but those who know of its origins whisper that it is cursed. The ship gains +1 Armour, +1 Speed, and +3 Manoeuvrability. However, every time the crew suffers a Misfortune, the GM rolls twice and chooses the worse of the two. The curse can have many other effects as well, many ill, but a truly skilled Rogue Trader can turn any situation to profit...'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 7'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Wrested from a Space Hulk'
type: 'shipTrait'
---
data:
    description: 'The ship suffers a flutter in its Warp Engines, an inconsistency that no amount of maintenance or supplication can eliminate. Whenever the ship travels through the immaterium, the GM should roll 1d10. On a 6 or lower, the journey takes an additional 1d5 weeks, on a 7 or higher, the travel time is reduced 1d5 weeks instead (potentially causing the ship to arrive before it left!). However, once in a great while, the ship will leave the warp to unexpectedly find itself someplace other than its intended destination. (This is at the GM''s discretion, but should not happen on a regular basis.)'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 8'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Temperamental Warp Engine'
type: 'shipTrait'
---
data:
    description: 'The ship was purchased with borrowed funds. The money could have come from a criminal organisation, influential noble, or even a member of the Inquisition—but no matter the source, the debt must be repaid. Whenever the crew attempts to complete an Endeavour''s Objective, they must accumulate an additional 50 Acheivement Points to accomplish the Objective. However, the ship''s financier supports his investment by providing aid and information. All crew can count their financier as a reliable contact. Additionally, their creditor may require the crew to perform specific missions that they are in no position to refuse.'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 9'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Finances in Arrears'
type: 'shipTrait'
---
data:
    description: 'Through dealings with some xenos race, this vessel has been outfitted with examples of their blasphemous technology. When constructing this vessel, players must select 1 Xenotech Component of their choice. However, any Tech-Use Tests to repair the ship suffer a -30, due to the strange and blasphemous nature of the machinery. Should the character attempting the repairs have Forbidden Lore (Xenos), the penalty is only -10. Also, the forces of the Ordo Xenos have an interest in the vessel and who controls it. VIII: STARSHIPS'
    source: 'Rogue Trader Core Rulebook - Past Histories, Roll 10'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Past Histories: Xenophilous'
type: 'shipTrait'
