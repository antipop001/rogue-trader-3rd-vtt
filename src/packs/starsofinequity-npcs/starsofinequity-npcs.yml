- _id: n1v8Opre9W9j7aKy
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Bestial
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait is animalistic, tending to behave instinctively rather than rationally. No matter
      how high its Intelligence score is, it is still bestial. A creature with this Trait never needs to make a Survival Test
      whilst in its natural habitat. Unless starving or desperate, a bestial creature must make a Willpower Test when frightened,
      startled or injured. On a failed test, the creature flees.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 4QDC4Xo7LW7zaeQx
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Natural Armour (5)
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has a naturally tough hide or an exoskeleton, affording it some protection against attacks.
      This Trait always includes a numeric value to indicate how many Armour Points the creature gains to all locations.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: ZDgivgW333SsdhLN
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Natural Weapons
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has sharp claws, teeth, spines or some other natural weapon to attack its foes. It counts as
      being armed even when not wielding weapons. Its attacks deal 1d10 points of damage plus its Strength Bonus. The creature
      may make attacks with its Natural Weapons using its Weapon Skill, though it cannot parry with its natural weapons, nor
      can it be disarmed—unless, of course, you hack off its limbs! Natural weapons always count as Primitive.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 0kENsMFVhXDqdK6H
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Size (Enormous)
  ownership:
    default: 3
  sort: 0
  system:
    description: '**Trait Groups:** Miniscule, Puny, Scrawny, Hulking, Enormous, Massive Creatures come in one of seven different
      size categories, as shown on the following chart. Size affects movement and how easy or hard it is to strike that creature
      in combat. (When calculating a creatures movement, apply the size modifier first, and then other modifiers from other
      Traits or talents. Base movement can never be reduced below 1.) For the purposes of comparison, a human is an average-sized
      creature.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: cdjlj612X2qBxb1X
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Strength (x2)
  ownership:
    default: 3
  sort: 0
  system:
    description: One or more of the creature's Characteristics is unnatural. Each time this Trait is gained, select a Characteristic,
      and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait,
      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
      Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.
    source: Rogue Trader Core Rulebook
  type: trait
