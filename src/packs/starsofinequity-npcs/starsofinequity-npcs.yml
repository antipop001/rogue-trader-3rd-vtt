  name: Berserk Charge
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has learned to put the whole force of his momentum behind his weapon blows. When he charges into
      combat, few can stand before him. If he uses the Charge Action, he gains a +20 bonus to Weapon Skill instead of +10.
    cost: 0
