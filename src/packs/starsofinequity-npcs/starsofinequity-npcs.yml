effects: []
flags:
  rt:
    description: Outside of those individuals trained in the Imperium’s secret temples, few killers can match the skills and
      determination of a death cult assassin. Trained to use blades with unparalleled grace and efficiency, the blindly devoted
      cultists have made an art form out of murder. Within the Calixis Sector and the Expanse, the deadly assassins of the
      infamous Moritat are undoubtedly the most renowned, though several other dissolute death cults, such as the Red Chain,
      the Sons of Dispater, and the Faceless Covenant, also thrive in the region, and are willing to contract out their services.
    movement: 3/6/9/18
    rawGear: 1 hallucinogen grenade, 1 photon flash grenade, preysense goggles, grapnel, stummer, data-slate with encrypted
      picts and information on intended target.
    source: Stars of Inequity
img: ''
items:
- _id: Wi0G4XOxrOravBcQ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
  name: Ambidextrous
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'This Talent does not represent true ambidexterity so much as sufficient training with both hands to make the
      distinction moot. The Explorer can use either hand equally well for any task, and does not suffer the -20 penalty for
      actions using his off hand. Special: When combined with a Two-Weapon Wielder Talent, the penalty for making attacks
      with both weapons in the same Turn drops to -10.'
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: mXy1snWzx0GFXc8v
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/gr_10.PNG
  name: Assassin Strike
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's natural agility and graceful martial forms turn him into a dervish of death on the battlefield.
      After making a melee attack, a successful Acrobatics Test allows him to move at half rate as a Free Action. The Explorer's
      opponent does not receive a free attack resulting from this move. He may only take this additional move once per Round.
    cost: 0
    prerequisites: Agility 40, Acrobatics
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: FJ11KnjXxBpuAwJB
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_06_b.PNG
  name: Blademaster
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's mastery of bladed weapons and their martial disciplines has no peer. When attacking with any bladed
      weapon, including chain weapons, power axes, and power swords, he may re-roll one missed attack per Round.
    cost: 0
    prerequisites: Weapon Skill 30, Melee Weapon Training (any)
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: FSAzf7AxbllV3pfq
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/psykana/wind-grasp-magenta-1.jpg
  name: Catfall
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Gymnastic ability and natural balance enables the Explorer to fall far greater distances without harm than the
      common man. Whenever he falls, he may take an Agility Test as a Free Action. Success, and each additional Degree of
      Success, reduces the distance fallen by a number of metres equal to the character's Agility Bonus for the purposes of
      determining the Damage from the fall.
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: keWxSFJQ6pnerOts
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Crippling Strike
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can land blows precisely where they will inflict the most harm, cutting into seams or hammering
      at weak points. When the character's melee attack causes Critical Damage, add +4 Damage.
    cost: 0
    prerequisites: Weapon Skill 50
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: rQBJzD8eUCeVgbr3
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Dual Strike
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's skill with melee weapons can place two blows together to maximise damage. When armed with two
      melee weapons, he can attack with both simultaneously as a Full Action. Make a single Weapon Skill Test, and if successful,
      he hits the target with both weapons. As he is swinging both weapons as a single attack, the character may take an Aim
      Action before attacking to get a +10 or +20 bonus to the WS Test. He does not suffer from the normal -20 WS penalty
      for wielding two weapons. If he hits, the target's Armour gets applied as normal to both hits individually, but Toughness
      only counts once against the combined Damage rolls of both hits. A single successful Dodge or Parry Test from the target
      will avoid both blows.
    cost: 0
    prerequisites: Agility 40, Two-Weapon Wielder (Melee)
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: h6Y6fldhywbQLe10
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/spear/stave_04_b.png
  name: Exotic Weapon Training (Blood Blade)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has received Exotic Weapon Training in a single Exotic Weapon, and can use it without penalty. This
      Talent may be taken multiple times, choosing a different Exotic Weapon each time.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: oC8R6q5VDLvCtSDP
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fearless
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through hard experience with horrifying situations, fear no longer commands the Explorer's actions. He is immune
      to the effects of Fear and Pinning, but disengaging from combat or backing down from a fight requires a successful Willpower
      Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 81zm5NnejZLeMkTC
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hard Target
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Light on his feet, the Explorer dodges and weaves as he moves, skills learned from long years in the line of
      fire. When he selects the Charge or Run Actions, opponents suffer a -20 penalty to Ballistic Skill Tests made to hit
      the character with a ranged weapon. This penalty continues until the start of the Explorer's next Turn.
    cost: 0
    prerequisites: Agility 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: XLExSQcyFQgh7yN3
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Leap Up
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: A combination of athletic ability and speed allow the Explorer to spring to his feet in virtually any circumstance.
      He may stand up as a Free Action.
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: TcStGpKPM6m9YM98
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Swift Attack
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's speed and martial ability allow him to land flurries of blows. As a Full Action, he may make two
      melee attacks on his Turn. If he has the Two-Weapon Wielder Talent and is wielding two melee weapons, he gets the advantage
      of Swift Attack with only one of the weapons, and a single attack with the other. If he has the Two-Weapon Wielder Talent
      and is wielding a melee weapon in one hand and a gun in the other, he gets the advantage of Swift Attack with the melee
      weapon and a single attack with the gun.
    cost: 0
    prerequisites: Weapon Skill 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: Fv4LFlhgaq5sx5Q0
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Melee Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained extensively with hand-to-hand weaponry, becoming proficient in the use of virtually
      all hand-held close combat arms. The Universal group includes the Chain, Shock, and Power groups, and allows proficient
      use of all those weapon types. When a character attempts to use a weapon he does not have the correct Weapon Training
      Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: zXVYmI8PiUrfR5qd
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Precise Blow
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's eye, hand, and weapon act seamlessly together, placing blows exactly where the attacker intends.
      When making a called shot with a melee weapon, the Explorer does not incur the -20 penalty.
    cost: 0
    prerequisites: Weapon Skill 40, Sure Strike
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: PlY6FW3njzUeuzUc
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Step Aside
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can sway his body out of the path of an attack, causing it to pass through thin air. He may make
      an additional Dodge once per Round. In effect this gives him a second Reaction that may only be used to Dodge, allowing
      two Dodges in a Turn. However, he may still only attempt a single Dodge against one attack.
    cost: 0
    prerequisites: Agility 40, Dodge
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: TUtXEGG9x8lQVH5m
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Sure Strike
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can direct his blows far better than most, giving him some control over where they land. When determining
      hit location for a melee attack, he may use the dice as he rolled them or reverse them, choosing the location he prefers.
    cost: 0
    prerequisites: Weapon Skill 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 5MwMkvSrIKvmhiyi
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Two-Weapon Wielder
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of training allow the Explorer to use a melee weapon in each hand when needed. When armed with two melee
      weapons, he may spend a Full Action to attack with both. Both tests made to attack with the weapons suffer a -20 penalty.
      He must possess Two-Weapon Wielder (Melee) and Two-Weapon Wielder (Ballistic) if he wishes to use a gun and hand weapon
      together.
    cost: 0
    prerequisites: Weapon Skill 35, Agility 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
