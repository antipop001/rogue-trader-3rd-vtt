effects: []
flags:
  rt:
    description: 'Striking from the blackest reaches of the Alenic Depths, the violent and cruel Rak''Gol have become the
      byword for death and terror in the Koronus Expanse. Horrific, eight-limbed monstrosities, twisted and Warped, the Rak''Gol
      seem to exist only for slaughter, descending on ships and isolated colonies like a plague, and disappearing again into
      the cold depths of the void. Though the underlying impetus for the Rak''Gol''s seemingly random attacks remains a mystery,
      those who suffer their predations rarely live to tell the tale.


      Rak''Gol Carvers are a subset of this species that have recently been seen spearheading their lightning assaults. These
      creatures are slightly smaller than many of their compatriots, though they still tower over humans, built for speed
      in lieu of raw power and armed with savage melee weapons. Their presence is often a precursor to the larger Marauders,
      Broodmasters, Abominations, and occasionally, the dreaded Techno-Shamans.'
    movement: 8/16/24/48
    rawGear: Good-Craftsmanship bionic respiratory system, long-range implanted vox, photo-visor, suicide device (automatically
      detonated to destroy the corpse upon death), 4 spare razorstorm launcher clips.
    source: Stars of Inequity
img: ''
items:
- _id: Lpkr4UONXV2O6IwJ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Basic Weapon Training (SP)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has received Basic Weapon Training in the Universal group of weapons, and can use them without penalty.
      The Universal group includes the Bolt, Las, Launcher, Melta, Plasma, and SP groups. When a character attempts to use
      a weapon he does not have the correct Weapon Training Talent for, he suffers a -20 penalty to any relevant Weapon Skill
      or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: JhuMsDv9c7gYNznF
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hard Target
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Light on his feet, the Explorer dodges and weaves as he moves, skills learned from long years in the line of
      fire. When he selects the Charge or Run Actions, opponents suffer a -20 penalty to Ballistic Skill Tests made to hit
      the character with a ranged weapon. This penalty continues until the start of the Explorer's next Turn.
    cost: 0
    prerequisites: Agility 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: NzMBOhD8sy7YrNUZ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Melee Weapon Training (Primitive, Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained extensively with hand-to-hand weaponry, becoming proficient in the use of virtually
      all hand-held close combat arms. The Universal group includes the Chain, Shock, and Power groups, and allows proficient
      use of all those weapon types. When a character attempts to use a weapon he does not have the correct Weapon Training
      Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: BOIpCPn8hEK7k1hx
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Pistol Weapon Training (SP) True Grit
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has practiced with nearly every single-handed ranged weapon within the confines of the Imperium,
      and no small number without. The Universal group confers proficiency with most pistol weapons, including the Bolt, Las,
      Launcher, Melta, Plasma, and SP groups. When a character attempts to use a weapon he does not have the correct Weapon
      Training Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 2ZKf5ddyze5mep65
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Sprint
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's fleet feet can propel him faster than his comrades. When taking the Full Move Action, the character
      can move an extra number of metres equal to his Agility Bonus. When taking the Run Action, he may double his movement
      for one Round. The Explorer gains one level of Fatigue if he uses this Talent two Turns in a row.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: aGtPASUcpPU9pHST
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fear (1)
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait has an unnerving appearance. The fear of it always has an associated rating (1–4)
      to reflect just how awful the creature is to behold. The higher the Fear Rating the harder it is for others to resist
      going insane from the encounter, as shown on the following chart.
    source: Rogue Trader Core Rulebook
  type: trait
