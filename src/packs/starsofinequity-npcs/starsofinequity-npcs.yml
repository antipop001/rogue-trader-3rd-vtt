- _id: Ik4RQEdVWboLe2oV
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Multiple Arms
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has more than one pair of arms. It increases its Toughness Characteristic by +10 and gains
      a +10 bonus on Strength Tests involving movement such as Climb and Swim. Finally, the creature may use the Multiple
      Attack action to gain two attacks on its turn.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: SCxfL9u6UEAvekOb
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Size (Hulking)
  ownership:
    default: 3
  sort: 0
  system:
    description: '**Trait Groups:** Miniscule, Puny, Scrawny, Hulking, Enormous, Massive Creatures come in one of seven different
      size categories, as shown on the following chart. Size affects movement and how easy or hard it is to strike that creature
      in combat. (When calculating a creatures movement, apply the size modifier first, and then other modifiers from other
      Traits or talents. Base movement can never be reduced below 1.) For the purposes of comparison, a human is an average-sized
      creature.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: s4hqzYb6rGZhdQku
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Quadruped
  ownership:
    default: 3
  sort: 0
  system:
    description: Quadrupeds are much quicker over a distance than their bipedal counterparts. To calculate their movement,
      double their Agility Bonus. This Trait is intended to cover creatures with hind legs and forepaws. Creatures with more
      than four legs may gain this Trait, but they increase the Agility Bonus by 1 multiplier for every extra set of legs
      (six legs equals AB × 3, eight legs AB × 4, and so on).
    source: Rogue Trader Core Rulebook
  type: trait
- _id: d9yQEi8KV8mFrRkK
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Sturdy
  ownership:
    default: 3
  sort: 0
  system:
    description: Sturdy creatures are hard to move and gain a +20 bonus to tests made to resist grappling and the Takedown
      talent.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: 2V9S5fwc8vF6a0uZ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Strength (x2)
  ownership:
    default: 3
  sort: 0
  system:
    description: One or more of the creature's Characteristics is unnatural. Each time this Trait is gained, select a Characteristic,
      and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait,
      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
      Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.
    source: Rogue Trader Core Rulebook
  type: trait
