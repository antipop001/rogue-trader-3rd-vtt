  sort: 0
  system:
    description: A creature with the Machine Trait is fashioned from inorganic materials and is generally more rigorous than
      fleshy folks. Machines do not breathe, are immune to the effects of a vacuum, extremes of cold, any mind-influencing
      psychic effect, and their Armour Points apply toward fire damage. Machines are also resilient to injury, having 1 to
      5 Armour Points for each location. This number is indicated next to the Trait.
    source: Rogue Trader Core Rulebook
