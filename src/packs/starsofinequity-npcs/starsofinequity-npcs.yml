  name: Mob Rule
  ownership:
    default: 3
  sort: 0
  system:
    description: Orks grow in confidence and brutality in the presence of their own kind. For every additional Ork within
      10m, the Ork's Willpower is increased by +10 to resist the effects of Fear and Pinning.
    source: Into the Storm
  type: trait
