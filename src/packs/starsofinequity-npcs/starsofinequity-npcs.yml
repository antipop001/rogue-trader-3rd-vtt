    description: Needing to quickly find employment elsewhere after a practical joke went awry, Barnabus took passage to the
      Koronus Expanse, where he was soon put to good use as an Arch-militant for a succession of Rogue Traders, before finally
      being granted a role as a colonial administrator. He has found he actually quite enjoys his position, where he can experience
      a comfortable lifestyle, whilst also engaging in some vaguely military pursuits, such as drill and endless dress parades.
