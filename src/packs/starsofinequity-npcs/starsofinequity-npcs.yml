effects: []
flags:
  rt:
    description: 'Stalker Hrrithek is one of many Kroot of the Forsaken Kindred who manifest a unique and unanticipated mutation.
      Hrrithek also belongs to a significantly smaller group: those for whom such mutation is actually beneficial. Psykers
      are not unknown amongst the Kroot; such powers are sometimes manifested by the shamanistic Shapers, and by Kindreds
      who have consumed the remains of Eldar, or other psychically attuned creatures. Hrrithek displays a very different sort
      of connection to the Warp. Hrrithek''s physical body straddles the division between realspace and the Warp, and over
      time, he has learned to consciously shift his being further into the Warp, while maintaining a tenuous hold on reality.
      In Hrrithek''s role as a Stalker, this ability has proven invaluable. In this ghost-like state, Hrrithek can move in
      complete


      silence, hide within solid objects, and even pass through solid walls. Many of the Kindred''s targets over the years
      have been at a loss to explain how their defences and security could have been compromised, for why should they expect
      an incorporeal phantom, when faced with the avian mercenaries of the Kroot? Hrrithck''s unique ability, combined with
      the Kroot''s mercenary nature, makes him an ideal assassin. Indeed, the Kindred has earned something of a reputation
      for excelling at the elimination of individual targets, due primarily to Hrrithck''s work.


      Hrrithck''s build is slight, even by the standards of the Kroot. His brute strength is also somewhat less impressive
      than typical for his race. Fortunately, he seldom has the need to engage in a straight up fight. Hrrithck leads a solitary
      life, only interacting with his fellow Kroot on matters of business, and the most sacred of rituals. The Stalker often
      disappears for days at a time. If he has simply hidden away in the depths of the largely empty Warsphere, or vanished
      for a more nefarious reason, none can say. Many of the Kindred are put ill at ease by Hrrithck, whose bizarre behaviour
      and empty stare are disturbing, even to the Kroot. Despite the many differences between the psychology of Kroot and
      humans, it seems a universal rule that familiarity with the Warp breeds madness.'
    movement: 5/10/15/30
    rawGear: ''
    source: Stars of Inequity
img: systems/rogue-trader-3rd/images/npcs/starsofinequity/stalker-hrrithck.png
