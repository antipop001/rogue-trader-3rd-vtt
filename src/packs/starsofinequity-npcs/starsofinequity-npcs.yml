  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's weapon seems to be everywhere at once, keeping many more opponents at bay in close combat than
      even skilled fighters. Opponents gain no bonuses for outnumbering the character in hand-to-hand combat.
    cost: 0
    prerequisites: Weapon Skill 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
