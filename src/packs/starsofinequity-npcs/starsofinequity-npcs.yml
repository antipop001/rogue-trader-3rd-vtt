      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
