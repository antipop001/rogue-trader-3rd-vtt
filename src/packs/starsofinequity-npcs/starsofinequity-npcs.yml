  rt:
    description: While nearly everyone on the frontier of the galaxy carries a weapon of some sort, a few individuals naturally
      excel at shooting, and have honed their ability to superhuman levels. Whether drawing down on an opponent with a bolt
      pistol or stubgun or lining up the crosshairs of a long-las, a gunslinger rarely misses his target. In the Expanse,
      gunslingers hailing from Gunmetal City on Scintilla in the Calixis Sector have a reputation for being the most lethal
      and efficient killers, and their services are always in demand.
    movement: 3/6/9/18
    rawGear: 2 blind grenades, 2 spare power packs, 12 spare expander rounds, photo-visor, filtration plugs, charm (such as
