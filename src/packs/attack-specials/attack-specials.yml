data:
    description: 'Some weapons are designed with precision in mind and respond superbly in skilled hands. They grant an additional bonus of +10 to the firer''s Ballistic Skill when used with an Aim Action in addition to the bonus granted from Aiming. When firing a single shot from a single Basic Weapon with the Accurate quality benefiting from the Aim action, the attack gains an extra d10 of damage for every two degrees of success to a maximum of two extra d10.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Accurate'
type: 'attackSpecial'
---
data:
    description: 'Some weapons, such as swords and knives, are designed so that the weight of the hilt balances the weight of the blade, making the weapon easier to wield. Balanced weapons grant a +10 bonus to Weapon Skill Tests made to Parry.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Balanced'
type: 'attackSpecial'
---
data:
    description: 'Many missiles, grenades and some guns create an explosion when they hit their target. When working out a hit from a Blast weapon anyone within the weapon''s blast radius in metres, indicated by the number in parenthesis, is also hit. Roll Hit Location and Damage individually for each person affected by a blast.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Blast'
type: 'attackSpecial'
---
data:
    description: 'The user has rebuilt and fined-tuned the weapon so he can operate it to his personal satisfaction. Reloading this weapon takes ½ the listed time, rounding up to the next full action (½ Action is still ½ Action).'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Customised'
type: 'attackSpecial'
---
data:
    description: 'A Defensive weapon, such as a shield, is intended to be used to block attacks and is awkward when used to make attacks. Defensive weapons grant a +15 bonus to tests made when used to Parry, but take a -10 penalty when used to make attacks.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Defensive'
type: 'attackSpecial'
---
data:
    description: 'Flame weapons project a cone of flame out to the range of the weapon. Unlike other weapons, flamers have just one range, and when fired, cast fiery death out to this distance. The wielder does not need to Test Ballistic Skill; he simply fires the weapon. All creatures in the flame''s path, a cone-shaped area extending in a 30 degree arc from the firer out to the weapon''s range, must make an Agility Test or be struck by the flames and take damage normally. If they take damage,'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Flame'
type: 'attackSpecial'
---
data:
    description: 'Some weapons, such as whips, are made up from lots of loosely connected segments, such as chains or supple woven hides. These kinds of weapons lash about when used to attack and cannot be Parried. V·ARIOURY'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Flexible'
type: 'attackSpecial'
---
data:
    description: 'Weapons with this quality are either badly designed or simply woefully made, and regardless of the care taken when used, offer little better than a lucky chance to hit. No bonus is gained from the use of the Aim Action with such weapons.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Inaccurate'
type: 'attackSpecial'
---
data:
    description: 'Certain weapons are prone to overheating, either because of poor design or because they fire unstable superheated ammunition. A weapon with the Overheats special quality overheats on an attack roll of 91 or higher. When a weapon overheats, the wielder suffers energy damage equal to the weapon''s damage with a penetration of 0 to an arm location (the arm holding the weapon if the weapon was fired one-handed, or a random arm if the weapon was fired with two hands). The wielder may choose to avoid taking the damage by dropping the weapon. Dropping a weapon is a Free Action. A weapon that overheats must spend the round afterwards cooling down and may not be fired again until the second round after overheating. A weapon with this quality does not Jam, and any effect that would cause the weapon to Jam (i.e., certain psychic powers) instead causes the weapon to overheat.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Overheats'
type: 'attackSpecial'
---
data:
    description: 'A field of power wreathes weapons with this quality, increasing their Damage and Penetration. Such modifiers are already included in the weapon''s profile. When you successfully use this weapon to Parry an attack made with a weapon that lacks this quality, you have a 75% chance of destroying your attacker''s weapon. Weapons with the Warp Weapon Quality and Natural Weapons are immune to this effect.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Power Field'
type: 'attackSpecial'
---
data:
    description: 'Crude and basic in design, these kinds of weapons, while still deadly, are less effective against modern armour. All Armour Points are doubled against hits from Primitive weapons, unless the armour also has the Primitive quality. Non-Primitive armour doubles its APs before being reduced for penetration.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Primitive'
type: 'attackSpecial'
---
data:
    description: 'Because of the volatile nature of the weapon''s ammunition or due to the way it fires, the weapon needs time between shots to Recharge. The weapon must spend the Round after firing building up a charge and cannot be fired—in effect you can only fire the weapon every other Round.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Recharge'
type: 'attackSpecial'
---
data:
    description: 'Based on tried and true technology, Reliable weapons seldom fail. If a Reliable weapon Jams, roll 1d10 and only on a roll of 10 has it in fact Jammed, otherwise it just misses as normal.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Reliable'
type: 'attackSpecial'
---
data:
    description: 'The standard ammunition of these weapons spreads out when fired, hitting more of the target. If fired at a foe within Point Blank range, each two degrees of success the firer scores indicates another hit (use Table 9-5: Multiple Hits on page 239). However, at longer ranges this spread of small projectiles reduces its effectiveness. All Armour Points are doubled against hits from scatter weapons at Long or Extreme Range.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Scatter'
type: 'attackSpecial'
---
data:
    description: 'Shocking weapons can Stun their opponents with a powerful surge of energy. A target that takes at least 1 point of Damage from a Shocking weapon, after Armour and Toughness Bonus, must make a Toughness Test, though he receives a +10 bonus for every Armour point he has on the location hit. If he fails, he is Stunned for a number of Rounds equal to half the Damage he suffered.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Shocking'
type: 'attackSpecial'
---
data:
    description: 'These weapons throw up dense clouds of smoke to create cover. When a hit is scored from a weapon with the Smoke quality, it creates a smokescreen 3d10 metres in diameter from the point of impact. This screen lasts for 2d10 Rounds, or less in adverse weather conditions (see the effects of Smoke on page 248).'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Smoke'
type: 'attackSpecial'
---
data:
    description: 'Weapons with this quality are designed to entangle enemies. On a successful hit, the target must make an Agility Test or be immobilised. An immobilised target can attempt no other actions except to try to escape the bonds. He can attempt to burst the bonds (a Strength Test) or wriggle free (an Agility Test) in his Turn. The target is considered helpless until he escapes.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Snare'
type: 'attackSpecial'
---
data:
    description: 'A weapon with the Storm Quality doubles the amount of hits inflicted on the target. For example, when firing a weapon with the Storm Quality in fully automatic mode, each degree of success will yield two additional hits (up to the weapon''s firing rate, as normal).'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Storm'
type: 'attackSpecial'
---
data:
    description: 'Tearing weapons are vicious devices, often using multitudes of fast-moving jagged teeth to rip into flesh and bone. These weapons roll one extra die for damage, and the lowest result is discarded.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Tearing'
type: 'attackSpecial'
---
data:
    description: 'Some weapons rely on toxins and poisons to do their damage. Anyone that takes Damage from a Toxic weapon, after reduction for Armour and Toughness Bonus, must make a Toughness Test with a -5 penalty for every point of Damage taken. Success indicates there is no further effect from the weapon. Failure however deals an immediate 1d10 points of Impact Damage to the target with no reduction from Armour or Toughness Bonus.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Toxic'
type: 'attackSpecial'
---
data:
    description: 'A twin-linked weapon represents two identical weapons connected together and linked to fire at the same time, often through one pull of the trigger or push of a button. Twin-linked weapons are built this way in order to increase the chances of scoring a hit through the crude expedience of blasting more shots at the target. A weapon with the Twin-linked Quality gains a +20% bonus to hit when fired and uses twice as much ammunition. In addition, the weapon may score one additional hit if the attack roll succeeds by two or more degrees of success. Lastly, the weapon''s reload time is doubled.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Twin-linked'
type: 'attackSpecial'
---
data:
    description: 'Heavy and difficult to ready after an attack, these kinds of weapons impose a -10% penalty when used to Parry.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unbalanced'
type: 'attackSpecial'
---
data:
    description: 'Certain weapons misfire more often than normal because they are badly maintained or constructed. An Unreliable weapon suffers a Jam on a roll of 91 or higher, even if fired on Semi- or Full Auto.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unreliable'
type: 'attackSpecial'
---
data:
    description: 'Weapons with this quality use ammunition that is both volatile and unstable and can react unpredictably when detonated. When an Unstable weapon scores a hit, roll 1d10. On a score of 1 it inflicts only half Damage, on a score of 2-9 it deals normal Damage, and on a score of 10 it inflicts twice the normal Damage.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unstable'
type: 'attackSpecial'
---
data:
    description: 'Huge and often top-heavy, Unwieldy weapons are too awkward to be used defensively. Unwieldy weapons cannot be used to Parry.'
    source: 'Rogue Trader Core Rulebook'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unwieldy'
type: 'attackSpecial'
---
data:
    description: 'Force Weapons are unique in that they will only function properly when wielded by a true psyker, whose mental energies turn these ordinary looking weapons into devices of terrifying power. They can take the form of almost any normal hand weapon such as a sword, axe, halberd, or hammer, and in the hands of a non-psyker they would function as such. When a psyker directs his powers through them though, such a weapon can multiply his strength to superhuman levels. Force Weapons have special rules when used by a psyker and will otherwise count as Best Craftsmanship Mono variant of the standard Primitive weapon. In the hands of a psyker, the weapon deals bonus damage and gains bonus penetration equal to the psyker''s Psy Rating (so a Psy Rating 3 would grant +3 damage and +3 Penetration), and the damage type changes to Energy. In addition, whenever a psyker damages an opponent, he may make a Focus Power Test (Opposed Willpower) as a Free Action. If he succeeds in making the test and scores more degrees of success than his opponent, for every degree of success, the force weapon''s wielder deals an additional 1d10 E Damage, ignoring Armour or Toughness Bonus. Force weapons cannot be destroyed by a power weapon''s field. Although Navigators are considered psykers, their powers are different from a regular psyker and they do not gain any of the above benefits for using a force weapon.'
    source: 'Into the Storm'
    enabled: true
    hasLevel: false
    level: 0
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Force'
type: 'attackSpecial'
