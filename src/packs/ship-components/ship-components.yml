  description: 'An often-used tactic among pirate fleets is to strew a heavily-trafficked shipping lane with mines, and then pounce on any unfortunate ship crippled by their massive explosions. Starship mines are huge and can explode with catastrophic effect. Most are automatically triggered via an on-board passive auspex to home in on nearby vessels, but some can be remotely operated to achieve greater effectiveness. For starships plying common transit lanes through a system, they are a frequent worry that requires constant vigilance. [Ship component — Power 1, Space 4, SP 1, Hulls: Transports, Light Cruisers, Cruisers.]'
