data:
  craftsmanship: common
  availability: common
  isOnFire: false
  isDepressurized: false
  isUnpowered: false
  isDestroyed: false
  power: 5
  space: 0
  hitPoints: 2
  shipPoints: 0
  description: 'A modified version of the Imperial Navy’s standard sensor array, with boosted wideband gain. S04 R-50 Auspex
    Multi-band The sensors of this ship have been optimised for navigation, at the expense of the sensor''s other uses. External:
    This Component does not require hull space. Although it is external, it can only be destroyed or damaged by a Critical
    Hit. Deep Void Augur Array These, quite simply, are the some of the best sensors created by the Adeptus Mechanicus, and
    are reserved for their own ships and Imperial Naval scout vessels. External: This Component does not require hull space.
    Although it is external, it can only be destroyed or damaged by a Critical Hit. SUPPLEMENTAL COMPONENTS Supplemental Components
    are not required for a starship to function, though they may be highly recommended. Unlike Essential Components, multiples
    of the same type of Component or even duplicates of the same Component may be installed on a ship, unless specifically
    stated otherwise. When installing Weapon Components, they must be placed in one of the starship''s Weapon Capacity slots.
    For example, a starship that has a Weapon Capacity of Dorsal 1 and Prow 1 can have one dorsal weapon and one prow weapon,
    no more. If a lance weapon is installed on a vessel of frigate size or smaller (transports and raiders, for example),
    it must be installed in a prow weapon slot. Lances are large and cumbersome weapons and in respects to smaller vessels,
    can only be installed on ships specifically designed to carry them. If a ship of frigate size or smaller does not have
    a prow weapon slot, it cannot carry a lance. Certain Weapon Components may only be installed in certain classes of ships,
    or in certain Weapon Capacity slots. MACROBATTERIES Macrobatteries are ranks of massive cannons or other weapons, fired
    in volley to overwhelm an enemy in a barrage of destruction. Thunderstrike Macrocannons An older version of the Mars Pattern,
    these macrocannons lack range and power. They are most often found on transports. Mars Pattern Macrocannons The most common
    macrobattery, these are reliable, hard-hitting weapons firing kilo-tonne ordinance, mounted along the vessel''s dorsal
    ridge or in broadside. Mars Pattern Macrocannon Broadside The most common macrobattery, these are reliable, hard-hitting
    weapons firing kilo-tonne ordinance, mounted in a warship''s extended broadside. Broadside: These weapons must occupy
    a Port or Starboard Weapon Capacity slot. Sunsear Laser Battery These laser batteries are common on Naval frigates, providing
    a balance between power used and damage inflicted. // External: This Component does not require hull space. Although it
    is external, it can only be destroyed or damaged by a Critical Hit. // Sensitive: Increased power draw provides a +5 bonus
    to the ship’s Detection. // Stellar Detection: Mapping protocols provide a +5 bonus to Manoeuvre Tests to avoid celestial
    phenomena, but subtracts -2 from the ship''s Detection. // Long Distance Scan: When working toward an Exploration objective,
    the players earn an additional 50 Achievement Points toward completing that objective. // Eye of the Omnissiah: The exceptional
    sensitivity of the array grants +10 to the ship''s Detection.'
  source: Rogue Trader Core Rulebook
  location: Main
  componentClass: Essential
  componentType: Augur Array
  target: ''
  effect: ''
  backpack:
    inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/ship-augur-array.png
name: M-201.b Augur Array
type: shipComponent
