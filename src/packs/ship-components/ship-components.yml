  componentClass: Supplemental
  componentType: Torpedo Tubes
  craftsmanship: common
  description: 'In the early days of the Imperium, certain Forge worlds produced weapons and starship components of a quality now lost to mankind, and torpedoes were no exception. "Plasma accelerated" torpedo tubes refer to a type of torpedo launch system, rather than a specific pattern. These weapon systems utilize plasma from the ship''s drives to "hot launch" the torpedoes, while integral guidance systems constantly update target profiles to the torpedoes'' machine spirits. They are even safer than their counterparts, with multiple reinforced adamantium-alloy blast hatches. This component can store sixteen torpedoes, plus an additional four if the ship''s captain does not mind keeping four "in the tubes." This follows all the rules for torpedo tubes. [Ship component — Power 2, Space 6, SP 2, Hulls: All Ships.]'
