  description: 'The ship is equipped with specialised tethering, grapples and distillation holds, so that it can process valuable comets discovered in their lonely orbits surrounding a star. The resulting waters and minerals can be used to replenish the crew and ship, or more profitably left as frozen chunks and sold to connoisseurs who value the luxury of pure cloud ice. Gelt in the Clouds: This Component allows the ship to conduct ice mining in a suitable comet field far outside a solar system. Comets must be first located with a Challenging (+0) Scrutiny + Detection Test via the ship''s augur arrays. Mining then takes 1d10+5 days and once complete the additional fresh water and air restore 1d5 Morale as well as extending deep void operations one additional month. Alternatively, this can grant the Explorers +50 Achievement Points to an ongoing Endeavour (the refined plasma can either be used in the Endeavour, or sold to generate funds), or can be used in the construction of a full Endeavour
