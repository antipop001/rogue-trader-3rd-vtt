  description: 'For the Rogue Trader who desires only the finest in shipboard accoutrements, a Melodium is ideal. Most are fashioned as grandiose chambers covered with all manner of gilded pipes, horns, and other instruments which can produce an endless variety of musical tunes. The room itself alters shape via clever brass sidings and panels as it plays, the better to accompany the melodies and vox-repeaters throughout the ship carry selected tunes into its farthest depths. A Melodium provides uplifting tones designed to instil feelings of duty and loyalty throughout the vessel, from the lowly ratings and voidmen to the officers. That sometimes this is due to subliminal infra-harmonics lacing the melodies is kept a guarded secret. The hall itself can be configured in a variety of ways to produce the desired internal music and background effects, greatly aiding in many a difficult negotiation. [Ship component — Power 1, Space 1, SP 1, Hulls: All Ships.]'
