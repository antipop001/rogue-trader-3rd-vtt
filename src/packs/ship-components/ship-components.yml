  description: 'Whereas some traders desire the obvious intimidation of a huge armoured prow, others prefer a more subtle approach and sheath an otherwise unremarkable ram beneath their ship''s prow with power-field generators. When activated, the ship''s ram glows with hazy light and is often the last thing an enemy captain will see before impact. I: THE WEAPONS OF WAR # MINEFIELDS A minefield reacts to a vessel inside its boundaries by making a Scrutiny Test with a Skill of 40 with +10 modifier for every full 20 Space the vessel has (the larger the ship, the more mines it activates). The mines suffer a –40 to the Test if the vessel is on Silent Running. If the mines detect a vessel, they strike it with 1d1+2 explosive hits, with this test being done each round the vessel is in the field. Each hit deals 1d10+2 damage, and the hits are combined as though from a macrobattery salvo. Armour and void shields protects against mines as normal. [Ship component — Power 2, Space 0, SP 2, Hulls: Light
