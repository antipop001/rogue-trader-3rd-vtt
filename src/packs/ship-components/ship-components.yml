  description: 'As the Imperium first began to expand away from the glowing light of the Astronomican, many navigators were much less adept at finding their way through the warp. To assist in this technique, massive force staves were added to the exterior of some vessels. These functioned as antennae, allowing a navigator to more easily hone in on the Astronomican''s signal. His Holy Light: The Navigator receives a +20 bonus to all tests to Locate the Astronomican. Beacon: In addition to increasing the navigator''s sensitivity, this Component also makes the vessel much more noticeable to others in the warp. Vessels equipped with a Warp Antenna suffer a –10 modifier on Warp Travel Encounter Tests. [Ship component — Power 1, Space 1, SP 2, Hulls: All Ships.]'
