  description: 'Not all Rogue Traders are able to make their way back to proper port facilities to repair damages from combat, and often they must make do in safe asteroid fields or backwater systems—quiet areas to afford them uninterrupted time to complete essential refurbishment. In order to hasten their repairs, they call on auxiliary power sources such as Lux Nets. These huge solar energy collectors use micro-thin sheets spread across hundreds of square kilometres to generate additional power. They are especially useful when the main drives are damaged, but can draw unwanted attention to a crippled vessel. [Ship component — Power 10 generated, Space 2, SP 2, Hulls: All Ships.]'
