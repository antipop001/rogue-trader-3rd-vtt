    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This two-meter long limb houses a variety of tools and attachments
        designed to assist a tech-priest in the course of his holy duties. The mechadendrite
        counts as a combitool, granting a +10 bonus to all Tech-Use Tests. The limb
        also houses six injector pistons, each of which may be filled with one dose
        of sacred unguent. These must be supplied separately. In addition to this,
        the limb contains an electrically powered censer, which can gust incense fumes
        over particularly troublesome faults. The censer generates one "blast" of
        smoke every fifteen minutes. This may be employed in melee combat to distract
        and choke, imposing a -5 penalty to Weapon Skill Tests made by all living
        creatures within a two metre radius for one Round. This is a Half Action.
        Unless the censer is deactivated, all Perception Tests made to detect the
        Tech-Priest that rely on a sense of smell gain a +10 bonus. Finally, the
        mechadendrite contains a cutting blade. This counts as a knife with the
        Defensive quality and Mono upgrade.
    source: Rogue Trader Core Rulebook, p.134
    backpack:
        inBackpack: false
