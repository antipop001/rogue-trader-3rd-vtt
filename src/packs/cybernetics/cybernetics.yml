    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: The paranoid (or prepared) are ever willing to replace crude flesh
        with more durable, armoured materials—the light armour shielding of a bionic
        heart provides a last line of defence. Superior models can be triggered to
        pump more rapidly to increase physical capacity, though this risks stroke
        or other catastrophe as the rest of the circulatory system is put under pressure.
        A character with this implant gains +1 armour to the body location—this bonus
        stacks with any armour worn—and gains the Sprint Talent.
    source: Rogue Trader Core Rulebook, p.133
