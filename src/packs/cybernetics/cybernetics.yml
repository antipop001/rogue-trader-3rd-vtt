data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: A neurally linked datavault and pict-capture array, often incorporating
        augmetic replacement of one or both eyes, that records information of people
        or scenes viewed. It can then later replay that information, or overlay the
        present view with additional data on people and objects viewed. It is a tool
        of chroniclers, remembrancers, and masters of ceremonies—as well as factors
        or nobles who like to see the secrets of their rivals overlaid upon their
        view of the negotiating table. It can provide a $+10$ bonus to Trade (Remembrancer)
        Tests, or other Tests in social situations where the recorded information
        provides leverage or value. The implant also grants the user the Total Recall
        Talent if he does not already possess it.
    source: Rogue Trader Core Rulebook, p.133
    backpack:
        inBackpack: false
flags:
    rt:
        grants:
            - name: Total Recall
              type: talent
