data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Unlike the more advanced version normally only granted to priests
        of the Adeptus Mechanicus, this version is more simplified, allowing the user
        to remotely operate a single weapon which is normally attached to the shoulder.
        While not as elaborate, it is easier to use and a favourite of many militant
        professions. This system allows user to fire an additional ranged weapon as
        a Free Action—using his full Ballistic Skill—no matter what other actions
        he may be taking at the time. This additional weapon must be connected to
        the user via the MIU weapon interface, and are often equipped as a shoulder-mount.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Miu Weapon Interface
type: cybernetic
