data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This is simply an emergency life support system built into the chest
        and wired into the spine, intended to sustain fragile flesh when it fails.
        It can oxygenate blood via electrolytic microfabric implanted in the lungs,
        keep blood circulating via backup pumps, and send necessary electrical stimulus
        to the rest of the body when it senses catastrophic injury. While it won't
        last for longer than a few hours, the actions of the Vitae Supplacement are
        usually sufficient to prevent death until the medicae arrive. Vitae Supplacement
        grants the Autosanguine Talent and, at the GM's discretion, may give a 50%
        chance of not dying due to blood loss or other normally fatal consequences
        of severe wounds. Common Craftsmanship versions can preserve someone for up
        to four hours, Good and Best versions double and triple this time, respectively.
    source: Into the Storm, p.142
    backpack:
        inBackpack: false
