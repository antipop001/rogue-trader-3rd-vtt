data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Sight, hearing, touch, and taste can be duplicated artificially and
        more esoteric senses may be added. Common systems, while usually very obviously
        artificial and often oversized, manage to more or less duplicate the approximate
        human range of senses adequately and have no further game effects. Poor cybernetic
        senses are problem- ridden imitations of the real thing (hearing may be troubled
        by static, vision rendered in low-resolution monochrome, and so on). A character
        with this system suffers a $-20$ penalty to Tests made involving the cybernetic
        sense. Good cybernetic senses grant the Heightened Senses talent for that
        particular sense, and a $+20$ bonus to Tests made to resist attacks on the
        sense itself—such as deafening noises or blinding flashes. Basic and advanced
        cybernetic eyes may also incorporate magnifying lenses (counting as a telescopic
        sight, see page 134 for more details), a full photo-visor, and/or a system
        allowing the Dark Sight trait (see page 364). Likewise, basic or advanced
        cybernetic hearing may also include an internal micro-bead system.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Cybernetic Senses
type: cybernetic
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Micro-cogitators implanted at the base of the skull allow the user
        to be aware of the direction of true magnetic north, present location to within
        a few metres, relative velocity, altitude, time of day, and other valuable
        information. The user must still have access to maps and other planetary in
        order to benefit from this information, however—knowing you are at a specific
        location on a planetary surface has little meaning if you have no idea what
        is over the next rise, or what direction you must travel to reach a given
        destination.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Locator Matrix
type: cybernetic
