data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This powerful shoulder-mounted mechadendrite is designed for heavy
        lifting and manipulation of industrial machinery. Built of ceramite and steel,
        it may extend to a length of $1.5\mathrm{m}$. When using the arm, the character
        gains a $+20$ bonus to Strength Tests. This limb is tipped with two sets of
        gripping and crushing pincers. These may be locked around a suitable anchor
        point as a Free Action to safely tether the tech-priest to lifting gear, high
        gantries, and so on. Finally, a character may use the manipulator as a club.
        It counts as a Primitive weapon that deals $1\mathrm{d}5 + 2$ Impact Damage.
        The manipulator may not be used for any task requiring fine manipulation such
        typing on a key pad or handling delicate objects. A character must have the
        appropriate Mechadendrite Use talent to operate this implant.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-mechadendrite.png
