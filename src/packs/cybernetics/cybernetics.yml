    inBackpack: false
    description: These implanted power cells use body heat and movement to recharge,
        requiring a day to gain a charge roughly equivalent to a lasgun power pack.
        Unlike a Potentia Coil implant, this does not generate enough power to operate
        complex machinery but is smaller, more easily concealed, and still useful
        in an emergency. Wiring leads to ports in the skin that accept most standard
        power conduits. The Power Cell can act as an ammo charge pack for a standard
        Lasgun or Hellgun and will take a full day to recharge after use.
