    description: The pain ward implant redirects incapacitating levels of pain to
        other regions of the brain, causing the sufferer to experience that pain as
        colours, hallucinations, or tastes. The implanted character can ignore Stun
        effects and involuntary actions or penalties resulting from the pain of critical
        damage, being on fire, drowning, and so on. Involuntary actions and restrictions
        caused by the mechanics of a particular injury still occur as normal.
