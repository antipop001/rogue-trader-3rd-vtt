data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These devices, also known as sense-links, allow the owner to directly
        interface with a machine or technological device. MIUs see widespread use
        among the Adeptus Mechanicus who regard them as objects of divine communion.
        A basic MIU implant involves a single spinal or cortex connector, while advanced
        variants include wrist connector probes—and possibly mechadendrite connectors—in
        addition to the spinal plug. Common models impose no modifiers to machine
        spirit communication and add a $+10$ bonus to Tech-Use, Pilot, or Drive Tests
        used in conjunction with devices capable of MIU linking. Poor MIU systems
        require a successful Willpower Test to use and impose a $-10$ penalty to interact
        with machine spirits. Good models grant a $+10$ bonus to communicate with
        machine spirits, and for Tech-Use, Pilot, Drive, Logic, Inquiry, and Ballistic
        Skill Tests when interfaced with MIU systems. In addition, an MIU gives the
        user the ability to experience the senses of any familiars he controls (such
        as a servo-skull or grapplehawk, see page 375) as if he were present.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Mind Impulse Unit (miu)
type: cybernetic
flags:
    rt:
        conditionalBonuses:
        - applies:
              skills: [techUse, pilot, drive]
              characteristics: []
          value: 10
          label: 'in conjunction with MIU-linked devices (Common, RT Core p.134)'
