data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Common versions of these systems mirror the function of the human
        arm and hand exactly, retaining strength, dexterity, and sense of touch. Poor
        versions halve the owner's Agility score where matters of fine dexterity are
        involved and Weapon Skill and Ballistic Skill Tests suffer a –10 penalty when
        using the limb. Good bionic arms provide a +10 bonus on Agility Tests requiring
        delicate manipulation (such as Sleight of Hand) and add a +10 bonus to Strength
        Tests using the arm.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-bionic-arm.png
name: Bionic Arm
type: cybernetic
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Common locomotion bionics must be fully integrated into the spine
        and nervous system to function properly; basic models accomplish this without
        any loss of function over the human norm. Poor versions halve the character's
        Movement Rates—round up—and such characters that attempt to run must succeed
        on an Agility Test or fall at the end of their movement. Good versions of
        these systems grant the owner the Sprint talent. In addition they add a +20
        bonus to Tests made to jump or leap.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-bionic-leg.png
name: Bionic Locomotion (legs, Hips, Pelvis, Etc.)
type: cybernetic
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Common bionic lungs and implanted respiratory systems mimic the action
        of human lungs and keep the body supplied with oxygen. Such characters gain
        a +20 bonus to Toughness Tests made to resist airborne toxins and gas weapons.
        Poor bionic lungs offer the same benefits as the Common system. However, they
        are raucously loud affairs and characters suffer a –20 penalty to all Silent
        Move checks. A generally poor oxygen supply to the body means all tests involving
        strenuous physical activity are increased by one level of Difficulty. Good
        bionic lungs count as a full life support system—thus if for any reason the
        user's own respiratory system fails, his bionic lungs will keep his blood
        oxygenated—and their presence may be unnoticeable if designed to be so.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-bionic-heart.png
name: Bionic Respiratory System
type: cybernetic
flags:
    rt:
        conditionalBonuses:
        - applies:
              skills: []
              characteristics: [toughness]
          value: 20
          label: 'resisting airborne toxins or gas (Common, RT Core p.132)'
