    description: Mounted inside the forearm is a long blade, which can spring from
        a skin vent along the back of the hand to act as a shortsword or dagger, an
        ideal surprise for a foe who believes an individual unarmed. In some versions,
        the entire hand is augmetic, folding to form a hilt for the revealed blade.
        The internal blade has the same characteristics as a monoknife, and may gain
        any weapon upgrades appropriate for its type. Some rare internal blades are
        power weapons or possess internal reservoirs of poison with which to coat
        the blade. Good craftmanship Internal Blades possess the Toxic Quality, while
