    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This highly flexible mechadendrite set with pict-capture and sensor
        devices is designed to assist in inspection and detection. This mechadendrite
        extends to a length of three metres, and can reduce its width to pencil thickness.
        It grants a +10 bonus to all Perception-based Tests. The pict-devices mounted
        on the mechadendrite allow the user to examine surfaces at a microscopic level
        and may be used as a telescopic sight. The mechadendrite is also mounted with
        an infra-red torch and sensors. A character using the mechadendrite suffers
        no penalties due to darkness and gains a +20 bonus to vision-based Perception
        Tests at night. Finally, the mechadendrite is fitted with a light that may
        be tinted a variety of different colours, depending on the controller's whim.
        This mechadendrite may be shoulder or sternum-mounted. A character must have
        the appropriate Mechadendrite Use talent to operate this implant.
    source: Rogue Trader Core Rulebook, p.134
    backpack:
        inBackpack: false
