data:
    craftsmanship: common
    availability: Common
    weight: 0
    equipped: false
    inBackpack: false
    description: 'What follows are some of the more widely used bionic and cybernetic
        implants desired to improve or salvage the human body. Implants usually serve
        to grant a human some ability he did not already possess, or integrate external
        devices into his body. Note: Mechadendrites are cybernetic limbs that are
        usually mounted on the back or shoulder. The maximum number of Mechadendrites
        a character may have mounted upon his body is equal to his Toughness bonus.'
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Implant Systems
type: cybernetic
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These implanted devices duplicate the effects of sensor systems that
        go beyond normal human senses. In all cases their use requires concentration
        and a Half Action. Common systems function identically to a standard handheld
        auspex device (see page 143). Poor systems possess only a single detection
        ability (either heat, radiation, or electromagnetics) and have the limited
        range of 20 metres. Good systems function as a full auspex but also allow
        rerolls on all Perception based Tests when using its functions.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-auger-array.png
name: Auger Arrays
type: cybernetic
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This catch-all category can include additional aural and scent receptors,
        atmospheric pressure detectors, sonar imaging systems, and more depending
        on the type of implant desired. These can work in concert with existing bionics
        or even natural senses. This implant grants the Heightened Senses Talent for
        any one sense (sight, smell, etc.).
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Augmented Senses
type: cybernetic
---
data:
    craftsmanship: common
    availability: Near Unique
    weight: 0
    equipped: false
    inBackpack: false
    description: A legendary archeotech bionic eye pattern that incorporates a tiny
        las weapon, sacrificing some of the normal abilities of a cybernetic vision
        implant in order to include this device. Each baleful eye has been passed
        from recipient to recipient across centuries or millennia, reclaimed by the
        Machine Cult whenever its present owner dies. As might be imagined, it is
        very intimidating when used as a part of negotiations with primitive societies.
        A character with this implant has a weapon equal to a hellpistol in his eye
        with a range of 10m. The baleful eye can be fired even if the character's
        hands are full, and the baleful eye may be used as a pistol in melee. The
        baleful eye of Sebastian Winterscale is said to have contained a much more
        potent weapon, but it has been lost for centuries.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-bionic-eye.png
name: Baleful Eye
type: cybernetic
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This solid, shoulder-mounted mechadendrite is designed for self-defence.
        This two metre limb is mounted with a sleek laspistol of Adeptus Mechanicus
        design. This weapon counts as a laspistol with the Compact upgrade. The owner
        may use this mechadendrite as his Reaction for the Round or as a Half Action
        Attack on his own turn, but it can only be fired once per Round. The firer
        uses his full Ballistic Skill for the attack. Note that this weapon has no
        optical targeting facilities built in. You must have the appropriate Mechadendrite
        Use talent to operate this implant.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-mechadendrite.png
name: Ballistic Mechadendrite
type: cybernetic
