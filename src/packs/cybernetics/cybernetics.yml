    description: This replaces the stomach and intestinal tract with a mechanized
        digestive system, allowing the user to digest almost any organic material
        and even many non-organic materials, so long as there are nutrients to be
        found. It will handle most dangerous poisons and harmful bio-motes as well.
        This implant allows the user to ignore the effects of any ingested toxic foodstuffs
        or poisons. Best craftmanship implants allow the user to survive by eating
        anything organic (although they may not enjoy doing so, as the bionics do
        not protect against flavours, textures, spines, spikes, or splinters).
    source: Into the Storm
