data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These systems may be used to repair a severely damaged brain or augment
        its abilities. Common cortex implants are used to restore paralysed and brain-damaged
        individuals to some semblance of normality. The best that can be managed by
        these systems is a permanent loss of 1d10 points from the character's Weapon
        Skill, Ballistic Skill, Agility, Intelligence and Fellowship. In addition,
        such characters gain 1d10 Insanity Points. Poor cortex implants restore brain
        function but destroy the personality and memories of the subject, effectively
        making them a servitor, and are therefore unsuitable for player characters.
        Good cortex implants are unusual even among the Mechanicus, and their creation
        is an almost lost art. They grant the trait Unnatural Intelligence (×2) (see
        page 368) and in addition perform all the functions of a cogitator system.
        However, characters with this implant gain 1d10 Insanity Points.
    source: Rogue Trader Core Rulebook
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/cyber-implant-system.png
name: Cortex Implants
type: cybernetic
