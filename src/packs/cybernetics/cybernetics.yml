data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This two-meter long, flexible limb is designed to provide medical
        and surgical assistance in the field. It grants a $+10$ bonus to Medicae Tests.
        The mechadendrite houses six injector pistons, each of which may be filled
        with one dose of a drug. These must be supplied separately. In addition to
        providing first aid, the mechadendrite's flesh staplers may be used to staunch
        Blood Loss as a Half Action. A small chainscalpel attachment reduces the difficulty
        of limb amputation to Challenging $(+0)$. This blade may be used as an improvised
        weapon, and on a hit it deals 1d5 Rending Damage. Finally, the medicae mechadendrite
        may be used to gain a $+10$ bonus to Interrogation Tests. This mechadendrite
        may be shoulder or sternum-mounted. A character must have the appropriate
        Mechadendrite Use talent to operate this implant.
    source: Rogue Trader Core Rulebook, p.134
    backpack:
        inBackpack: false
