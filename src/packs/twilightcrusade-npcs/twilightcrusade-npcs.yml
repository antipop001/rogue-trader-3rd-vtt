      ones of equal severity. The character's fellow Explorers may find him somewhat cold, though other followers of the Omnissiah
      will rejoice in his newfound freedom.
    cost: 0
    prerequisites: Explorator
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
