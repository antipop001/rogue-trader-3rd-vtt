effects: []
flags:
  rt:
    description: 'House Modren was never a prosperous one, its Warrant of Trade little more than a footnote in a long list
      of minor warrants issued during the early stages of the Angevin Crusade. Alongside such luminaries as Haarlock, Winterscale,
      and Aquairre, the foundling house could do little to establish itself and was resigned to the fact it would always be
      a lesser power. Centuries later, little about House Modren had changed, their activities limited to short trading runs
      beyond the Maw and the occasional dalliance with the various xenos denizens of the Expanse. All this changed when a
      chance encounter with a heavily damaged pirate raider brought Vir Modren into contact with the Ruinous Powers.


      At this time, Vir was a scion of his house. His father gave him command of a small flotilla of vessels and sent him
      to earn his right to the Modren Warrant. Bored by the tasks assigned him and irritated by his father''s insistence that
      he prove his worth, the young Vir was eager for glory when his flag officer informed him of the pirate vessel. Vir''s
      fleet swiftly defeated the heavily damaged raider and a party was sent aboard to claim the vessel and any cargo it may
      be carrying. Vir was toying with the idea of keeping the vessel and operating a side-line in piracy when the boarding
      party requested that he come aboard the raider. It appeared that the raider''s crew were a cult of some kind, blasphemous
      symbols and profane altars scattered around the decks. Each of the raider''s surviving crew members bore a plethora
      of ritual scars and many possessed the dark gifts of Chaos as mutations and minor wyrdling powers. Vir had them all
      put to the torch, but the raider''s cargo deck held one last surprise for the young scion.


      Within the sealed holds and locked vaults, Modren''s men had discovered a number of hideous artefacts, relics of the
      Chaos powers. Several of the boarding party had died because of them, driven to suicide or berserk slaughter when they
      laid eyes upon them. Modren surveyed the carnage these simple idols and tomes had caused and knew that this was real
      power.


      Extracting data from the raider''s central cogitator, Modren learned that this vessel was actually part of a larger
      force, tasked with delivering these relics to a rendezvous point not far from the mouth of the Koronus Passage, near
      a region of space known as the Screaming Vortex. Modren immediately formed up his fleet and moved to intercept them.
      Arriving at the rendezvous point, Modren saw the Chaos fleet was not much larger than his own and arrayed in poor formation.
      Clearly the renegades were not expecting any kind of trouble. Using the element of surprise, Modren''s fleet swept down
      on them in a maelstrom of lance batteries, plasma fire, and vicious boarding actions. The action cost him many men and
      ships, but Modren secured victory and, more importantly, more of the relics the Chaos vessels were carrying.


      Modren began plotting a course to return to his father''s fleet, sure that the capture of these relics and the destruction
      of a Chaos fleet would easily earn him his inheritance. During the long journey, Modren and his seneschals pored over
      the captured relics, attempting to discern their true powers and how to access them. When the fleet''s Astropath approached
      him, warning of dire portents he saw in the Warp and giving cryptic messages of a doom to come, Modren listened to everything
      he had to say and swore to no longer pursue his research. The Astropath was moved to another ship to convalesce and
      Modren resumed his work. The more about these relics Modren discovered the more he understood they should not be turned
      over to his father. Why did this man who had done nothing with the house warrant deserve the relics he had fought for?
      Modren decided that once he reached his father''s fleet he would not simply turn the relics over like some simpering
      fool. Instead, he would claim their power for his own, and with them, bind the dynasty to his will.


      As his fleet exited the Warp, the vessels spread into a wolf pack formation. Each vessel carried one of the heretical
      relics. He closed all vox channels and jammed all pict-casts, cutting his fleet off from any attempt from his father
      to bargain or plead for his life; then, the killing began. The remnants of Modren''s fleet were all hardened killers,
      tempered in battle during their conflict with the Chaos reavers. Using the power of the relics and bold words, Modren
      had convinced even the most loyal captains in his fleet that his father''s rule must come to an end for the dynasty
      to truly prosper.


      The vessels moved swiftly and surely, crippling the other craft with pin-point lance blasts and finishing them off in
      brutal boarding actions, actions the Rogue Trader fleet was powerless to repulse as the invading men bore the terrible
      Chaos relics ahead of them. Modren led the assault to capture his father''s flagship himself, storming the bridge on
      a tide of blood and steel. The reunion between father


      and son was lethal and final. The two struck at each other deadly blows, but Modren alone rose from the blood-soaked
      steel, his father''s weapon still embedded in his chest—some whisper that it pierced his heart.


      After seizing control of his father''s fleet and the house warrant, Modren retreated into the trackless depths of the
      Koronus Expanse. Concerned about the effect the relics were having on his crew and worried he did not truly understand
      the powers he was manipulating, he founded a domain deep within the far reaches of unexplored space. He drew about him
      a court of Warp-dabblers and seers, Hereteks and killers, aliens and mutants. Making occasional forays into darkest
      parts of the Koronus Expanse for supplies or research materials, Vir Modren has not been seen in person for decades,
      but his presence has been felt nevertheless. In this latest gambit, his forces have captured a Tau Ethereal, one of
      the species'' enigmatic leaders, together with a sizeable haul of Tau technology and weapons. Once these resources have
      yielded up their secrets, his court will be one step closer to Modren''s true goal. His heart hungers for conquests
      greater still, and the Koronus Expanse is a fertile place to begin a new empire that could threaten the Calixis Sector
      and beyond.'
    movement: 5/10/15/30
    rawGear: ''
    source: Twilight Crusade
