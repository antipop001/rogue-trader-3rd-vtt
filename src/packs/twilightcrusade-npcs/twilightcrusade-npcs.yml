effects: []
flags:
  rt:
    description: 'A powerful telepath in the service of Inquisitor Silberthorne, Gulette Anhd should command fear and respect
      in everyone she meets, but the aging Psyker has taken a different path. Discovering her talents in her childhood, Gulette
      spent much of her early life enduring the painful instruction of the Adeptus Astra Telepathica. Lucky to be found both
      powerful and disciplined enough to live with her gifts, she was sent to train at the Scholastica Psykana, developing
      her powers to better serve humanity.


      Her greatest strengths lay in the realm of telepathy. Mind reading and thought control came as easily to her as walking
      or breathing. Gulette had no desire to see out her days as a Primaris Psyker in the Imperial Guard, risking her life
      under alien suns. Nor did she relish the thought of joining the legion of Astropaths, blind and crippled by the torturous
      Soul Binding ritual. So she took care to never appear too strong or too weak, by turns hiding or exaggerating her abilities.
      As the end of her instruction approached she was taken for the Rite of Sanctioning, fear gnawing at her soul as to what
      her ultimate fate would be when time at the Scholastica ended. As the robed and hooded adepts descended upon her, their
      electro-needles and branding irons held before them, a whispered voice pierced the gloom of the chamber. The voice decreed
      that, following the rite, she was to be taken from the chamber and given over to the custody of an Inquisitor. A thrill
      of terror shot down her spine, all thoughts of the agony she was to endure at the hands of Scholastica adepts forgotten.
      An Inquisitor: one of those most feared and secretive of all the Imperium''s dread agents. A thousand thoughts scrabbled
      in her head: did they know? Had they perceived


      her futile attempts at subterfuge? What would they do to her? How many further torments would she endure before the
      sinister Inquisitors snuffed out her life?


      When the blazing pain of the Sanctioning had faded, Gulette was led to a simple, unadorned room. Within was a seemingly
      normal, unassuming middle-aged man. He explained that the Scholastica instructors had informed him of her attempts to
      mask her powers; her skill at misdirection was good, but there was definitely room for improvement. He offered her the
      opportunity to increase her skills while hunting and tracking the enemies of Mankind. She could perform the Emperor''s
      work not on the front lines or from within a sightless and ruined body, but from the shadows; a secret and deadly weapon
      in the hands of the Inquisition. Scarcely believing it to be possible, Gulette accepted the offer.


      Since that day, Gulette has worked with Inquisitor Silberthorne on countless missions. Her preferred tactic is to assume
      the role of a humble scribe or adept working for whatever false personality Silberthorne has conjured up. In her experience,
      many people immediately dismiss the lowly data-slate wielding scribe as insignificant. From this position of anonymity
      she is free to discretely scan the thoughts and intentions of all around her, secretly feeding her master the hidden
      knowledge she has gleaned. If necessary, she can become a deadly combatant, one capable of directly influencing the
      actions of others or boiling their brains within their skulls, though given her advancing years she has used these powers
      less and less.'
    movement: 3/6/9/18
    rawGear: ''
    source: Twilight Crusade
