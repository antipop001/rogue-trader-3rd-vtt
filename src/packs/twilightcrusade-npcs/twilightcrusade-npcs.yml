effects: []
flags:
  rt:
    description: ''
    movement: 4/8/12/24
    rawGear: 'Well-made clothes, reload for plasma pistol MRC APPENDIX # SHAS’O JA’VRA Commander Skyroar, named Shas’o Ja’Vra
      in her native Tau dialect, was born to be a soldier and fire is her blood. Belonging to the Fire caste was merely the
      beginning. Like every other member of the Tau warrior caste, her training in the martial skills of her people started
      shortly after her birth. Raised in constant conflict, she was drilled in weapons use, tactics, discipline, and command
      during every waking moment of her life. Although an excellent student, she was passed over for the position of Shas’ui
      by her instructors—some said because of her unwillingness to see the bigger picture, others claiming that she sought
      glory for herself rather than seeking to serve the Greater Good. Whether or not these allegations held a grain of truth,
      she bore them with the grace and patience expected of a soldier, showing no sign of turmoil within.'
    source: Twilight Crusade
img: systems/rogue-trader-3rd/images/npcs/twilightcrusade/inquisitor-silberthorne.png
