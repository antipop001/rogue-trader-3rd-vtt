  img: systems/rogue-trader-3rd/icons/talents/red/r_08.png
  name: Frenzy
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: After spending one full Round fuelling his anger — by flagellation, drugs, or other means — the Explorer goes
      into an uncontrolled rage on the next Round, gaining a +10 bonus to Weapon Skill, Strength, Toughness, and Willpower
      but suffering a -20 penalty to Ballistic Skill and Intelligence. The Explorer must attack the nearest enemy in melee
      combat if possible; if not engaged with the nearest enemy he must move toward and engage that enemy where reasonable.
      While Frenzied he is immune to Fear, Pinning, stunning effects, and the effects of Fatigue, may not Parry, retreat,
      or flee, and must use the All Out Attack Manoeuvre in melee combat if possible. He remains Frenzied for the duration
      of the combat. Unless the character has a Talent that allows him to do so, he may not use Psychic Techniques whilst
      in Frenzy.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: PQApjQ8DbtSilhiy
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Swift Attack
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's speed and martial ability allow him to land flurries of blows. As a Full Action, he may make two
      melee attacks on his Turn. If he has the Two-Weapon Wielder Talent and is wielding two melee weapons, he gets the advantage
      of Swift Attack with only one of the weapons, and a single attack with the other. If he has the Two-Weapon Wielder Talent
      and is wielding a melee weapon in one hand and a gun in the other, he gets the advantage of Swift Attack with the melee
      weapon and a single attack with the gun.
    cost: 0
    prerequisites: Weapon Skill 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: K5kxcgIEvdUV1Ca1
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Two-Weapon Wielder
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of training allow the Explorer to use a melee weapon in each hand when needed. When armed with two melee
      weapons, he may spend a Full Action to attack with both. Both tests made to attack with the weapons suffer a -20 penalty.
      He must possess Two-Weapon Wielder (Melee) and Two-Weapon Wielder (Ballistic) if he wishes to use a gun and hand weapon
      together.
    cost: 0
    prerequisites: Weapon Skill 35, Agility 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
