effects: []
flags:
  rt:
    description: 'Commanding the Navy cruiser *Valurous Charge* in the tumultuous Jericho Reach would be a challenge for any
      Imperial officer, but not Captain Ontkean Hesteron. A dedicated and successful Navy officer, Hesteron lived his life
      by a simple set of rules: adore the Emperor, defend the Imperium, and suffer not the enemies of Mankind to live. From
      the moment he first stepped aboard a Navy vessel he knew just who those enemies were, and how to deal with them. Since
      meeting Inquisitor Silberthorne, Hesteron''s simple rules have been thrown into question.


      Contacted by the Inquisitor, Hesteron agreed to transport him, his acolytes, and a number of other select persons, in
      secret, across the void to the Koronus Expanse. During the voyage, Hesteron discovered the true nature of his passengers.
      Alarmed and confused by what he found, only the direct intervention of the Inquisitor stopped Hesteron from alerting
      his crew and killing the entire Tau entourage. Instead, he has sworn to keep Silberthorne''s secrets and aid the Inquisitor
      however he can.


      Despite his oaths to the Inquisitor, Hesteron is deeply unsettled by the presence of xenos on his ship, and Silberthorne''s
      insistence it remain a secret. He doesn''t like lying to his crew and would much prefer to operate openly. However,
      as a Navy captain he takes his oaths very seriously, and will not betray the trust Inquisitor Silberthorne has placed
      in him.'
    movement: 2/4/6/12
    rawGear: ''
    source: Twilight Crusade
img: systems/rogue-trader-3rd/images/npcs/twilightcrusade/captain-ontkean-hesteron.png
