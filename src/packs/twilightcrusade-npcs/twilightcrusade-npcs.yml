effects: []
flags:
  rt:
    description: 'Following his victory, Makara set about establishing command of the slavers'' ship. Many of the vital crew
      members were slaves themselves and eagerly joined Makara when he offered them their freedom. Of the remaining pilgrims,
      dozens tried to sway Makara to return to Maccabeus Quintus so they could continue their holy trek. The newly established
      ship''s captain flushed them from the airlocks, watching their writhing bodies twist silently in the aching cold of
      the void.


      Makara and his crew headed out into the Koronus Expanse, away from the stifling rigidity of the Imperium. Here was a
      place where he could do as he pleased, where no man had command over him and no god judged him. He took to the pirate
      life with considerable ease, striking across the length and breadth of the Expanse, and, soon enough, profit began to
      drive his every endeavour. His path crossed Vir Modren''s not long ago. The reclusive Rogue Trader, long thought dead,
      contacted the now flamboyant and capricious captain with an offer: work for him no questions asked, and Makara would
      double his current profits, guaranteed. So far, the arrangement has been a profitable one. Makara is content to work
      alongside the shadowy Rogue Trader for now. The increased profits he earns outweigh the discomfort he feels with some
      of Modren''s courtiers, though he may leave Modren''s service if this changes.'
    movement: 4/8/12/24
    rawGear: ''
    source: Twilight Crusade
img: systems/rogue-trader-3rd/images/npcs/twilightcrusade/npc-appendix.png
