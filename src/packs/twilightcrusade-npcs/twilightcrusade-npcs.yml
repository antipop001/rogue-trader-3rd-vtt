    aptitudes: ''
    benefit: The Explorer's infrasonic dirges cause terror in the weak. All humans within a 50-metre radius — regardless of
      their ability to hear — treat the character as if he had a Fear Rating of 1. While incanting the dirge, the Explorer
      may not communicate in any other way. The rite requires two minutes of chanting, and most would not consider halting
