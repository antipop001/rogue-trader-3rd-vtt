data:
    description: 'Even the most unimportant offspring of a Rogue Trader dynasty are likely to have grown up amongst the rarefied heights of Imperial aristocracy, and can handle themselves amongst them without embarrassment. A Child of Dynasty gains a +5 bonus to all Fellowship Tests to interact with high-ranking officials of the Imperium and members of the Imperial nobility in a formal setting (exactly when this bonus applies is up to the GM).'
    source: 'Into the Storm, p.14'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Honour Amongst One''s Peers'
