data:
    description: 'Stability is a luxury rarely afforded to most Rogue Trader Houses, and one that most are poorly disposed to suffer long. For many Rogue Traders, stability is a byword for stagnation or resting on one''s laurels, and as most are naturally inclined to risk taking, few find their fortunes stable for long. There are some Houses, however, that come to attain such a state — wealthy and powerful Houses that appear capable of absorbing almost any loss while still generating astronomical profits. These are in the main the very oldest of the dynasties, those whose risks are spread out across a vast web of investment and patronage, for whom a disastrous expedition that might bankrupt a smaller House is offset by a dozen other, more successful undertakings. Ship Points: 8, Profit Factor: 6.'
    source: 'Into the Storm, p.37'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fortune & Fate: Stable'
type: 'trait'
flags:
