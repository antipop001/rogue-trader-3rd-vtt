data:
    description: 'You hold humanity above all and regard anything outside the Imperium with contempt. You suffer a -10 penalty to Interaction Skill Tests when dealing with any source outside the Imperium (such as aliens and traitors).'
    source: 'Rogue Trader Core Rulebook, p.26'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
