data:
    description: 'Your years in the fighting pits have earned you an enemy. You begin play with a rival drawn from the criminal underworld of the fighting pits.'
    source: 'Into the Storm, p.19'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Rival (Underworld)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Birthright'
---
data:
    description: 'Orks are extremely resilient, their bodies capable of withstanding injury that would kill a human. The Ork has the Unnatural Toughness (x2) Trait, doubling its Toughness Bonus for all relevant purposes. As with all Unnatural Characteristics, this does not modify the Ork''s movement, and it is not applied to starting Wounds.'
    source: 'Into the Storm, p.61'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unnatural Toughness (x2)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Due to the Ork''s robust physiology, all Medicae Tests made to treat the injuries of an Ork gain a +20 bonus.'
    source: 'Into the Storm, p.61'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Medicae (Ork)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Orks are fundamentally genderless. Their reproduction is based on the spores they shed throughout their lives and at the moment of their deaths, and the notion of gender is of no concern to them. This, combined with their warlike and wholly inhuman outlook, means that it is fundamentally impossible to seduce an Ork.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Da Boyz'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Orks aren''t easily tempted to Chaos, and are far more resistant to the warping influence of the Warp than humans, for reasons nobody has been able to define. Consequently, Orks do not gain Corruption Points.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'No Corruption'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Orks accrue Insanity Points as normal, but they have no effect on the Ork until he accrues 100 Insanity. At this point he becomes a Madboy — prone to extremely unpredictable behaviour — and is removed from play.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Madboyz'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'These are the richest of the Orks, and tend to be the most inclined to flaunt their wealth and status. Their great fang-like teeth and tusks—collectively known as "Teef" and used as currency by the Orks—grow faster than those of the Orks of any other Klan, which means Bad Moons have greater wealth and a greater inclination to trade and barter than most. Bad Moons gain a +20 bonus on all Barter Tests when dealing with other Orks, and grant a +10 bonus to any Acquisition Test made to deal with Ork traders or obtain items of Ork equipment.'
    source: 'Into the Storm, p.61'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Bad Moons'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
        conditionalBonuses:
        - applies:
              skills: [barter]
              characteristics: []
          value: 20
          label: 'on Barter Tests when dealing with other Orks'
---
data:
    description: 'Largely distrusted by other Orks, Blood Axes have adopted many human ideas and tactics in their way of war, such as camouflage, and are notable for having traded with humans at various points in history. Blood Axes gain Common Lore (Imperium) (Int) or Concealment (Ag) as a Trained Skill, and +3 Perception or Agility.'
    source: 'Into the Storm, p.61'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Blood Axes'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Justifiably considered to be thieves and looters by most other Orks, Death Skulls are superstitious plunderers who gleefully strip the fallen (and anyone else not paying attention) of their possessions. They are notable for wearing copious amounts of blue warpaint, as blue is considered a lucky colour amongst Orks in general and Death Skulls in particular. Death Skulls gain Tech-Use (Int) or Sleight of Hand (Ag) as a Trained Skill, and the Runtz Talent. Their blue warpaint and various talismans and lucky charms collectively count as a Charm.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Death Skulls'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Addicted to speed almost as much as they are violence, Evil Suns love loud, fast-moving vehicles, often saving their Teef for a bike or another ramshackle vehicle so as to get to grips with the enemy even faster. Evil Suns gain Drive (Ground Vehicle) (Ag) or Tech-Use (Int) as a Trained Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Evil Suns'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Typically the largest, most aggressive, and most violent of a species renowned for its size, aggression, and propensity for violence, Goffs are intolerant of the other Klans, whose methods they consider to be entirely Un-Orky. Goffs increase their Strength by +3.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Goffs'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Tending to be primitive in outlook, Snakebites disdain the use of technology in favour of what they see as traditional methods. Their name comes from their initiation rites, in which a venomous snake is goaded into biting a young Ork (known as a "Yoof"). Given the Orks'' natural resilience, this rarely has a significant effect other than making the Ork more tolerant of poisons. Snakebites gain the Resistance (Poison) Talent, and either Survival (Int), Tracking (Int), or Wrangling (Int) as a Trained Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Snakebites'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Some Orks possess a natural affinity for vehicles, learning quickly how to get them to go as fast as possible. Drivas gain Drive (Ground Vehicle) (Ag), or Pilot (Flyer or Space Craft) (Ag) as a Trained Basic Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Driva'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Essential for survival in the early years of an Ork settlement, Huntas are skilled at tracking down prey for their tribe—a skill that remains useful when they start hunting enemies instead of food. Huntas gain Tracking (Int) as a Trained Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Hunta'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'A common innate skill, some Orks possess a natural knack for making machines work. Mekboyz gain Tech-Use (Int) as a Trained Skill. As an Oddboy, a Mekboy also gains +5 Intelligence (Errata v1.4).'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Mekboy (Oddboy)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Invaluable to other Orks, Painboys are Orks with an understanding of medicine. Painboys gain Medicae (Int) as a Trained Basic Skill. As an Oddboy, a Painboy also gains +5 Intelligence (Errata v1.4).'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Painboy (Oddboy)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Possessed of a natural inclination to goad slaves and wild animals into the service of the Orks, Runtherds—also known as Slavers—gain Wrangling (Int) as a Trained Basic Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Runtherd (Oddboy)'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Aiding the Huntas during an Ork tribe''s formative years, Trappas are skilled at setting traps and guiding their kin through the most dangerous environments. Trappas gain Survival (Int) as a Trained Basic Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Know-Wotz: Trappa'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'This Kroot was born into a Kindred that has selected prey possessing great courage. Many such Kindreds have feasted upon the apex predators of a dozen worlds, passing on the gifts of increased bravery, excellent hand-eye coordination, and coolness under fire. The Kroot gains +5 BS, a +5 bonus to Wrangling Tests, and a +10 bonus to resist Fear or Pinning.'
    source: 'Into the Storm, p.49'
