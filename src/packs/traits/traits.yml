data:
    description: 'Orks aren''t easily tempted to Chaos, and are far more resistant to the warping influence of the Warp than humans, for reasons nobody has been able to define. Consequently, Orks do not gain Corruption Points.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'No Corruption'
type: 'trait'
flags:
