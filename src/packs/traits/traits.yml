data:
    description: 'The creature always counts as braced when firing heavy weapons and may fire on semi- or full-automatic as a half action. A creature with this Trait suffers no penalties for moving and firing on semi- or full-automatic.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Auto-Stabilised'
type: 'trait'
---
data:
    description: 'A creature with this Trait is animalistic, tending to behave instinctively rather than rationally. No matter how high its Intelligence score is, it is still bestial. A creature with this Trait never needs to make a Survival Test whilst in its natural habitat. Unless starving or desperate, a bestial creature must make a Willpower Test when frightened, startled or injured. On a failed test, the creature flees.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Bestial'
type: 'trait'
---
data:
    description: 'Blind creatures automatically fail all tests based on vision and automatically fail all Ballistic Skill Tests. Such creatures take a –30 penalty to Weapon Skill Tests and most other tests that ordinarily involve or are benefited by vision.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Blind'
type: 'trait'
---
data:
    description: 'A creature with this Trait deals an extra 3 points of damage with attacks made while charging.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Brutal Charge'
type: 'trait'
---
data:
    description: 'A creature with this Trait can move through solid objects by burrowing through them. This Trait always includes a number to indicate speed. Such creatures can burrow through soil, rock, sand, and so on, though some (expressed in the creature entry) can burrow through metal. When a creature burrows, it leaves behind a tunnel. Creatures at least one size smaller than the creature that created the tunnel can enter these areas without impediment. There''s a 50% chance each round that the tunnel collapses behind the creature.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Burrower'
type: 'trait'
---
data:
    description: 'Worms, serpents, and similar creatures crawl and slither rather than walk. The base move for a creature with this Trait is half their Agility Bonus (rounded up), but they do not take penalties for moving over difficult terrain.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Crawler'
type: 'trait'
---
data:
    description: 'Daemonic creatures are creatures of the Warp, but can manifest in realspace either through sheer strength of will, hunger, or occult rituals. Creatures with this Trait double their Toughness Bonus against all damage, except for damage inflicted by force weapons, psychic powers, holy attacks, or other creatures with this Trait. Daemonic creatures are also immune to poison and disease.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Daemonic'
type: 'trait'
---
data:
    description: 'A creature with this Trait sees normally even in areas of total darkness, and never takes a penalty for fighting in areas of dim or no lighting.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Dark Sight'
type: 'trait'
---
data:
    description: 'Incorporeal creatures are insubstantial and weightless, able to pass through solid objects such as walls and weapons. An incorporeal creature gains a +30 bonus on Concealment Tests when hiding inside something. They may also automatically pass any Silent Move Tests they are required to make. An incorporeal creature is also immune to normal weapons—they simply pass through its body as if it wasn''t there. Daemons, psychic powers, Warp creatures, other creatures with the Incorporeal Trait, and opponents armed with force weapons may all injure an incorporeal creature normally. An incorporeal creature can''t normally affect the mortal world, and thus can''t damage non-incorporeal opponents unless noted otherwise. Incorporeal creatures cannot pass through certain devices or barriers, such as a wall with hexagrammic wards, or a starship''s Geller Field.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Incorporeal'
type: 'trait'
---
data:
    description: 'A creature with this Trait has an unnerving appearance. The fear of it always has an associated rating (1–4) to reflect just how awful the creature is to behold. The higher the Fear Rating the harder it is for others to resist going insane from the encounter, as shown on the following chart.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fear'
type: 'trait'
---
data:
    description: 'A creature with this Trait has the natural ability to fly, whether with broad leathery wings, strange Warp energies, or inflatable gas sacs. This Trait always includes a number to indicate at what speeds it moves when it flies. This number replaces your agility bonus for Movement Actions. For more details on flying, see Chapter IX: Playing the Game.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Flyer'
type: 'trait'
---
data:
    description: 'The mind of a creature with this Trait is beyond the petty frailties and precarious sanity of a mortal mind. It is immune to Fear, Pinning, Insanity Points, and psychic powers used to cloud, control, or delude its mind.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'From Beyond'
type: 'trait'
---
data:
    description: 'A creature with the Machine Trait is fashioned from inorganic materials and is generally more rigorous than fleshy folks. Machines do not breathe, are immune to the effects of a vacuum, extremes of cold, any mind-influencing psychic effect, and their Armour Points apply toward fire damage. Machines are also resilient to injury, having 1 to 5 Armour Points for each location. This number is indicated next to the Trait.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Machine'
type: 'trait'
---
data:
    description: 'This creature has more than one pair of arms. It increases its Toughness Characteristic by +10 and gains a +10 bonus on Strength Tests involving movement such as Climb and Swim. Finally, the creature may use the Multiple Attack action to gain two attacks on its turn.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Multiple Arms'
type: 'trait'
---
data:
    description: 'This creature has a naturally tough hide or an exoskeleton, affording it some protection against attacks. This Trait always includes a numeric value to indicate how many Armour Points the creature gains to all locations.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Natural Armour'
type: 'trait'
---
data:
    description: 'This creature has sharp claws, teeth, spines or some other natural weapon to attack its foes. It counts as being armed even when not wielding weapons. Its attacks deal 1d10 points of damage plus its Strength Bonus. The creature may make attacks with its Natural Weapons using its Weapon Skill, though it cannot parry with its natural weapons, nor can it be disarmed—unless, of course, you hack off its limbs! Natural weapons always count as Primitive.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Natural Weapons'
type: 'trait'
---
data:
    description: 'A creature with this Trait can transform its body into an insubstantial state, passing ghost-like through solid objects or barriers of any sort. This Trait functions exactly like the Incorporeal Trait, except the creature may become solid or insubstantial by spending a half action. Phase carries additional limitations. A creature in a phased state cannot cross psychically charged barriers, holy wards, or energy fields designed to flux space or manipulate the Warp such as a Gellar Field or a Void Shield.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Phase'
type: 'trait'
---
data:
    description: 'Quadrupeds are much quicker over a distance than their bipedal counterparts. To calculate their movement, double their Agility Bonus. This Trait is intended to cover creatures with hind legs and forepaws. Creatures with more than four legs may gain this Trait, but they increase the Agility Bonus by 1 multiplier for every extra set of legs (six legs equals AB × 3, eight legs AB × 4, and so on).'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Quadruped'
type: 'trait'
---
data:
    description: 'Creatures with this Trait heal very quickly. Each round, at the start of its turn the creature tests Toughness to remove 1 point of damage. It loses this Trait when slain.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Regeneration'
type: 'trait'
---
data:
    description: '**Trait Groups:** Miniscule, Puny, Scrawny, Hulking, Enormous, Massive Creatures come in one of seven different size categories, as shown on the following chart. Size affects movement and how easy or hard it is to strike that creature in combat. (When calculating a creatures movement, apply the size modifier first, and then other modifiers from other Traits or talents. Base movement can never be reduced below 1.) For the purposes of comparison, a human is an average-sized creature.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Size'
type: 'trait'
---
data:
    description: 'A creature with this Trait perceives its surroundings by emitting a frequency noise, allowing the creature to locate the position of any solid object within 30 metres. Other creatures within range, and that succeed on a Difficult (-10) Awareness Test, may detect the curious keening.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Sonar Sense'
type: 'trait'
---
data:
    description: 'The soul of this creature is bound to a higher purpose or being, in return for a measure of protection. When this Trait is first gained, the entity to which the soul is bound must be decided. Many Imperial psykers, especially astropaths, are soul-bound to the Emperor, for example, whereas Chaos sorcerers may be bound to one of the Ruinous Powers. A soul-bound psyker rolls an additional d10 when forced to roll on Table 6-3: Perils of the Warp on page 161, discarding whichever one he chooses to get a more favourable result. Upon becoming soul-bound, a character must choose one of the following effects: 1d10 Insanity Points, the permanent loss of sight, the permanent loss of 1d10 from one Characteristic or a random mutation (only if soul-bound to the Ruinous Powers). In addition, a soul-bound character is permanently indebted to the entity, which undoubtedly entails all manner of other duties and consequences.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Soul-Bound'
type: 'trait'
---
data:
    description: 'A creature with this Trait has an unusual, alien, or altogether bizarre anatomy. All hits count as Body hits and death results when damage equals or exceeds the creature''s Wounds.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Strange Physiology'
type: 'trait'
---
data:
    description: 'Some Warp entities are so terribly powerful that the will perpetuating their bodies in our reality is almost impossible to break or disrupt. Such entities are completely immune to the effects of poisons, diseases, the need to breathe, most environmental hazards, bleeding, stunning, and any critical result other than one that would destroy them outright, unless caused by a psychic power, force weapon, or holy attack.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'The Stuff of Nightmares'
type: 'trait'
---
data:
    description: 'Sturdy creatures are hard to move and gain a +20 bonus to tests made to resist grappling and the Takedown talent.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Sturdy'
type: 'trait'
---
data:
    description: 'A creature with this Trait is poisonous. A target hit by its natural weapons must make a Toughness Test. The toxins might instead be delivered by contact with the creature''s skin or by inhaling its stench, in which case a Toughness Test must be made upon coming into contact or proximity. A failed Toughness Test indicates the victim has been poisoned. A typical poison deals 1d10 points of damage, ignoring Armour Points. Variations, if present, are included in the creature''s description.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Toxic'
type: 'trait'
---
data:
    description: 'One or more of the creature''s Characteristics is unnatural. Each time this Trait is gained, select a Characteristic, and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait, its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections by ×4. Note this Trait does not modify the creature''s movement. Movement is based on a creature''s unmodified Agility Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unnatural Characteristic'
type: 'trait'
---
data:
    description: 'The creature can perceive its surroundings using senses other than sight or hearing, using special organs, fine hairs, or some other disturbing Trait to make itself aware of what''s around it. This Trait always includes a range, usually 15 metres.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unnatural Senses'
type: 'trait'
---
data:
    description: 'The creature moves with incredible speed. For the purposes of determining movement, the creature doubles its Agility Bonus (after modifiers from other Traits and factors, specifically size).'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Unnatural Speed'
type: 'trait'
---
data:
    description: 'Most Warp-entities have a tenuous hold on our reality, often maintained only by horror and bloodshed, and may be disrupted if sufficient harm can be done to their manifested forms. If a creature with this Trait takes damage and does not deal damage or Insanity Points to other creatures by the end of its next turn, it must make a Willpower Test. The creature takes 1 damage for failure, plus 1 damage for each degree of failure. If this would deal damage equal to or in excess of the creature''s Wounds, it is cast back into the Warp.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Warp Instability'
type: 'trait'
---
data:
    description: 'Creatures with this Trait have weapons that are partially insubstantial, able to ignore such mundane things as armour or cover. Natural weapons and attacks made by a creature with this Trait ignore physical armour unless it is created from psychoactive materials or carries the holy quality. Force fields still work against these attacks normally.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Warp Weapon'
type: 'trait'
---
data:
    description: 'Creatures with this Trait have a limited capability for flight, flying no higher than two metres. As with the Flyer trait, this Trait always includes a number to indicate speed. For more details on flying, see Chapter VII: Playing the Game.'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Hoverer'
type: 'trait'
---
data:
    description: 'You have been judged a suitable vessel for the following implants: Electro-Graft (interface with machine data ports), Electro Inductors (emit or siphon power via bio-electrical emanations), Respirator Unit (+20 bonus to resist airborne toxins and gas weapons, contains vox-synthesiser), Cyber-Mantle (sub-dermal anchorage framework for further implants), Potentia Coil (power unit that can store energy and produce various fields), Cranial Circuitry (linked processors and cortical circuits augmenting mental capacities).'
    source: 'Rogue Trader Core Rulebook'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Mechanicus Implants'
type: 'trait'
---
data:
    description: 'Improved Natural Weapons are Natural Weapons that are not Primitive. The creature counts as armed even when not wielding weapons, dealing 1d10 plus Strength Bonus damage with its natural attacks, but unlike standard Natural Weapons these attacks do not count as Primitive.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Improved Natural Weapons'
type: 'trait'
---
data:
    description: 'Kroot are infamous for their practice of devouring the corpses of their foes. A Kroot who devours a fresh corpse (killed no more than 24 hours previously, organic only—no daemons or machines) gains a number of bonus Wounds equal to the unmodified Toughness Bonus that the corpse possessed when alive (typically three). These bonus Wounds may not exceed the Kroot''s own Toughness Bonus and remain for a number of hours equal to the Kroot''s Toughness Bonus or until they are lost, whichever comes first. Unlike normal Wounds, these bonus Wounds are removed when affected by the Damage of any successful attack, and are always removed first. In addition, a Kroot who consumes a fresh corpse heals at twice the normal rate and adds one additional bonus Wound to any wounds healed through other means for a number of hours equal to his Toughness Bonus. A Kroot can only benefit from one consumed corpse at a time.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Eaters of the Dead'
type: 'trait'
---
data:
    description: 'Kroot gain a +10 bonus to all Concealment, Shadowing, and Silent Move Tests. In addition, Kroot treat forests, jungles, and similar environments as open terrain.'
    source: 'Into the Storm, p.142'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fieldcraft'
type: 'trait'
