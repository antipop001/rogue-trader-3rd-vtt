data:
    description: 'Your zealous deeds have left their mark upon you. You gain +10 to Intimidate Tests and -10 to Charm Tests, and one poor-Craftsmanship bionic (you may spend 200 xp to upgrade it to common-Craftsmanship, or a total of 300 xp to upgrade it to good-Craftsmanship).'
    source: 'Rogue Trader Core Rulebook, p.27'
