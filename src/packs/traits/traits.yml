---
data:
    description: 'The Kroot''s beak is a natural weapon with the following profile: 1d5+SB R, Primitive.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Kroot Beak'
type: 'trait'
---
data:
    description: 'Kroot are far more comfortable wearing light armour or piecemeal protection scavenged from the battlefield. When a Kroot wears armour that provides more than 3 APs, he loses the benefits of the Unnatural Perception and Fieldcraft Traits.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Kroot Physiology'
type: 'trait'
---
data:
    description: 'The Shaper may select one target that he can see. If the Shaper has previously devoured an example of the target''s race, the Shaper may make a Challenging (+0) Scrutiny Test against the target as a Half Action. If successful, the Shaper may determine the number of Wounds that the target possesses, and may further determine a number of the target''s characteristic bonuses equal to the degrees of success on the Scrutiny Test. The Shaper may select which characteristic bonuses he discovers. This ability may be used once per target per encounter.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Instinctual Understanding'
type: 'trait'
---
data:
    description: 'One of the many roles of a Shaper within Kroot society is to act as a focus for the practice of ancestor worship. Kroot Shapers have a great mastery of rituals that call upon the ancestor spirits of their Kindred. The Kroot Shaper may select certain advances that have this trait as a prerequisite. These advances are known as Shamanic Talents. Each must be activated by the Shaper, usually involving a sonorous chant and access to the powders, rocks and bones kept within the Shaper''s fetish pouch. Activating a Shamanic Talent is a Full Action.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Shamanic Powers'
type: 'trait'
---
data:
    description: 'Orks are extremely resilient, their bodies capable of withstanding and surviving injury that would kill humans, and recovering swiftly enough from even the most grievous wounds to get back into the fight within days. Orks gain the Unnatural Toughness (x2) and Sturdy Traits, and the Iron Jaw and True Grit Talents. Additionally, all Medicae tests to treat the injuries of an Ork gain a +20 bonus, due to the Ork''s robust physiology.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: '''Ard'
type: 'trait'
---
data:
    description: 'Battle is natural to the Orks, who possess abilities needed to wage war from birth. Orks gain the Furious Assault and Xenos Weapon Training (Ork) Talents.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Made Fer Fightin'''
type: 'trait'
---
data:
    description: 'For reasons still baffling to the Imperium, Orks seem to be able to make their own technology function when by all rights it shouldn''t. Any Ork weapon with the Unreliable quality is not considered to be Unreliable when wielded by an Ork.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Make It Work'
type: 'trait'
---
data:
    description: 'Amongst Orks, size and authority are synonymous, with larger Orks naturally viewed as leaders by those smaller than them. When dealing with other Greenskins (Gretchin, Snotlings, other Orks), an Ork may use the Intimidate skill to perform all the normal functions of the Command Skill, affecting a number of subordinate Greenskins equal to his Strength Bonus. When dealing with non-Greenskins, the Ork does not get this bonus.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Might Makes Right'
type: 'trait'
---
data:
    description: 'Orks grow in confidence and brutality in the presence of their own kind. For every additional Ork within 10m, the Ork''s Willpower is increased by +10 to resist the effects of Fear and Pinning.'
    source: 'Into the Storm'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Mob Rule'
type: 'trait'
---
data:
    description: 'Hivers grow up surrounded by crowds and are used to weaving through even the densest mobs with ease. Crowds do not count as Difficult Terrain for hivers, and when Running or Charging through a dense crowd, hivers take no penalty to the Agility Test to keep their feet.'
    source: 'Rogue Trader Core Rulebook, p.21'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Accustomed to Crowds'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Home World'
---
data:
    description: 'The folk of Imperial Worlds are taught that ignorance of the dark places of the galaxy is a blessing from the God-Emperor. This wise blindness imposes a -5 penalty on Forbidden Lore (Int) Tests.'
    source: 'Rogue Trader Core Rulebook, p.22'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Blessed Ignorance'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Home World'
        conditionalBonuses:
        - applies:
              skills: [forbiddenLore]
              characteristics: []
          value: -5
          label: 'on Forbidden Lore Tests'
---
data:
    description: 'The void born are touched by the fickle powers of the warp, making them preternaturally lucky. Whenever a void born character spends a Fate Point (though not if he burns one), roll 1d10. On the roll of a natural 9, the Fate Point is not lost.'
    source: 'Rogue Trader Core Rulebook, p.20'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Charmed'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Home World'
---
data:
    description: 'Fortress world characters are drilled relentlessly for war from an early age, but this single-minded focus leaves them ill at ease with matters unrelated to battle. They suffer a -5 penalty on Social Interaction Tests regarding non-combat topics (at the GM''s discretion).'
    source: 'Into the Storm, p.11'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Constant Combat Training'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Home World'
        conditionalBonuses:
        - applies:
              skills: [charm, command, deceive, inquiry, barter, blather]
              characteristics: [fellowship]
          value: -5
          label: 'on Social Interaction Tests regarding non-combat topics'
---
data:
    description: 'Those who spend time on a penal world gain a skewed outlook on the morality of the Imperium and a less than savoury reputation amongst Imperial authorities. They suffer a -20 penalty on Interaction Tests when dealing with the Adeptus Arbites, the Ecclesiarchy, Enforcers, and the Military should their home world become known (at the GM''s discretion).'
    source: 'Into the Storm, p.13'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Criminal'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Home World'
        conditionalBonuses:
        - applies:
              skills: [charm, command, deceive, inquiry, barter, blather, intimidate]
              characteristics: [fellowship]
          value: -20
          label: 'vs Arbites, Ecclesiarchy, Enforcers, Military if home world known'
---
data:
    description: 'Due to the prestigious heritage of a Child of Dynasty, they can bring considerable resources to bear when outfitting a starship. All Child of Dynasty characters add an extra +3 Ship Points to those already generated when building the group''s ship. However, a group with a Child of Dynasty character may not exchange their Ship Points for Profit Factor — any unspent Ship Points at the end of creating their starship are lost.'
    source: 'Into the Storm, p.14'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
