data:
    description: 'Hivers seldom endure the horrors of the open sky or the indignity of the great outdoors. They suffer a -10 penalty to all Survival Tests, and whilst out of a "proper hab" (places without manufactured goods, solid ceilings, and electrical power) the hiver suffers a -5 penalty to all Intelligence Tests.'
    source: 'Rogue Trader Core Rulebook, p.21'
