---
data:
    description: 'Frontier world characters are suspicious by nature. Because of this outlook, frontier world characters suffer a -10 penalty on all Fellowship Tests when dealing with someone they have not previously met (exactly when to apply this check is up to the GM).'
    source: 'Into the Storm, p.10'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
