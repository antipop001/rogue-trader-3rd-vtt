---
data:
    description: 'The Kroot have battled against Orks for centuries, and it was during a major battle on their homeworld of Pech that the Kroot and Tau first formed an alliance. Many times since, the Orks have encountered Kroot mercenaries as both enemies and allies, and the Shapers have learned to strengthen their Kindred by devouring Ork flesh. Doing so produces a startling resilience in a Kroot''s frame. The Kroot gains +10 Toughness. This bonus is applied after calculating starting Wounds.'
    source: 'Into the Storm, p.49'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Kindred: Greenskin Hybrid'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Kroot'
---
data:
    description: 'Certain Kindred of Kroot have fed upon the most poisonous creatures they could hunt. The resulting generations of Kroot are nearly impervious to all forms of poison and are capable of secreting a highly corrosive acid that burns the exposed flesh of their enemies. The Kroot automatically passes all Toughness Tests to resist toxins and weapons with the Toxic Quality. The Kroot''s beak loses the Primitive Quality and gains the Toxic Quality.'
    source: 'Into the Storm, p.49'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Kindred: Headhunter'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Kroot'
---
data:
    description: 'The predecessors of these Kroot habitually preyed upon chameleonic reptiles and other such creatures that blend into their surroundings. The resulting Kindred are incredibly stealthy, and their skin ripples with colours and patterns that make them nearly invisible when they wish to hide. The Kroot may make Concealment and Silent Move Tests as a Free Action and may do so even while being observed.'
    source: 'Into the Storm, p.50'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Kindred: Stalker'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Kroot'
---
data:
    description: 'The most coveted of Rogue Trader Warrants are those granted in genuine recognition of great deeds performed in service to the Imperium. Such a reward is often not consciously sought and may come as a surprise to the recipient, gifted in a lavish ceremony attended by the great and good of the Imperium''s highest offices. The recipient is likely to have gathered many powerful allies — some might even have forged connections with Space Marine Chapters, sector lords, Admirals or Inquisitors. There is a darker side, however: the sponsor of the granting will often expect some form of recompense, a favour that may not be called in for many decades, and almost certainly at the most inconvenient time. Ship Points: 16, Profit Factor: 2.'
    source: 'Into the Storm, p.38'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Reward'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'While a Warrant of Trade can change hands through overt aggression, a change in title is more likely to occur through underhanded methods — assassination, fraud, and most commonly outright bribery. This might occur when a Rogue Trader has overstepped the limits of his authority and a rival garners sufficient evidence of the transgression to force the Imperium to censure him. In such a case the rival takes power of the existing Warrant and all assets and rights associated with it; a new line is established and the old one slowly dissolved. Ship Points: 12, Profit Factor: 2. (Errata v1.4: formerly named "Bribery".)'
    source: 'Into the Storm, p.38'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Intrigue'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'A Trade Mandate is one of countless administrative instruments employed by the Adeptus Terra — an instrument of strategy by which the division''s policies for managing the unmanageable are drawn up. By way of myriad incomprehensible cogitations, vast armies of scribes and factors plot the needs and means of the Imperium''s worlds. The cogitations have determined that at a particular date, in a particular region, the efforts and services of a Rogue Trader House will be required; the date might be centuries in the future, with entire armies of scribes spending their whole lives selecting the eventual recipient, even one not yet born. Ship Points: 10, Profit Factor: 4.'
    source: 'Into the Storm, p.38'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Administratum Trade Mandate'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'The Ecclesiarchy cannot grant a Warrant of Trade — that privilege lies with the Adeptus Terra and the High Lords — but it holds great influence in the matter. While a Confessor preaches hate and bloodshed to the masses, his agents move amongst the Imperium''s institutions, making promises of favour and wealth to those who aid them and veiled threats to those who obstruct them. One such promise may be the granting of a Warrant of Trade, the confessor''s allies ensuring that individuals with the power to grant it are spoken to in return for certain favours being performed. Ship Points: 8, Profit Factor: 6. (Errata v1.4: formerly named "Ecclesiarchal Bequest".)'
    source: 'Into the Storm, pp.38-39'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Ministorum Bequest'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Many Warrants of Trade have been granted over the millennia as prizes of war. A powerful and successful lord militant might be promised the charter as inducement to undertake a crusade otherwise considered impossible — a crusade that might take decades and cost millions of lives, but by whose conclusion the lord militant will have earned his Warrant. Occasionally the prize is not won but taken: a powerful servant of the Imperium manoeuvres himself into a position to demand the Warrant as reward for service, or prizes an existing Warrant from an established Dynasty as the culmination of years of plotting. Ship Points: 6, Profit Factor: 8.'
    source: 'Into the Storm, p.39'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Prize of War'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Some Warrants of Trade have been obtained not by service or any other such means, but by the recipient demanding their granting as a form of blackmail. Although rare, such a situation might arise when a Lord Militant commands armies so vast that he can hold entire regions of the Imperium ransom, the granting of a Warrant being the price he demands for turning his conquests over to the Adeptus Terra. There have also been instances of far subtler manipulation, in which the would-be recipient holds power over an individual of great influence within the Adeptus Terra who is willing to sponsor the granting to keep his secret shame from his peers. Ship Points: 4, Profit Factor: 10.'
    source: 'Into the Storm, p.39'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Blackmail'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Those who strive to reach the very pinnacles of the Imperium''s power structures frequently stumble before gaining the ultimate power they crave. Such men and women are too dangerous to be allowed the power they seek, but too visible and well connected to quietly remove. The solution is often to grant the troublesome Imperial servant a Warrant of Trade, giving him licence to seek all the power he desires — but to do so far away from the Imperium. The exile is thus furnished with great means but cast out beyond the Emperor''s light, watching always for the enemies who drove him out. Ship Points: 2, Profit Factor: 16.'
    source: 'Into the Storm, p.39'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Acquisition: Exile'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Many Rogue Traders maintain contacts in the battlefleets of the Imperial Navy, for many second sons and daughters will have served their time as officers there before returning to serve their Houses. Friends and contacts made during service are rarely forgotten, and many such Rogue Traders take every opportunity to look up old compatriots when stopping over at a naval base. Out beyond the fringes such contacts transcend the cordialities of the officers'' mess and take on a far more serious aspect. A Rogue Trader vessel that comes to grief fighting alien raiders might hold little hope of help ever arriving, but there are countless tales of such vessels being rescued by the timely arrival of a long range navy patrol vessel, the master of which happened to recognize the cipher attached to a distress call and was willing to divert and offer aid. Of course, this works both ways, and many are the times a Rogue Trader has been obliged to set aside his own mission to bolster the forces of a naval squadron against one of the many enemies that lurk in the cold void of the Expanse. Ship Points: 12, Profit Factor: 2.'
    source: 'Into the Storm, p.43'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Contacts: Battlefleet'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'It is not uncommon for the paths of Rogue Traders and Explorators to cross, particularly out amongst the unexplored systems beyond the Imperium''s borders. On occasion the two factions will have cause to join forces, and as both generally have quite different objectives to their exploration this is often a successful course of action. There are plenty of times however when the interests of the two groups will clash, such as when an Explorator Fleet wishes to strip mine a newly discovered world while a Rogue Trader wishes to trade with its native population. Nonetheless, many Rogue Traders maintain ties with Explorators they have worked alongside in the past. By doing so, the Rogue Trader can utilise information the Explorators have gathered, gaining exclusive access to systems the Explorators have discovered. A Rogue Trader with contacts within the Explorator Fleets will know of such worlds long before his rivals, and have a unique opportunity to investigate them for opportunities from which his House might profit. Ship Points: 10, Profit Factor: 4.'
    source: 'Into the Storm, p.43'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Contacts: Adeptus Mechanicus'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Contacts within the Missionaria Galaxia can prove extremely useful, for this division of the Ecclesiarchy maintains holdings far beyond the fringes. It may well be that a single preacher operating out of an isolated mission proves a staunch ally in a crisis, for he will be well-schooled in the ways of the native population and well able to defend himself should the need arise. The Missionaria does not lend its aid to just anyone however, and any preacher to whom a Rogue Trader is forced to turn for aid will only help him out after determining the individual''s moral purity. Even when aid is forthcoming, the preacher may well make demands in return, often including requests for support in his own mission or substantial donations to the mission of taking the Word of the Emperor to the ignorant souls beyond the fringes. Ship Points: 8, Profit Factor: 6.'
    source: 'Into the Storm, p.43'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Contacts: Missionaria Galaxia'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Those Rogue Trader Dynasties whose fortunes are built upon the acquisition and generation of vast sums of wealth will have dealings with commercial combines across entire sectors and beyond. They will have bonded scribes and factors operating in the courts of the greatest of commercial concerns and these will have the ear of the most influential merchants in the region. It is important to remember that the great merchant houses, particularly those who span several worlds let alone whole sectors, are powerful institutions, and not ones to be crossed lightly. Merchant contacts have a great many uses, for they allow the Rogue Trader to tap into the vast web of influence and power of the merchant houses in question. This network will extend to the major settlements on almost every major world in the region and in many cases beyond. For a price, the Rogue Trader will be able to call upon any service, from repair facilities for a damaged vessel to the services of the merchant house''s indentured mercenaries. Ship Points: 6, Profit Factor: 8.'
    source: 'Into the Storm, p.44'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Contacts: Merchant House'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'The space lanes of the Imperium are plagued with outlaws and pirates. Some are human but others are alien, such as the dread Eldar Corsairs and brutal Ork Raiders. The closer to Wilderness Space and the Fringes a Rogue Trader operates, the more likely he is to come into contact with such scum, and worse, humans who have cast aside even a pirate''s limited sensibilities and given themselves over to the nightmarish veneration of the Ruinous Powers. Every Rogue Trader will have faced pirates in battle, and some will have had cause to join together with them too from time to time. Out beyond the borders one cannot afford to be too choosy who one allies with when the enemy is a ravening alien horror or a gestalt swarm consciousness intent upon feeding upon the Rogue Trader and his friends. Such alliances are more often than not short-lived, for Rogue Traders and pirates exist at opposite ends of the scale in terms of the Imperium''s institutions, yet it could be said that both share a similar outlook in life — both parties see the galaxy as there to be exploited in one way or another. Ship Points: 4, Profit Factor: 10.'
    source: 'Into the Storm, p.44'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Contacts: Pirates'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Often only applicable to a newly created Rogue Trader House, the term ''rising star'' is used to describe a dynasty most definitely on the up. The bearer of the Warrant may be cresting a wave of success and influence, having recently been granted the Warrant or bequeathed the trappings — a fleet and military assets — that may have accompanied it. Many eyes will be watching the dynasty, some with hopeful expectation, others with jealousy. A great weight of responsibility rests on the shoulders of the bearer, and they may have a great deal to prove to earn the title ''Rogue Trader'' in the eyes of the Imperium and their peers. Alternately, the House may be more established but, thanks to a succession in leadership, enjoying a resurgence in its fortunes. Ship Points: 12, Profit Factor: 10.'
    source: 'Into the Storm, p.37'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fortune & Fate: Rising Star'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Warrant'
---
data:
    description: 'Most Rogue Trader Houses undergo significant fluctuations in their fortunes, and a firm hand on the tiller is required to safely navigate the peaks and troughs. A dynasty said to be in the ascendant enjoys an upturn in its fortunes and an increase in its influence and prestige. Such a House proves itself a worthy investment to any who would join it in its endeavours, and its head will have little difficulty in attracting allies and backers. The only real problem a Rogue Trader in such a position may find is that of jealous rivals, for few dynasties survive long without attracting the ire of their peers — the most successful learn to anticipate and deal with such enemies before the fortunes of their House can be affected. Ship Points: 10, Profit Factor: 8.'
    source: 'Into the Storm, p.37'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fortune & Fate: Ascending'
