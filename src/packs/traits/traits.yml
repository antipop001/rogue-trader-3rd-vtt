data:
    description: 'Upon entering the Koronus Expanse, the Kroot soon encountered the devious alien merchants known as the Stryxis. They were delicious. Shapers who have directed their Kindred to feed upon Stryxis notice a proclivity for cunning and deviousness in later generations of Kroot. The Kroot gains +10 Int, a +5 bonus to Barter and Deceive Tests, and a +1 bonus to Initiative.'
    source: 'Into the Storm, p.49'
