              characteristics: [fellowship]
          value: -5
          label: 'to interact with members of the Ecclesiarchy in formal settings'
---
data:
    description: 'As a result of their living on the "streets," the Footfallen suffer a -5 penalty on all Scholastic Lore Tests except those that involve information on the Koronus Expanse (whether or not a given Scholastic Lore Test involves the Koronus expanse is up to the GM).'
    source: 'Into the Storm, p.11'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Street Knowledge'
type: 'trait'
flags:
