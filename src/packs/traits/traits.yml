data:
    description: 'The warp has touched your flesh. Roll once on Table 14-3: Mutations (see page 369); a result of 74 or lower applies (Errata v1.4 — the printed text reads "lower than 76-00"). If you choose, you may spend 200 xp to select one result of 74 or lower from the table instead of rolling randomly. Resolve and record the specific mutation off-engine.'
    source: 'Rogue Trader Core Rulebook, p.25'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Mutant'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Lure'
---
data:
    description: 'You harbour a fascination with the alien. You gain a bonus of +10 to Fellowship Tests when dealing with alien races or cultures, but suffer a -5 penalty to Willpower Tests involving alien artefacts and alien psychic powers.'
    source: 'Rogue Trader Core Rulebook, p.27'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Xenophile'
