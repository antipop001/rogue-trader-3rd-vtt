data:
    description: 'You were born changed by the contamination of your homeworld. Roll once on Table 14-3: Mutations (Rogue Trader Core Rulebook, p.369), re-rolling any result of 75 or higher. Resolve the specific mutation off-engine and record it here.'
    source: 'Into the Storm, p.19'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
