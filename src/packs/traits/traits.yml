    description: 'The warp has touched your flesh. Roll once on Table 14-3: Mutations (see page 369); a result of 74 or lower applies (Errata v1.4 — the printed text reads "lower than 76-00"). If you choose, you may spend 200 xp to select one result of 74 or lower from the table instead of rolling randomly. Resolve and record the specific mutation off-engine.'
