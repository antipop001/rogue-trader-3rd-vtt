        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Justifiably considered to be thieves and looters by most other Orks, Death Skulls are superstitious plunderers who gleefully strip the fallen (and anyone else not paying attention) of their possessions. They are notable for wearing copious amounts of blue warpaint, as blue is considered a lucky colour amongst Orks in general and Death Skulls in particular. Death Skulls gain Tech-Use (Int) or Sleight of Hand (Ag) as a Trained Skill, and the Runtz Talent. Their blue warpaint and various talismans and lucky charms collectively count as a Charm.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Death Skulls'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Addicted to speed almost as much as they are violence, Evil Suns love loud, fast-moving vehicles, often saving their Teef for a bike or another ramshackle vehicle so as to get to grips with the enemy even faster. Evil Suns gain Drive (Ground Vehicle) (Ag) or Tech-Use (Int) as a Trained Skill.'
    source: 'Into the Storm, p.62'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Klan: Evil Suns'
type: 'trait'
flags:
    rt:
        category: 'Background'
        originStep: 'Ork'
---
data:
    description: 'Typically the largest, most aggressive, and most violent of a species renowned for its size, aggression, and propensity for violence, Goffs are intolerant of the other Klans, whose methods they consider to be entirely Un-Orky. Goffs increase their Strength by +3.'
    source: 'Into the Storm, p.62'
