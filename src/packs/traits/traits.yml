data:
    description: 'A Rogue Trader dynasty might fall upon hard times for a wide range of reasons, from disaster to incompetence, and the transition from stable to struggling might be sudden and unanticipated if it is due to external factors. Perhaps the most common reason for a dynasty to find itself in such straits is through the activities of its rivals, particularly if these have found common cause and determined to ruin the fortunes of their enemy. Another reason a House might find itself struggling is when it comes to rely too heavily on a particular field of exploitation or revenue, only to find that resource has suddenly dried up. Nevertheless, Rogue Traders are uniquely optimistic individuals, and many are at their best when faced with a nigh insurmountable challenge. Ship Points: 6, Profit Factor: 4.'
    source: 'Into the Storm, p.37'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fortune & Fate: Struggling'
