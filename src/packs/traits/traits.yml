data:
    description: 'The galaxy is a harsh place, and none are owed the success they seek. Countless numbers of Rogue Traders lose their livelihoods each year; indeed, the entire institution of the Warrant of Trade could be said to rely upon a constant ''pruning'' of the dynasties as a form of natural selection, ensuring that only the most driven and skilled of individuals continue to prosper. A House that has fallen from grace might retain scant resources — perhaps just a vessel and a skeleton crew of bonded retainers. Such a Rogue Trader would be fully aware of his situation and might be driven to extreme measures just to get by, even tempted to seek dealings with xenos or to explore regions long forbidden. Having fallen from grace does not imply permanent misfortune, however, and a Rogue Trader''s fortunes might yet turn full circle. Ship Points: 4, Profit Factor: 2.'
    source: 'Into the Storm, p.37'
img: 'systems/rogue-trader-3rd/icons/talents/blue/b_18.png'
name: 'Fortune & Fate: Fallen from Grace'
