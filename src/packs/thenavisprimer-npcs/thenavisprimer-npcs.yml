  name: Air of Authority
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer was born to command, either motivating or terrifying those under his charge. On a successful Command
      Test, the Explorer may affect a number of targets equal to 1d10 plus his Fellowship Bonus. This Talent has no effect
      on hostile targets, and only affects NPCs.
    cost: 0
    prerequisites: Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: h74V7LFHWvTptZJD
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Armour of Contempt
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's hatred of all the impure armours his soul against malign influence. Whenever the Explorer gains
      Corruption Points, reduce the total by 1, to a minimum of 0. With a successful Willpower Test, taken as a Free Action,
      he may ignore the effects of accumulated Corruption Points for 1 Round.
    cost: 0
    prerequisites: Willpower 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: WZ5rE5WFV8Uq27ZS
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Basic Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has received Basic Weapon Training in the Universal group of weapons, and can use them without penalty.
      The Universal group includes the Bolt, Las, Launcher, Melta, Plasma, and SP groups. When a character attempts to use
      a weapon he does not have the correct Weapon Training Talent for, he suffers a -20 penalty to any relevant Weapon Skill
      or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: QBeV1nq6ofNHnKuI
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Die Hard
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through either willpower or sheer stubbornness, the Explorer refuses to cross into shadow. When he suffers from
      blood loss, the character may roll twice to avoid death.
    cost: 0
    prerequisites: Willpower 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: MEBt97OG3v7pC3pd
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Duty Unto Death
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's will or faith can sustain him when his flesh is weak. He ignores the effects of injury, Fatigue,
      and Stunning during combat. This Talent does not prevent the Damage, but allows the character to temporarily ignore
      its effects for the duration of the combat. Death still affects him normally.
    cost: 0
    prerequisites: Willpower 45
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: upFSdbGO2FaPvvoC
  effects: []
  flags:
    rt:
      conditionalBonuses:
      - applies:
          characteristics:
          - fellowship
          skills: []
        label: vs Psykers (stacks with Rival)
        value: -10
  img: systems/rogue-trader-3rd/icons/talents/violet/p_21.PNG
  name: Enemy (Psykers)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The opposite of Good Reputation, the Explorer is particularly despised by a specific social group or organisation.
      He suffers an additional -10 penalty to Fellowship Tests when dealing with this group. This Talent is cumulative with
      the Rival Talent, for a total -20 penalty. The GM and player may agree to award this Talent when appropriate to the
      adventure or campaign. This Talent can be removed with an Elite Advance and the approval of the GM if the Explorer has
      redeemed himself with the group in question. Talent Groups: Academics, Adepta Sororitas, Adeptus Arbites, Adeptus Mechanicus,
      Administratum, Astropaths, Ecclesiarchy, Government, Imperial Guard, Imperial Navy, Inquisition, Military, Navigators,
      Nobility, Rogue Trader, Underworld, Workers.'
    choice: Psykers
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: tkyqwvMIXEUPUtR8
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fearless
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through hard experience with horrifying situations, fear no longer commands the Explorer's actions. He is immune
      to the effects of Fear and Pinning, but disengaging from combat or backing down from a fight requires a successful Willpower
      Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: TKDDINl8VBgwqxc9
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Foresight
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Logic and analysis do for the Explorer what Tarot and the bones claim to do for the superstitious masses. By
      careful consideration of all the possible consequences, and examination of all evidence and information, he can identify
      the best path for success. By spending ten minutes studying or analysing a problem, he gains a +10 bonus to his next
      Intelligence Test.
    cost: 0
    prerequisites: Intelligence 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: IDAy5H0Fr0lY7w3Q
  effects: []
  flags:
    rt:
      conditionalBonuses:
      - applies:
          characteristics:
          - weaponSkill
          skills: []
        label: in melee vs Daemons, Mutants, Psykers
        value: 10
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hatred (Daemons, Mutants, Psykers)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'A group, organisation or race has wronged the Explorer in the past, fuelling this animosity. When fighting opponents
      of that group in close combat, he gains a +10 bonus to all Weapon Skill Tests made against them. (Errata v1.4: The effects
      of the Hatred Talent never stack — multiple Hatred Talents do not combine, and the bonus to Weapon Skill Tests can never
      exceed +10.) Talent Groups: Criminals, Mutants, Pirates, Psykers, Rogue Trader (specific), Xenos (specific).'
    choice: Daemons, Mutants, Psykers
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 6ESFXustzeIf1O6Z
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Inspire Wrath
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer knows just the turn of phrase that incites individuals or groups to rage against others. His rhetoric
      grants +20 to Interaction Tests when inspiring hatred or anger, and double the number of individuals affected. This
      Talent can be combined with Master Orator to further increase the number of listeners affected.
    cost: 0
    prerequisites: Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: HNq2STvT7KQfUFFF
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Into the Jaws of Hell
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer inspires loyalty and devotion in his followers such that they would follow him into the warp or
      on a boarding action against xenos corsairs. In personal combat, while visible to them, they are immune to Fear and
      Pinning. While the character is known to be on board a ship in which he serves, the ship has a +5 bonus to its Morale.
    cost: 0
    prerequisites: Iron Discipline
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: dQEupmIzOqTtpJPY
  effects: []
  flags:
    rt:
      conditionalBonuses:
      - applies:
          characteristics: []
          skills:
          - command
        label: to motivate followers
        value: 10
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Iron Discipline
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Iron sharpens iron. The Explorer does not coddle his crew, nor motivate them through kindness. His stalwart example
      and stern leadership exhorts them with steel instead of spoils. If the character is visible to his followers, either
      in person or via vox- or pict-caster, they may re-roll failed Willpower Tests made to resist Fear and Pinning. Iron
      Discipline can affect a number of targets equal to the character's Willpower Bonus, who must be under his command. PCs
      can benefit from Iron Discipline if the character with this Talent is the official group leader. If the Explorer is
      leading a boarding action, he gains a +10 bonus to his Command Tests.
    cost: 0
    prerequisites: Willpower 30, Command
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: mywK9gdik0bZJN6F
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Iron Jaw
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has taken blows from Orks and given back as good as he got. He can bounce back from most strikes
      without ill effects. If ever Stunned, a successful Toughness Test allows him to ignore the effects.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: Ocpxy5avSsGHhGFA
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Jaded
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's wide travels have shown both wonders and horrors beyond the ken of most. The galaxy has thrown
      its worst at him and he has yet to flinch. Outrageous events, from death's horrific visage to xenos abominations, will
      not cause Insanity Points or Fear Tests. Terrors of the Warp still affect the character normally.
    cost: 0
    prerequisites: Willpower 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: UpttJvzHeWmUbi7P
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Master Orator
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has learned the techniques required to influence large audiences. His Fellowship Tests and Fellowship-based
      Skill Tests affect 10 times the normal number of targets.
    cost: 0
    prerequisites: Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 3SMnbUKwJdk7rnOD
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Melee Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained extensively with hand-to-hand weaponry, becoming proficient in the use of virtually
      all hand-held close combat arms. The Universal group includes the Chain, Shock, and Power groups, and allows proficient
      use of all those weapon types. When a character attempts to use a weapon he does not have the correct Weapon Training
      Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: b7HsV1H2BWhUVgOb
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Nerves of Steel
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Long years on the battlefield enable the Explorer to remain calm as fire impacts all around. He may re-roll failed
      Willpower Tests to avoid or recover from Pinning.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: JcQBj597aQC8gmu0
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Paranoia
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer knows that danger lurks behind every corner and knows the galaxy will hit him as soon as he lets
      his guard down. The character gains a +2 bonus on Initiative rolls, and the GM may secretly Test his Perception to notice
      hidden threats. The price of his eternal vigilance is a twitchy disposition and the inability to relax.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: oGaDURYFdBx7dnG8
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Pistol Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has practiced with nearly every single-handed ranged weapon within the confines of the Imperium,
      and no small number without. The Universal group confers proficiency with most pistol weapons, including the Bolt, Las,
      Launcher, Melta, Plasma, and SP groups. When a character attempts to use a weapon he does not have the correct Weapon
      Training Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 6moF0bUSQDfTaDYq
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Polyglot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has an innate ability to derive meaning from unknown languages and make himself understood using
      this intuitive grasp. He treats all languages as Basic Skills. This is not the same as true knowledge of the language,
      and tests using this Talent suffer a -10 penalty due to the simplistic nature of translation.
    cost: 0
    prerequisites: Intelligence 30, Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: HqeYmWmS2DoX7fh9
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
