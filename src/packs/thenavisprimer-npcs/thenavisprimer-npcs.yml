  name: Melee Weapon Training (Universal)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has trained extensively with hand-to-hand weaponry, becoming proficient in the use of virtually
      all hand-held close combat arms. The Universal group includes the Chain, Shock, and Power groups, and allows proficient
      use of all those weapon types. When a character attempts to use a weapon he does not have the correct Weapon Training
      Talent for, he suffers a -20 penalty to any relevant Weapon Skill or Ballistic Skill Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: KPxN55j9rNYBiXmh
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Mimic
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Vox synthesisers, training or innate abilities allow the Explorer to accurately mimic the voice of another. He
      must study the voice patterns of his target for at least one hour for proper imitation, and speak the same language.
      He cannot accurately copy the voice of a xeno due to the difference in physiology and the subtle complexities of most
      alien languages. Listeners must succeed on a Difficult (-10) Scrutiny Test to penetrate the deception. If the character
      studies used vox recordings, or comm-link conversations rather than in-person observation, the Difficulty of the Scrutiny
      Test is reduced to Challenging (+0). His deception automatically fails if the listener can clearly see he is not the
      imitated individual.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: cDLD8OrFVnH9DTfH
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Paranoia
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer knows that danger lurks behind every corner and knows the galaxy will hit him as soon as he lets
      his guard down. The character gains a +2 bonus on Initiative rolls, and the GM may secretly Test his Perception to notice
      hidden threats. The price of his eternal vigilance is a twitchy disposition and the inability to relax.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
