  sort: 0
  system:
    description: 'A creature with this Trait has the natural ability to fly, whether with broad leathery wings, strange Warp
      energies, or inflatable gas sacs. This Trait always includes a number to indicate at what speeds it moves when it flies.
      This number replaces your agility bonus for Movement Actions. For more details on flying, see Chapter IX: Playing the
      Game.'
