  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has mastered his body and its reactions by prayer to the Emperor, shutting down unnecessary functions
      to refresh his body and mind. Success on a Willpower Test and 10 minutes without interruptions removes one level of
      Fatigue.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: mNP4KSJtgdtkT1D9
