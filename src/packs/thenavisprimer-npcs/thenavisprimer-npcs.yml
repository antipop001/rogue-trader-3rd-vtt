  name: Counter Attack
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's lightning ripostes are things of beauty—if they were slow enough to be seen. After successfully
      Parrying an opponent's attack, he may immediately make an attack against that opponent using the Parry weapon as a Free
      Action. This attack suffers a -20 penalty.
    cost: 0
    prerequisites: Weapon Skill 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
