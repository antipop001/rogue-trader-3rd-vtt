    rawGear: Pockets full of bullets (equivalent to two Slugga clips), several Teef, special hat or hair squig. **Keep an
      Eye on 'Im:** Minderz have been tasked with keeping an eye on the Weirdboy; they make every effort to stay within 5
      metres of their charge at all times, and refuse to leave (especially at his own behest) unless convinced with an Intimidate
      Test as per the Might Makes Right Trait (see page 52) or some other appropriately strenuous form of coercion.
    source: The Navis Primer
