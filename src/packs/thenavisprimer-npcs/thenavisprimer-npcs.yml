  system:
    aptitudes: ''
    benefit: The Explorer's speed and martial ability allow him to land flurries of blows. As a Full Action, he may make two
      melee attacks on his Turn. If he has the Two-Weapon Wielder Talent and is wielding two melee weapons, he gets the advantage
      of Swift Attack with only one of the weapons, and a single attack with the other. If he has the Two-Weapon Wielder Talent
      and is wielding a melee weapon in one hand and a gun in the other, he gets the advantage of Swift Attack with the melee
      weapon and a single attack with the gun.
    cost: 0
    prerequisites: Weapon Skill 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 1IiK70FtH0CKNK3E
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Bestial
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait is animalistic, tending to behave instinctively rather than rationally. No matter
      how high its Intelligence score is, it is still bestial. A creature with this Trait never needs to make a Survival Test
      whilst in its natural habitat. Unless starving or desperate, a bestial creature must make a Willpower Test when frightened,
      startled or injured. On a failed test, the creature flees.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: KH4rTthDyY97N0Ys
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Flyer (8)
  ownership:
    default: 3
  sort: 0
  system:
    description: 'A creature with this Trait has the natural ability to fly, whether with broad leathery wings, strange Warp
      energies, or inflatable gas sacs. This Trait always includes a number to indicate at what speeds it moves when it flies.
      This number replaces your agility bonus for Movement Actions. For more details on flying, see Chapter IX: Playing the
      Game.'
    source: Rogue Trader Core Rulebook
  type: trait
- _id: DqM9hOALQAk3igex
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Natural Weapons
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has sharp claws, teeth, spines or some other natural weapon to attack its foes. It counts as
      being armed even when not wielding weapons. Its attacks deal 1d10 points of damage plus its Strength Bonus. The creature
      may make attacks with its Natural Weapons using its Weapon Skill, though it cannot parry with its natural weapons, nor
      can it be disarmed—unless, of course, you hack off its limbs! Natural weapons always count as Primitive.
    source: Rogue Trader Core Rulebook
  type: trait
