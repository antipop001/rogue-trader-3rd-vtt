  name: Chem Geld
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Either chemical and surgical treatments or sheer will has rendered the Explorer immune to most mundane temptations.
      Seduction attempts against him automatically fail, and Charm Tests increase their Difficulty by one level. Taking this
      Talent causes one Insanity Point.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
