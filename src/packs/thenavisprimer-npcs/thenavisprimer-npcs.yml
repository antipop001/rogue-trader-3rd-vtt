  name: Polyglot
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has an innate ability to derive meaning from unknown languages and make himself understood using
      this intuitive grasp. He treats all languages as Basic Skills. This is not the same as true knowledge of the language,
      and tests using this Talent suffer a -10 penalty due to the simplistic nature of translation.
    cost: 0
    prerequisites: Intelligence 30, Fellowship 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: rzwkugKe82Xk9Uk0
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Pure Faith
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'The Explorer''s faith in the God Emperor of Mankind, his divine power and grace, is total and complete. This
      faith wraps around him and suffuses his soul, armouring him against the foul influences and weapons of the heretic.
      Pure Faith provides all of the following benefits: The Explorer is always immune to the effects of Daemonic Presence
      including the negative modifiers to his Willpower. The Explorer may spend a Fate Point to not take Fear Tests, not acquire
      Insanity Points, and not gain any Corruption Points. These safeguards remain for the duration of the encounter. The
      Explorer may burn a Fate Point to resist the effects of any single daemonic or psychic attack, effectively allowing
      him to emerge unscathed as if by a miracle.'
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: EpTGVOUlWqQ2zAWb
  effects: []
  flags: {}
