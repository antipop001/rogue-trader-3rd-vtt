  name: Disturbing Voice
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's voice has particularly baleful or menacing qualities, causing others to quail before it. He gains
      +10 bonus to all Intimidate or Interrogation Tests when he employs this Talent, but suffers a -10 penalty to Fellowship
      Tests when dealing with others in a non-threatening manner, such as animals, children, or the easily startled.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
