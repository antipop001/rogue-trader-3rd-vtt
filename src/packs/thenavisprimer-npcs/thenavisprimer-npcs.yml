    benefit: The Explorer has been infused with a great wealth of lore and knowledge, either through punishing noetic techniques
      or by arcane methods kept secret by the guardians of technology and knowledge. The Explorer treats all Common and Scholastic
      Lore Skills as untrained Basic Skills. This Talent also provides a +10 bonus to any Tests involving Common or Scholastic
      Lore for which he already possesses the Skill.
    cost: 0
    prerequisites: Intelligence 40
