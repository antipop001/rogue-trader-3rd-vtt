  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Might Makes Right
  ownership:
    default: 3
  sort: 0
  system:
    description: Amongst Orks, size and authority are synonymous, with larger Orks naturally viewed as leaders by those smaller
      than them. When dealing with other Greenskins (Gretchin, Snotlings, other Orks), an Ork may use the Intimidate skill
      to perform all the normal functions of the Command Skill, affecting a number of subordinate Greenskins equal to his
      Strength Bonus. When dealing with non-Greenskins, the Ork does not get this bonus.
    source: Into the Storm
  type: trait
