- _id: yjNK6fhDmIBEP7kL
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/items/swords/swords_01_b.png
  name: Ambidextrous
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: 'This Talent does not represent true ambidexterity so much as sufficient training with both hands to make the
      distinction moot. The Explorer can use either hand equally well for any task, and does not suffer the -20 penalty for
      actions using his off hand. Special: When combined with a Two-Weapon Wielder Talent, the penalty for making attacks
      with both weapons in the same Turn drops to -10.'
    cost: 0
    prerequisites: Agility 30
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: BtiHiXwDj5todLS6
  effects: []
  flags:
    rt:
      conditionalBonuses:
      - applies:
          characteristics:
          - weaponSkill
          skills: []
        label: when Charging
        value: 20
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Berserk Charge
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has learned to put the whole force of his momentum behind his weapon blows. When he charges into
      combat, few can stand before him. If he uses the Charge Action, he gains a +20 bonus to Weapon Skill instead of +10.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: sm7lNWvtcVUtwzyI
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Cleanse and Purify
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can control the flow of molten promethium like no other, manipulating flame like an old accomplice.
      The targets of his flamer attacks take a -20 penalty to their Agility Tests to escape its effects.
    cost: 0
    prerequisites: Flame Weapon Training (Universal)
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: wxoztTiLUlNmiUW2
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Die Hard
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through either willpower or sheer stubbornness, the Explorer refuses to cross into shadow. When he suffers from
      blood loss, the character may roll twice to avoid death.
    cost: 0
    prerequisites: Willpower 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 07PxyHuiF93fXsIC
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fearless
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Through hard experience with horrifying situations, fear no longer commands the Explorer's actions. He is immune
      to the effects of Fear and Pinning, but disengaging from combat or backing down from a fight requires a successful Willpower
      Test.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 3UwCIfrZBECnQqbl
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Hardy
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's constitution rebounds quickly from shock or injury. When undergoing medical treatment or healing
      from injuries, he recovers Damage as if Lightly Wounded.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: uI2ACncfxEyFmfSL
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Iron Jaw
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer has taken blows from Orks and given back as good as he got. He can bounce back from most strikes
      without ill effects. If ever Stunned, a successful Toughness Test allows him to ignore the effects.
    cost: 0
    prerequisites: Toughness 40
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: VtBHGLCfNWqmvXD0
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Two-Weapon Wielder (Ballistic)
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: Years of training allow the Explorer to use a melee weapon in each hand when needed. When armed with two melee
      weapons, he may spend a Full Action to attack with both. Both tests made to attack with the weapons suffer a -20 penalty.
      He must possess Two-Weapon Wielder (Melee) and Two-Weapon Wielder (Ballistic) if he wishes to use a gun and hand weapon
      together.
    cost: 0
    prerequisites: Weapon Skill 35, Agility 35
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: QDNanYZGyRerVREE
  effects: []
