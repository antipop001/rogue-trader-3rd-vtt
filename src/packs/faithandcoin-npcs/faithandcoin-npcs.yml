  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Auto-Stabilised
  ownership:
    default: 3
  sort: 0
  system:
    description: The creature always counts as braced when firing heavy weapons and may fire on semi- or full-automatic as
      a half action. A creature with this Trait suffers no penalties for moving and firing on semi- or full-automatic.
    source: Rogue Trader Core Rulebook
  type: trait
