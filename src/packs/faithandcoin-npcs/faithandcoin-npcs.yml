  ownership:
    default: 3
  sort: 0
  system:
    description: The creature can perceive its surroundings using senses other than sight or hearing, using special organs,
      fine hairs, or some other disturbing Trait to make itself aware of what's around it. This Trait always includes a range,
      usually 15 metres.
    source: Rogue Trader Core Rulebook
