  system:
    aptitudes: ''
    benefit: After spending one full Round fuelling his anger — by flagellation, drugs, or other means — the Explorer goes
      into an uncontrolled rage on the next Round, gaining a +10 bonus to Weapon Skill, Strength, Toughness, and Willpower
      but suffering a -20 penalty to Ballistic Skill and Intelligence. The Explorer must attack the nearest enemy in melee
      combat if possible; if not engaged with the nearest enemy he must move toward and engage that enemy where reasonable.
      While Frenzied he is immune to Fear, Pinning, stunning effects, and the effects of Fatigue, may not Parry, retreat,
      or flee, and must use the All Out Attack Manoeuvre in melee combat if possible. He remains Frenzied for the duration
      of the combat. Unless the character has a Talent that allows him to do so, he may not use Psychic Techniques whilst
      in Frenzy.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
