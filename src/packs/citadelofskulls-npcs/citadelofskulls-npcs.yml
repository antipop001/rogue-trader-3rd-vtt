flags:
  rt:
    description: 'Thermodrakes are highly mutated native lizards that live in and around the poisonous lagoons, brownfields,
      and toxic slag heaps near Iniquity’s industrial centres. Highly poisonous, these cunning creatures are as big as a man
      and incredibly strong. Their four powerful limbs are tipped with long talons, and their slavering, tooth-filled mouths
      constantly drip with venom. They are also possessed of thick natural armour—thick scaled skin the green-black colour
      of ancient verdigris and a rust-coloured underbelly. While they are typically slow creatures, when surprised or cornered,
      they are capable of short bursts of speed and will attack in a frenzy of claws and teeth. Their bite is deadly poisonous,
      and they can spit a gob of thick, caustic mucous up to ten metres. Typically, they aim for the eyes.


      **Weapons:** Bite (1d10+8 R; Pen 1; Toxic), Claws (1d10+8 R), Caustic Mucous (10m; 1d10+2 E; Tearing). If a Thermodrake
      makes a successful called shot to a victim’s eyes with its caustic mucous, the victim is blinded for 1d5 rounds per
      the Blinded rules on page 260 of the *ROGUE TRADER*


      Thermodrake Profile'
    movement: 6/12/18/36
    rawGear: ''
    source: Citadel of Skulls
