    aptitudes: ''
    benefit: The Omnissiah has augmetically blessed the Explorer's voice box, allowing him to recite infrasonic liturgies
      that trigger awe and fear. All humans, regardless of their ability to hear, within a 50-metre radius feel a sense of
      dread and take a -10 penalty to their next Skill Test. Characters may ignore these effects with a successful Willpower
      Test. Whilst incanting the rite, the character may not talk or communicate with others. The rite requires two minutes
      of litanies, and it is considered very bad form to break off the recitation before completion. Humans without auditory
      implants cannot hear infrasonic sound, and though still affected, will not know the Explorer is speaking.
    cost: 0
