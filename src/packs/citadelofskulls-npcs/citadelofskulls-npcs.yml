  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Bestial
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait is animalistic, tending to behave instinctively rather than rationally. No matter
      how high its Intelligence score is, it is still bestial. A creature with this Trait never needs to make a Survival Test
      whilst in its natural habitat. Unless starving or desperate, a bestial creature must make a Willpower Test when frightened,
      startled or injured. On a failed test, the creature flees.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: m5wsYjEeqG6lBODx
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Burrower
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait can move through solid objects by burrowing through them. This Trait always includes
      a number to indicate speed. Such creatures can burrow through soil, rock, sand, and so on, though some (expressed in
      the creature entry) can burrow through metal. When a creature burrows, it leaves behind a tunnel. Creatures at least
      one size smaller than the creature that created the tunnel can enter these areas without impediment. There's a 50% chance
      each round that the tunnel collapses behind the creature.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: PJIjf71DIu35OE8s
