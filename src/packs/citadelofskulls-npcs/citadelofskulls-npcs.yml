  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Step Aside
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer can sway his body out of the path of an attack, causing it to pass through thin air. He may make
      an additional Dodge once per Round. In effect this gives him a second Reaction that may only be used to Dodge, allowing
      two Dodges in a Turn. However, he may still only attempt a single Dodge against one attack.
    cost: 0
    prerequisites: Agility 40, Dodge
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: YLboVwZ0eTbrVSpC
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Takedown
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: As a Half Action the Explorer may declare that he is attempting a takedown before testing Weapon Skill. If he
      hits and would have done at least 1 point of Damage, then ignore the Damage and the opponent must make a Toughness Test
      or be stunned for 1 Round. When performing a Stun Action, the character does not suffer a -20 penalty to his Weapon
      Skill.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: zFXsndsFP8d3p7XV
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Bestial
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait is animalistic, tending to behave instinctively rather than rationally. No matter
      how high its Intelligence score is, it is still bestial. A creature with this Trait never needs to make a Survival Test
      whilst in its natural habitat. Unless starving or desperate, a bestial creature must make a Willpower Test when frightened,
      startled or injured. On a failed test, the creature flees.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: rb8a6nALUnDzXJyr
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Burrower
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait can move through solid objects by burrowing through them. This Trait always includes
      a number to indicate speed. Such creatures can burrow through soil, rock, sand, and so on, though some (expressed in
      the creature entry) can burrow through metal. When a creature burrows, it leaves behind a tunnel. Creatures at least
      one size smaller than the creature that created the tunnel can enter these areas without impediment. There's a 50% chance
      each round that the tunnel collapses behind the creature.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: qCxajpj6padUXUtQ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Dark Sight
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait sees normally even in areas of total darkness, and never takes a penalty for fighting
      in areas of dim or no lighting.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: iyTKq13d3OGpFcjG
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Fear (1)
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait has an unnerving appearance. The fear of it always has an associated rating (1–4)
      to reflect just how awful the creature is to behold. The higher the Fear Rating the harder it is for others to resist
      going insane from the encounter, as shown on the following chart.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: Udo6OWvB2GIiB3BQ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Improved Natural Weapons
  ownership:
    default: 3
  sort: 0
  system:
    description: Improved Natural Weapons are Natural Weapons that are not Primitive. The creature counts as armed even when
      not wielding weapons, dealing 1d10 plus Strength Bonus damage with its natural attacks, but unlike standard Natural
      Weapons these attacks do not count as Primitive.
    source: Into the Storm
  type: trait
- _id: xjBNMSWXHD807bul
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Natural Armour (4)
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has a naturally tough hide or an exoskeleton, affording it some protection against attacks.
      This Trait always includes a numeric value to indicate how many Armour Points the creature gains to all locations.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: x1MUAtEzZIRDwacG
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Natural Weapons (Teeth and Claws)
  ownership:
    default: 3
  sort: 0
  system:
    description: This creature has sharp claws, teeth, spines or some other natural weapon to attack its foes. It counts as
      being armed even when not wielding weapons. Its attacks deal 1d10 points of damage plus its Strength Bonus. The creature
      may make attacks with its Natural Weapons using its Weapon Skill, though it cannot parry with its natural weapons, nor
      can it be disarmed—unless, of course, you hack off its limbs! Natural weapons always count as Primitive.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: LHKvc9FTitEFnZdK
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Quadruped (x3)
  ownership:
    default: 3
  sort: 0
  system:
    description: Quadrupeds are much quicker over a distance than their bipedal counterparts. To calculate their movement,
      double their Agility Bonus. This Trait is intended to cover creatures with hind legs and forepaws. Creatures with more
      than four legs may gain this Trait, but they increase the Agility Bonus by 1 multiplier for every extra set of legs
      (six legs equals AB × 3, eight legs AB × 4, and so on).
    source: Rogue Trader Core Rulebook
  type: trait
- _id: E25EgCMvBZNMdGpB
