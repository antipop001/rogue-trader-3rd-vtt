- _id: P02jerh5hzrNCjea
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/psykana/enchant-sky-2.jpg
  name: Lightning Attack
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer's speed with weapons is legendary, allowing him to launch flurries of attacks. As a Full Action,
      the character may make three melee attacks on his Turn. The effects of this Talent replace those of Swift Attack rather
      than adding to them. The use of Lightning Attack may not be combined with Dual Strike. If the Explorer has the Two-Weapon
      Wielder Talent and is wielding two melee weapons, he gets the advantage of Lightning Attack with only one of the weapons,
      and a single attack with the other. If he has the Two-Weapon Wielder Talent and is wielding a melee weapon in one hand
      and a gun in the other, he gets the advantage of Lightning Attack with the melee weapon and a single attack with the
      gun.
    cost: 0
    prerequisites: Swift Attack
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: nWsaACkayWJ7p7rR
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Lightning Reflexes
  ownership:
    default: 3
  sort: 0
  system:
    aptitudes: ''
    benefit: The Explorer always expects trouble, even in the most innocuous situations, allowing him to act quickly when
      needed. The character adds twice his Agility Bonus when rolling for Initiative. If he has Unnatural Agility, add +1
      to the multiplier before factoring the bonus into the Initiative roll.
    cost: 0
    prerequisites: ''
    source: Rogue Trader Core Rulebook
    tier: '1'
  type: talent
- _id: 8eUtNiQKUniEsOVL
