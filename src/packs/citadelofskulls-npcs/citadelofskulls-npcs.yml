flags:
  rt:
    description: '"For enough Thrones, I''d take a shot at the God-Emperor himself."


      --Fallon Marquese on his unique business model


      A truly evil and low individual, Fallon Marquese makes his living as a scout and assassin for hire. An expert tracker
      and marksman, he claims to have stepped foot on every world in the Expanse and regularly takes credit for some of the
      more fantastic assassinations in the Calixis Sector. Marquese also claims to possess knowledge of secret doors and passageways
      in the Citadel of Skulls itself. He is currently on Iniquity after arriving aboard a slaver ship and is looking for
      his next assignment.'
    movement: 4/8/12/24
    rawGear: ''
    source: Citadel of Skulls
