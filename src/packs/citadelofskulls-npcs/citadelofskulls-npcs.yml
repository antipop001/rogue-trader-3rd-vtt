effects: []
flags:
  rt:
    description: '"Nothing may exist in this galaxy without my knowledge, or without my consent."


      -Euryale Ceto, Archivist of the Citadel of Skulls


      The hideous mutant known as Euryale Ceto is the keeper of the treasure vaults beneath the Citadel of Skulls. Also known
      as the Archivist, she was once a powerful human sorceress from an isolated feral world in the Unbeholden Reaches. Taken
      by Chaos Reavers during a raid centuries ago, she threw her lot in with the powers of Chaos after experiencing the excruciating
      joy of Slaanesh. Since then, she has dedicated herself to collecting dark knowledge and experiencing blasphemous pleasures
      for the glory of Slaanesh. Now, after centuries in the service of Slaanesh, her body is twisted beyond recognition and
      she has become a frightful four-armed hybrid of woman and serpent. Cunning and incredibly intelligent, she prefers to
      keep to her chambers in the vault, cataloguing and obsessively studying her many treasures while her sorcerers and daemons
      do the work of guarding her and the treasures in the vault.


      Euryale Ceto Profile'
    movement: 4/8/12/24
    rawGear: ''
    source: Citadel of Skulls
