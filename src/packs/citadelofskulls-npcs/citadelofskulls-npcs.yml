effects: []
flags:
  rt:
    description: 'Plying the Empyrean in their corrupt voidships, the captains of the numerous Chaos Reaver fleets are as
      varied as the stars themselves. They come from all walks of life, from bloodthirsty pirates, to fallen Rogue Traders,
      to corrupt Imperial Navy officers, and have little in common save a taste for savagery and a devotion to the Ruinous
      Powers. Whether murdering, guileless brutes, smooth-talking professional killers, disorganised rabble, or well-trained
      officers who deploy their fleets with military precision, they are, to a man, extremely dangerous characters. They have
      countless fanatical and well-trained Reavers under their command, and darker powers as well. They are not to be trifled
      with lightly.


      ## Chaos Reaver Captain Profile'
