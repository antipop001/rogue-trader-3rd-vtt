    description: These disease-carrying vermin are a common sight among the catacombs of the Citadel of Skulls. Nurglings
      are tiny, hideous things with bloated bodies whose scrofulous hides are covered in weeping sores, pustules, and misshapen
      tumours. Their ravening mouths are filled with long, jagged fangs, and their spindly arms tipped with scabrous claws.
      Travelling in swarms, these voracious predators will attack anything on sight, and can kill a man with a single bite.
    movement: 2/4/6/12
