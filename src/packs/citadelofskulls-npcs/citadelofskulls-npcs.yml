effects: []
flags:
  rt:
    description: 'Iniquity''s labour force is composed of countless millions of slaves forcibly taken from ships, planets,
      outposts, and stations throughout the Expanse by the numerous bands of Chaos Reaver slavers. The slave labour force,
      while generally downtrodden, has formed their own, strange society. They have separated themselves along cultural and
      class lines and have installed a rigid caste system. There is also a thriving underground economy among the slaves that
      provides the base entertainments and drugs that the slaves desire as a way to escape their eternal torment. The overseers
      and slavers have allowed this to flourish as it makes their jobs significantly easier.


      ## Slave Profile'
