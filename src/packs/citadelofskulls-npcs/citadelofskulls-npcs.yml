effects: []
flags:
  rt:
    description: The brothers Felthan are a pair of heavily-augmented identical twins from a feral world in the Heathen Stars.
      They have travelled the Expanse for nearly fifty years, selling their services as thugs and killers to the highest bidder.
      Adherents of Chaos more through association than by active worship, they recently shipped out with Slade Mortia as hired
      bodyguards. While canny and passable tacticians, the brothers are dull-witted and have a near insatiable taste for mindless
      violence that makes them difficult to control. Despite this, they are loyal to Mortia and defend him to their last breath,
      as long as the money keeps coming.
    movement: 3/6/9/18
    rawGear: Chaos charm, micro-bead, three clips for each weapon.
    source: Citadel of Skulls
img: systems/rogue-trader-3rd/images/npcs/citadelofskulls/torq-and-siegmund-felthan.png
