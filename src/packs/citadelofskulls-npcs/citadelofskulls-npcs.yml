effects: []
flags:
  rt:
    description: 'Tunnel Horrors are giant, highly-aggressive hunting arachnids native to the blasted surface of Iniquity.
      Whether they are mutations of normal arachnids or naturally occurring creatures is unclear. Whatever the case may be,
      they are bigger than a man and incredibly fast considering their size. They have eight legs tipped with wicked talons,
      a lean, flat abdomen, and a small head studded with numerous eyes surrounding a jaw filled with needle teeth. Their
      body is protected by a thick, black, chitinous exoskeleton covered in short, bristly, hairs along the seems of the chitin
      plates. These hairs comprise a delicate sensory system by which the creature senses the vibrations caused by approaching
      prey. They are rare and solitary creatures who dig deep burrows beneath the surface that are lined with a sticky white
      thread-like substance secreted from their body. They camouflage their lairs by building a cover or lid of local flora,
      soil, and stones woven together with their sticky thread and hinged like a trap door. When they sense the approach of
      their prey, typically


      humans and the larger lizards and serpents native to the planet, they lunge from their hidden lair, snatch their victim,
      and drag them back into their lair for future consumption.


      ## Tunnel Horror Profile'
    movement: 16/32/48/96
    rawGear: ''
    source: Citadel of Skulls
img: systems/rogue-trader-3rd/images/npcs/citadelofskulls/tunnel-horror.png
