    description: 'Slaves who have transgressed or have reached the end of their natural usefulness are turned over to Iniquity''s
      Hereteks for servitor conversion. Modified with artificial muscle grafts and built-in tools, these mindless brutes are
      commonplace among the mines and industries of Iniquity. Even in death, there is no escape for a slave from the industrial
      hell of Iniquity''s mines, furnaces, and foundries.


      ## Iniquity-pattern Industrial Servitor Profile'
    movement: 1/2/3/6
    rawGear: Internal micro-bead for receiving and relaying orders, photo-visor.
    source: Citadel of Skulls
