flags:
  rt:
    description: Among the legion of Chaos followers on Iniquity are quite a few fallen members of the Priesthood of Mars.
      These corrupt Tech-Priests are responsible for keeping the ships, manufactoria, and diverse industrial machines found
      on and around Iniquity running through dark rituals and rites. Chaos Hereteks also control the numerous servitors found
      among the forces of Chaos on Iniquity.
    movement: 3/6/9/18
    rawGear: Micro-bead, Mechanicus implants, tattered robes, dataslate, auto-quill, two clips for weapon, corrupt servo-skull.
    source: Citadel of Skulls
