effects: []
flags:
  rt:
    description: 'The Khadem are those slaves who have been horribly mutated by exposure to the ever-present industrial pollution
      and radiation found on Iniquity. Thoroughly debased, these unfortunates have been cast out by their enslaved brethren
      and have regressed mentally to the point where they can do only the most menial of tasks. Khadem are found in the numerous
      slag heaps, scrap yards, and poison-filled chemical lagoons and holding ponds found around Iniquity''s industrial centres.
      They are put to work here separating garbage, scavenging, and wading among poisons and pollutants skimming for reclaimable
      compounds and ores.


      Physically, their mutations take many diverse forms, but all Khadem tend to have a number of common traits related to
      the cause of their plight. Thanks to the constant exposure to lethal chemicals, their skin has hardened, and they have
      grown resistant to most mundane poisons. Their blood has become a toxic soup, it glows green and hisses and steams when
      exposed to the open air. Their organs have liquefied or taken on other forms to better deal with their toxic blood,
      and they can vomit a corrosive cocktail of poisonous bile and caustic chemicals in close combat. Khadem are typically
      encountered in packs or family clans. They are shy and meek, almost childlike, around non-mutants and their overseers,
      but can be goaded into fits of rage that make them dangerous to those unused to their ways.


      ## Khadem Profile'
    movement: 2/4/6/12
    rawGear: ''
    source: Citadel of Skulls
img: ''
