    description: 'Chaos Reavers are voidmen who, whether by choice or by design, have come to embrace the Dark Gods. They
      come from all walks of life and, like their uncorrupted brethren, represent a broad cross-section of humanity. Pressed
      from captured ships or lured from ports and planets with the promise of wealth and a life of ease, their lot is even
      harder than an average voidman''s, and their life expectancy is shockingly short.


      ## Chaos Reaver Profile'
