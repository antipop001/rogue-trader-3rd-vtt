flags:
  rt:
    description: '"I prefer the direct approach. Master Gunner, give them a couple of broadsides to set the proper tone for
      auspicious meeting."


      -Slade Mortia opening trade negotiations


      Captain of the dreaded cruiser Debaser, Slade Mortia is a man known throughout the rimward regions of the Expanse as
      a ruthless and merciless pirate. Specialising in commerce raiding and ship thievery, Mortia is known as a prime realspace
      navigator and a master ship handler. His crewmen and reavers are held as an example by their fellows as some of the
      most brutal and dangerous voidmen in the Expanse. He is famous for stealing numerous ships and uncounted Thrones worth
      of cargo from Battlefleet Calixis and escaping with his ill-gotten gains to the Expanse.'
    movement: 4/8/12/24
    rawGear: Chaos charm, corrupted almanac astrae divinitus, dataslate, auto-quill, combi-tool, defaced lord-captain's baton,
      micro-bead.
    source: Citadel of Skulls
img: systems/rogue-trader-3rd/images/npcs/citadelofskulls/slade-mortia.png
