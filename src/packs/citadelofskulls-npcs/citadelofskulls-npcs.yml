effects: []
flags:
  rt:
    description: Iniquity's Hereteks have created their own variant of the ubiquitous Charron-pattern Battle Servitor to meet
      the needs of their dark lords. They are massive, hulking slabs of vat-grown nacreous grey skin pierced through with
      corrupt, arcane machine parts. These mindless killing machines carry an array of built-in weapons, from servo-fists
      to heavy bolters to missile launchers, and are very capable, if unimaginative, combatants.
    movement: 1/2/3/6
    rawGear: 'Internal micro-bead for receiving and relaying orders, ammo hopper equivalent to four clips for each weapon,
      red dot laser sight for heavy weapon, systems sealed against hazardous environments, built-in magboots. *Varies by grenade
      or missile.* # CHAOS HERETEK Among the legion of Chaos followers on Iniquity are quite a few fallen members of the Priesthood
      of Mars. These corrupt Tech-Priests are responsible for keeping the ships, manufactoria, and diverse industrial machines
      found on and around Iniquity running through dark rituals and rites. Chaos Hereteks also control the numerous servitors
      found among the forces of Chaos on Iniquity.'
    source: Citadel of Skulls
img: systems/rogue-trader-3rd/images/npcs/citadelofskulls/iniquity-pattern-combat-servitor.png
