effects: []
flags:
  rt:
    description: These hideous beings are warp-possessed mutants who serve as the personal servants of Archivist Eurayle Ceto.
      Like something out of a nightmare, they appear to be a horrid hybrid of man and snake. From the waist up, they have
      thickly-muscled humanoid torsos with four arms covered in glossy blue-black scales. Below the waist, they have no legs,
      but support themselves and move about on a five-metre tail like that of a snake. Their faces are human-like, but vaguely
      reptilian, with wild black hair, two black slits for nostrils, and beetle brows over tiny close-set yellow eyes. They
      speak, when they bother to speak at all, in a piercing, sibilant whisper that carries through the vaults and chambers
      of Eurayle's libraries. They roam the myriad twisting chambers of the library's catacombs, lurking in shadows and waiting
      patiently for interlopers. While they have no sorcerous powers, they more than make up for this deficiency with incredible
      martial prowess. They are incredibly fast and strong, more so than their lithe and awkward frame would suggest. As ambidextrous
      as spiders, they wield deadly serrated warp blades in each hand, and can attack with either their swords or vicious
      bite.
    movement: 12/24/36/72
    rawGear: Chaos charm.
    source: Citadel of Skulls
