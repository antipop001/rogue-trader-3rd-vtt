effects: []
flags:
  rt:
    description: 'The Tau make extensive use of artificial intelligence-controlled machines called drones. These drones are
      most often seen on the battlefield in squads of gun drones, equipped with twin-linked pulse carbines they operate in
      squadrons, using their anti-gravitic motors to outmanoeuvre and surprise their prey.


      A variant of the gun drone, equipped with a longshot pulse rifle and directed by markerlights, has also become a highly
      feared presence in the far off Eastern Rim zones of conflict.


      Drones are not only equipped to deal death, however; two further models, one equipped with a markerlight and a second
      carrying a shield generator provide vital support for the forces of the Tau Empire.


      Drones possess only a simple programmed response system and, although capable of adapting to changing battlefield conditions,
      are often controlled directly by Fire Warriors or battlesuit pilots equipped with drone controllers.'
    movement: 6/12/18/36
    rawGear: If the drone is not equipped with a weapon, it may instead carry a markerlight or a shield generator.
    source: 'The Koronus Bestiary: Tau Character Guide'
img: systems/rogue-trader-3rd/images/npcs/taucharacterguide/tau-drones.png
