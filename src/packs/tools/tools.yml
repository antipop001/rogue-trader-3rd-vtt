---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Simple in design but essential in many situations, blast goggles
        serve two main purposes. The first is eye protection, essential in many close
        quarters fire-fights when small shrapnel may be flying in all directions.
        The glassteel lenses can withstand fragments that would puncture many armours
        and keeps the user from falling prey to threats to his vision. The other main
        purpose is in diminishing the effects of high intensity bursts of light, such
        as close range lasgun fire or even photon flash grenade blasts. Overall blast
        goggles are part of many the gear for both boarding raiders or defending armsmen.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Blast Goggles
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Made of a leathery, faded yellow material of unknown origin, and
        sometimes found for trade on Footfall, slip suits have a greasy texture and
        are nearly frictionless to the touch. They are rare but sought after by many
        thieves and some bloodsport pit fighters for the benefits they provide in
        melee combats. The tough fabric is most often stitched into capes or vests.
        This item gives a +10 bonus to any attempts to break free from a Grapple action,
        and opponents Grappling the wearer suffer a -10 penalty.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Slip Suit
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: For a Rogue Trader, image is everything, both in terms of what it
        projects and what it conceals. A Targeting Monocle does both—it gives the
        impression of someone more willing to wear a cumbersome affectation than receive
        normal ocular augmentics, while secretly providing a dazzling display of information
        to the user via translucent projections directly to the eye. Distances, wind
        velocity, infra-red detections, target movement, and more are visible overlaying
        the normal visual image. Advanced models can link into specially upgraded
        guns to also include precise firing solutions, ammunition count, and weapon
        status. A targeting monocle can either be a Motion Predictor, Photo Sight,
        Preysense Sight, or Telescopic Sight (this is determined when the monocle
        is acquired). However, it requires a Very Hard (-30) Scrutiny Test to determine
        this is anything but a Monocle. The Monocle must be linked (usually via a
        low-power vox connection) with a weapon, and counts as a weapon's sight.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Targeting Monocle
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: One of the sacred duties entrusted to all Rogue Trader expeditions
        into the unknown reaches beyond the Calixis Sector is to find the lost remnants
        of humanity and bring them back to the loving embrace of the Adeptus Ministorum,
        lest their souls be forever lost to the darkness. While this duty is undertaken
        with varying degrees of enthusiasm and diligence (often depending on how many
        Thrones will be gained in the process), those Explorers with close ties to
        the Ministorum often carry many of these impressive pylon-like apparatuses
        with them in their travels, as they cannot always tarry behind to see to these
        lost sheep. Each is planted into the ground using deep spike-anchors. They
        stand 10 meters tall, with the metallic symbol of the Imperium of Man perched
        at the top, illuminated day and night via internal batteries and solar cells.
        A variety of homing beacons, vox broadcasters, and recording auspex sensors
        operate inside the wide base to alert any passing Ministorum vessels that
        this flock is ready to receive its shepherds. Common Craftmanship versions
        will operate for five years without repairs, Good and Best Craftmanship versions
        operate two and three times as long, respectively.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Aquila Magnificus
type: tool
---
data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Rogue Traders by their very nature deal with the extremely valuable
        and impossibly precious, items of irreplaceable worth beyond the dreams of
        mere planetary governors or Imperial warlords. Such things are of course to
        be guarded heavily, for between the time of taking possession to the time
        they are sold there could be many opportunities for others to steal them away.
        To keep such prizes safe, some explorers use the famed bloodlock bolt, a special
        chest combining stasis technology with sophisticated auspex medicae sensors.
        Once the chest is secured, the combination lock is set by dripping the user's
        blood into the lock portal which sequences not only the exact blood makeup
        and gene-patterns, but also any other chemicals in the blood such as alcohol
        levels, drug types, and the like. By carefully dosing himself with an exact
        set of liquids and chemicals, the user essentially sets the exact combination
        to open the chest back up—for it will take not only his exact blood but also
        the exact combination of drugs and consumables as well. The stasis field,
        set within the chest, ensures that until the lock is properly opened the contents
        remain safe—if the lock is simply blown apart, the field collapses and destroys
        the contents.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Bloodlock Bolt
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Also known as Dry Death, this concoction of several liquids can be
        sprayed as an aerosol or even simply poured directly onto almost any surface.
        As long as it stays liquid it is safe, but once dry it will react to any sudden
        impact (such as a bullet strike or even a thrown rock) with a violent detonation.
        While not as powerful as regular manufactured explosives, it is very useful
        for setting surprise attacks or ambushes, or sabotaging a vehicle. Bomb Spray
        explosives inflict 1d5+3 X Damage per kilogram used, and a blast radius of
        two metres per their weight in kilograms.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Bomb Spray
type: tool
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: It is a fact that very little can move faster than a deal gone bad,
        so many traders incorporate hidden holsters with fast-action draws to aid
        in the expeditious and favourable settlement of such negotiations. Basic models
        attach simply to the small of the back, ankle, or under robes or coat. Fancier
        models include mechanical rapid-access devices to quickly slam a pistol into
        the hand from a forearm or bicep mounting, granting a lightning-quick response
        to the situation. Such holsters can only be used with compact pistol weapons.
        A Common or Good Craftsmanship concealed holster imposes a –20 to all tests
        (Awareness, Scrutiny, or Search) to discover the weapon on the person. A Best
        Craftsmanship version also allows the wielder to draw the weapon in the holster
        as a Free Action.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Concealed Holster
type: tool
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: There are many times when an Explorer may wish to conceal his appearance
        or take on the guise of another. Several Rogue Traders have even established
        rumours of their own demise then surreptitiously returned from the Expanse,
        the better to smuggle highly illegal goods. Disguise kits range from basic
        makeup and prosthetic flesh appliances to elaborate skin dyes, vocal augmenters,
        and even false dermal layering to fool gene scanners. Disguise Kits grant
        a +20 bonus to use of the Disguise Skill, with Best Craftsmanship versions
        granting +30 instead.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Disguise Kit
type: tool
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: This heavy cloth can be formed into a very durable shelter with the
        simple addition of water, either from the user or from nature. When exposed
        to water (or most liquids) one side of the material stiffens into rockcrete,
        while a layer of silicasheet on the inside acts to keep the hab dry. Most
        kits come with simple support rods to provide shape to the cloth as it sets,
        allowing users to form a variety of hab shapes as desired, with room for up
        to three people. Needless to say, the cloth is stored in a very water-proof
        container (which can then double as a water bag). Good and Best Craftsmanship
        versions can contain four and six people, respectively.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Emergency Hab
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This spay is often used by covert operatives, as it can be dispensed
        by a seemingly innocuous applicator. Sprayed onto regular fabric it bonds
        rapidly, turning it into impact armour strong enough to shield against most
        blows. The effects fade quickly, however, as body movement gradually breaks
        down the adhesion and the protection wears away. But for someone moving from
        a civilian event into a fire-fight (or taking a civilian into a fire-fight),
        it makes for a perfect accessory. Flak Spray makes any clothing act as Guard
        Flak Armour for 3d10 rounds.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Flak Spray
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: This thin fabric turns utterly rigid when a small electrostatic charge
        is applied. It is part of many emergency shelter kits, as it is very light
        weight and needs no supports; users can simply unroll and activate to form
        a strong shelter against the elements. When the charge is deactivated, the
        fabric collapses and can be reused if needed, making it a popular item in
        long distance marches. Common Craftsmanship versions hold two people, Good
        and Best hold three and four people, respectively.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Flex-Tent
type: tool
---
data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Anti-grav Flip-belts are used by the decadent Eldar of the so-called
        Harlequin cult, in a sheer affront to the laws of physics. They allow the
        user to partially negate the effects of gravity; the impossibly acrobatic
        movements allowed by the belt along with the wearer's natural agility and
        skill make the taunting xenos extremely difficult targets to hit despite their
        outlandish costumes and coloration. A flip-belt grants the Hover trait (6)
        and +20 on all Agility-based Tests, and requires the Pilot (Personal) Skill
        to use. All Flip-belts are at least Good Craftsmanship.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Flip-Belt
type: tool
---
data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Found primarily in the gas giants in systems near the Cauldron, this
        oily blue-green liquid is rather unremarkable except that it spontaneously
        bursts into a dark blue flame when exposed to oxygen. Rebel and recidivist
        strike forces sometimes use it in booby traps, or simply throw glass bottles
        of the liquid at their enemy. Firewater explosions inflict 1d10 E Damage per
        kilogram used, and a blast radius of two meters per the weight in kilograms.
        Those caught in the blast area must make an Agility Test or catch on fire.
        There is no Good or Best Craftsmanship version of this item.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Firewater
type: tool
---
data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These large metallic folding wings are made of multiple flat plates
        resembling long feathers. Combined with suspensor fields, they allow the user
        to glide long distances and even fly for some time. When folded they are bulky
        and about half a metre thick on the user's back; extended the wings are quite
        wide and very noticeable, especially when vain users adorn them with real
        feathers and colorful paint schemes. Glidewings grants the user the Flyer
        Trait (12), and require the Pilot (Personal) Skill to use. However the user
        must launch himself from an elevated position (at least 15 metres high) for
        them to be used. Best Craftsmanship Glidewings grant a +10 bonus to Skill
        Tests to use them.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Glidewing
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Bulk versions of the standard grav plating found on all Imperial
        voidships and stations, gravity generators are huge squares of metal which
        can be laid out on the surface to replicate the feeling of Blessed Terra either
        by increasing or reducing the local gravity field. They are useful when operating
        in areas of much greater or lesser gravity than is the norm, for meeting with
        natives, negotiating trade accords, securing cargo, or other short-term dealings.
        They can also be used as portable restraining cells, keeping prisoners secure
        under very high gravitational restraint.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Gravity Generator
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: 'Designed for speed of deployment and ease of assembly, these pre-fabricated
        units can be set into place by landing craft or even drop pods. Once in the
        desired location, rocket pinions anchor each unit into place, then each is
        connected into the larger overall base via enclosed corridors. Modular habs
        such as these (or the Phaeton pattern) can be used in a variety of environments
        including inhospitable or even toxic atmospheres. A Common Craftsmanship Modular
        Hab Base includes: one barracks for up to 40 people, commissary, medicae facility,
        command and communications hub (complete with vox and auspex arrays), two
        storage sheds, a small genatorium, and a prefab landing pad. Good Craftsmanship
        bases include a prefabricated bulwark, capable of surrounding the base, and
        two Sabre defence platforms armed with two twin-linked heavy stubbers. Best
        Craftsmanship versions also include a laboratory facility.'
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Jovian-Pattern Modular Hab Base
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Useful to diplomats and explorers, a Lingua-Vox Servitor is a specially
        designed servo-skull equipped with an advanced linguistic cogitation engine.
        The Lingua-Vox hovers just over the shoulder of its master, aiding him in
        translating and understanding unfamiliar tongues. An Explorer with an active
        Lingui-Vox Servitor treats all Speak Language Skills as Basic Skills. Best
        Craftsmanship Linqua-Vox drones are capable of deciphering Secret Tongues.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-vox-caster.png
name: Lingua-Vox Servitor
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: This is a larger and more powerful version of the hand-held auspex
        devices used by Imperial agents, usually mounted on a large, transportable
        chassis for added stability. Though bulky, it can scan huge areas of terrain
        as well as the sky above and the ground below to detect movement patterns,
        vox signals, seismic disturbances, and other programmed criteria. Its onboard
        cogitators analyse and display detected information. The Long-range Auspex
        counts as an Auspex in all respects, save its range is 5 kilometres and it
        can penetrate walls up to a metre thick. Good Craftsmanship versions increase
        the range to 10 kilometres, and Best versions grant a +30 to Awareness Tests
        made with the device, instead of a +20.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-auspex.png
name: Locke-Pattern Long-Range Auspex
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: While fabulously rare, the stasis pods produced by the forge world
        of Locke are exceedingly well crafted. Each will preserve one humanoid-sized
        item in a state of unchanging time for as long as power can be maintained.
        Though used infrequently given the more widely-available nature of saviour
        systems, stasis pods are ideal for containing dangerous xenos or animal life
        during transport without the risk of escape or damage. Rogue Traders who specialise
        in beast hunts may have many dozens of pods lining their cargo holds, containing
        everything from the nightmare creatures of Burnscour to savage Genestealers
        stolen from drifting space hulks.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Locke-Pattern Stasis Pod
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: The origin of Nephitic Acid is one of the many secrets of the Adeptus
        Mechanicus. It is unknown whether this grey-green liquid was derived from
        a xenos breed or devised through the aid of ancient STC datavaults. It quickly
        dissolves most materials in seconds and then fades into an inert grey paste.
        Only pure silicate glass can hold it effectively and even the most airtight
        of bottles still emits the acid's strong bitter odour. When applied to other
        materials, it deals 2d10+10 E Damage before becoming inert (the damage is
        applied once during a single Round). A single dose can eat through the equivalent
        of five centimetre thick square metre of adamantium in that time.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Nephitic Acid
type: tool
