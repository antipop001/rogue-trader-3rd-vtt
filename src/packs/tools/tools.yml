data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This advanced item is a staple in many medikits. It uses sonic waves
        that penetrate deep into the flesh to staunch bleeding. Wrapped around a limb,
        it closes off arteries and can be tuned to stop bleeding without interfering
        with regular blood flow, thus preventing anoxia and possible loss of the limb.
        When used to stop blood loss, this device grants a +10 bonus to any Medicae
        Test. Good and Best Craftsmanship versions grant a +20 instead.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Screaming Tourniquet
type: tool
