data:
    craftsmanship: 'common'
    availability: 'common'
    weight: 0
    equipped: false
    inBackpack: false
    description: 'A personal carrying device can take many forms, but is usually some kind of bag with attached straps for ease of carrying. A backpack can usually carry approximately 50 kilograms.'
    source: 'Rogue Trader Core Rulebook'
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: 'systems/rogue-trader-3rd/icons/items/heavy/heavy_02.png'
name: 'Backpack'
type: 'tool'
---
data:
    craftsmanship: 'common'
    availability: 'common'
    weight: 0
    equipped: false
    inBackpack: false
    description: 'Cameleoline material is made up of mimic fibres that blend the colouration of the wearer into their surroundings. A character wearing a cameleoline cloak gains a +20 bonus to Concealment Tests. If the wearer remains stationary, he counts as being one Range Bracket further away (see Chapter IX: Playing the Game, page 247) when targeted by ranged weapons.'
    source: 'Rogue Trader Core Rulebook'
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: 'systems/rogue-trader-3rd/icons/items/heavy/heavy_02.png'
name: 'Cameleoline Cloak'
type: 'tool'
---
data:
    craftsmanship: 'common'
    availability: 'common'
    weight: 0
    equipped: false
    inBackpack: false
    description: 'A charm is a keepsake, holy relic or good luck token that is intended to draw the benevolent eye of the Emperor to the wearer. They take myriad forms including such things as saintly finger bones, fragments of blessed bolter casings, water from holy rivers, and even corpse hair woven into significant patterns. Throughout the Imperium, there is no shortage of folk who will sell such items, though discerning true relics from the false is an almost impossible task (thus the cost of a charm is entirely up to the GM and how well the Explorer can haggle with the seller). Charms have no tangible benefits. However, when the unfolding plot calls for something bad to happen to a random character, at the GM''s discretion a character with a charm will be exempt. If all the characters carry charms (as all Emperor-fearing citizens should) then it is up to the GM to choose which charms are the most potent.'
    source: 'Rogue Trader Core Rulebook'
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: 'systems/rogue-trader-3rd/icons/items/heavy/heavy_02.png'
name: 'Charm'
type: 'tool'
---
data:
    craftsmanship: 'common'
    availability: 'common'
    weight: 0
    equipped: false
    inBackpack: false
    description: 'Chronos are hand-held or wrist-worn timepieces, generally dependable and simple to use. |  Name | kg | Availability  | | --- | --- | --- | |  Backpack | 1 | Plentiful  | |  Cameleoline Cloak | 0.5 | Rare  | |  Charm | — | Average  | |  Chrono | — | Abundant  | |  Clip Harness/Drop Harness | 2 | Common  | |  Clothing and Adornment (Common) | — | Abundant†  | |  Clothing and Adornment (Merchant Guilder) | — | Average†  | |  Clothing and Adornment (Noble) | — | Scarce†  | |  Filtration Plugs | — | Common  | |  Night Cloak | 2 | Average  | |  Photo-visors/Photo-contacts | 0.5 | Scarce  | |  Preysense Goggles | 0.5 | Rare  | |  Rebreather | 1 | Scarce  | |  Recoil Gloves | 0.5 | Rare  | |  Respirator/Gas Mask | 0.5 | Average  | |  Shifting Fabric | — | Very Rare  | |  Survival Suit | — | Plentiful  | |  Synskin | 2 | Extremely Rare  | |  Void Suit | 8 | Plentiful  | |  Void Suit (Selenite-pattern) | 25 | Scarce  | † Clothing and Adornment may have any appropriate Availability. There is always a way to spend more on appearance, to find yet more exclusive fabrics, clothiers, and jewelers, and otherwise display the ways that your wealth glitters more brightly than that of your rivals.'
    source: 'Rogue Trader Core Rulebook'
    target: ''
    effect: ''
    backpack:
        inBackpack: false
