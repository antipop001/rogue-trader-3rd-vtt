data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: A vox-caster is a simple communication device that can be used to
        send signals over great distances, up to and including ships in orbit from
        a planet's surface. Using a vox to receive or transmit signals through interference
        or other unusual conditions requires a successful Ordinary (+10) Tech-Use
        Test.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
