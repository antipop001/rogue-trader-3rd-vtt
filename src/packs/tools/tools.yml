---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: As it can open most standard Imperial locks, the multikey is not
        a standard item for most honest Imperial citizens. For the same reason though,
        they are widely sought after by criminals and other disreputable elements.
        A character with a multikey gains a +30 bonus to any Security Test when trying
        to open locks. When exploring new worlds, a device of this ancient tech-pattern
        is indispensable—but few have the means or influence to acquire one. After
        a few seconds of analysing planetary data, a multicompass can display directions,
        show topographical maps, point out compass bearings, indicate altitude, and
        much more. Even the Mechanicus Calixis do not fully understand all the capabilities
        of such a rare and hallowed device. Possessing a multicompass adds a +10 bonus
        to all Survival and Navigation (Land) Tests.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Multikey
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These are perhaps some of the most valuable items an Explorer can
        possess, as they outline safe routes through the warp, or at least as safe
        as warp travel can get. Some cover jump locations and travel times known to
        many, but others can reveal translation timetable plots known only to a few
        who guard their secrets with their lives. Even rarer are those maps presumed
        lost, describing jump passages thought forgotten or only known as hearsay
        or legend. These are all items that can spur decades-long quests, either establishing
        new fortunes and houses or wrecking them utterly. These items are exceptionally
        rare and can be the goals of lifelong pursuits to chase down even the faintest
        rumour of such a map. Common-Craftsmanship examples of this item grant no
        bonus, but Good-Craftsmanship primas grant a +10 to Navigation (Stellar) Tests.
        Best-Craftsmanship primas increase this bonus to +20.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Navis Prima
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Pict recorders (or simply picters) are relatively simple live-media
        recording devices, and some have holographic capabilities. Most also allow
        for playback as well as recording, and some are even built into dedicated
        pict-servitors so they can capture important archaeological quests, weapons
        tests, alien interrogations, and other dangerous events.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Pict Recorder
type: tool
