    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Once prisoners (or bounties) are caught, strait-capes are often used
        to secure them. Made from heavy, durable fabric, each is lined with memory
        wire so that when thrown over a body and activated they constrict and wrap
        the foe into a tight bundle. Once locked, they are almost escape-proof and
        allow for easy transport of the now-mummified target. Strait-capes can be
        used as a thrown weapon with the Inaccurate and Snare Qualities, and impose
        a –10 penalty on all tests to escape its coils, no matter what variety. |  Name
