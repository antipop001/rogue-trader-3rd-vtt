data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Though indeed primitive, in skilled hands it can operate as effectively
        as any advanced medikit. Filled with basics such as needles, scalpels, bandages,
        antiseptics, gauze, pain-killers, synthetic flesh spray, wound glue, and more,
        it is ideal for most minor wounds suffered in combat. A Physik Kit grants
        +10 when using the Medicae skill for first-aid treatment. Best Craftsmanship
        versions grant +20 instead.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Physik Kit
type: tool
