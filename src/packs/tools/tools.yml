    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Relatively simple devices, Preysense goggles allow the wearer to
        see thermal images from warm bodies, revealing hiding enemies at night. A
        character wearing Preysense goggles suffers no penalties due to darkness and
        gains a +20 bonus to vision-based Perception Tests at night.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
