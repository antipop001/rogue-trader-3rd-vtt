    craftsmanship: common
    availability: Plentiful
    weight: 0
    equipped: false
    inBackpack: false
    description: These sealed suits are intended to preserve the wearer in the most
        hostile environments. A void suit incorporates a rebreather and allows the
        wearer to survive in vacuum. Many incorporate simple void-kits that include
        tether lines, void-steel clamps, and similar small pieces of useful equipment.
        However, poor void suits may not adequately shield the wearer from the energies
        of the void over long periods of exposure, leading to sickness or death.
    source: Rogue Trader Core Rulebook
