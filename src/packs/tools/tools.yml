data:
    craftsmanship: common
    availability: Plentiful
    weight: 0
    equipped: false
    inBackpack: false
    description: A truly ancient design and a relic of the sacred STC, the Selenite-pattern
        is perhaps the most common heavy void suit used in the Imperium. Intended
        for use by voidwalkers, belt miners, and the like, the suit's insulated ceramic-fibre
        weave provides much better protection than a simple sealed suit from the hazards
        of space such as temperature extremes, radiation, and micro-fragment impact.
        Widely fabricated and hugely durable, some Selenite suits are treasured relics
        of the void born families and star vessels, and may have served many generations
        in a particular ship's crew. The Selenite can sustain life in hard vacuum
        for up to ten hours before the dual re-breather cells of its life support
        system must be replaced (which may even be done without removing the suit).
        A fully functioning suit in good order also contains an internal vox-link,
        a seal patching kit, a compact grapnel/clasp plus ten metres of line, and
        a photo-visor. The suit's reinforced structure provides 3 Armour Points to
        the Body, Arms and Legs and 4 Armour Points from the helmet to the Head. The
        suit however is quite bulky and imposes a -10 penalty on all Agility Tests
        whilst worn. Selenite suits appear in several local variants and are subject
        to the rules for Armour Quality. Selenite suits common to Port Wander and
        Footfall are fitted with impellor units, allowing the wearer to propel himself
        through open space in zero or reduced gravity conditions with a Movement of
        6 (they are not powerful enough to use in a normal gravity environment, however).
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Void Suit (Selenite-Pattern)
type: tool
