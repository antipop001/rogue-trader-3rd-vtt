data:
    craftsmanship: common
    availability: Abundant
    weight: 0
    equipped: false
    inBackpack: false
    description: The citizens of the Imperium wear a staggering range of clothing,
        jewellery, and other forms of adornment. All manner of styles imaginable exist
        to illustrate the role or importance of the individual. Explorers might wear
        bodygloves and rings, the best in noble finery, wigs, ship-suits, practical
        hive world clothes, military uniforms and dress weapons, scholarly robes,
        tattoos, or religious garb from any one of a thousand temples, depending on
        taste, profession, and background. The Availability of clothing and adornment
        is determined by how much an Explorer chooses to spend on his apparel, from
        basic rags up to exquisite and expensive attire far beyond even lesser nobles.
    source: Rogue Trader Core Rulebook
