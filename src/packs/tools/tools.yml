data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Synskin is a bio-reactive bodyglove with an inert non-reflective
        surface that moulds itself to the wearer's form. Synskin adds 2 Armour Points
        to all locations (these Armour Points do not stack with other worn armour)
        and the wearer gains a +10 bonus to Concealment and Silent Move Tests. In
        addition, synskin renders the wearer invisible to the effects of Preysense
        goggles and Dark Sight. Synskin does not stack with other armour. If worn
        under other armour, the wearer does not benefit from the bonus to Concealment
        and Silent Move Tests, but is still rendered invisible to infa-red goggles
        and Dark Sight unless he is wearing power armour.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
