data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Melta bombs are affixed to their target with mag-adhesives designed
        to quickly adhere to metallic surfaces. They detonate with a powerful shaped
        charge of intense heat akin to a melta-gun beam, and are ideal for destroying
        bulkheads, vehicle hulls, and other heavily armoured targets. Melta bombs
        are typically unwieldy and not designed to be thrown, only placed in contact
        with their target material to ensure the charge explodes to maximum effect.
        When a melta bomb explodes it deals 6d10 E Damage to anything within two metres
        with a Penetration of 12. Anything surviving must take an Agility Test or
        catch on fire.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Melta Bomb
type: tool
---
data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: A micro-bead or comm-bead is a short-range communication device worn
        in the ear, good for communication out to about one kilometre. Bad weather,
        dense terrain, and intervening rock or plasteel can greatly reduce this range,
        however.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Micro-Bead
