data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: The diagnostic is a sophisticated medical device used among high
        ranking planetary officials and other powerful individuals. It can detect
        and diagnose almost every ailment known to the Imperium, and can be incorporated
        into medical kits, servo-skulls, and other dedicated servitors. Rogue Traders
        who are often away from proper medical assistance feel that such devices are
        essential on their voyages. A Diagnostic provides +20 to Medicae or Perception
        Tests to determine an ailment. Any success indicates the proper medical countermeasures.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
