    description: 'Equipped with a remote trigger, shock collars contain variable electrical nodes capable of delivering non-lethal jolts of electricity to a beast wearing the collar. Though negative reinforcement might only be part of a training regime, shock collars can significantly aid in keeping savage beasts under control. Of course, some creatures respond better to the threat of pain than others, and some can react violently indeed to a sudden shock.'
