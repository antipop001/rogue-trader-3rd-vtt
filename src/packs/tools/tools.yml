    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: A tool and symbol of status for wealthy factors and brokers, the
        optics and prongs of this heavy device rapidly stack, count, and assay the
        worth of diverse currencies. Any attempt to cheat by Sleight of Hand or similar
        method of distraction suffers a -30 penalty where a Remuneration Engine is
        used. Its temperamental machine spirit requires the constant attention of
        tech-adepts, however.
    source: Rogue Trader Core Rulebook
