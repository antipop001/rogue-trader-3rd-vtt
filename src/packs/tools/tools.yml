    equipped: false
    inBackpack: false
    description: 'One of the reasons that Tau firepower is so feared is this piece of equipment. Resembling a large, thin gunsight, the markerlight is a revolutionary weapon in the fight for the Greater Good. The markerlight projects a beam of light, invisible to the naked eye. This beam is capable of highlighting key strategic targets and relaying their position back to the shooter, his allies, and any other warrior equipped to perceive it.'
