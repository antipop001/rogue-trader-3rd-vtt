data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: Normally fashioned into a large cloak, or more rarely a stormcoat
        complete with hood, a night cloak will absorb almost all ambient light and
        emit almost no heat. When the hood is completely furled the user can disappear
        into the dark, hidden even from infrared sensors. It gets very hot inside
        the cloak from the internalised heat, and a wearer must pass a Challenging
        (+0) Toughness Test or suffer a fatigue level after every hour of heavy exertion.
        The cloak grants the user a +30 bonus to Concealment Skill Tests when in the
        dark, even when there is no applicable terrain.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
