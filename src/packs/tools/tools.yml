    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: These gloves have interlocking plates connected with memory wire.
        When the user grips a weapon, it locks together into a rigid strut around
        the hand and wrist, thus preventing wrist or arm damage when the weapon discharges.
        A character using a recoil glove can fire a Basic weapon with one hand without
        the normal –20 penalty. In addition, Pistol weapons that require two hands
        can be used one-handed without penalty.
    source: Rogue Trader Core Rulebook
