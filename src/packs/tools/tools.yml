    weight: 0
    equipped: false
    inBackpack: false
    description: A small launcher or gun that fires a hooked or magnetic grapnel,
        connected to the launcher with a thin but strong 100m wire. Once the grapnel
        attaches to the desired spot, such as a rooftop, the user can manually climb
        the line or activate a powered winch. In a pinch they can also be used as
