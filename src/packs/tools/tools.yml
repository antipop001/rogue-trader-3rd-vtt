data:
    craftsmanship: common
    availability: Plentiful
    weight: 0
    equipped: false
    inBackpack: false
    description: When working in harsh, extreme conditions, survival suits are a must.
        No matter whether it is too hot or too cold, the suit can maintain proper
        body temperature via excellent insulation capabilities. Using the differential
        between body temperature and outside temperature to drive power cells, its
        reclamation systems produce drinking water for the wearer. Most suits come
        complete with a hood and goggles to protect the head and face. While it will
        not sustain life indefinitely, it is usually enough to allow survivors to
        wait for rescue. The suit grants the wearer a +20 bonus to any Toughness Tests
        against the effects of extreme environments.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
