    description: 'Having travelled far and wide across much of the Koronus Expanse as Seneschal to the Rogue Trader Zhorne, Grigory van Heuring visited scores of planets and managed countless wares passing through the cavernous holds of the *Lux Salvationis*. A studious chronicler and prolific writer, van Heuring complied a great deal of his vast knowledge into a compendium cataloguing virtually everything of value that came into his possession during his storied career.'
