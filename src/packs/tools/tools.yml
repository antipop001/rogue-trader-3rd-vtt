data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: A tome or data-slate containing a thrice-blessed collection of catechisms,
        castigations, and psalms first assembled by Pius Mefonte in the 4th century
        M41. These are some of the best-known verses of the Calixian Ministorum, and
        the work itself—ornamented, gilded, and set with flowing pennons of scripture—is
        a sign that he who owns it is holy and well-versed in the God-Emperor's teachings.
        It grants a +10 bonus to Charm Tests involving religious oratory or inspiration
        and an Imperial audience.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
