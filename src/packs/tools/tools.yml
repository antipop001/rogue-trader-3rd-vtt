    inBackpack: false
    description: This exotic material is fashionable in the pleasure zones of the
        Drusus Marches—the more so for its great expense and rarity. The raw fibres
        are imported from the Koronus Expanse and, when woven into fabric, react ambient
        light, altering colours and patterns in an ever-changing stylised display.
        Some claim it also reacts to the wearer's mental state, though opinions vary.
        Either way shifting fabric clothing is surprisingly comfortable, stylish,
        and certain to make an impression.
    source: Rogue Trader Core Rulebook
