    craftsmanship: common
    availability: Rare
    weight: 1.5
    equipped: false
    inBackpack: false
    description: 'Frequently worn by thieves and assassins, whisper boots contain sound dampeners in their soles, which hush the wearer''s footsteps. Though regulated on several planets in the Calixis Sector, whisper boots are popular in the Expanse among those who prefer not to attract too much attention. Whisper boots grant their wearer an additional two Degrees of Success on successful Silent Move Tests.'
