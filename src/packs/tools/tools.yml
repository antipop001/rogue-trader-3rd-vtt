    weight: 0
    equipped: false
    inBackpack: false
    description: 'Pyskers often use devices to help them focus their powers. A psy-focus
        could be a sacred bone, carved wytch stave, blessed icon, or a chain of crystals.
        When a Psyker with a Psy-focus makes an Invocation Skill Test (see Chapter
        III: Skills, page 83) he gains a +10 bonus.'
    source: Rogue Trader Core Rulebook
    target: ''
