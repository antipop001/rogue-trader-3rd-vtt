data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: 'A demolition charge is a simple explosive device, commonly used
        for blowing open doors, breaching bulkheads, and destroying infrastructure.
        The listed weight for a demolition charge represents 1 kg of explosives, though
        it is possible to rig charges together—thus increasing their destructive potential.
        When a demolition charge explodes, anyone (or anything) caught within its
        blast radius takes 3d10 Explosive Damage plus an additional 2 points of Damage
        for every kilogram used. The blast radius of the charge is 5 metres for each
        kilogram used. For setting and defusing explosives see the Demolition Skill
        in Chapter III: Skills, page 80.'
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
