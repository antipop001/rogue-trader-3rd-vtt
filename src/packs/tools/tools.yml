data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: A charm is a keepsake, holy relic or good luck token that is intended
        to draw the benevolent eye of the Emperor to the wearer. They take myriad
        forms including such things as saintly finger bones, fragments of blessed
        bolter casings, water from holy rivers, and even corpse hair woven into significant
        patterns. Throughout the Imperium, there is no shortage of folk who will sell
        such items, though discerning true relics from the false is an almost impossible
        task (thus the cost of a charm is entirely up to the GM and how well the Explorer
        can haggle with the seller). Charms have no tangible benefits. However, when
        the unfolding plot calls for something bad to happen to a random character,
        at the GM's discretion a character with a charm will be exempt. If all the
        characters carry charms (as all Emperor-fearing citizens should) then it is
        up to the GM to choose which charms are the most potent.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-charm.png
name: Charm
type: tool
