data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: This deadly poison is extracted from the neurotoxic sap of the widespread
        Calixian plaguewort plant's crushed leaves. Skin contact causes numbing, and
        if introduced into the bloodstream (for example by coating a bladed weapon
        or spear with the sweet smelling liquid) it can lead to paralysis and death.
        Any weapon coated with this venom gains the Toxic quality for 1d5 Rounds of
        combat. In addition to the Toxic damage, if the target fails its Toughness
        Test, it suffers 1d10 Agility damage. There is no Good or Best Craftsmanship
        version of this item.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Plaguewort Venom
type: tool
