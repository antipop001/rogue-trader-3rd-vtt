    weight: 1.5
    equipped: false
    inBackpack: false
    description: 'Worn by the self-titled Adherents of Aleynikov, these symbolic aprons, which hang front and back from the shoulders, outwardly represent the wearer''s commitment to that missionary''s cause. They were adopted by the Adherents of Aleynikov within a century after her untimely demise.'
