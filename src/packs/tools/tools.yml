    inBackpack: false
    description: Consisting of a mask or helmet, rebreathers contain their own air
        supply and are designed to preserve the user in even the most toxic atmospheres.
        A character wearing a rebreather is immune to the effects of gases and can
        even survive underwater. However, rebreathers typically have air canisters
        that last for about one hour and then must be replaced. Replacing a canister
        is a Full Action.
