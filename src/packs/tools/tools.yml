data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Used frequently on many newly-colonised planets, these systems are
        formed from dozens of large pylons bristling with power relay nodes, all linked
        together in line to form an invisible protective barrier around important
        installations or structures. They draw a great deal of power and can easily
        keep most native animals or civilians at bay, but will normally falter against
        aggressive attacks from armed forces or monstrous creatures. The field causes
        2d10+6 E Damage with the Shocking quality. Good and Best Craftsmanship versions
        do an additional 1d10 damage.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Perimeter Defence System
type: tool
