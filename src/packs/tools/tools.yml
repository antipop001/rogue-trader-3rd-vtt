data:
    craftsmanship: common
    availability: Extremely Rare
    weight: 0.1
    equipped: false
    inBackpack: false
    description: 'Traditionally given to the aristocratic youth of Nazhdureyah at the age of maturity, the Djesset is a talisman that was worn by that world''s psychic nobility. Taking the form of a single stylised eye, most often inlaid with precious rubies or carnelian, the Djesset was the outward symbol of the supremacy of psykers.'
