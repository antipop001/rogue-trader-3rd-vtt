    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: A tool of assassins and dangerous nobility, the ring contains a small
        reservoir compartment that discretely opens with the right muscle movements
        of the finger bearing it. It gives a –20 penalty to any Test required to notice
        that the ring-wearer is introducing a substance into food or drink.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
