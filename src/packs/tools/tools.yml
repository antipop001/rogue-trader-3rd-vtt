data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: Jump packs are large backpacks containing powerful turbofan or rocket
        engines. A user triggers a jump pack to lift high into the air and then swoop
        down as part of their assault. Jump packs are also useful in leaping over
        high obstacles and reaching rooftops in a single bound, but without training
        most users will seriously injure themselves in crashes. Though bulky, loud,
        and somewhat dangerous to use they are ideal for the maximum in personal mobility
        on the ground or even in the void. Jump packs require the operator to have
        the Pilot (Personal) skill. A standard jump pack allows for a safe, guided
        fall from any height and, with a thruster boost, make an unlimited series
        of short jumps (landing at the end of each Round's movement). Alternatively,
        the pack can duplicate the Flyer (12) trait for up to a minute at a time.
        A jump pack's power supply will last for about an hour of strenuous operation
        before requiring replacement.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Lathe-Pattern Jump Pack
type: tool
---
data:
    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Many officers of the Imperial Navy carry one of these short rods
        as an insignia of rank and station. Most are highly engraved and ornamented
        with the heraldry of their ship and fleet. Underlings refer to them dismissively
        as "Calixian Crutches" or worse, seeing them only as another symbol of their
        oppression. What most do not know—and only find out too late—is that naval
        batons are often strongly reinforced and can easily shatter bones. Some even
        contain specialised micro-cogitators or datavaults—for example, the bridge
        baton of the Rogue Trader ship Aigsarn contains the codeprayers for the bridge
        machine spirits. It is ceremoniously re-inserted into the main helm station
        as part of each shift change in an elaborate ceremony of phrases and counterphrases.
        Failure to properly perform this ritual results in the lockdown of all command
        systems—a means of preventing piracy or mutiny.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Lord-Captain's Baton
type: tool
