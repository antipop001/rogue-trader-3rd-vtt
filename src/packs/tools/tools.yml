data:
    craftsmanship: common
    availability: Near Unique
    weight: 0
    equipped: false
    inBackpack: false
    description: Many still refuse to believe these featureless flat planks exist.
        Power Boards are very much real, most older than many a starship but still
        gleaming and unmarked. Each allows the user to glide through the air, using
        anti-grav engines of unknown design. Internal power cells recharge slowly
        after use, but each charge can last hours depending on the speed and distance
        desired. Users operate a board with their own body orientation, and most affix
        footholds to prevent falls. Most users also decorate their boards with bold
        and colourful patterns and sayings, the better to advertise their reckless
        nature, as riding a board well is truly the mark of a skilful individual.
        A Power Board grants the user the Flyer (15) Trait, but any user must have
        the Pilot (Personal) Skill to use one.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Power Board
type: tool
---
data:
    craftsmanship: common
    availability: Abundant
    weight: 0
    equipped: false
    inBackpack: false
    description: The common Imperial petrochemical-based liquid fuel, most often used
        to refer to the jelly-like chemical used to power most Imperial Flamer weapons.
        It can also be used to create anti-personnel explosives and bombs as it is
        often readily available in most war zones. Most voidships carry huge reserves
        as well, both to power many systems as well as for trading with local systems.
        Refined Promethium is valued across the stars, and is the basis for many bartering
        cultures. Promethium explosives inflict 1d10 Energy Damage per kilogram used,
        and a blast radius of four meters per their weight in kilograms. Those caught
        in the blast area must make an Agility Test or catch on fire. There is no
        Good or Best Craftsmanship version of this item.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Promethium
type: tool
---
data:
    craftsmanship: common
    availability: Near Unique
    weight: 0
    equipped: false
    inBackpack: false
    description: These small, rare quartz-like crystals emit a soft purple glow when
        psychic energy is being used nearby, with the intensity varying depending
        on the degree of power released. They are found mostly on barren worlds devoid
        of life, an unquietly common phenomenon in the Expanse. Psycrystals perform
        best when used by non-psykers, paradoxically enough, giving off false indications
        or even causing mental distress when held by those who can channel the warp.
        Each crystal glows if psychic powers are being used by an individual within
        a short distance, usually five metres, or are targeting an individual within
        the same radius. There is no Good or Best Craftsmanship version of this item.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Psycrystal
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: A staple for many air and ground transports, the Ryboth kit is relatively
        lightweight and transportable (as many crashed pilots will need to quickly
        remove themselves from their wreckage to safety before enemy troops arrive).
        Typical kits contain basics such as fishing gear and animal snares, firestarter
        tabs, flares, compass and signal mirror, water purification tabs, antibiotic
        and detox pills, insect repellent, sunscreen gel, flextent shelter, limited
        med kit, exposure cloth depending on the projected travel locations, multi-tool,
        disposable handgun, a booklet on survival tips, prayer scrolls, vox hailer,
        combat blade, and more. Rations included are basic in the extreme but will
        keep body and soul in the Emperor's Embrace until rescue can arrive. Ryboth
        kits grant a +10 bonus to Survival Tests, providing the tools (but not the
        knowledge) to aid the user in staying alive longer than he would otherwise.
        Good and Best Craftsmanship versions grant a +20 instead.
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Ryboth Travel Survival Kit
type: tool
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: Skinplants are a more sophisticated version of the electoo—entire
        devices can be built just under the skin using crystal technology provided
        by the Machine Cult. Users can replicate electronic ID systems, lamplights,
        chronos, and a host of other non-mechanical items. Highly fashionable, they
        adorn the arms and hands of many of the sector's wealthiest and most stylish
        individuals. Good and Best Craftsmanship versions are usually more detailed
        designs or more complex devices (at the GM's discretion).
    source: Into the Storm
    target: ''
    effect: ''
    backpack:
        inBackpack: false
