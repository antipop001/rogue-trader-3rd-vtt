    craftsmanship: common
    availability: Very Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: Aerial machines fashioned in the shape of avian predators, Grapplehawks
        are an unusual form of cyber-familiar used by some Adeptus Arbites squads
        and wealthy bounty-hunters (see page 375 for details). Once launched into
        the air a Grapplehawk glides in search of its target before swooping to strike
        with metallic claws and stunning electrical discharges. Potent internal suspensors
        provide enough lift for a Grapplehawk to carry a man's weight through the
        air for short distances.
    source: Rogue Trader Core Rulebook
    target: ''
