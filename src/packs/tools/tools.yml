data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: Screamers are proximity alarms that detect motion or sound—depending
        on the model—and alert their users to incoming dangers by making a horrendous
        noise. To use a screamer, you must succeed on a Tech-Use Test. The GM rolls
        this test in secret so you are not sure of whether or not the device will
        work properly. Once set, a screamer has a Perception of 75 for the purposes
        of detecting sounds or motions. If it detects an intruder, it sounds its alarm,
        which can be heard anywhere out to one kilometre. Doors, walls and other barriers
        may reduce the alarm's range.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Screamer
type: tool
---
data:
    craftsmanship: common
    availability: common
    weight: 0
    equipped: false
    inBackpack: false
    description: 'Even the most secure and reliable ship possesses emergency kits
        on most decks—though often decks can measure in the kilometres. Some work
        crews will also carry smaller versions in case of hull beaches or bulkhead
        failure. A standard kit weighs roughly 20kg and can include: - **Glowstick**:
        Good for 1d5 hours of steady illumination. - **Universal Power Cell**: Using
        either integral plugs or adaptor leads, it can power a glowstick or emergency
        vox for 1d5 hours or a laspistol for 5 shots. - **Ration pack and water canister**:
        Contains enough to provide sustenance for roughly 1 day, because if rescue
        doesn''t come by then it probably won''t come at all. - **Emergency Vox**:
        Usually pre-tuned to the ship''s vox, but advanced models are more versatile,
        and may also be capable of issuing automatic distress cants such as the standard
        "Voidfarer''s Prayer for Aid." - **Air bottle &amp; mask**: Contains roughly
        30 minutes of air, usually enough to get through toxic passageways. - **Anti-radiation
        tablets**: Essential when exposed to plasma drive leaks or the raw energies
        of the void. - **Hull sealant spray-gel**: This foul-smelling gel can be sprayed
        onto vents and bulkheads to seal against the void. Each tube can cover 20
        or so small (10 sq cm) punctures.'
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Shipboard Emergency Kit
type: tool
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: A servitor is an automaton whose controlling components are organic
        and mostly human in origin. Some are grown in vats, while others are formed
        from the aged bodies of honoured tech-priests or despised criminals whose
        punishment is to serve the Imperium in this fashion. The process of creating
        a servitor purges higher brain functions and psychic pattern of the subject,
        rendering him a blank slate for reprogramming. The most common forms of servitor
        are mindless labour drones, dedicated to a small selection of simple tasks,
        and fitted with devices necessary to this toil. Some are not even mobile,
        being built into the machinery they control. Examples familiar to voidfarers
        include bridge servitors, pilot servitors, and the hulking monotask servitors
        that transport cargo pallets in Imperial docking transepts. More complex or
        specialised servitors are less common, and have correspondingly more rare
        Availabilities—where the Mechanicus Calixis agree to provide them at all (see
        Page 374 for details).
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Servitor
type: tool
---
data:
    craftsmanship: common
    availability: Scarce
    weight: 0
    equipped: false
    inBackpack: false
    description: A human skull—often that of a favoured servant or lowly tech-adept—that
        has been fitted with a rudimentary machine-spirit, support systems, and a
        suspensor device to allow it to float through the air. These limited constructs
        are devoted to a particular task and have the basic equipment to carry out
        their purpose. Their small size and manoeuvrability allows them to enter otherwise
        inaccessible spaces and act as eyes and ears for their masters. The servo-skull
        is synonymous with the Adeptus Mechanicus, whom these creations serve faithfully.
        Servo-skulls can also be found as cyber-familiars, weapon-bearing guardians,
        librarium functionaries, medical assistants, lumen-bearers, proclaimers, and
        scroll-carriers in the greater Imperium. Servo-skull equipment is usually
        one pair of simple manipulator pincers, a weapon, pict-capture device, surgical
        implements, stab-light, or loudhailer, but many other functions and servo-skull
        patterns exist (see page 375 for details).
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
img: systems/rogue-trader-3rd/icons/items/buckets/tool-multi-key.png
name: Servo-Skull
type: tool
---
data:
    craftsmanship: common
    availability: Average
    weight: 0
    equipped: false
    inBackpack: false
    description: The reverse of a screamer, stummers generate sound waves to cancel
        out ambient sounds and noises made by moving personnel in a small area. A
        character carrying an active stummer gains a +30 bonus to Silent Move Tests.
        A stummer typically has enough power for 20 minutes of continuous use before
        needing to be recharged—a process that takes about one hour.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
    backpack:
        inBackpack: false
