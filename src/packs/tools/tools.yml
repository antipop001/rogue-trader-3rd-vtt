data:
    craftsmanship: common
    availability: Rare
    weight: 0
    equipped: false
    inBackpack: false
    description: A smaller version of a jump pack, these rely on suspensor fields
        to counter gravity to slow descent. Two small jets on either side above the
        shoulders offer extra braking as well. Unlike a jump pack it is designed to
        allow the user to land safely from a long fall—such as combat drop from a
        transport—rather than leap into the air. The grav chute allows for a safe,
        guided fall from any height. The user can hover in place for up to a minute
        at a time if so desired. After an hour of use, the power supply must be replaced.
    source: Rogue Trader Core Rulebook
    target: ''
    effect: ''
