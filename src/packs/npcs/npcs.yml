effects: []
flags:
  rt:
    description: Encountered very rarely in the Koronus Expanse, the kroot are not indigenous to the local stars but nomadic
      wanderers from half a galaxy away. A mercenary race, their feral, clannish mindset hides both a perception and intelligence
      few would credit them with. A carnivorous and highly adaptable species, an individual kroot stands considerably taller
      than a human and possesses many features that betray their avian heritage. Sporting a crest of quills, a beaked mouth,
      and the ability to move with incredible speed and lithe physical power, a kroot is a formidable opponent. Their martial
      prowess—combined with an unpleasant reputation for eating those they slay—gives these freelance warriors a justly fearsome
      reputation, and they command a high price from the merchant criminals and recidivist elements willing to flout Imperial
      law by taking them into their employ.
    movement: 4/8/16/32
    rawGear: 'Cut meat, bandolier of 30 spare charges for rifle, fetish pouch. # FROI II BEYOND “...And I beheld the Warp
      in the burning nothingness of its eyes and fell to my knees and wept, my faith gone asunder, cursing the name of the
      mother that gave birth to me for the truth of existence is too terrible to know...” —From the Canticle of Shebanus the
      Fallen Beyond our physical reality lies the Warp, a turbulent and ever-shifting cosmos of unreality and raw energy shaped
      not by paltry physical laws, but by fathomless insanity and echoing impulse and possibility; it is this very realm of
      madness ships must travel through to leap interstellar distances, and dwelling within its depths are entities fashioned
      from the stuff of nightmares and bounded by no law save their hungers.'
    source: Rogue Trader Core Rulebook, Ch. XIV
img: systems/rogue-trader-3rd/images/npcs/kroot-mercenary.png
