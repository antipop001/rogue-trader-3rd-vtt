- _id: t1aDWqmrZ5Byn5x6
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Phase
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait can transform its body into an insubstantial state, passing ghost-like through
      solid objects or barriers of any sort. This Trait functions exactly like the Incorporeal Trait, except the creature
      may become solid or insubstantial by spending a half action. Phase carries additional limitations. A creature in a phased
      state cannot cross psychically charged barriers, holy wards, or energy fields designed to flux space or manipulate the
      Warp such as a Gellar Field or a Void Shield.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: ewuYHlT0XsVfqw33
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Toxic
  ownership:
    default: 3
  sort: 0
  system:
    description: A creature with this Trait is poisonous. A target hit by its natural weapons must make a Toughness Test.
      The toxins might instead be delivered by contact with the creature's skin or by inhaling its stench, in which case a
      Toughness Test must be made upon coming into contact or proximity. A failed Toughness Test indicates the victim has
      been poisoned. A typical poison deals 1d10 points of damage, ignoring Armour Points. Variations, if present, are included
      in the creature's description.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: CKS21QQg2Bdmv6AL
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Agility (×2)
  ownership:
    default: 3
  sort: 0
  system:
    description: One or more of the creature's Characteristics is unnatural. Each time this Trait is gained, select a Characteristic,
      and double its bonus. For example, a creature with a Strength of 41 normally has a 4 Strength Bonus. With this Trait,
      its Strength Bonus increases to 8. The Trait may be gained multiple times. Each time, you may select a new Characteristic
      or one chosen previously. Each time you apply this Trait to the same Characteristic, the Bonus multiplier increases
      by 1. For example, one selection multiplies the Characteristic Bonus by ×2, two selections by ×3, and three selections
      by ×4. Note this Trait does not modify the creature's movement. Movement is based on a creature's unmodified Agility
      Bonus. During Opposed Characteristic Tests, on a success, the bonus multiplier is added to the degree of success.
    source: Rogue Trader Core Rulebook
  type: trait
- _id: KcbHAIMOUjpViCDP
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Unnatural Speed (×2)
  ownership:
    default: 3
  sort: 0
  system:
    description: The creature moves with incredible speed. For the purposes of determining movement, the creature doubles
      its Agility Bonus (after modifiers from other Traits and factors, specifically size).
    source: Rogue Trader Core Rulebook
  type: trait
- _id: octkDNcOX3VNlPyJ
  effects: []
  flags: {}
  img: systems/rogue-trader-3rd/icons/talents/blue/b_18.png
  name: Warp Instability
  ownership:
    default: 3
  sort: 0
  system:
    description: Most Warp-entities have a tenuous hold on our reality, often maintained only by horror and bloodshed, and
      may be disrupted if sufficient harm can be done to their manifested forms. If a creature with this Trait takes damage
      and does not deal damage or Insanity Points to other creatures by the end of its next turn, it must make a Willpower
      Test. The creature takes 1 damage for failure, plus 1 damage for each degree of failure. If this would deal damage equal
      to or in excess of the creature's Wounds, it is cast back into the Warp.
    source: Rogue Trader Core Rulebook
  type: trait
