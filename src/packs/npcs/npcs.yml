effects: []
flags:
  rt:
    description: 'Imperial lore has it that throughout history the brutal ork has contested mankind’s dominion of the stars.
      Built for bloodshed, violence, and little else, the average ork is a hulking simian humanoid with tough, sallow-greenish
      hide and a protruding jaw lined with jagged tusk-like fangs. Frighteningly strong (most can easily pull a human being
      apart in their clawed hands), orks are also phenomenally resistant to injury, largely fearless, and can thrive in many
      hazardous environments unaided. Orkiods demonstrate a staggering variety of physical types and subspecies, with the
      largest and most brutal always in command. While lacking intellect, orks possess an innate low cunning and simple but
      effective grasp of tactics. This, combined with a talent for scavenging and creating their own crude but highly effective
      tech, makes them a danger far beyond the near-animalistic xenos predator they at first appear to be.


      Barbarous and strife-torn ork empires are scattered


      throughout known space, and the Koronus Expanse is no exception with a volume of space known as Undred-Undred Teef the
      home of a long established ork domain from which frequent raids and pirate attacks from scavenging ork warbands of loota
      krews and freebooter pirates are infamous.'
    movement: 3/6/9/18
    rawGear: 2d10 ork teeth ("Teef"), shiny bitz, scavenged machine components and trophies, 3 spare clips for the shoots,
      respirator, crude hand vox. **Mob Rule:** Orks grow in confidence and brutality in the company of their own kind. For
      every additional ork within 10m, the ork's Willpower is increased by +10 to resist the effects of Fear and Pinning.
    source: Rogue Trader Core Rulebook, Ch. XIV
img: systems/rogue-trader-3rd/images/npcs/ork-freebooter.png
