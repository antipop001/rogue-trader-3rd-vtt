effects: []
flags:
  rt:
    description: 'Few humans know much of the enigmatic ancient race know as the Eldar, save reports of haughty disdain, quixotic
      temperament, powerful technology, and the unnatural and subtle cruelties of merciless raiders who strike like ghostly
      phantoms. Despite these conflicting reports there are those foolish and wealthy enough to take up the extortionately
      priced services of these so-called corsairs. Those who do employ the skills of these most efficient mercenaries take
      a very grave risk. The tales of mastery and splendour in battle attributed to them are almost equalled by those telling
      of their fickle loyalty, sudden betrayals, and gleeful slaughtering grace, silken armour a-sheen with the blood of former
      allies.


      Within the Koronus Expanse the two most infamous groups of eldar corsairs at large are known to humanity as the fickle
      and deadly mercenaries of the Children of Thorns and the mysterious exterminators called the Crow Spirits.'
    movement: 5/10/15/30
    rawGear: 3 spare clips of shuriken catapult ammunition, waystone gem, xenos-crafted medkit, xenos-crafted void-sealed
      armour that grants full life support, long range encrypted vox, auspex, and Dark Sight. Inbuilt void impellor units
      in the armour grant Flyer 12 in null gravity.
    source: Rogue Trader Core Rulebook, Ch. XIV
img: systems/rogue-trader-3rd/images/npcs/eldar-corsair.png
