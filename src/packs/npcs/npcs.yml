  rt:
    description: These near-mindless creatures are animalistic predators whose hunger for life is boundless. They are drawn
      to the soul sparks of mortal life like sharks to bloody water. Such a predator is the Ebon Geist, a thing blacker than
      the emptiest void, a killing shadow, thin and writhing that can pass through dark spaces as insubstantial as a nightmare
      fading into forgetfulness. The geist murders with its chill talons leaving noting but bodies consumed to desiccated
      husks, the screaming shadows of its victims cold-burned into the hull where they perished.
    movement: 8/16/24/48
    rawGear: ''
    source: Rogue Trader Core Rulebook, Ch. XIV
